name: Install frozen G6 release
description: Verify and install one candidate-bound G6 release on a runtime job
inputs:
  archive-dir:
    description: Absolute downloaded release directory
    required: true
  timing-file:
    description: Optional non-authoritative G6 timing JSON path
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        G6_TIMING_FILE: ${{ inputs.timing-file }}
      run: |
        set -euo pipefail
        archive_dir="${{ inputs.archive-dir }}"
        expected_go="go$(sed -n 's/^go=//p' toolchains.lock)"
        scripts/g6-install-release.sh "${archive_dir}" "${GITHUB_SHA}" "${expected_go}"
