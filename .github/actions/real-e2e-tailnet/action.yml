name: Join ephemeral Cross-VM Tailnet
description: Run hosted VM preflight, validate OIDC scope, join the ephemeral Tailnet, and reject advertised routes.
inputs:
  oauth-client-id:
    required: true
  audience:
    required: true
  tags:
    required: true
  hostname:
    required: true
runs:
  using: composite
  steps:
    - name: Verify hosted VM and dependencies
      shell: bash
      run: bash scripts/real-e2e-hosted.sh preflight
    - name: Check GitHub OIDC scope before Tailnet join
      shell: bash
      env:
        TS_AUDIENCE: ${{ inputs.audience }}
      run: python3 scripts/real-e2e-tailnet.py oidc
    - name: Join ephemeral Tailnet using OIDC
      id: tailnet
      uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
      with:
        oauth-client-id: ${{ inputs.oauth-client-id }}
        audience: ${{ inputs.audience }}
        tags: ${{ inputs.tags }}
        hostname: ${{ inputs.hostname }}
        args: --accept-dns=false
        use-cache: 'false'
    - name: Reject advertised Tailnet routes
      shell: bash
      run: sudo tailscale set --accept-routes=false
