name: Consume candidate artifact
description: Download a producer ID and explicitly verify its candidate manifest and payloads
inputs:
  artifact-id:
    required: true
    description: ID from the producing job
  sha256:
    required: true
    description: Manifest digest from the producing job
  component:
    required: true
    description: agent or controller
  arch:
    required: true
    description: amd64 or arm64
  version:
    required: true
    description: Candidate version
  path:
    required: true
    description: Destination directory
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        path: ${{ inputs.path }}
    - shell: bash
      env:
        DIRECTORY: ${{ inputs.path }}
        COMPONENT: ${{ inputs.component }}
        ARCH: ${{ inputs.arch }}
        VERSION: ${{ inputs.version }}
        DIGEST: ${{ inputs.sha256 }}
      run: node scripts/release-artifacts.mjs verify "$DIRECTORY" "$COMPONENT" "$ARCH" "$VERSION" "$DIGEST"
