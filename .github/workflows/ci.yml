name: Basic CI

on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      contract_base_ref:
        description: Prior commit or tag for manual contract comparison
        type: string
        required: true
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Key compatibility checks
        type: choice
        options: [quick, full]
        default: full
        required: true
      contract_base_ref:
        description: Prior commit or tag; must differ from this candidate
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.profile || 'quick' }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'quick') }}

jobs:
  ci-relevance:
    name: Basic CI Routing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.relevance.outputs.profile }}
      database_scope: ${{ steps.relevance.outputs.database_scope }}
      run_ci_tools: ${{ steps.relevance.outputs.run_ci_tools }}
      ci_suites: ${{ steps.relevance.outputs.ci_suites }}
      ci_tools_profiles: ${{ steps.relevance.outputs.ci_tools_profiles }}
      ci_tools_cache_label: ${{ steps.relevance.outputs.ci_tools_cache_label }}
      run_installers: ${{ steps.relevance.outputs.run_installers }}
      run_docs: ${{ steps.relevance.outputs.run_docs }}
      run_go: ${{ steps.relevance.outputs.run_go }}
      run_rust: ${{ steps.relevance.outputs.run_rust }}
      run_web: ${{ steps.relevance.outputs.run_web }}
      run_web_browser: ${{ steps.relevance.outputs.run_web_browser }}
      run_database: ${{ steps.relevance.outputs.run_database }}
      run_controller_cache: ${{ steps.relevance.outputs.run_controller_cache }}
      controller_cache_images: ${{ steps.relevance.outputs.controller_cache_images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ (github.event_name == 'workflow_dispatch' || inputs.profile == 'full') && 1 || 0 }}
          persist-credentials: false
      - name: Classify the change set
        id: relevance
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CI_PROFILE: ${{ inputs.profile }}
          CI_EVENT: ${{ inputs.profile == 'full' && 'workflow_dispatch' || github.event_name }}
        run: scripts/ci-relevance.sh "${CI_EVENT}" "${BASE_SHA}" "${HEAD_SHA}" "${GITHUB_OUTPUT}" "${CI_PROFILE}"

  docs:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.run_docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: |
          scripts/docs-check.sh
          scripts/check-public-repository.sh

  ci-tools:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.run_ci_tools == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ !contains(needs.ci-relevance.outputs.ci_suites, 'contracts') && 1 || 0 }}
          persist-credentials: false
      - name: Setup style, contract and release tools
        if: needs.ci-relevance.outputs.ci_tools_profiles != ''
        uses: ./.github/actions/setup-tools
        with:
          profiles: ${{ needs.ci-relevance.outputs.ci_tools_profiles }}
          cache-label: ${{ needs.ci-relevance.outputs.ci_tools_cache_label }}
          cache-npm: ${{ contains(needs.ci-relevance.outputs.ci_suites, 'contracts') && 'true' || 'false' }}
      - name: CI guard and workflow contracts
        env:
          CI_SUITES: ${{ needs.ci-relevance.outputs.ci_suites }}
          CONTRACT_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || inputs.contract_base_ref }}
          CONTRACT_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CONTRACT_EVENT: ${{ github.event_name }}
        run: bash scripts/ci-tools-check.sh

  go:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.run_go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.ci-relevance.outputs.profile == 'full' && 30 || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          profiles: go-test
      - id: cache-key
        run: bash scripts/ci-go-cache-key.sh >> "${GITHUB_OUTPUT}"
      - id: go-mod-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/go-mod
          key: basic-go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.identity }}
      - id: go-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/go-build
          key: basic-go-build-v1-unit-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.identity }}-${{ github.sha }}
          restore-keys: basic-go-build-v1-unit-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.identity }}-
      - run: |
          scripts/go-check.sh ${{ needs.ci-relevance.outputs.profile == 'full' && 'full' || 'standard' }}
          scripts/transport-boundary-check.sh --go-only
      - name: Save Go modules (main only)
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-mod-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/go-mod
          key: ${{ steps.go-mod-cache.outputs.cache-primary-key }}
      - name: Save ordinary Go objects (main only)
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/go-build
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}

  rust:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.run_rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          profiles: rust-basic
          key-suffix: -${{ hashFiles('rust/Cargo.lock') }}
      - name: Restore Rust workspace build cache
        id: rust-target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: rust/target/debug
          key: basic-rust-target-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'rust/rust-toolchain.toml') }}-${{ hashFiles('scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh', 'rust/Cargo.lock', 'rust/**/Cargo.toml', 'rust/.cargo/**', 'scripts/rust-check.sh') }}-${{ github.sha }}
          restore-keys: |
            basic-rust-target-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'rust/rust-toolchain.toml') }}-${{ hashFiles('scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh', 'rust/Cargo.lock', 'rust/**/Cargo.toml', 'rust/.cargo/**', 'scripts/rust-check.sh') }}-
            basic-rust-target-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'rust/rust-toolchain.toml') }}-
      - run: |
          scripts/rust-check.sh
          scripts/transport-boundary-check.sh --rust-only
          scripts/agent-boundary-check.sh
      - name: Save Rust workspace build cache (main only)
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: rust/target/debug
          key: ${{ steps.rust-target-cache.outputs.cache-primary-key }}

  installers:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.run_installers == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Relay launcher and installer contracts
        run: |
          python3 scripts/test-node-bootstrap.py
          bash scripts/test-controller-install.sh
          bash scripts/test-controller-bootstrap.sh
          bash scripts/test-controller-host-bootstrap.sh
          bash scripts/test-controller-lifecycle.sh
          bash scripts/test-production-auth-config.sh
          python3 scripts/test-vpn-audit.py
          python3 scripts/test-controller-gateway-headers.py
          docker run --rm --network none -v "$PWD:/source:ro" \
            python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df \
            python3 /source/scripts/test-relay-launchers.py

  web:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.run_web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          profiles: web
          cache-npm: 'true'
      - run: scripts/web-check.sh basic

  web-browser:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.run_web_browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Shared UI regressions run in mobile Chromium and all three engines.
      BROWSER_PROJECTS: desktop mobile firefox webkit
      # Full also serves the build through the production Standalone gateway and
      # then the Integrated Edge and gateway, where the cross-engine specs fail
      # on any CSP violation.
      BROWSER_GATEWAYS: ${{ needs.ci-relevance.outputs.profile == 'full' && 'standalone integrated' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          profiles: web
          cache-npm: 'true'
      - name: Build production web bundle
        run: |
          source scripts/env.sh
          cd web
          npm run build
      - name: Browser regressions on the production build
        run: |
          pw_version="$(jq -r '.devDependencies["@playwright/test"]' web/package.json)"
          pw_version="${pw_version#^}"
          [[ "${pw_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          pw_tmp="$(mktemp -d /tmp/ocservia-pw.XXXXXX)"
          chmod 0755 "${pw_tmp}"
          mkdir -p "${pw_tmp}/home" "${pw_tmp}/cache"
          trap 'rm -rf -- "${pw_tmp}"' EXIT
          docker_args=(
            --rm --init --ipc=host --network=host
            --user "$(id -u):$(id -g)"
            --security-opt seccomp=unconfined
            --security-opt apparmor=unconfined
            -v "${PWD}:${PWD}:ro"
            -v "${pw_tmp}:${pw_tmp}"
            -w "${PWD}/web"
            -e "PATH=${PWD}/.tools/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            -e "TMPDIR=${pw_tmp}"
            -e "HOME=${pw_tmp}/home"
            -e "XDG_CACHE_HOME=${pw_tmp}/cache"
            -e "PLAYWRIGHT_WORKERS=4"
            -e "BROWSER_PROJECTS=${BROWSER_PROJECTS}"
            -e "BROWSER_GATEWAYS=${BROWSER_GATEWAYS}"
          )
          if [[ -n "${BROWSER_GATEWAYS}" ]]; then
            docker_args+=(
              --group-add "$(stat -c '%g' /var/run/docker.sock)"
              -v "$(command -v docker):/usr/local/bin/docker:ro"
              -v /var/run/docker.sock:/var/run/docker.sock
            )
          fi
          docker run "${docker_args[@]}" "mcr.microsoft.com/playwright:v${pw_version}-noble" \
            bash -euo pipefail -c '
              args=()
              for project in ${BROWSER_PROJECTS}; do args+=("--project=${project}"); done
              specs=(agent-rollout.spec.ts node-forms.spec.ts shell-navigation.spec.ts apple-layout.spec.ts vpn-audit.spec.ts)
              if [[ -z "${BROWSER_GATEWAYS}" ]]; then
                node test/run-auth-browser.mjs "${specs[@]}" "${args[@]}"
              fi
              for gateway in ${BROWSER_GATEWAYS}; do
                node test/run-auth-browser.mjs "${specs[@]}" "${args[@]}" "--gateway=${gateway}"
              done
            '

  database-smoke:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.run_database == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.ci-relevance.outputs.database_scope == 'full' && 90 || 25 }}
    env:
      PG_MAJOR: '18'
      DATABASE_TEST_SCOPE: ${{ needs.ci-relevance.outputs.database_scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          profiles: go-test
      - id: cache-key
        run: bash scripts/ci-go-cache-key.sh >> "${GITHUB_OUTPUT}"
      - id: go-mod-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/go-mod
          key: basic-go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.identity }}
      - id: go-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/go-build
          key: basic-go-build-v1-db-smoke-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.identity }}-${{ github.sha }}
          restore-keys: |
            basic-go-build-v1-db-smoke-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.identity }}-
            basic-go-build-v1-unit-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.identity }}-
      - run: scripts/database-integration.sh
      - name: Verify PostgreSQL 18 volume lifecycle
        run: bash scripts/test-postgres-volume-layout.sh
      - name: Save database Go objects (main only)
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/go-build
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}

  database-recovery-full:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          profiles: go-test
      - id: cache-key
        run: bash scripts/ci-go-cache-key.sh >> "${GITHUB_OUTPUT}"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/go-mod
          key: basic-go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.identity }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/go-build
          key: basic-go-build-v1-db-smoke-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.identity }}-${{ github.sha }}
          restore-keys: |
            basic-go-build-v1-db-smoke-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.identity }}-
            basic-go-build-v1-unit-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.identity }}-
      - run: |
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-postgres-bundled" \
            ARTIFACT_DIR="${RUNNER_TEMP}/database-recovery-postgres/bundled" \
            bash scripts/postgres-backup-restore-smoke.sh
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-postgres" \
            ARTIFACT_DIR="${RUNNER_TEMP}/database-recovery-postgres" \
            bash scripts/external-postgres-backup-restore-smoke.sh
      - name: Preserve database recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: database-recovery-postgres-${{ github.run_id }}
          path: ${{ runner.temp }}/database-recovery-postgres
          if-no-files-found: warn
          retention-days: 7

  controller-cache:
    name: Refresh Controller cache (${{ matrix.arch }})
    needs: ci-relevance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-relevance.outputs.run_controller_cache == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    concurrency:
      group: controller-cache-${{ matrix.arch }}
      cancel-in-progress: false
    env:
      VERSION: '0.0.0'
      SOURCE_COMMIT: ${{ github.sha }}
      CONTROLLER_ARCH: ${{ matrix.arch }}
      CONTROLLER_CACHE_IMAGES: ${{ needs.ci-relevance.outputs.controller_cache_images }}
      BUILDX_BUILDER: controller-cache-${{ github.run_id }}-${{ matrix.arch }}
      BUILD_CACHE_TIMEOUT: 300s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-cache-credentials
      - name: Refresh native Controller cache
        id: build-images
        run: bash scripts/build-release-controller.sh --cache-only
      - name: Remove Controller BuildKit builder
        if: always()
        run: docker buildx rm "${BUILDX_BUILDER}" >/dev/null 2>&1 || true

  basic-ci-result:
    name: Basic CI Result
    if: ${{ always() && !cancelled() }}
    needs: [ci-relevance, docs, ci-tools, go, rust, installers, web, web-browser, database-smoke, database-recovery-full]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "${RESULTS}" | jq -e '
            . as $results | .["ci-relevance"].outputs as $routing |
            .["ci-relevance"].result == "success" and
            ($routing.profile == "quick" or $routing.profile == "full") and
            all(["run_docs", "run_go", "run_rust", "run_web", "run_web_browser", "run_database", "run_ci_tools", "run_installers", "run_controller_cache"][];
              $routing[.] == "true" or $routing[.] == "false") and
            (if $routing.profile == "full" then
              all(["run_docs", "run_go", "run_rust", "run_web", "run_web_browser", "run_database", "run_ci_tools", "run_installers"][]; $routing[.] == "true") and
              ($routing.ci_suites | split(" ") | index("guards") != null and index("release") != null and index("source-style") != null and index("contracts") != null)
            else true end) and
            all([
              ["docs", "run_docs"],
              ["ci-tools", "run_ci_tools"],
              ["go", "run_go"],
              ["rust", "run_rust"],
              ["installers", "run_installers"],
              ["web", "run_web"],
              ["web-browser", "run_web_browser"],
              ["database-smoke", "run_database"]
            ][];
              ($routing[.[1]] == "true") as $selected |
              ($selected and $results[.[0]].result == "success") or
              ($selected == false and $results[.[0]].result == "skipped")) and
            (if $routing.profile == "full" then
              .["database-recovery-full"].result == "success"
            else .["database-recovery-full"].result == "skipped" end)'
