name: Basic CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Basic CI coverage
        type: choice
        options: [quick, full]
        default: full
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-relevance:
    name: Basic CI Routing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.relevance.outputs.profile }}
      database_scope: ${{ steps.relevance.outputs.database_scope }}
      run_docs: ${{ steps.relevance.outputs.run_docs }}
      run_go: ${{ steps.relevance.outputs.run_go }}
      run_rust: ${{ steps.relevance.outputs.run_rust }}
      run_web: ${{ steps.relevance.outputs.run_web }}
      run_database: ${{ steps.relevance.outputs.run_database }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the change set
        id: relevance
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CI_PROFILE: ${{ inputs.profile }}
        run: scripts/ci-relevance.sh "${GITHUB_EVENT_NAME}" "${BASE_SHA}" "${HEAD_SHA}" "${GITHUB_OUTPUT}" "${CI_PROFILE}"

  docs:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.run_docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/docs-check.sh

  go:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.run_go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/bootstrap.sh go-test
      - run: scripts/go-check.sh standard

  rust:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.run_rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/bootstrap.sh rust-basic
      - run: scripts/rust-check.sh

  web:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.run_web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/bootstrap.sh web
      - name: Install Chromium for authentication regressions
        run: |
          source scripts/env.sh
          cd web
          npx playwright install --with-deps chromium
      - run: scripts/web-check.sh

  database-smoke:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.run_database == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      postgres17: ${{ steps.completed.outputs.postgres17 }}
      postgres18: ${{ steps.completed.outputs.postgres18 }}
      mysql: ${{ steps.completed.outputs.mysql }}
      mariadb: ${{ steps.completed.outputs.mariadb }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: postgres
            postgres: "17"
          - engine: postgres
            postgres: "18"
          - engine: mysql
          - engine: mariadb
    env:
      PG_MAJOR: ${{ matrix.postgres }}
      ENGINE: ${{ matrix.engine }}
      DATABASE_TEST_SCOPE: ${{ needs.ci-relevance.outputs.database_scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/bootstrap.sh go-test
      - if: matrix.engine == 'postgres'
        run: scripts/database-integration.sh
      - if: matrix.engine != 'postgres'
        run: |
          unset DATABASE_FULL_PART
          if [[ "${DATABASE_TEST_SCOPE}" == full ]]; then export DATABASE_FULL_PART=current; fi
          bash scripts/database-foundation-integration.sh
      - id: completed
        run: echo "${ENGINE}${PG_MAJOR}=success" >> "${GITHUB_OUTPUT}"

  database-history-full:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      mysql: ${{ steps.completed.outputs.mysql }}
      mariadb: ${{ steps.completed.outputs.mariadb }}
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, mariadb]
    env:
      ENGINE: ${{ matrix.engine }}
      DATABASE_TEST_SCOPE: ${{ needs.ci-relevance.outputs.database_scope }}
      DATABASE_FULL_PART: history
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/bootstrap.sh go-test
      - run: bash scripts/database-foundation-integration.sh
      - id: completed
        run: echo "${ENGINE}=success" >> "${GITHUB_OUTPUT}"

  basic-ci-result:
    name: Basic CI Result
    if: always()
    needs: [ci-relevance, docs, go, rust, web, database-smoke, database-history-full]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "${RESULTS}" | jq -e '
            def completed($job; $parts):
              .[$job] as $result | $result.result == "success" and
              all($parts[]; $result.outputs[.] == "success");
            .["ci-relevance"].outputs as $routing |
            .["ci-relevance"].result == "success" and
            (if $routing.profile == "full" then
              $routing.database_scope == "full" and
              all(["run_docs", "run_go", "run_rust", "run_web", "run_database"][]; $routing[.] == "true") and
              completed("database-history-full"; ["mysql", "mariadb"])
            elif $routing.profile == "quick" then
              $routing.database_scope == "regression" and .["database-history-full"].result == "skipped"
            else false end) and
            (if $routing.run_database == "true" then
              completed("database-smoke"; ["postgres17", "postgres18", "mysql", "mariadb"])
            else true end) and
            (.["ci-relevance"].outputs as $flags |
              [{job: "docs", flag: "run_docs"},
               {job: "go", flag: "run_go"},
               {job: "rust", flag: "run_rust"},
               {job: "web", flag: "run_web"},
               {job: "database-smoke", flag: "run_database"}] as $checks |
              . as $results | all($checks[];
                ($flags[.flag] == "true" and $results[.job].result == "success") or
                ($flags[.flag] == "false" and $results[.job].result == "skipped")))'
