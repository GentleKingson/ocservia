name: Basic CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Key compatibility checks
        type: choice
        options: [quick, full]
        default: full
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.profile || 'quick' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.profile == 'quick' }}

jobs:
  ci-relevance:
    name: Basic CI Routing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.relevance.outputs.profile }}
      database_scope: ${{ steps.relevance.outputs.database_scope }}
      database_matrix: ${{ steps.relevance.outputs.database_matrix }}
      run_ci_tools: ${{ steps.relevance.outputs.run_ci_tools }}
      run_installers: ${{ steps.relevance.outputs.run_installers }}
      run_docs: ${{ steps.relevance.outputs.run_docs }}
      run_go: ${{ steps.relevance.outputs.run_go }}
      run_rust: ${{ steps.relevance.outputs.run_rust }}
      run_web: ${{ steps.relevance.outputs.run_web }}
      run_database: ${{ steps.relevance.outputs.run_database }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the change set
        id: relevance
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CI_PROFILE: ${{ inputs.profile }}
        run: scripts/ci-relevance.sh "${GITHUB_EVENT_NAME}" "${BASE_SHA}" "${HEAD_SHA}" "${GITHUB_OUTPUT}" "${CI_PROFILE}"

  docs:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.run_docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/docs-check.sh

  go:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.run_go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/bootstrap.sh go-test
      - id: cache-key
        run: bash scripts/ci-go-cache-key.sh >> "${GITHUB_OUTPUT}"
      - id: go-mod-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/go-mod
          key: basic-go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.identity }}
      - id: go-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/go-build
          key: basic-go-build-v1-unit-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.identity }}-${{ github.sha }}
          restore-keys: basic-go-build-v1-unit-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.identity }}-
      - name: CI guard and workflow contracts
        if: needs.ci-relevance.outputs.run_ci_tools == 'true'
        run: |
          source scripts/env.sh
          bash scripts/test-ci-relevance.sh
          bash scripts/test-required-go-tests.sh
          bash scripts/test-bootstrap-profiles.sh
      - run: scripts/go-check.sh standard
      - name: Save Go modules (main only)
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-mod-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/go-mod
          key: ${{ steps.go-mod-cache.outputs.cache-primary-key }}
      - name: Save ordinary Go objects (main only)
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/go-build
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}

  rust:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.run_rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/bootstrap.sh rust-basic
      - run: scripts/rust-check.sh
      - name: Relay launcher and installer contracts
        if: needs.ci-relevance.outputs.run_installers == 'true'
        run: |
          bash scripts/test-managed-node-install.sh
          bash scripts/test-controller-install.sh
          bash scripts/test-controller-bootstrap.sh
          docker run --rm -v "$PWD:/source:ro" node:24.18.0-bookworm \
            python3 /source/scripts/test-relay-launchers.py
          docker run --rm --network none -v "$PWD:/source:ro" node:24.18.0-bookworm \
            bash /source/scripts/test-release-agent-state-check.sh

  web:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.run_web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/bootstrap.sh web
      - run: scripts/web-check.sh basic

  database-smoke:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.run_database == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci-relevance.outputs.database_matrix) }}
    env:
      PG_MAJOR: ${{ matrix.postgres }}
      ENGINE: ${{ matrix.engine }}
      DATABASE_TEST_SCOPE: ${{ needs.ci-relevance.outputs.database_scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/bootstrap.sh go-test
      - id: cache-key
        run: bash scripts/ci-go-cache-key.sh >> "${GITHUB_OUTPUT}"
      - id: go-mod-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/go-mod
          key: basic-go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.identity }}
      - id: go-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/go-build
          key: basic-go-build-v1-db-smoke-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.identity }}-${{ github.sha }}
          restore-keys: |
            basic-go-build-v1-db-smoke-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.identity }}-
            basic-go-build-v1-unit-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.identity }}-
      - if: matrix.engine == 'postgres'
        run: scripts/database-integration.sh
      - if: matrix.engine != 'postgres'
        run: bash scripts/database-foundation-integration.sh
      - name: Save database Go objects (one main writer)
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.engine == 'mysql' && steps.go-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/go-build
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}

  database-recovery-full:
    needs: ci-relevance
    if: needs.ci-relevance.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, mariadb]
    env:
      ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: |
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ENGINE}" \
            ARTIFACT_DIR="${RUNNER_TEMP}/database-recovery-${ENGINE}" \
            bash scripts/i18-mysql-backup-restore-smoke.sh

  basic-ci-result:
    name: Basic CI Result
    if: always()
    needs: [ci-relevance, docs, go, rust, web, database-smoke, database-recovery-full]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "${RESULTS}" | jq -e '
            . as $results | .["ci-relevance"].outputs as $routing |
            .["ci-relevance"].result == "success" and
            ($routing.profile == "quick" or $routing.profile == "full") and
            (if $routing.profile == "full" then
              all(["run_docs", "run_go", "run_rust", "run_web", "run_database"][]; $routing[.] == "true")
            else true end) and
            all(["docs", "go", "rust", "web", "database-smoke"][];
              . as $job | (if $job == "database-smoke" then "run_database" else "run_" + $job end) as $flag |
              ($routing[$flag] == "true" and $results[$job].result == "success") or
              ($routing[$flag] == "false" and $results[$job].result == "skipped")) and
            (if $routing.profile == "full" then
              .["database-recovery-full"].result == "success"
            else .["database-recovery-full"].result == "skipped" end)'
