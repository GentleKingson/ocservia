  license:
    name: Dependency License Policy
    needs: [ci-relevance]
    if: needs.ci-relevance.outputs.run_license == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore verified tools
        id: security-tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: tooling-v4-security-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh') }}
      - name: Restore shared npm cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/npm
          key: npm-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'web/package-lock.json', 'scripts/g6-runtime/package-lock.json') }}
          restore-keys: |
            npm-v4-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore shared Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/go-build
            .cache/go-mod
            .cache/gopath
          key: go-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'go.work', 'go.work.sum', 'control-plane/go.mod', 'control-plane/go.sum', 'tools/g6-harness/go.mod') }}-${{ github.sha }}
          restore-keys: |
            go-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'go.work', 'go.work.sum', 'control-plane/go.mod', 'control-plane/go.sum', 'tools/g6-harness/go.mod') }}-
            go-v4-${{ runner.os }}-${{ runner.arch }}-
      - name: Enable sccache GitHub Actions backend
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"
          disable_annotations: true
      - name: Configure sccache backend
        run: scripts/configure-sccache.sh
      - name: Bootstrap pinned security tools
        run: scripts/bootstrap.sh security
      - name: License checks
        run: scripts/license-check.sh ${{ needs.ci-relevance.outputs.run_rust == 'true' && '--skip-rust' || '' }}
      - name: Save verified tools
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.security-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: ${{ steps.security-tools-cache.outputs.cache-primary-key }}

  native-ocserv:
    name: Native Ocserv / Agent Integration
    needs: [ci-relevance]
    if: needs.ci-relevance.outputs.run_native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore verified tools
        id: native-tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: tooling-v4-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh') }}
      - name: Enable sccache GitHub Actions backend
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"
          disable_annotations: true
      - name: Configure sccache backend
        run: scripts/configure-sccache.sh
      - name: Bootstrap pinned native tools
        run: scripts/bootstrap.sh native
      - name: Install ephemeral native fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --yes ocserv openconnect ssl-cert
      - name: Native ocpasswd, OpenSSL, and Ocserv login
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts/native-ocserv
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          # Stay below the Linux ephemeral port range (32768+) so an
          # unrelated outbound connection on the runner cannot collide with
          # the Ocserv listener bind.
          port=$((20000 + GITHUB_RUN_ID % 10000))
          native_target="${RUNNER_TEMP}/ocservia-native-target-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          native_status=0
          sudo --preserve-env=RUNNER_TEMP,ARTIFACT_DIR,RUSTC_WRAPPER,SCCACHE_GHA_ENABLED,SCCACHE_BASEDIRS,ACTIONS_CACHE_SERVICE_V2,ACTIONS_CACHE_URL,ACTIONS_RESULTS_URL,ACTIONS_RUNTIME_TOKEN env \
            CARGO_TARGET_DIR="${native_target}" \
            RUN_ID="I13-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-native" \
            OCSERVIA_I13_OCSERV_PORT="${port}" \
            scripts/i13-native-ocserv-integration.sh || native_status=$?
          sudo rm -rf "${native_target}" || native_status=1
          exit "${native_status}"
      - name: Save verified tools
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.native-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: ${{ steps.native-tools-cache.outputs.cache-primary-key }}
      - name: Upload native failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-ocserv-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/native-ocserv
          if-no-files-found: warn
          retention-days: 1

  backend-integration:
    name: Backend Integration
    if: ${{ always() }}
    needs:
      - ci-relevance
      - runtime-artifacts
      - go-standard
      - go-race
      - database
      - production-relays
      - credential-rotation
      - local-slice
      - p1-smoke
      - rust-validation
      - contracts-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI_RELEVANCE: ${{ needs.ci-relevance.result }}
      RUNTIME_ARTIFACTS: ${{ needs.runtime-artifacts.result }}
      RUNTIME_ARTIFACTS_RELEVANT: ${{ needs.ci-relevance.outputs.run_runtime_artifacts }}
      GO_STANDARD: ${{ needs.go-standard.result }}
      GO_STANDARD_RELEVANT: ${{ needs.ci-relevance.outputs.run_go_standard }}
      GO_RACE: ${{ needs.go-race.result }}
      GO_RACE_RELEVANT: ${{ needs.ci-relevance.outputs.run_go_race }}
      DATABASE: ${{ needs.database.result }}
      DATABASE_RELEVANT: ${{ needs.ci-relevance.outputs.run_database }}
      CONTRACTS_POLICY: ${{ needs.contracts-policy.result }}
      STAGE_CONTRACTS_RELEVANT: ${{ needs.ci-relevance.outputs.run_stage_contracts }}
      PRODUCTION_RELAYS: ${{ needs.production-relays.result }}
      PRODUCTION_RELAYS_RELEVANT: ${{ needs.ci-relevance.outputs.run_production_relays }}
      CREDENTIAL_ROTATION: ${{ needs.credential-rotation.result }}
      CREDENTIAL_ROTATION_RELEVANT: ${{ needs.ci-relevance.outputs.run_credential_rotation }}
      LOCAL_SLICE: ${{ needs.local-slice.result }}
      LOCAL_SLICE_RELEVANT: ${{ needs.ci-relevance.outputs.run_local_slice }}
      P1_SMOKE: ${{ needs.p1-smoke.result }}
      P1_SMOKE_RELEVANT: ${{ needs.ci-relevance.outputs.run_p1_smoke }}
      RUST_VALIDATION: ${{ needs.rust-validation.result }}
      RUST_VALIDATION_RELEVANT: ${{ needs.ci-relevance.outputs.run_rust }}
    steps:
      - name: Verify backend/runtime worker results
        run: |
          if [[ "${CI_RELEVANCE}" != "success" ]]; then
            echo "the relevance classifier finished with ${CI_RELEVANCE}" >&2
            exit 1
          fi
          if [[ "${STAGE_CONTRACTS_RELEVANT}" == "true" && "${CONTRACTS_POLICY}" != "success" ]]; then
            echo "staged feature contracts require contracts-policy success, got ${CONTRACTS_POLICY}" >&2
            exit 1
          fi
          while IFS='|' read -r worker result authorized; do
            if [[ "${result}" == "success" && "${authorized}" == "true" ]]; then
              continue
            fi
            if [[ "${result}" == "skipped" && "${authorized}" == "false" ]]; then
              continue
            fi
            echo "${worker} finished with ${result} while its relevance flag is ${authorized:-missing}" >&2
            exit 1
          done <<CHECKS
          runtime-artifacts|${RUNTIME_ARTIFACTS}|${RUNTIME_ARTIFACTS_RELEVANT}
          go-standard|${GO_STANDARD}|${GO_STANDARD_RELEVANT}
          go-race|${GO_RACE}|${GO_RACE_RELEVANT}
          database|${DATABASE}|${DATABASE_RELEVANT}
          production-relays|${PRODUCTION_RELAYS}|${PRODUCTION_RELAYS_RELEVANT}
          credential-rotation|${CREDENTIAL_ROTATION}|${CREDENTIAL_ROTATION_RELEVANT}
          local-slice|${LOCAL_SLICE}|${LOCAL_SLICE_RELEVANT}
          p1-smoke|${P1_SMOKE}|${P1_SMOKE_RELEVANT}
          rust-validation|${RUST_VALIDATION}|${RUST_VALIDATION_RELEVANT}
          CHECKS

  web-smoke:
    name: Web & Smoke
    if: ${{ always() }}
    needs:
      - ci-relevance
      - web-validation
      - browser-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI_RELEVANCE: ${{ needs.ci-relevance.result }}
      WEB_VALIDATION: ${{ needs.web-validation.result }}
      WEB_VALIDATION_RELEVANT: ${{ needs.ci-relevance.outputs.run_web }}
      BROWSER_E2E: ${{ needs.browser-e2e.result }}
      BROWSER_E2E_RELEVANT: ${{ needs.ci-relevance.outputs.run_browser }}
    steps:
      - name: Verify Web/browser worker results
        run: |
          if [[ "${CI_RELEVANCE}" != "success" ]]; then
            echo "the relevance classifier finished with ${CI_RELEVANCE}" >&2
            exit 1
          fi
          while IFS='|' read -r worker result authorized; do
            if [[ "${result}" == "success" && "${authorized}" == "true" ]]; then
              continue
            fi
            if [[ "${result}" == "skipped" && "${authorized}" == "false" ]]; then
              continue
            fi
            echo "${worker} finished with ${result} while its relevance flag is ${authorized:-missing}" >&2
            exit 1
          done <<CHECKS
          web-validation|${WEB_VALIDATION}|${WEB_VALIDATION_RELEVANT}
          browser-e2e|${BROWSER_E2E}|${BROWSER_E2E_RELEVANT}
          CHECKS

  quality-security-native:
    name: Quality, Security & Native
    if: ${{ always() }}
    needs:
      - ci-relevance
      - contracts-policy
      - rust-validation
      - security-scan
      - license
      - native-ocserv
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI_RELEVANCE: ${{ needs.ci-relevance.result }}
      CONTRACTS_POLICY: ${{ needs.contracts-policy.result }}
      CONTRACTS_POLICY_RELEVANT: ${{ needs.ci-relevance.outputs.run_contracts_policy }}
      RUST_VALIDATION: ${{ needs.rust-validation.result }}
      RUST_VALIDATION_RELEVANT: ${{ needs.ci-relevance.outputs.run_rust }}
      SECURITY_SCAN: ${{ needs.security-scan.result }}
      LICENSE: ${{ needs.license.result }}
      LICENSE_RELEVANT: ${{ needs.ci-relevance.outputs.run_license }}
      NATIVE_OCSERV: ${{ needs.native-ocserv.result }}
      NATIVE_OCSERV_RELEVANT: ${{ needs.ci-relevance.outputs.run_native }}
    steps:
      - name: Verify contracts/security/native worker results
        run: |
          if [[ "${CI_RELEVANCE}" != "success" ]]; then
            echo "the relevance classifier finished with ${CI_RELEVANCE}" >&2
            exit 1
          fi
          # Secret scanning is structurally outside classifier skip authority.
          # Every conditional worker must either succeed or be skipped with an
          # explicit false relevance flag.
          while IFS='|' read -r worker result authorized; do
            if [[ "${result}" == "success" && "${authorized}" == "true" ]]; then
              continue
            fi
            if [[ "${result}" == "skipped" && "${authorized}" == "false" ]]; then
              continue
            fi
            echo "${worker} finished with ${result} while its relevance flag is ${authorized:-missing}" >&2
            exit 1
          done <<CHECKS
          contracts-policy|${CONTRACTS_POLICY}|${CONTRACTS_POLICY_RELEVANT}
          rust-validation|${RUST_VALIDATION}|${RUST_VALIDATION_RELEVANT}
          security-scan|${SECURITY_SCAN}|true
          license|${LICENSE}|${LICENSE_RELEVANT}
          native-ocserv|${NATIVE_OCSERV}|${NATIVE_OCSERV_RELEVANT}
          CHECKS
