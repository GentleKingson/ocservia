name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-artifacts:
    name: Build Runtime Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runner preflight
        run: scripts/ci-preflight.sh
      - name: Restore verified tools
        id: runtime-tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: tooling-v4-go-rust-integration-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh') }}
      - name: Restore shared Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/go-build
            .cache/go-mod
            .cache/gopath
          key: go-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'go.work', 'go.work.sum', 'control-plane/go.mod', 'control-plane/go.sum', 'tools/g6-harness/go.mod') }}-${{ github.sha }}
          restore-keys: |
            go-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'go.work', 'go.work.sum', 'control-plane/go.mod', 'control-plane/go.sum', 'tools/g6-harness/go.mod') }}-
            go-v4-${{ runner.os }}-${{ runner.arch }}-
      - name: Enable sccache GitHub Actions backend
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"
          disable_annotations: true
      - name: Configure sccache backend
        run: scripts/configure-sccache.sh
      - name: Bootstrap pinned Go and Rust tools
        run: scripts/bootstrap.sh go-rust-integration
      - name: Build commit-bound runtime artifacts
        run: scripts/ci-runtime-artifact.sh build "${RUNNER_TEMP}/runtime-upload" "${GITHUB_SHA}"
      - name: Save verified tools
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.runtime-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: ${{ steps.runtime-tools-cache.outputs.cache-primary-key }}
      - name: Show sccache statistics
        if: always()
        run: |
          source scripts/env.sh
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || true
          fi
      - name: Upload runtime artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-upload/runtime-artifacts.tar.gz
          if-no-files-found: error
          retention-days: 1

  go-standard:
    name: Go Static and Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runner preflight
        run: scripts/ci-preflight.sh
      - name: Restore verified tools
        id: go-standard-tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: tooling-v4-go-quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh') }}
      - name: Restore shared Go cache
        id: go-standard-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/go-build
            .cache/go-mod
            .cache/gopath
          key: go-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'go.work', 'go.work.sum', 'control-plane/go.mod', 'control-plane/go.sum', 'tools/g6-harness/go.mod') }}-${{ github.sha }}
          restore-keys: |
            go-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'go.work', 'go.work.sum', 'control-plane/go.mod', 'control-plane/go.sum', 'tools/g6-harness/go.mod') }}-
            go-v4-${{ runner.os }}-${{ runner.arch }}-
      - name: Bootstrap pinned Go tools
        run: scripts/bootstrap.sh go-quality
      - name: Go format, static analysis, unit, and vulnerability checks
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts/go-standard
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          set -o pipefail
          scripts/go-check.sh standard 2>&1 | tee "${ARTIFACT_DIR}/go-standard.log"
      - name: Save verified tools
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-standard-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: ${{ steps.go-standard-tools-cache.outputs.cache-primary-key }}
      - name: Save shared Go cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-standard-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/go-build
            .cache/go-mod
            .cache/gopath
          key: ${{ steps.go-standard-cache.outputs.cache-primary-key }}
      - name: Upload Go diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-standard-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/go-standard
          if-no-files-found: warn
          retention-days: 1

  go-race:
    name: Go Race
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runner preflight
        run: scripts/ci-preflight.sh
      - name: Restore verified tools
        id: go-race-tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: tooling-v4-go-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh') }}
      - name: Restore shared Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/go-build
            .cache/go-mod
            .cache/gopath
          key: go-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'go.work', 'go.work.sum', 'control-plane/go.mod', 'control-plane/go.sum', 'tools/g6-harness/go.mod') }}-${{ github.sha }}
          restore-keys: |
            go-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'go.work', 'go.work.sum', 'control-plane/go.mod', 'control-plane/go.sum', 'tools/g6-harness/go.mod') }}-
            go-v4-${{ runner.os }}-${{ runner.arch }}-
      - name: Bootstrap pinned Go tools
        run: scripts/bootstrap.sh go-test
      - name: Go race suite
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts/go-race
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          set -o pipefail
          scripts/go-check.sh race 2>&1 | tee "${ARTIFACT_DIR}/go-race.log"
      - name: Save verified tools
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-race-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: ${{ steps.go-race-tools-cache.outputs.cache-primary-key }}
      - name: Upload Go race diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-race-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/go-race
          if-no-files-found: warn
          retention-days: 1

  database:
    name: PostgreSQL ${{ matrix.pg-major }} Integration
    needs: runtime-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pg-major: [17, 18]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runner preflight
        run: scripts/ci-preflight.sh
      - name: Restore verified tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: tooling-v4-go-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh') }}
      - name: Restore shared Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/go-build
            .cache/go-mod
            .cache/gopath
          key: go-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'go.work', 'go.work.sum', 'control-plane/go.mod', 'control-plane/go.sum', 'tools/g6-harness/go.mod') }}-${{ github.sha }}
          restore-keys: |
            go-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'go.work', 'go.work.sum', 'control-plane/go.mod', 'control-plane/go.sum', 'tools/g6-harness/go.mod') }}-
            go-v4-${{ runner.os }}-${{ runner.arch }}-
      - name: Bootstrap pinned Go tools
        run: scripts/bootstrap.sh go-test
      - name: Download runtime artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-download
      - name: Verify runtime artifacts
        run: scripts/ci-runtime-artifact.sh extract "${RUNNER_TEMP}/runtime-download/runtime-artifacts.tar.gz" "${RUNNER_TEMP}/runtime" "${GITHUB_SHA}"
      - name: PostgreSQL integration
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts/database/pg${{ matrix.pg-major }}
          OCSERVIA_CONTROL_BIN: ${{ runner.temp }}/runtime/ocserv-control
          PG_MAJOR: ${{ matrix.pg-major }}
          RUN_ID: database-${{ github.run_id }}-${{ github.run_attempt }}-pg${{ matrix.pg-major }}
        run: scripts/database-integration.sh
      - name: Upload PostgreSQL diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: database-pg${{ matrix.pg-major }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/database/pg${{ matrix.pg-major }}
          if-no-files-found: warn
          retention-days: 1

  stage-contracts:
    name: I14-I19 Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runner preflight
        run: scripts/ci-preflight.sh
      - name: Stage-specific contract assertions
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts/stage-contracts
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          set -o pipefail
          scripts/i14-quota-expiry-backport.sh --contract-only 2>&1 | tee "${ARTIFACT_DIR}/i14.log"
          scripts/i15-config-plan.sh --contract-only 2>&1 | tee "${ARTIFACT_DIR}/i15.log"
          scripts/i16-config-apply.sh --contract-only 2>&1 | tee "${ARTIFACT_DIR}/i16.log"
          scripts/i17-certificate-secret.sh --contract-only 2>&1 | tee "${ARTIFACT_DIR}/i17.log"
          scripts/i19-five-minute-offline-recovery.sh --contract-only 2>&1 | tee "${ARTIFACT_DIR}/i19.log"
      - name: Upload stage contract diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stage-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/stage-contracts
          if-no-files-found: warn
          retention-days: 1

  production-relays:
    name: I18 Production Relays
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runner preflight
        run: scripts/ci-preflight.sh
      - name: Restore verified tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: tooling-v4-go-rust-integration-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh') }}
      - name: Restore shared Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/go-build
            .cache/go-mod
            .cache/gopath
          key: go-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'go.work', 'go.work.sum', 'control-plane/go.mod', 'control-plane/go.sum', 'tools/g6-harness/go.mod') }}-${{ github.sha }}
          restore-keys: |
            go-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'go.work', 'go.work.sum', 'control-plane/go.mod', 'control-plane/go.sum', 'tools/g6-harness/go.mod') }}-
            go-v4-${{ runner.os }}-${{ runner.arch }}-
      - name: Enable sccache GitHub Actions backend
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"
          disable_annotations: true
      - name: Configure sccache backend
        run: scripts/configure-sccache.sh
      - name: Bootstrap pinned Go and Rust tools
        run: scripts/bootstrap.sh go-rust-integration
      - name: Production topology, relays, backup, and package checks
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts/production-relays
          RUN_ID: production-${{ github.run_id }}-${{ github.run_attempt }}-relays
        run: scripts/i18-production-relays.sh --contract-only
      - name: Show sccache statistics
        if: always()
        run: |
          source scripts/env.sh
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || true
          fi
      - name: Upload production relay diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-relays-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/production-relays
          if-no-files-found: warn
          retention-days: 1

  credential-rotation:
    name: PostgreSQL Credential Rotation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runner preflight
        run: scripts/ci-preflight.sh
      - name: Application and backup credential rotation
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts/credential-rotation
          RUN_ID: postgres-rotation-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/i18-postgres-credential-rotation.sh
      - name: Upload credential rotation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: credential-rotation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/credential-rotation
          if-no-files-found: warn
          retention-days: 1

  local-slice:
    name: Local Slice
    needs: runtime-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runner preflight
        run: scripts/ci-preflight.sh
      - name: Download runtime artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-download
      - name: Verify runtime artifacts
        run: scripts/ci-runtime-artifact.sh extract "${RUNNER_TEMP}/runtime-download/runtime-artifacts.tar.gz" "${RUNNER_TEMP}/runtime" "${GITHUB_SHA}"
      - name: Go, PostgreSQL, UDS, and Rust stub local slice
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts/local-slice
          OCSERVIA_CONTROL_BIN: ${{ runner.temp }}/runtime/ocserv-control
          OCSERVIA_TRANSPORTD_STUB_BIN: ${{ runner.temp }}/runtime/ocservia-transportd-stub
          RUN_ID: local-slice-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/local-slice-integration.sh
      - name: Upload local slice diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: local-slice-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/local-slice
          if-no-files-found: warn
          retention-days: 1

  web-validation:
    name: Web Static and Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runner preflight
        run: scripts/ci-preflight.sh
      - name: Restore verified tools
        id: web-tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: tooling-v4-web-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh') }}
      - name: Restore shared npm cache
        id: web-npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/npm
          key: npm-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'web/package-lock.json', 'scripts/g6-runtime/package-lock.json') }}
          restore-keys: |
            npm-v4-${{ runner.os }}-${{ runner.arch }}-
      - name: Bootstrap pinned Web tools
        run: scripts/bootstrap.sh web
      - name: Web checks
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts/web-validation
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          set -o pipefail
          scripts/web-check.sh 2>&1 | tee "${ARTIFACT_DIR}/web-check.log"
      - name: Save verified tools
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.web-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: ${{ steps.web-tools-cache.outputs.cache-primary-key }}
      - name: Save shared npm cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.web-npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/npm
          key: ${{ steps.web-npm-cache.outputs.cache-primary-key }}
      - name: Upload Web diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/web-validation
          if-no-files-found: warn
          retention-days: 1

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runner preflight
        run: scripts/ci-preflight.sh
      - name: Docker Compose Playwright E2E
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts/browser-e2e
          COMPOSE_PROJECT: ocservia-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          RUN_ID: e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/e2e.sh
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/browser-e2e
          if-no-files-found: warn
          retention-days: 1

  p1-smoke:
    name: P1 Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AGENT_COUNT: 24
      HEARTBEAT_COUNT: 2
      HEARTBEAT_INTERVAL_MS: 500
      MINIMUM_RESOURCE_SAMPLES: 8
      P1_PROFILE: smoke
      QUEUE_CAPACITY: 256
      REQUEST_CONCURRENCY: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runner preflight
        run: scripts/ci-preflight.sh
      - name: P1 harness boundary tests
        env:
          COMPOSE_PROJECT: ocservia-p1-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          RUN_ID: p1-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/test-p1-resilience-capacity.sh
      - name: P1 hosted-runner smoke profile
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts/p1-smoke
          COMPOSE_PROJECT: ocservia-p1-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          RUN_ID: p1-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/p1-resilience-capacity.sh
      - name: Upload P1 smoke diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: p1-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/p1-smoke
          if-no-files-found: warn
          retention-days: 1

  contracts-policy:
    name: Contracts and Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Runner preflight
        run: scripts/ci-preflight.sh
      - name: Restore verified tools
        id: contracts-tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: tooling-v4-contracts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh') }}
      - name: Restore shared npm cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/npm
          key: npm-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'web/package-lock.json', 'scripts/g6-runtime/package-lock.json') }}
          restore-keys: |
            npm-v4-${{ runner.os }}-${{ runner.arch }}-
      - name: Bootstrap pinned contract tools
        run: scripts/bootstrap.sh contracts
      - name: Repository policy
        run: |
          scripts/check-public-repository.sh
          scripts/test-public-repository-policy.sh
      - name: Documentation
        run: scripts/docs-check.sh
      - name: CI workflow policy tests
        run: |
          scripts/test-bootstrap-profiles.sh
          scripts/test-ci-runtime-artifact.sh
      - name: G6 readiness workflow policy
        run: |
          scripts/test-g6-readiness-workflow.sh
          scripts/test-g6-readiness-hang-guards.sh
      - name: Generate contract outputs
        run: scripts/generate.sh
      - name: Lint contract sources
        run: |
          source scripts/env.sh
          (cd proto && buf format --diff --exit-code && buf lint)
          (cd web && npx --no-install redocly lint --config ../openapi/.redocly.yaml ../openapi/openapi.yaml)
      - name: Check contract breaking changes
        run: scripts/check-breaking.sh
      - name: Check generated output
        run: |
          scripts/generated-clean.sh --skip-generate
          scripts/test-generated-clean.sh
      - name: Save verified tools
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.contracts-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: ${{ steps.contracts-tools-cache.outputs.cache-primary-key }}
      - name: Capture contract diagnostics
        if: always()
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts/contracts
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          git status --short >"${ARTIFACT_DIR}/git-status.txt"
          git diff --binary >"${ARTIFACT_DIR}/generated-output.diff"
      - name: Upload contract diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/contracts
          if-no-files-found: error
          retention-days: 1

  rust-validation:
    name: Rust Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runner preflight
        run: scripts/ci-preflight.sh
      - name: Restore verified tools
        id: rust-tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: tooling-v4-rust-validation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh') }}
      - name: Enable sccache GitHub Actions backend
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"
          disable_annotations: true
      - name: Configure sccache backend
        run: scripts/configure-sccache.sh
      - name: Bootstrap pinned Rust tools
        run: scripts/bootstrap.sh rust-validation
      - name: Rust checks
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts/rust
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          set -o pipefail
          scripts/rust-check.sh 2>&1 | tee "${ARTIFACT_DIR}/rust-check.log"
      - name: Agent privilege boundary
        run: scripts/agent-boundary-check.sh
      - name: Transport boundary
        run: scripts/transport-boundary-check.sh
      - name: Save verified tools
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: ${{ steps.rust-tools-cache.outputs.cache-primary-key }}
      - name: Show sccache statistics
        if: always()
        run: |
          source scripts/env.sh
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || true
          fi
      - name: Upload Rust diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/rust
          if-no-files-found: warn
          retention-days: 1

  security-license:
    name: Security and Licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Runner preflight
        run: scripts/ci-preflight.sh
      - name: Restore verified tools
        id: security-tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: tooling-v4-security-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh') }}
      - name: Restore shared npm cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/npm
          key: npm-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'web/package-lock.json', 'scripts/g6-runtime/package-lock.json') }}
          restore-keys: |
            npm-v4-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore shared Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/go-build
            .cache/go-mod
            .cache/gopath
          key: go-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'go.work', 'go.work.sum', 'control-plane/go.mod', 'control-plane/go.sum', 'tools/g6-harness/go.mod') }}-${{ github.sha }}
          restore-keys: |
            go-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'go.work', 'go.work.sum', 'control-plane/go.mod', 'control-plane/go.sum', 'tools/g6-harness/go.mod') }}-
            go-v4-${{ runner.os }}-${{ runner.arch }}-
      - name: Enable sccache GitHub Actions backend
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"
          disable_annotations: true
      - name: Configure sccache backend
        run: scripts/configure-sccache.sh
      - name: Bootstrap pinned security tools
        run: scripts/bootstrap.sh security
      - name: Secret scan
        run: scripts/security-check.sh
      - name: License checks
        run: scripts/license-check.sh
      - name: Save verified tools
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.security-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: ${{ steps.security-tools-cache.outputs.cache-primary-key }}
      - name: Show sccache statistics
        if: always()
        run: |
          source scripts/env.sh
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || true
          fi

  native-ocserv:
    name: Native Ocserv
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runner preflight
        run: scripts/ci-preflight.sh
      - name: Restore verified tools
        id: native-tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: tooling-v4-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh') }}
      - name: Enable sccache GitHub Actions backend
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"
          disable_annotations: true
      - name: Configure sccache backend
        run: scripts/configure-sccache.sh
      - name: Bootstrap pinned native tools
        run: scripts/bootstrap.sh native
      - name: Install ephemeral native fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --yes ocserv openconnect ssl-cert
      - name: Native ocpasswd, OpenSSL, and Ocserv login
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts/native-ocserv
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          port=$((40000 + GITHUB_RUN_ID % 10000))
          native_target="${RUNNER_TEMP}/ocservia-native-target-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          native_status=0
          sudo --preserve-env=RUNNER_TEMP,ARTIFACT_DIR,RUSTC_WRAPPER,SCCACHE_GHA_ENABLED,SCCACHE_BASEDIRS,ACTIONS_CACHE_SERVICE_V2,ACTIONS_CACHE_URL,ACTIONS_RESULTS_URL,ACTIONS_RUNTIME_TOKEN env \
            CARGO_TARGET_DIR="${native_target}" \
            RUN_ID="I13-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-native" \
            OCSERVIA_I13_OCSERV_PORT="${port}" \
            scripts/i13-native-ocserv-integration.sh || native_status=$?
          sudo rm -rf "${native_target}" || native_status=1
          exit "${native_status}"
      - name: Save verified tools
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.native-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: ${{ steps.native-tools-cache.outputs.cache-primary-key }}
      - name: Show sccache statistics
        if: always()
        run: |
          source scripts/env.sh
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || true
          fi
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-ocserv-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/native-ocserv
          if-no-files-found: warn
          retention-days: 1

  backend-integration:
    name: Backend Integration
    if: ${{ always() }}
    needs:
      - runtime-artifacts
      - go-standard
      - go-race
      - database
      - stage-contracts
      - production-relays
      - credential-rotation
      - local-slice
      - rust-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RUNTIME_ARTIFACTS: ${{ needs.runtime-artifacts.result }}
      GO_STANDARD: ${{ needs.go-standard.result }}
      GO_RACE: ${{ needs.go-race.result }}
      DATABASE: ${{ needs.database.result }}
      STAGE_CONTRACTS: ${{ needs.stage-contracts.result }}
      PRODUCTION_RELAYS: ${{ needs.production-relays.result }}
      CREDENTIAL_ROTATION: ${{ needs.credential-rotation.result }}
      LOCAL_SLICE: ${{ needs.local-slice.result }}
      RUST_VALIDATION: ${{ needs.rust-validation.result }}
    steps:
      - name: Aggregate backend results
        run: |
          for result in \
            "${RUNTIME_ARTIFACTS}" "${GO_STANDARD}" "${GO_RACE}" \
            "${DATABASE}" "${STAGE_CONTRACTS}" "${PRODUCTION_RELAYS}" \
            "${CREDENTIAL_ROTATION}" "${LOCAL_SLICE}" "${RUST_VALIDATION}"
          do
            case "${result}" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done

  web-smoke:
    name: Web & Smoke
    if: ${{ always() }}
    needs:
      - web-validation
      - browser-e2e
      - p1-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      WEB_VALIDATION: ${{ needs.web-validation.result }}
      BROWSER_E2E: ${{ needs.browser-e2e.result }}
      P1_SMOKE: ${{ needs.p1-smoke.result }}
    steps:
      - name: Aggregate Web and smoke results
        run: |
          for result in "${WEB_VALIDATION}" "${BROWSER_E2E}" "${P1_SMOKE}"
          do
            case "${result}" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done

  quality-security-native:
    name: Quality, Security & Native
    if: ${{ always() }}
    needs:
      - contracts-policy
      - rust-validation
      - security-license
      - native-ocserv
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CONTRACTS_POLICY: ${{ needs.contracts-policy.result }}
      RUST_VALIDATION: ${{ needs.rust-validation.result }}
      SECURITY_LICENSE: ${{ needs.security-license.result }}
      NATIVE_OCSERV: ${{ needs.native-ocserv.result }}
    steps:
      - name: Aggregate quality, security, and native results
        run: |
          for result in \
            "${CONTRACTS_POLICY}" "${RUST_VALIDATION}" \
            "${SECURITY_LICENSE}" "${NATIVE_OCSERV}"
          do
            case "${result}" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
