        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: 'g6-harness-smoke-release-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/g6-harness-smoke-release'}
      - name: Download FD-A raw evidence
        if: needs.g6-smoke-fd-a.outputs.artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: 'g6-harness-smoke-fd-a-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/g6-harness-smoke-fd-a'}
      - name: Download FD-B raw evidence
        if: needs.g6-smoke-fd-b.outputs.artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: 'g6-harness-smoke-fd-b-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/g6-harness-smoke-fd-b'}
      - name: Assemble candidate-bound smoke evidence
        id: assemble
        if: needs.g6-smoke-release.result == 'success' && needs.g6-smoke-fd-a.result == 'success' && needs.g6-smoke-fd-b.result == 'success'
        run: |
          set -euo pipefail
          harness="${RUNNER_TEMP}/g6-harness-smoke-release/ocservia-g6-harness"
          chmod 0755 "${harness}"
          mkdir -p "${RUNNER_TEMP}/g6-harness-smoke-bundle"
          "${harness}" smoke-assemble \
            --fd-a "${RUNNER_TEMP}/g6-harness-smoke-fd-a/domain-result.json" --fd-b "${RUNNER_TEMP}/g6-harness-smoke-fd-b/domain-result.json" \
            --bundle "${RUNNER_TEMP}/g6-harness-smoke-bundle/smoke-bundle.json" --output "${RUNNER_TEMP}/g6-harness-smoke-bundle/assembly-result.json" \
            --expected-harness-sha "${{ needs.g6-smoke-release.outputs.harness-sha256 }}" \
            --release-artifact-id "${{ needs.g6-smoke-release.outputs.artifact-id }}" --release-artifact-digest "${{ needs.g6-smoke-release.outputs.artifact-digest }}" \
            --fd-a-artifact-id "${{ needs.g6-smoke-fd-a.outputs.artifact-id }}" --fd-a-artifact-digest "${{ needs.g6-smoke-fd-a.outputs.artifact-digest }}" \
            --fd-b-artifact-id "${{ needs.g6-smoke-fd-b.outputs.artifact-id }}" --fd-b-artifact-digest "${{ needs.g6-smoke-fd-b.outputs.artifact-digest }}"
          bundle_sha="$(jq -er '.bundle_sha256' "${RUNNER_TEMP}/g6-harness-smoke-bundle/assembly-result.json")"
          printf 'bundle-sha256=%s\n' "${bundle_sha}" >>"${GITHUB_OUTPUT}"
      - name: Preserve structured smoke assembly failure
        if: always()
        run: |
          result="${RUNNER_TEMP}/g6-harness-smoke-bundle/assembly-result.json"
          [[ -s "${result}" ]] && exit 0
          mkdir -p "$(dirname "${result}")"
          jq -n --arg candidate_sha "${GITHUB_SHA}" --arg run_id "${GITHUB_RUN_ID}" --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" --arg environment_id "g6-$(printf '%s' "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | openssl dgst -sha256 -r | cut -c1-16)" '{schema_version:"ocservia.g6-harness-smoke-assembly-result.v1",profile:"smoke",binding:{$candidate_sha,$run_id,$run_attempt,$environment_id,authority:"engineering"},bundle_sha256:null,status:"failed",formal_verdict_eligible:false,failure:{code:"runtime_evidence_unavailable",message:"both successful runtime evidence artifacts are required"}}' >"${result}"
      - name: Publish smoke evidence bundle
        id: publish
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: {name: 'g6-harness-smoke-bundle-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/g6-harness-smoke-bundle', if-no-files-found: error, retention-days: 1}
      - name: Enforce smoke assembly result
        if: always()
        run: test "${{ steps.assemble.outcome }}" = success

  g6-smoke-secret-scan:
    name: G6 Harness Smoke Secret Scan
    needs: [g6-smoke-fd-a, g6-smoke-fd-b, g6-smoke-assemble]
    if: ${{ always() && inputs.profile == 'smoke' && inputs.smoke_relevant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.publish.outputs.artifact-id }}
      artifact-digest: ${{ steps.publish.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with: {path: ".cache/downloads\n.tools", key: 'tooling-v4-security-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''toolchains.lock'', ''scripts/checksums.txt'', ''scripts/bootstrap.sh'') }}'}
      - run: scripts/bootstrap.sh security
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: 'g6-harness-smoke-fd-a-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/g6-harness-smoke-fd-a'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: 'g6-harness-smoke-fd-b-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/g6-harness-smoke-fd-b'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: 'g6-harness-smoke-bundle-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/g6-harness-smoke-bundle'}
      - name: Scan every smoke evidence layer
        id: scan
        run: |
          source scripts/env.sh
          gitleaks dir --no-banner --redact --no-color --config "${GITHUB_WORKSPACE}/scripts/g6-secret-scan.toml" "${RUNNER_TEMP}/g6-harness-smoke-fd-a"
          gitleaks dir --no-banner --redact --no-color --config "${GITHUB_WORKSPACE}/scripts/g6-secret-scan.toml" "${RUNNER_TEMP}/g6-harness-smoke-fd-b"
          gitleaks dir --no-banner --redact --no-color --config "${GITHUB_WORKSPACE}/scripts/g6-secret-scan.toml" "${RUNNER_TEMP}/g6-harness-smoke-bundle"
      - name: Record structured smoke secret scan result
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/g6-harness-smoke-secret-scan"
          status=failed; [[ "${{ steps.scan.outcome }}" == success ]] && status=passed
          jq -n --arg candidate_sha "${GITHUB_SHA}" --arg run_id "${GITHUB_RUN_ID}" --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg environment_id "g6-$(printf '%s' "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | openssl dgst -sha256 -r | cut -c1-16)" --arg status "${status}" \
            '{schema_version:"ocservia.g6-harness-smoke-secret-scan-result.v1",profile:"smoke",binding:{$candidate_sha,$run_id,$run_attempt,$environment_id,authority:"engineering"},$status,formal_verdict_eligible:false}' \
            >"${RUNNER_TEMP}/g6-harness-smoke-secret-scan/secret-scan-result.json"
      - name: Publish structured smoke secret scan result
        id: publish
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: {name: 'g6-harness-smoke-secret-scan-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/g6-harness-smoke-secret-scan', if-no-files-found: error, retention-days: 1}

  g6-smoke-verifier:
    name: G6 Harness Smoke Independent Verifier
    needs: [g6-smoke-release, g6-smoke-assemble]
    if: ${{ always() && inputs.profile == 'smoke' && inputs.smoke_relevant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact-id: ${{ steps.publish.outputs.artifact-id }}
      artifact-digest: ${{ steps.publish.outputs.artifact-digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: 'g6-harness-smoke-release-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/g6-harness-smoke-release'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: 'g6-harness-smoke-bundle-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/g6-harness-smoke-bundle'}
      - name: Independently verify the smoke bundle
        id: verify
        env: {G6_AUTHORITY: engineering}
        run: |
          harness="${RUNNER_TEMP}/g6-harness-smoke-release/ocservia-g6-harness"
          chmod 0755 "${harness}"
          "${harness}" smoke-verify --bundle "${RUNNER_TEMP}/g6-harness-smoke-bundle/smoke-bundle.json" \
            --expected-bundle-sha "${{ needs.g6-smoke-assemble.outputs.bundle-sha256 }}" \
            --expected-harness-sha "${{ needs.g6-smoke-release.outputs.harness-sha256 }}" \
            --output "${RUNNER_TEMP}/g6-harness-smoke-verification/verification-result.json"
      - name: Preserve structured smoke verification failure
        if: always()
        run: |
          result="${RUNNER_TEMP}/g6-harness-smoke-verification/verification-result.json"
          [[ -s "${result}" ]] && exit 0
          mkdir -p "$(dirname "${result}")"
          jq -n --arg candidate_sha "${GITHUB_SHA}" --arg run_id "${GITHUB_RUN_ID}" --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg environment_id "g6-$(printf '%s' "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | openssl dgst -sha256 -r | cut -c1-16)" \
            '{schema_version:"ocservia.g6-harness-smoke-verification-result.v1",profile:"smoke",binding:{$candidate_sha,$run_id,$run_attempt,$environment_id,authority:"engineering"},status:"failed",formal_verdict_eligible:false,failure:{code:"smoke_bundle_unavailable",message:"a complete smoke bundle is required for independent verification"}}' >"${result}"
      - name: Publish independent smoke verification
        id: publish
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: {name: 'g6-harness-smoke-verification-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/g6-harness-smoke-verification', if-no-files-found: error, retention-days: 1}

  g6-smoke-result:
    name: G6 Harness Smoke Result
    needs: [g6-smoke-release, g6-smoke-fd-a, g6-smoke-fd-b, g6-smoke-assemble, g6-smoke-secret-scan, g6-smoke-verifier]
    if: ${{ always() && inputs.profile == 'smoke' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      G6RD_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      G6_AUTHORITY: engineering
    steps:
      - name: Record a structured not-applicable result
        if: ${{ !inputs.smoke_relevant }}
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/g6-harness-smoke-result/smoke-result.json"
          mkdir -p "$(dirname "${result}")"
          environment_id="g6-$(printf '%s' "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | openssl dgst -sha256 -r | cut -c1-16)"
          jq -n \
            --arg candidate_sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg environment_id "${environment_id}" \
            --arg completed_at "$(date --utc +%Y-%m-%dT%H:%M:%S.%NZ)" \
            '{schema_version:"ocservia.g6-harness-smoke-result.v1",profile:"smoke",binding:{$candidate_sha,$run_id,$run_attempt,$environment_id,authority:"engineering"},harness_sha256:null,started_at:$completed_at,completed_at:$completed_at,domains:null,artifacts:{release:null,fd_a:null,fd_b:null,bundle:null,secret_scan:null,verification:null},stages:{runtime_fd_a:"not_applicable",runtime_fd_b:"not_applicable",assembly:"not_applicable",secret_scan:"not_applicable",verification:"not_applicable"},status:"not_applicable",formal_verdict_eligible:false,failure:null}' \
            >"${result}"
      - name: Download the frozen smoke harness
        if: inputs.smoke_relevant && needs.g6-smoke-release.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: g6-harness-smoke-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g6-harness-smoke-release
      - name: Download the FD-A smoke result
        if: inputs.smoke_relevant && needs.g6-smoke-fd-a.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: g6-harness-smoke-fd-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g6-harness-smoke-fd-a
      - name: Download the FD-B smoke result
        if: inputs.smoke_relevant && needs.g6-smoke-fd-b.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: g6-harness-smoke-fd-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g6-harness-smoke-fd-b
      - name: Aggregate the non-authoritative smoke result
        if: inputs.smoke_relevant && needs.g6-smoke-release.result == 'success' && needs.g6-smoke-fd-a.result == 'success' && needs.g6-smoke-fd-b.result == 'success' && needs.g6-smoke-assemble.result == 'success' && needs.g6-smoke-secret-scan.result == 'success' && needs.g6-smoke-verifier.result == 'success'
        run: |
          set -euo pipefail
          release="${RUNNER_TEMP}/g6-harness-smoke-release"
          harness="${RUNNER_TEMP}/ocservia-g6-harness"
          expected="${{ needs.g6-smoke-release.outputs.harness-sha256 }}"
          test "$(sha256sum "${release}/ocservia-g6-harness" | awk '{print $1}')" = "${expected}"
          install -m 0755 "${release}/ocservia-g6-harness" "${harness}"
          "${harness}" smoke-aggregate \
            --fd-a "${RUNNER_TEMP}/g6-harness-smoke-fd-a/domain-result.json" \
            --fd-b "${RUNNER_TEMP}/g6-harness-smoke-fd-b/domain-result.json" \
            --expected-harness-sha "${expected}" \
            --release-artifact-id "${{ needs.g6-smoke-release.outputs.artifact-id }}" \
            --release-artifact-digest "${{ needs.g6-smoke-release.outputs.artifact-digest }}" \
            --fd-a-artifact-id "${{ needs.g6-smoke-fd-a.outputs.artifact-id }}" \
            --fd-a-artifact-digest "${{ needs.g6-smoke-fd-a.outputs.artifact-digest }}" \
            --fd-b-artifact-id "${{ needs.g6-smoke-fd-b.outputs.artifact-id }}" \
            --fd-b-artifact-digest "${{ needs.g6-smoke-fd-b.outputs.artifact-digest }}" \
            --bundle-artifact-id "${{ needs.g6-smoke-assemble.outputs.artifact-id }}" \
            --bundle-artifact-digest "${{ needs.g6-smoke-assemble.outputs.artifact-digest }}" \
            --secret-scan-artifact-id "${{ needs.g6-smoke-secret-scan.outputs.artifact-id }}" \
            --secret-scan-artifact-digest "${{ needs.g6-smoke-secret-scan.outputs.artifact-digest }}" \
            --verification-artifact-id "${{ needs.g6-smoke-verifier.outputs.artifact-id }}" \
            --verification-artifact-digest "${{ needs.g6-smoke-verifier.outputs.artifact-digest }}" \
            --output "${RUNNER_TEMP}/g6-harness-smoke-result/smoke-result.json"
      - name: Preserve a smoke result when aggregation cannot start
        if: always()
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/g6-harness-smoke-result/smoke-result.json"
          [[ -s "${result}" ]] && exit 0
          mkdir -p "$(dirname "${result}")"
          environment_id="g6-$(printf '%s' "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | openssl dgst -sha256 -r | cut -c1-16)"
          failure_code=smoke_release_unavailable
          failure_message="the frozen smoke harness could not be executed"
          if [[ "${{ needs.g6-smoke-release.result }}" = success ]]; then
            failure_code=smoke_aggregation_failed
            failure_message="the smoke result could not be aggregated"
          fi
          jq -n \
            --arg candidate_sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg environment_id "${environment_id}" \
            --arg completed_at "$(date --utc +%Y-%m-%dT%H:%M:%S.%NZ)" \
            --arg failure_code "${failure_code}" \
            --arg failure_message "${failure_message}" \
            '{schema_version:"ocservia.g6-harness-smoke-result.v1",profile:"smoke",binding:{$candidate_sha,$run_id,$run_attempt,$environment_id,authority:"engineering"},harness_sha256:null,started_at:$completed_at,completed_at:$completed_at,domains:null,artifacts:{release:null,fd_a:null,fd_b:null,bundle:null,secret_scan:null,verification:null},stages:{runtime_fd_a:"failed",runtime_fd_b:"failed",assembly:"failed",secret_scan:"failed",verification:"failed"},status:"failed",formal_verdict_eligible:false,failure:{code:$failure_code,message:$failure_message}}' \
            >"${result}"
      - name: Publish the non-authoritative smoke result
        id: publish
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g6-harness-smoke-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g6-harness-smoke-result
          if-no-files-found: error
          retention-days: 1
      - name: Enforce the smoke contract
        if: always()
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/g6-harness-smoke-result/smoke-result.json"
          if [[ "${{ inputs.smoke_relevant }}" = true ]]; then
            test "${{ needs.g6-smoke-release.result }}" = success
            test "${{ needs.g6-smoke-fd-a.result }}" = success
            test "${{ needs.g6-smoke-fd-b.result }}" = success
            test "${{ needs.g6-smoke-assemble.result }}" = success
            test "${{ needs.g6-smoke-secret-scan.result }}" = success
            test "${{ needs.g6-smoke-verifier.result }}" = success
            expected_status=passed
          else
            expected_status=not_applicable
          fi
          jq -e --arg expected_status "${expected_status}" '
              .schema_version == "ocservia.g6-harness-smoke-result.v1" and
              .profile == "smoke" and
              .binding.candidate_sha == env.GITHUB_SHA and
              .binding.authority == "engineering" and
              .status == $expected_status and
              .formal_verdict_eligible == false and
              .failure == null
            ' "${result}" >/dev/null
