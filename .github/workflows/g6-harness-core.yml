          --destination "${RUNNER_TEMP}/g6-rd-final-freeze"
          --timeout 1800s
          --peer-job "Resilience / G6 Formal FD-B: Standby, Promotion & Faults"
      - name: Finish failure domain A peer observation timing
        run: scripts/g6-timing.sh end "${RUNNER_TEMP}/artifacts/timing/g6-rd-fd-a.json" peer_observation_wait || true
      - name: Start failure domain A evidence timing
        run: scripts/g6-timing.sh start "${RUNNER_TEMP}/artifacts/timing/g6-rd-fd-a.json" evidence_collection
      - name: Run failure domain A evidence segment
        run: '"${G6_HARNESS_BIN}" run-segment --domain fd-a --segment evidence'
      - name: Finish failure domain A evidence timing
        run: scripts/g6-timing.sh end "${RUNNER_TEMP}/artifacts/timing/g6-rd-fd-a.json" evidence_collection || true
      - name: Finalize failure domain A runtime result
        if: always()
        timeout-minutes: 3
        run: scripts/g6-readiness-fd-a.sh runtime-result "${{ job.status }}"
      - id: source-digest
        if: always()
        run: |
          source="${RUNNER_TEMP}/g6-readiness-${RUN_ID}/outbox/fd-a-final/source-manifest.json"
          echo "sha256=$(sha256sum "${source}" | cut -d' ' -f1)" >>"${GITHUB_OUTPUT}"
      - name: Scan raw output before upload
        id: raw-scan
        if: always()
        run: |
          scripts/bootstrap.sh g6-secret-scan
          source scripts/env.sh
          gitleaks dir --no-banner --redact --no-color --config scripts/g6-secret-scan.toml \
            "${RUNNER_TEMP}/g6-readiness-${RUN_ID}/outbox/fd-a-final"
      - name: Publish failure domain A raw evidence
        id: fd-a-raw-upload
        if: always() && steps.raw-scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g6-rd-raw-fd-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g6-readiness-${{ env.RUN_ID }}/outbox/fd-a-final
          if-no-files-found: error
          retention-days: 7
      - name: Collect redacted failure domain A diagnostics
        if: always()
        timeout-minutes: 5
        run: timeout --signal=TERM --kill-after=15s 120s scripts/g6-readiness-fd-a.sh diagnostics
      - name: Record failure domain A timing diagnostics
        if: always()
        run: |
          timing="${RUNNER_TEMP}/artifacts/timing/g6-rd-fd-a.json"
          scripts/g6-timing.sh rendezvous-dir "${timing}" "${RUNNER_TEMP}/artifacts/g6-readiness-fd-a/rendezvous" || true
          scripts/g6-timing.sh summary "${timing}" || true
          mkdir -p "${RUNNER_TEMP}/artifacts/g6-readiness-fd-a"
          cp -f "${timing}" "${RUNNER_TEMP}/artifacts/g6-readiness-fd-a/timing.json" 2>/dev/null || true
      - name: Clean failure domain A resources
        if: always()
        timeout-minutes: 7
        run: '"${G6_HARNESS_BIN}" cleanup --domain fd-a --timeout 180s'
      - name: Upload failure domain A diagnostics
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g6-rd-fd-a-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/g6-readiness-fd-a
          if-no-files-found: warn
          retention-days: 5

  g6-rd-fd-b:
    name: "G6 Formal FD-B: Standby, Promotion & Faults"
    needs: g6-rd-release-image
    if: inputs.profile == 'formal'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: ${{ inputs.authority == 'production_readiness' && 'g6-production-readiness' || 'g6-engineering-rehearsal' }}
    env:
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-fd-b
      FD_ID: fd-b
      FD_ALIAS: fd-beta
      G6_AUTHORITY: ${{ inputs.authority }}
      G6RD_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      G6RD_RELEASE_MANIFEST_DIGEST: ${{ needs.g6-rd-release-image.outputs.release-manifest-digest }}
      G6RD_AGENT_IMAGE: ocservia-g6-agent:${{ github.run_id }}-${{ github.run_attempt }}
      G6RD_CONTROL_PLANE_IMAGE: ocservia-g6-control-plane:${{ github.run_id }}-${{ github.run_attempt }}
      G6RD_TRANSPORTD_IMAGE: ocservia-g6-transportd:${{ github.run_id }}-${{ github.run_attempt }}
      G6RD_RELAY_IMAGE: ocservia-g6-relay:${{ github.run_id }}-${{ github.run_attempt }}
      G6RD_PROBE_IMAGE: ocservia-g6-probe:${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      raw-artifact-id: ${{ steps.fd-b-raw-upload.outputs.artifact-id }}
      raw-source-sha256: ${{ steps.source-digest.outputs.sha256 }}
      raw-artifact-digest: ${{ steps.fd-b-raw-upload.outputs.artifact-digest }}
      release-manifest-digest: ${{ needs.g6-rd-release-image.outputs.release-manifest-digest }}
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize failure domain B timing diagnostics
        run: >-
          scripts/g6-timing.sh init
          "${RUNNER_TEMP}/artifacts/timing/g6-rd-fd-b.json"
          g6-rd-fd-b formal "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}"
      - name: Verify runner prerequisites
        run: |
          scripts/g6-timing.sh start "${RUNNER_TEMP}/artifacts/timing/g6-rd-fd-b.json" runner_preparation
          scripts/ci-preflight.sh
