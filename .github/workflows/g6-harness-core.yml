          scripts/g6-timing.sh summary "${timing}" || true
          mkdir -p "${RUNNER_TEMP}/artifacts/g6-readiness-fd-a"
          cp -f "${timing}" "${RUNNER_TEMP}/artifacts/g6-readiness-fd-a/timing.json" 2>/dev/null || true
      - name: Upload FD-A diagnostics
