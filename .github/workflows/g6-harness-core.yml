      - name: Run failure domain B resource preflight segment
        run: '"${G6_HARNESS_BIN}" run-segment --domain fd-b --segment resource-preflight'
      - name: Wait for failure domain A observation barriers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "${G6_HARNESS_BIN}" wait-download
          --name "g6-rd-window-barrier-armed-fd-a-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          --destination "${RUNNER_TEMP}/g6-rd-window-barrier-armed-fd-a"
          --timeout 600s
          --peer-job "Resilience / G6 Formal FD-A: Primary & PITR"
      - name: Start 300-second observation timing
        run: scripts/g6-timing.sh start "${RUNNER_TEMP}/artifacts/timing/g6-rd-fd-b.json" observation_300_seconds
      - name: Run failure domain B observation window segment
        run: '"${G6_HARNESS_BIN}" run-segment --domain fd-b --segment window'
      - name: Finish 300-second observation timing
        run: scripts/g6-timing.sh end "${RUNNER_TEMP}/artifacts/timing/g6-rd-fd-b.json" observation_300_seconds || true
      - name: Start failure domain B evidence timing
        run: scripts/g6-timing.sh start "${RUNNER_TEMP}/artifacts/timing/g6-rd-fd-b.json" evidence_collection
      - name: Run failure domain B evidence segment
        run: '"${G6_HARNESS_BIN}" run-segment --domain fd-b --segment evidence'
      - name: Finish failure domain B evidence timing
        run: scripts/g6-timing.sh end "${RUNNER_TEMP}/artifacts/timing/g6-rd-fd-b.json" evidence_collection || true
      - name: Publish the final freeze request
        uses: ./.github/actions/g6-checkpoint-upload
        with:
          name: g6-rd-final-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g6-readiness-${{ env.RUN_ID }}/outbox/final-freeze
          retention-days: 1
      - name: Finalize failure domain B runtime result
        if: always()
        timeout-minutes: 3
        run: scripts/g6-readiness-fd-b.sh runtime-result "${{ job.status }}"
      - id: source-digest
        if: always()
        run: |
          source="${RUNNER_TEMP}/g6-readiness-${RUN_ID}/outbox/fd-b-final/source-manifest.json"
          echo "sha256=$(sha256sum "${source}" | cut -d' ' -f1)" >>"${GITHUB_OUTPUT}"
      - name: Scan raw output before upload
        id: raw-scan
        if: always()
        run: |
          scripts/bootstrap.sh g6-secret-scan
          source scripts/env.sh
          gitleaks dir --no-banner --redact --no-color --config scripts/g6-secret-scan.toml \
            "${RUNNER_TEMP}/g6-readiness-${RUN_ID}/outbox/fd-b-final"
      - name: Publish failure domain B raw evidence
        id: fd-b-raw-upload
        if: always() && steps.raw-scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g6-rd-raw-fd-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g6-readiness-${{ env.RUN_ID }}/outbox/fd-b-final
          if-no-files-found: error
          retention-days: 7
      - name: Collect redacted failure domain B diagnostics
        if: always()
        timeout-minutes: 5
        run: timeout --signal=TERM --kill-after=15s 120s scripts/g6-readiness-fd-b.sh diagnostics
      - name: Record failure domain B timing diagnostics
        if: always()
        run: |
          timing="${RUNNER_TEMP}/artifacts/timing/g6-rd-fd-b.json"
          scripts/g6-timing.sh rendezvous-dir "${timing}" "${RUNNER_TEMP}/artifacts/g6-readiness-fd-b/rendezvous" || true
          scripts/g6-timing.sh summary "${timing}" || true
          mkdir -p "${RUNNER_TEMP}/artifacts/g6-readiness-fd-b"
          cp -f "${timing}" "${RUNNER_TEMP}/artifacts/g6-readiness-fd-b/timing.json" 2>/dev/null || true
      - name: Clean failure domain B resources
        if: always()
        timeout-minutes: 7
        run: '"${G6_HARNESS_BIN}" cleanup --domain fd-b --timeout 180s'
      - name: Upload failure domain B diagnostics
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g6-rd-fd-b-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/g6-readiness-fd-b
          if-no-files-found: warn
          retention-days: 5

  resilience-result:
    name: Resilience Result
    needs: [g6-rd-fd-a, g6-rd-fd-b]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      G6_PIPELINE_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require both fault domains
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e '. as $results | all(["g6-rd-fd-a", "g6-rd-fd-b"][]; $results[.].result == "success")' <<<"${RESULTS}"
      - run: scripts/bootstrap.sh g6-secret-scan
      - run: scripts/bootstrap.sh g6-runtime
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7
        with:
          artifact-ids: ${{ needs.g6-rd-fd-a.outputs.raw-artifact-id }}
          path: ${{ runner.temp }}/g6-rd-raw-fd-a
      - name: Verify domain A producer manifest
        env:
          EXPECTED: ${{ needs.g6-rd-fd-a.outputs.raw-source-sha256 }}
        run: |
          [[ "${EXPECTED}" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(sha256sum "${RUNNER_TEMP}/g6-rd-raw-fd-a/source-manifest.json" | cut -d' ' -f1)" == "${EXPECTED}" ]]
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7
        with:
          artifact-ids: ${{ needs.g6-rd-fd-b.outputs.raw-artifact-id }}
          path: ${{ runner.temp }}/g6-rd-raw-fd-b
      - name: Verify domain B producer manifest
        env:
          EXPECTED: ${{ needs.g6-rd-fd-b.outputs.raw-source-sha256 }}
        run: |
          [[ "${EXPECTED}" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(sha256sum "${RUNNER_TEMP}/g6-rd-raw-fd-b/source-manifest.json" | cut -d' ' -f1)" == "${EXPECTED}" ]]
      - name: Assemble and evaluate once
        timeout-minutes: 15
        env:
          PURPOSE: ${{ inputs.purpose }}
        run: |
          node scripts/g6-pipeline.mjs assemble \
            --fd-a "${RUNNER_TEMP}/g6-rd-raw-fd-a" \
            --fd-b "${RUNNER_TEMP}/g6-rd-raw-fd-b" \
            --output "${RUNNER_TEMP}/resilience" \
            --work-dir "${RUNNER_TEMP}/assembly" \
            --builder "${GITHUB_WORKSPACE}/scripts/build-g6-evidence.mjs" \
            --slo "${GITHUB_WORKSPACE}/docs/acceptance/g6-slo.yaml"
          environment="g6-$(printf '%s' "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | openssl dgst -sha256 -r | cut -c1-16)"
          node scripts/verify-g6-evidence.mjs --purpose "${PURPOSE}" \
            --slo docs/acceptance/g6-slo.yaml \
            --evidence "${RUNNER_TEMP}/resilience/evidence.json" \
            --topology "${RUNNER_TEMP}/resilience/topology.json" \
            --release-manifest "${RUNNER_TEMP}/resilience/release-manifest.json" \
            --artifact-root "${RUNNER_TEMP}/resilience" \
            --expected-authority "${G6_AUTHORITY}" \
            --expected-environment-id "${environment}" \
            --expected-failure-domain-class multi_host \
            >"${RUNNER_TEMP}/resilience/result.json"
      - name: Scan diagnostics before upload
        id: scan
        if: always()
        run: |
          source scripts/env.sh
          test -d "${RUNNER_TEMP}/resilience"
          gitleaks dir --no-banner --redact --no-color --config scripts/g6-secret-scan.toml "${RUNNER_TEMP}/resilience"
      - name: Preserve scoped result and sanitized diagnostics
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: resilience-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resilience
          retention-days: 7
          if-no-files-found: error
