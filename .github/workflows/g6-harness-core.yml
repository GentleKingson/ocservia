      - name: Upload failure domain A scenario readiness
        uses: ./.github/actions/g6-checkpoint-upload
        with:
          name: g6-rd-fd-a-ready-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g6-readiness-${{ env.RUN_ID }}/outbox/fd-a-ready
          retention-days: 5
      - name: Wait for the observation-window barrier request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "${G6_HARNESS_BIN}" wait-download
