        run: |
          scripts/g6-timing.sh start "${RUNNER_TEMP}/artifacts/timing/g6-smoke-fd-a.json" evidence_collection
          "${G6_HARNESS_BIN}" run-segment --domain fd-a --segment evidence
          scripts/g6-timing.sh end "${RUNNER_TEMP}/artifacts/timing/g6-smoke-fd-a.json" evidence_collection || true
      - name: Bind FD-A raw evidence
