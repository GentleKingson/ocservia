          mkdir -p "${out}/harness"
          if [[ -d "${RUNNER_TEMP}/g6-readiness-${RUN_ID}/harness" ]]; then cp -R "${RUNNER_TEMP}/g6-readiness-${RUN_ID}/harness/." "${out}/harness/"; fi
          [[ -s "${out}/partial-runtime-status" ]] || printf '%s\n' "${{ job.status }}" >"${out}/partial-runtime-status"
      - name: Publish FD-A raw smoke evidence
        id: publish
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
