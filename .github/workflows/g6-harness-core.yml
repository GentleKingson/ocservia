      - name: Start Primary
        run: '"${G6_HARNESS_BIN}" run-segment --domain fd-a --segment primary'
      - name: Publish Primary readiness
        uses: ./.github/actions/g6-checkpoint-upload
        with: {name: 'g6-smoke-primary-up-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/g6-readiness-${{ env.RUN_ID }}/outbox/primary-up', retention-days: 1}
