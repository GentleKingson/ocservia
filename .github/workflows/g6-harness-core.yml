name: G6 Readiness Core (Reusable)

on:
  workflow_call:
    inputs:
      helpers-id:
        type: string
        default: ''
      helpers-sha256:
        type: string
        default: ''
      version:
        type: string
        default: ''
      agent-id:
        type: string
        default: ''
      agent-sha256:
        type: string
        default: ''
      controller-id:
        type: string
        default: ''
      controller-sha256:
        type: string
        default: ''
      purpose:
        type: string
        default: resilience
      profile:
        description: Exact harness execution profile
        type: string
        required: true
      authority:
        description: Evidence authority carried by this invocation
        type: string
        required: true
      candidate_sha:
        description: Exact candidate commit executed by the caller
        type: string
        required: true

permissions:
  contents: read
  actions: read

env:
  G6_AUTHORITY: ${{ inputs.authority }}
  # Five local owner terms exercise the five distinct stale-owner probes.
  G6_AGENTS_A: ${{ inputs.purpose == 'performance' && '25' || '5' }}
  G6_AGENTS_B: ${{ inputs.purpose == 'performance' && '25' || '5' }}
  G6RD_WINDOW_SECONDS: ${{ inputs.purpose == 'performance' && '305' || '60' }}

# The formal profile freezes every runtime image and host-side binary once,
# then runs the two failure domains through the authority-selected Environment.
jobs:
  g6-contract:
    name: G6 Readiness Invocation Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      G6_CORE_PROFILE: ${{ inputs.profile }}
      G6_CORE_AUTHORITY: ${{ inputs.authority }}
      G6_CORE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      G6_CORE_PURPOSE: ${{ inputs.purpose }}
    steps:
      - name: Validate the exact reusable-workflow invocation
        run: |
          set -euo pipefail
          [[ "${G6_CORE_CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${G6_CORE_CANDIDATE_SHA}" = "${GITHUB_SHA}"
          test "${G6_CORE_PROFILE}" = formal
          test "${G6_CORE_PURPOSE}" = resilience || test "${G6_CORE_PURPOSE}" = performance
          test "${G6_CORE_AUTHORITY}" = engineering || \
            test "${G6_CORE_AUTHORITY}" = production_readiness

  g6-rd-release-image:
    name: G6 Formal Release Build
    needs: g6-contract
    if: inputs.profile == 'formal'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: ${{ inputs.authority == 'production_readiness' && 'g6-production-readiness' || 'g6-engineering-rehearsal' }}
    outputs:
      release-manifest-digest: ${{ steps.release-build.outputs.release-manifest-digest }}
    env:
      DOCKER_BUILDKIT: "1"
      BUILDX_BUILDER: g6-buildx-${{ github.run_id }}-${{ github.run_attempt }}
      G6RD_AGENT_IMAGE: ocservia-g6-agent:${{ github.run_id }}-${{ github.run_attempt }}
      G6RD_CONTROL_PLANE_IMAGE: ocservia-g6-control-plane:${{ github.run_id }}-${{ github.run_attempt }}
      G6RD_TRANSPORTD_IMAGE: ocservia-g6-transportd:${{ github.run_id }}-${{ github.run_attempt }}
      G6RD_RELAY_IMAGE: ocservia-g6-relay:${{ github.run_id }}-${{ github.run_attempt }}
      G6RD_PROBE_IMAGE: ocservia-g6-probe:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-artifacts
        if: inputs.agent-id != ''
        with:
          artifact-id: ${{ inputs.agent-id }}
          sha256: ${{ inputs.agent-sha256 }}
          component: agent
          arch: amd64
          version: ${{ inputs.version }}
          path: ${{ runner.temp }}/candidate
      - uses: ./.github/actions/release-artifacts
        if: inputs.controller-id != ''
        with:
          artifact-id: ${{ inputs.controller-id }}
          sha256: ${{ inputs.controller-sha256 }}
          component: controller
          arch: amd64
          version: ${{ inputs.version }}
          path: ${{ runner.temp }}/candidate
      - uses: ./.github/actions/release-test-images
        if: inputs.helpers-id != ''
        with:
          artifact-id: ${{ inputs.helpers-id }}
          sha256: ${{ inputs.helpers-sha256 }}
          component: test-helpers
          arch: amd64
          version: ${{ inputs.version }}
          path: ${{ runner.temp }}/test-helpers
      - name: Initialize release timing diagnostics
        run: >-
          scripts/g6-timing.sh init
          "${RUNNER_TEMP}/artifacts/timing/g6-rd-release.json"
          g6-rd-release formal "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}"
      - name: Verify runner prerequisites
        run: |
          scripts/g6-timing.sh start "${RUNNER_TEMP}/artifacts/timing/g6-rd-release.json" runner_preparation
          scripts/ci-preflight.sh
          scripts/g6-timing.sh end "${RUNNER_TEMP}/artifacts/timing/g6-rd-release.json" runner_preparation || true
      - name: Restore verified release Go toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: tooling-v4-g6-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh') }}
      - name: Bootstrap the pinned release Go toolchain
        run: |
          scripts/g6-timing.sh start "${RUNNER_TEMP}/artifacts/timing/g6-rd-release.json" toolchain_bootstrap
          scripts/bootstrap.sh go-test
          scripts/g6-timing.sh end "${RUNNER_TEMP}/artifacts/timing/g6-rd-release.json" toolchain_bootstrap || true
      - name: Relay Actions cache credentials to the job environment
        # BuildKit's gha cache backend needs the runner's cache-service
        # token and URLs, but the runner injects those only into action
        # processes — plain run steps never see them (actions/runner#4325
        # is still open). This repo-owned relay action copies them into
        # the job environment for the builder preparation below. If the
        # credentials are unavailable, the build deliberately falls back to
        # the local BuildKit cache and continues without the GHA backend.
        uses: ./.github/actions/g6-cache-credentials
      - name: Prepare the BuildKit cache builder
        run: |
          set -euo pipefail
          timing="${RUNNER_TEMP}/artifacts/timing/g6-rd-release.json"
          scripts/g6-timing.sh start "${timing}" buildx_builder_prepare
          # Persistent BuildKit caches are performance inputs only. Cache
          # hit or miss, the candidate label, image IDs, payload checksums,
          # and the frozen release manifest are still recomputed from the
          # exact candidate below, and both failure domains still verify the
          # frozen release independently.
          # The buildkitd container does not inherit the runner's Actions
          # cache credentials, so forward them explicitly when available.
          # The external cache is never authoritative: a missing token or
          # URL only disables the GHA cache flags and leaves a cold build.
          buildx_driver_opts=()
          if [[ "${G6_CACHE_AVAILABLE:-false}" == true ]]; then
            buildx_driver_opts+=(--driver-opt "env.ACTIONS_RUNTIME_TOKEN=${ACTIONS_RUNTIME_TOKEN}")
            if [[ -n "${ACTIONS_CACHE_URL:-}" ]]; then
              buildx_driver_opts+=(--driver-opt "env.ACTIONS_CACHE_URL=${ACTIONS_CACHE_URL}")
            fi
            if [[ -n "${ACTIONS_RESULTS_URL:-}" ]]; then
              buildx_driver_opts+=(--driver-opt "env.ACTIONS_RESULTS_URL=${ACTIONS_RESULTS_URL}")
            fi
          else
            echo "::warning::GitHub Actions cache credentials unavailable; running a cold BuildKit solve"
          fi
          docker buildx create \
            --driver docker-container \
            --driver-opt "image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8" \
            --name "g6-buildx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "${buildx_driver_opts[@]}" \
            --bootstrap \
            --use
          scripts/g6-timing.sh end "${timing}" buildx_builder_prepare || true
      - name: Build and freeze the release images
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          CANDIDATE_PRODUCTS: ${{ inputs.agent-id != '' && inputs.controller-id != '' && 'true' || 'false' }}
        id: release-build
        timeout-minutes: 30
        run: |
          set -euo pipefail
          archive_dir="${RUNNER_TEMP}/g6-rd-runtime-images-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${archive_dir}"
          timing="${RUNNER_TEMP}/artifacts/timing/g6-rd-release.json"
          scripts/g6-timing.sh start "${timing}" candidate_docker_image_build
          docker pull postgres:17.10-bookworm
          record_image_timing() {
            scripts/g6-timing.sh image "${timing}" "$1" \
              "$(docker image inspect --format '{{.Size}}' "$2")" \
              "$(docker image inspect --format '{{.Id}}' "$2")" || true
          }
          # Reuse verified products in release runs. Standalone diagnostics
          # build separate Cargo feature graphs; probes and relay are fixtures.
          # The wrapper bounds the external cache wait, preserves a failed
          # cache-backed solve, and retries exactly once without cache flags.
          # The retry is the authoritative build result.
          build_pids=()
          (
            if [[ "${CANDIDATE_PRODUCTS}" == true ]]; then
              for name in control transport; do
                docker load -i "${RUNNER_TEMP}/candidate/${name}-linux-amd64.tar"
                case "${name}" in control) image="${G6RD_CONTROL_PLANE_IMAGE}" ;; transport) image="${G6RD_TRANSPORTD_IMAGE}" ;; esac
                docker tag "ghcr.io/gentlekingson/ocservia/${name}:${CANDIDATE_VERSION}-linux-amd64" "${image}"
              done
            else
            scripts/g6-timing.sh measure "${timing}" control_plane_build -- \
              scripts/g6-buildx-cache.sh g6-control-plane true control-plane-build \
                --pull=false \
                --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
                --no-cache-filter runtime-base \
                --load \
                --file control-plane/Dockerfile \
                --tag "${G6RD_CONTROL_PLANE_IMAGE}" .
            fi
          ) &
          build_pids+=("$!")
          (
            if [[ -n "${RELEASE_RELAY_IMAGE:-}" ]]; then
              docker tag "${RELEASE_RELAY_IMAGE}" "${G6RD_RELAY_IMAGE}"
            else
            scripts/g6-timing.sh measure "${timing}" relay_build -- \
              scripts/g6-buildx-cache.sh g6-relay true relay-build \
                --pull=false \
                --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
                --no-cache-filter relay-runtime \
                --load \
                --file deploy/production/relay.Dockerfile \
                --tag "${G6RD_RELAY_IMAGE}" .
            fi
          ) &
          build_pids+=("$!")
          (
            if [[ "${CANDIDATE_PRODUCTS}" != true ]]; then
            scripts/g6-timing.sh measure "${timing}" transportd_build -- \
              scripts/g6-buildx-cache.sh g6-rust-runtime false transportd-build \
                --pull=false \
                --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
                --load \
                --file rust/g6-runtime.Dockerfile \
                --target transportd-runtime \
                --tag "${G6RD_TRANSPORTD_IMAGE}" .
            fi
            if [[ -n "${RELEASE_PROBE_IMAGE:-}" ]]; then
              docker tag "${RELEASE_PROBE_IMAGE}" "${G6RD_PROBE_IMAGE}"
            else
            scripts/g6-timing.sh measure "${timing}" g6_probe_build -- \
              scripts/g6-buildx-cache.sh g6-rust-runtime false g6-probe-build \
                --pull=false \
                --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
                --load \
                --file rust/g6-runtime.Dockerfile \
                --target g6-probe-runtime \
                --tag "${G6RD_PROBE_IMAGE}" .
            fi
            if [[ "${CANDIDATE_PRODUCTS}" == true ]]; then
              mkdir -p "${RUNNER_TEMP}/agent-payload"
              tar -xzf "${RUNNER_TEMP}/candidate/ocservia-agent-${CANDIDATE_VERSION}-linux-amd64.tar.gz" \
                -C "${RUNNER_TEMP}/agent-payload" --strip-components=4 \
                "ocservia-agent-${CANDIDATE_VERSION}/rust/target/release/ocservia-agent" \
                "ocservia-agent-${CANDIDATE_VERSION}/rust/target/release/ocservia-privd"
              scripts/g6-buildx-cache.sh g6-agent-candidate false g6-agent-build \
                --label "org.opencontainers.image.revision=${GITHUB_SHA}" --load \
                --file rust/g6-runtime.Dockerfile --target g6-agent-candidate \
                --build-context "candidate-agent=${RUNNER_TEMP}/agent-payload" \
                --tag "${G6RD_AGENT_IMAGE}" .
            else
            scripts/g6-timing.sh measure "${timing}" g6_agent_build -- \
              scripts/g6-buildx-cache.sh g6-rust-runtime false g6-agent-build \
                --pull=false \
                --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
                --load \
                --file rust/g6-runtime.Dockerfile \
                --target g6-agent-runtime \
                --tag "${G6RD_AGENT_IMAGE}" .
            fi
          ) &
          build_pids+=("$!")
          build_status=0
          for pid in "${build_pids[@]}"; do
            if ! wait "${pid}"; then
              build_status=1
            fi
          done
          test "${build_status}" -eq 0
          scripts/g6-timing.sh end "${timing}" candidate_docker_image_build || true
          record_image_timing control_plane "${G6RD_CONTROL_PLANE_IMAGE}"
          record_image_timing transportd "${G6RD_TRANSPORTD_IMAGE}"
          record_image_timing relay "${G6RD_RELAY_IMAGE}"
          record_image_timing g6_probe "${G6RD_PROBE_IMAGE}"
          record_image_timing g6_agent "${G6RD_AGENT_IMAGE}"
          scripts/g6-timing.sh start "${timing}" helper_harness_tunnel_build
          if [[ -n "${RELEASE_PROBE_IMAGE:-}" ]]; then
            install -m 0755 "${RUNNER_TEMP}/test-helpers/ocservia-g6-tunnel" "${archive_dir}/ocservia-g6-tunnel"
          else
          tunnel_output="${archive_dir}/tunnel-output"
          # Export the tunnel from the shared builder's content-addressed
          # BuildKit stage; this reuses the compiled layer and does not
          # rebuild anything on either failure domain.
          scripts/g6-buildx-cache.sh g6-rust-runtime false tunnel-export \
            --pull=false \
            --file rust/g6-runtime.Dockerfile \
            --target g6-tunnel-artifact \
            --output "type=local,dest=${tunnel_output}" .
          install -m 0755 "${tunnel_output}/ocservia-g6-tunnel" \
            "${archive_dir}/ocservia-g6-tunnel"
          rm -rf -- "${tunnel_output}"
          fi
          source scripts/env.sh
          pinned_go="${GITHUB_WORKSPACE}/.tools/go/bin/go"
          expected_go="go$(sed -n 's/^go=//p' toolchains.lock)"
          actual_go="$("${pinned_go}" env GOVERSION)"
          test "$(command -v go)" = "${pinned_go}"
          test "${actual_go}" = "${expected_go}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOTOOLCHAIN=local \
            "${pinned_go}" build -trimpath \
            -o "${archive_dir}/ocservia-g6-harness" \
            ./tools/g6-harness/cmd/g6-harness
          scripts/g6-timing.sh end "${timing}" helper_harness_tunnel_build || true
          printf 'candidate_sha\t%s\n' "${GITHUB_SHA}" \
            >"${archive_dir}/harness-manifest.tsv"
          printf 'go_version\t%s\n' "${actual_go}" \
            >>"${archive_dir}/harness-manifest.tsv"
          printf 'ocservia-g6-harness\t%s\n' \
            "$(sha256sum "${archive_dir}/ocservia-g6-harness" | awk '{print $1}')" \
            >>"${archive_dir}/harness-manifest.tsv"
          printf 'candidate_sha\t%s\n' "${GITHUB_SHA}" \
            >"${archive_dir}/tunnel-manifest.tsv"
          printf 'ocservia-g6-tunnel\t%s\n' \
            "$(sha256sum "${archive_dir}/ocservia-g6-tunnel" | awk '{print $1}')" \
            >>"${archive_dir}/tunnel-manifest.tsv"
          release_images=(
            postgres:17.10-bookworm
            "${G6RD_CONTROL_PLANE_IMAGE}"
            "${G6RD_TRANSPORTD_IMAGE}"
            "${G6RD_RELAY_IMAGE}"
            "${G6RD_PROBE_IMAGE}"
            "${G6RD_AGENT_IMAGE}"
          )
          : >"${archive_dir}/image-ids.tsv"
          for image in "${release_images[@]}"; do
            printf '%s\t%s\n' "${image}" \
              "$(docker image inspect --format '{{.Id}}' "${image}")" \
              >>"${archive_dir}/image-ids.tsv"
          done
          scripts/g6-timing.sh start "${timing}" docker_save_gzip
          docker save "${release_images[@]}" \
            | gzip -1 >"${archive_dir}/runtime-images.tar.gz"
          scripts/g6-timing.sh end "${timing}" docker_save_gzip || true
          scripts/g6-timing.sh artifact "${timing}" frozen_runtime_archive "${archive_dir}/runtime-images.tar.gz" || true
          (
            cd "${archive_dir}"
            sha256sum runtime-images.tar.gz image-ids.tsv \
              ocservia-g6-tunnel tunnel-manifest.tsv \
              ocservia-g6-harness harness-manifest.tsv >release-artifacts.sha256
          )
          printf 'release-manifest-digest=%s\n' \
            "$(sha256sum "${archive_dir}/release-artifacts.sha256" | awk '{print $1}')" \
            >>"${GITHUB_OUTPUT}"
      - name: Upload BuildKit cache fallback diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g6-buildkit-cache-fallback-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/g6-buildkit-cache-fallback
          if-no-files-found: ignore
          retention-days: 5
      - name: Start frozen release upload timing
        run: scripts/g6-timing.sh start "${RUNNER_TEMP}/artifacts/timing/g6-rd-release.json" release_artifact_upload
      - name: Publish the frozen release images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g6-rd-runtime-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g6-rd-runtime-images-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Record frozen release upload timing
        if: always()
        run: |
          timing="${RUNNER_TEMP}/artifacts/timing/g6-rd-release.json"
          scripts/g6-timing.sh end "${timing}" release_artifact_upload || true
          scripts/g6-timing.sh artifact "${timing}" frozen_release_payload "${RUNNER_TEMP}/g6-rd-runtime-images-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/runtime-images.tar.gz" || true
          scripts/g6-timing.sh summary "${timing}" || true
      - name: Upload release timing diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g6-timing-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/timing/g6-rd-release.json
          if-no-files-found: warn
          retention-days: 5
      - name: Clean release-image resources
        if: always()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          status=0
          archive_dir="${RUNNER_TEMP}/g6-rd-runtime-images-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          buildx_builder="g6-buildx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker buildx inspect "${buildx_builder}" >/dev/null 2>&1; then
            docker buildx rm "${buildx_builder}" >/dev/null || status=1
          fi
          for image in \
            "${G6RD_AGENT_IMAGE}" "${G6RD_CONTROL_PLANE_IMAGE}" \
            "${G6RD_TRANSPORTD_IMAGE}" "${G6RD_RELAY_IMAGE}" \
            "${G6RD_PROBE_IMAGE}" postgres:17.10-bookworm; do
            if docker image inspect "${image}" >/dev/null 2>&1; then
              docker image rm --force "${image}" >/dev/null || status=1
            fi
          done
          rm -rf -- "${archive_dir}" || status=1
          exit "${status}"

  g6-rd-fd-a:
    name: "G6 Formal FD-A: Primary & PITR"
    needs: g6-rd-release-image
    if: inputs.profile == 'formal'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: ${{ inputs.authority == 'production_readiness' && 'g6-production-readiness' || 'g6-engineering-rehearsal' }}
    env:
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-fd-a
      FD_ID: fd-a
      FD_ALIAS: fd-alpha
      G6_AUTHORITY: ${{ inputs.authority }}
      G6RD_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      G6RD_RELEASE_MANIFEST_DIGEST: ${{ needs.g6-rd-release-image.outputs.release-manifest-digest }}
      G6RD_AGENT_IMAGE: ocservia-g6-agent:${{ github.run_id }}-${{ github.run_attempt }}
      G6RD_CONTROL_PLANE_IMAGE: ocservia-g6-control-plane:${{ github.run_id }}-${{ github.run_attempt }}
      G6RD_TRANSPORTD_IMAGE: ocservia-g6-transportd:${{ github.run_id }}-${{ github.run_attempt }}
      G6RD_RELAY_IMAGE: ocservia-g6-relay:${{ github.run_id }}-${{ github.run_attempt }}
      G6RD_PROBE_IMAGE: ocservia-g6-probe:${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      raw-artifact-id: ${{ steps.fd-a-raw-upload.outputs.artifact-id }}
      raw-source-sha256: ${{ steps.source-digest.outputs.sha256 }}
      raw-artifact-digest: ${{ steps.fd-a-raw-upload.outputs.artifact-digest }}
      release-manifest-digest: ${{ needs.g6-rd-release-image.outputs.release-manifest-digest }}
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize failure domain A timing diagnostics
        run: >-
          scripts/g6-timing.sh init
          "${RUNNER_TEMP}/artifacts/timing/g6-rd-fd-a.json"
          g6-rd-fd-a formal "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}"
      - name: Verify runner prerequisites
        run: |
          scripts/g6-timing.sh start "${RUNNER_TEMP}/artifacts/timing/g6-rd-fd-a.json" runner_preparation
          scripts/ci-preflight.sh
          scripts/g6-timing.sh end "${RUNNER_TEMP}/artifacts/timing/g6-rd-fd-a.json" runner_preparation || true
      - name: Start frozen release download timing
        run: scripts/g6-timing.sh start "${RUNNER_TEMP}/artifacts/timing/g6-rd-fd-a.json" fd_artifact_download
      - name: Download the frozen release images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: g6-rd-runtime-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g6-rd-runtime-images
      - name: Finish frozen release download timing
        run: scripts/g6-timing.sh end "${RUNNER_TEMP}/artifacts/timing/g6-rd-fd-a.json" fd_artifact_download || true
      - name: Verify and load the release images
        uses: ./.github/actions/g6-install-release
        with:
          archive-dir: ${{ runner.temp }}/g6-rd-runtime-images
          timing-file: ${{ runner.temp }}/artifacts/timing/g6-rd-fd-a.json
      - name: Restore verified G6 Node runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: tooling-v5-g6-node-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh', 'scripts/g6-runtime/package-lock.json') }}
      - name: Restore shared npm cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/npm
          key: npm-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'web/package-lock.json', 'scripts/g6-runtime/package-lock.json') }}
          restore-keys: |
