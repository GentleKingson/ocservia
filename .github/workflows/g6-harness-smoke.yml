name: Manual G6 Readiness Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  g6-harness-core:
    name: G6 Harness Smoke Core
    uses: ./.github/workflows/g6-harness-core.yml
    with:
      profile: smoke
      authority: engineering
      candidate_sha: ${{ github.sha }}
      smoke_relevant: true
