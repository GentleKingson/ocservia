name: G6 Readiness Harness

on:
  workflow_dispatch:
    inputs:
      authority:
        description: Evidence authority carried by this dispatch
        type: choice
        options:
          - engineering
          - production_readiness
        default: engineering
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.authority }}
  queue: max

jobs:
  g6-harness-core:
    name: G6 Readiness Core
    uses: ./.github/workflows/g6-harness-core.yml
    with:
      profile: formal
      authority: ${{ inputs.authority }}
      candidate_sha: ${{ github.sha }}
