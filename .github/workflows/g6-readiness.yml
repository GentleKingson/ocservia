name: Resilience
run-name: G6 Formal · ${{ inputs.authority }} · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: Finite fault regression or performance assessment using original limits
        type: choice
        options: [resilience, performance]
        default: resilience
        required: true
      authority:
        description: Evidence authority carried by this dispatch
        type: choice
        options:
          - engineering
          - production_readiness
        default: engineering
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.authority }}
  queue: max

jobs:
  g6-harness-core:
    name: Resilience
    uses: ./.github/workflows/g6-harness-core.yml
    with:
      profile: formal
      authority: ${{ inputs.authority }}
      candidate_sha: ${{ github.sha }}
      purpose: ${{ inputs.purpose }}
