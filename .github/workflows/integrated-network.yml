name: Integrated Network Prototype

on:
  workflow_dispatch:
    inputs:
      public_address:
        description: Authorized nonproduction public fixture IP (empty runs isolated checks)
        type: string
        default: ''
      public_ca_pem:
        description: Public test CA PEM, never a private key
        type: string
        default: ''
      probe_mode:
        description: Existing integrated network fixture or real Integrated Controller
        type: choice
        options: [fixture, controller]
        default: fixture
      candidate_sha:
        description: Exact candidate source SHA required for Controller mode
        type: string
        default: ''
  push:
    branches: [codex/p1-integrated-network]
    paths:
      - .github/workflows/integrated-network.yml
      - deploy/production/edge.Dockerfile
      - deploy/production/integrated/**
      - scripts/test-integrated-network.py
      - scripts/probe-integrated-public.py

permissions:
  contents: read

concurrency:
  group: integrated-network-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-client:
    if: github.event_name == 'workflow_dispatch' && inputs.public_address != ''
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Probe shared public fixture
        env:
          OCSERVIA_INTEGRATED_TEST_PUBLIC_ADDRESS: ${{ inputs.public_address }}
          OCSERVIA_INTEGRATED_TEST_CA_PEM: ${{ inputs.public_ca_pem }}
          PROBE_MODE: ${{ inputs.probe_mode }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          python3 scripts/probe-integrated-public.py --address "${OCSERVIA_INTEGRATED_TEST_PUBLIC_ADDRESS}" \
            --mode "${PROBE_MODE}" --candidate-sha "${CANDIDATE_SHA}" \
            --output "${RUNNER_TEMP}/public-client/result.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: public-client-${{ matrix.runner }}-${{ github.run_id }}
          path: ${{ runner.temp }}/public-client/
          retention-days: 1
          if-no-files-found: warn
  network:
    if: github.event_name != 'workflow_dispatch' || inputs.public_address == ''
    name: Isolated network (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build development images (no Registry write)
        run: |
          docker build -f deploy/production/edge.Dockerfile -t ocservia-integrated-test-edge .
          docker build -f deploy/production/relay.Dockerfile -t ocservia-integrated-test-relay .
      - name: Test isolated network
        run: |
          python3 scripts/test-integrated-network.py \
            --edge-image ocservia-integrated-test-edge --relay-image ocservia-integrated-test-relay \
            --artifacts "${RUNNER_TEMP}/integrated-network"
      - name: Upload scoped evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integrated-network-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/integrated-network/
          if-no-files-found: warn
          retention-days: 1
