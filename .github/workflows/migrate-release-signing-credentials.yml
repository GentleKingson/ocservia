name: Migrate release signing credentials

on:
  workflow_dispatch: {}

permissions:
  contents: read
  administration: write

jobs:
  migrate:
    name: Scope signing credentials to release-publishing and remove repository copies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
      AGENT_TRUSTED_KEY_SHA256: ${{ secrets.AGENT_TRUSTED_KEY_SHA256 }}
    steps:
      - name: Check secret management access
        run: |
          if ! gh api "repos/${GH_REPO}/actions/secrets" >/tmp/secrets.json 2>/tmp/secrets.err; then
            cat /tmp/secrets.err >&2
            echo "MIGRATION_FAILED_PERMISSION: GITHUB_TOKEN cannot manage repository secrets" >&2
            exit 1
          fi
          jq -e '.secrets | map(.name) | index("AGENT_SIGNING_KEY") != null and index("AGENT_TRUSTED_KEY_SHA256") != null' \
            /tmp/secrets.json >/dev/null \
            || { echo "repository secrets are missing expected names" >&2; exit 1; }
      - name: Store both values as release-publishing environment secrets
        run: |
          [[ -n "${AGENT_SIGNING_KEY}" && -n "${AGENT_TRUSTED_KEY_SHA256}" ]] \
            || { echo "repository secrets unexpectedly empty" >&2; exit 1; }
          printf '%s' "${AGENT_SIGNING_KEY}" | gh secret set AGENT_SIGNING_KEY --env release-publishing --body-file -
          printf '%s' "${AGENT_TRUSTED_KEY_SHA256}" | gh secret set AGENT_TRUSTED_KEY_SHA256 --env release-publishing --body-file -
          gh secret list --env release-publishing
      - name: Remove repository-level copies
        run: |
          gh secret delete AGENT_SIGNING_KEY
          gh secret delete AGENT_TRUSTED_KEY_SHA256
          if gh secret list | grep -E "AGENT_SIGNING_KEY|AGENT_TRUSTED_KEY_SHA256"; then
            echo "repository-level copies still present" >&2
            exit 1
          fi
          echo "repository-level signing credentials removed"
