name: Cross-VM Private Business
on:
  workflow_dispatch:
    inputs:
      node-install:
        description: Accept the real Nodes installation wizard (local same-SHA v0.0.0 assets)
        type: boolean
        default: false
        required: false
  workflow_call:
    secrets:
      CROSS_VM_RELAY_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: cross-vm-enrollment-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
env:
  NODE_INSTALL_E2E: ${{ github.event_name == 'workflow_dispatch' && inputs.node-install && 'true' || 'false' }}
  RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  COMPOSE_PROJECT: cross-vm-${{ github.run_id }}-${{ github.run_attempt }}
  CARGO_INCREMENTAL: '0'
jobs:
  admission:
    name: Cross-VM Admission
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      mode: ${{ steps.trust.outputs.mode }}
    steps:
      - name: Require trusted main workflow before repository code
        id: trust
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          JOB_CONTEXT: ${{ toJSON(job) }}
          EVENT_NAME: ${{ github.event_name }}
          # Keep disabled until this three-VM profile passes on trusted main.
          SCHEDULE_ENABLED: 'false'
        run: |
          if [[ "$SOURCE_REPOSITORY" != GentleKingson/ocservia || "$SOURCE_REF" != refs/heads/main ||
                ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] ||
             ! jq -e --arg ref 'GentleKingson/ocservia/.github/workflows/real-e2e.yml@refs/heads/main' \
               --arg sha "$SOURCE_SHA" '.workflow_ref == $ref and .workflow_sha == $sha' <<<"$JOB_CONTEXT" >/dev/null; then
            echo 'CROSS_VM_ENROLLMENT=BLOCKED_AUTH' >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          case "$EVENT_NAME" in
            workflow_dispatch|schedule|push) ;;
            *) echo 'CROSS_VM_ENROLLMENT=BLOCKED_AUTH' >>"$GITHUB_STEP_SUMMARY"; exit 1 ;;
          esac
          # Actions expression equality ignores case. Decide here, without
          # credentials, so only the exact repository-variable value enables it.
          if [[ "$EVENT_NAME" == schedule && "$SCHEDULE_ENABLED" != true ]]; then
            echo 'mode=disabled' >>"$GITHUB_OUTPUT"
            echo 'CROSS_VM_ENROLLMENT=NOT_RUN_SCHEDULE_DISABLED' >>"$GITHUB_STEP_SUMMARY"
          else
            echo 'mode=run' >>"$GITHUB_OUTPUT"
          fi
  preflight:
    name: Cross-VM Infrastructure Preflight
    needs: admission
    if: needs.admission.outputs.mode == 'run'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: cross-vm-test-relay
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require protected Tailnet configuration
        env:
          TS_PEER_CLIENT_ID: ${{ vars.TS_PEER_CLIENT_ID }}
          TS_PEER_AUDIENCE: ${{ vars.TS_PEER_AUDIENCE }}
          TS_RELAY_CLIENT_ID: ${{ vars.TS_RELAY_CLIENT_ID }}
          TS_RELAY_AUDIENCE: ${{ vars.TS_RELAY_AUDIENCE }}
          TS_POLICY_REVIEWED: ${{ vars.TS_POLICY_REVIEWED }}
          REAL_E2E_RELAY_TOKEN: ${{ secrets.CROSS_VM_RELAY_TOKEN }}
        run: |
          if ! python3 scripts/real-e2e-tailnet.py infra; then
            echo 'CROSS_VM_ENROLLMENT=BLOCKED_INFRA' >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
  relay:
    name: Cross-VM Relay
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    permissions:
      contents: read
      actions: read
      id-token: write
    environment:
      name: cross-vm-test-relay
      deployment: false
    env:
      REAL_E2E_ROLE: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/real-e2e-tailnet
        with:
          oauth-client-id: ${{ vars.TS_RELAY_CLIENT_ID }}
          audience: ${{ vars.TS_RELAY_AUDIENCE }}
          tags: tag:ocservia-ci-relay
          hostname: ocservia-relay-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Start private HTTPS Relay and publish readiness
        uses: ./.github/actions/real-e2e-step
        with:
          script: real-e2e-relay-host.sh
          phase: start
          relay-token: ${{ secrets.CROSS_VM_RELAY_TOKEN }}
          publish-name: relay-ready
          publish-path: ${{ runner.temp }}/real-e2e-relay-${{ env.RUN_ID }}/ready
      - name: Wait for native recovery baseline and stop sole Relay
        uses: ./.github/actions/real-e2e-step
        with:
          wait-name: recovery-node-baseline
          wait-peer: Cross-VM Agent
          token: ${{ github.token }}
          script: real-e2e-relay-host.sh
          phase: stop
          publish-name: recovery-relay-stopped
          publish-path: ${{ runner.temp }}/real-e2e-relay-${{ env.RUN_ID }}/stopped
      - name: Wait for offline queue proof and restore same Relay
        uses: ./.github/actions/real-e2e-step
        with:
          wait-name: recovery-node-queued
          wait-peer: Cross-VM Agent
          token: ${{ github.token }}
          script: real-e2e-relay-host.sh
          phase: restore
          publish-name: recovery-relay-restored
          publish-path: ${{ runner.temp }}/real-e2e-relay-${{ env.RUN_ID }}/restored
      - name: Keep Relay alive until both peer jobs complete
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/real-e2e-relay-host.sh hold
      - name: Clean Relay and private TLS material
        if: always()
        run: timeout --kill-after=15s 240s bash scripts/real-e2e-relay-host.sh cleanup
      - name: Logout local Tailnet identity
        if: always()
        run: bash scripts/real-e2e-hosted.sh tailnet-cleanup
      - name: Clean private preflight directory
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/real-e2e-private-$RUN_ID-relay"
      - name: Preserve allowlisted evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cross-vm-evidence-relay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/real-e2e-evidence-relay
          if-no-files-found: error
          retention-days: 7
  controller:
    name: Cross-VM Controller
    runs-on: ubuntu-24.04
    needs: preflight
    permissions:
      contents: read
      actions: read
      id-token: write
    timeout-minutes: 90
    environment:
      name: cross-vm-test-relay
      deployment: false
    env:
      REAL_E2E_ROLE: controller
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/real-e2e-tailnet
        with:
          oauth-client-id: ${{ vars.TS_PEER_CLIENT_ID }}
          audience: ${{ vars.TS_PEER_AUDIENCE }}
          tags: tag:ocservia-ci-peer
          hostname: ocservia-controller-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for Relay readiness and configure dedicated test Relay
        uses: ./.github/actions/real-e2e-step
        with:
          wait-name: relay-ready
          wait-peer: Cross-VM Relay
          token: ${{ github.token }}
          phase: consume-relay
          relay-token: ${{ secrets.CROSS_VM_RELAY_TOKEN }}
      - name: Start Controller and publish readiness
        uses: ./.github/actions/real-e2e-step
        with:
          phase: start
          publish-name: controller-ready
      - name: Wait for agent-endpoint and issue encrypted enrollment token
        uses: ./.github/actions/real-e2e-step
        with:
          wait-name: agent-endpoint
          wait-peer: Cross-VM Agent
          token: ${{ github.token }}
          phase: issue-token
          publish-name: enrollment-token
          publish-path: ${{ runner.temp }}/real-e2e-private-${{ env.RUN_ID }}-controller/encrypted-token
      - name: Wait for enrollment-result and verify
        uses: ./.github/actions/real-e2e-step
        with:
          wait-name: enrollment-result
          wait-peer: Cross-VM Agent
          token: ${{ github.token }}
          phase: verify
      - name: Approve node and publish encrypted business authority
        uses: ./.github/actions/real-e2e-step
        with:
          phase: authority
          publish-name: business-authority
      - name: Wait for native authority proof and register privd authority
        uses: ./.github/actions/real-e2e-step
        with:
          wait-name: business-node-ready
          wait-peer: Cross-VM Agent
          token: ${{ github.token }}
          phase: register-privd
          publish-name: business-authority-registered
      - name: Apply native business and publish VPN input
        uses: ./.github/actions/real-e2e-step
        with:
          phase: business
          publish-name: business-controller-done
      - name: Wait for native business result and verify
        uses: ./.github/actions/real-e2e-step
        with:
          wait-name: business-node-result
          wait-peer: Cross-VM Agent
          token: ${{ github.token }}
          phase: verify-business
      - name: Create and publish Relay recovery baseline
        uses: ./.github/actions/real-e2e-step
        with:
          phase: recovery-controller-baseline
          publish-name: recovery-controller-baseline
      - name: Wait for sole Relay stop and queue reload during outage
        uses: ./.github/actions/real-e2e-step
        with:
          wait-name: recovery-relay-stopped
          wait-peer: Cross-VM Relay
          token: ${{ github.token }}
          phase: recovery-controller-queued
          publish-name: recovery-controller-queued
      - name: Wait for Relay restoration and verify recovered operation
        uses: ./.github/actions/real-e2e-step
        with:
          wait-name: recovery-relay-restored
          wait-peer: Cross-VM Relay
          token: ${{ github.token }}
          phase: recovery-controller-done
          publish-name: recovery-controller-done
      - name: Wait for native recovery result and reconcile exactly one effect
        uses: ./.github/actions/real-e2e-step
        with:
          wait-name: recovery-node-result
          wait-peer: Cross-VM Agent
          token: ${{ github.token }}
          phase: recovery-controller-verify
      - name: Clean private files and task resources
        if: always()
        timeout-minutes: 5
        run: timeout --kill-after=15s 240s bash scripts/real-e2e-hosted.sh cleanup
      - name: Logout local Tailnet identity
        if: always()
        run: bash scripts/real-e2e-hosted.sh tailnet-cleanup
      - name: Preserve allowlisted evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cross-vm-evidence-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/real-e2e-evidence-controller
          if-no-files-found: error
          retention-days: 7
  node:
    name: Cross-VM Agent
    runs-on: ubuntu-24.04
    needs: preflight
    permissions:
      contents: read
      actions: read
      id-token: write
    timeout-minutes: 90
    environment:
      name: cross-vm-test-relay
      deployment: false
    env:
      REAL_E2E_ROLE: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/real-e2e-tailnet
        with:
          oauth-client-id: ${{ vars.TS_PEER_CLIENT_ID }}
          audience: ${{ vars.TS_PEER_AUDIENCE }}
          tags: tag:ocservia-ci-peer
          hostname: ocservia-node-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for Relay readiness and configure dedicated test Relay
        uses: ./.github/actions/real-e2e-step
        with:
          wait-name: relay-ready
          wait-peer: Cross-VM Relay
          token: ${{ github.token }}
          phase: consume-relay
          relay-token: ${{ secrets.CROSS_VM_RELAY_TOKEN }}
      - name: Build native Agent and verify Relay auth negative controls
        run: |
          bash scripts/real-e2e-hosted.sh build
          bash scripts/real-e2e-hosted.sh relay-check
      - name: Wait for controller-ready and publish agent-endpoint
        uses: ./.github/actions/real-e2e-step
        with:
          wait-name: controller-ready
          wait-peer: Cross-VM Controller
          token: ${{ github.token }}
          phase: prepare
          publish-name: agent-endpoint
      - name: Wait for enrollment-token and enroll
        uses: ./.github/actions/real-e2e-step
        with:
          wait-name: enrollment-token
          wait-dir: encrypted-token
          wait-peer: Cross-VM Controller
          token: ${{ github.token }}
          phase: enroll
          publish-name: enrollment-result
      - name: Wait for native business authority and activate TLS
        uses: ./.github/actions/real-e2e-step
        with:
          wait-name: business-authority
          wait-peer: Cross-VM Controller
          token: ${{ github.token }}
          phase: activate
          publish-name: business-node-ready
      - name: Wait for authority registration and start native Agent and privd
        uses: ./.github/actions/real-e2e-step
        with:
          wait-name: business-authority-registered
          wait-peer: Cross-VM Controller
          token: ${{ github.token }}
          phase: start-native
      - name: Wait for Controller business operations and verify OpenConnect VPN
        uses: ./.github/actions/real-e2e-step
        with:
          wait-name: business-controller-done
          wait-peer: Cross-VM Controller
          token: ${{ github.token }}
          phase: native-result
          publish-name: business-node-result
      - name: Wait for Controller recovery baseline and capture native baseline
        uses: ./.github/actions/real-e2e-step
        with:
          wait-name: recovery-controller-baseline
          wait-peer: Cross-VM Controller
          token: ${{ github.token }}
          phase: recovery-node-baseline
          publish-name: recovery-node-baseline
      - name: Wait for offline queued operation and verify live VPN
        uses: ./.github/actions/real-e2e-step
        with:
          wait-name: recovery-controller-queued
          wait-peer: Cross-VM Controller
          token: ${{ github.token }}
          phase: recovery-node-queued
          publish-name: recovery-node-queued
      - name: Wait for recovered operation and verify single reload
        uses: ./.github/actions/real-e2e-step
        with:
          wait-name: recovery-controller-done
          wait-peer: Cross-VM Controller
          token: ${{ github.token }}
          phase: recovery-node-result
          publish-name: recovery-node-result
      - name: Clean private files and task resources
        if: always()
        timeout-minutes: 5
        run: timeout --kill-after=15s 240s bash scripts/real-e2e-hosted.sh cleanup
      - name: Logout local Tailnet identity
        if: always()
        run: bash scripts/real-e2e-hosted.sh tailnet-cleanup
      - name: Preserve allowlisted evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cross-vm-evidence-node-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/real-e2e-evidence-node
          if-no-files-found: error
          retention-days: 7
  verdict:
    name: Cross-VM Verdict and Artifact Cleanup
    needs: [admission, preflight, relay, controller, node]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Delete run-attempt rendezvous artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RENDEZVOUS_PATTERN='^real-e2e-(relay-ready|controller-ready|agent-endpoint|enrollment-token|enrollment-result|business-authority|business-authority-registered|business-node-ready|business-controller-done|business-node-result|recovery-controller-baseline|recovery-node-baseline|recovery-relay-stopped|recovery-controller-queued|recovery-node-queued|recovery-relay-restored|recovery-controller-done|recovery-node-result)-'"${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}$"
          export RENDEZVOUS_PATTERN
          list_rendezvous_ids() {
            gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name | test(env.RENDEZVOUS_PATTERN)) | .id'
          }
          for id in $(list_rendezvous_ids); do
            gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$id"
          done
          test -z "$(list_rendezvous_ids)"
      - name: Require preflight, three VMs and cleanup to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == schedule ]] && jq -e '
            keys == ["admission","controller","node","preflight","relay"] and
            .admission.result == "success" and .admission.outputs.mode == "disabled" and
            ([.controller,.node,.preflight,.relay] | all(.[]; .result == "skipped"))' <<<"$RESULTS" >/dev/null; then
            echo 'CROSS_VM_ENROLLMENT=NOT_RUN_SCHEDULE_DISABLED' >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -e 'keys == ["admission","controller","node","preflight","relay"] and
            .admission.outputs.mode == "run" and all(.[]; .result == "success")' <<<"$RESULTS" >/dev/null
          {
            echo 'CROSS_VM_ENROLLMENT=PASS'
            echo 'CROSS_VM_PRIVATE_BUSINESS=PASS'
            echo 'DEDICATED_RELAY_RECOVERY=PASS'
            echo 'CROSS_WAN_PUBLIC_INGRESS=NOT_TESTED'
            echo 'SERVER_DEVICE_DELETION=NOT_INDEPENDENTLY_VERIFIED'
            if [[ "$NODE_INSTALL_E2E" == true ]]; then
              echo 'RELEASE_ASSET_DOWNLOAD=NOT_TESTED'
              echo 'NODE_INSTALL_E2E=PASS'
            fi
            echo 'CLEANUP=PASS'
          } >>"$GITHUB_STEP_SUMMARY"
