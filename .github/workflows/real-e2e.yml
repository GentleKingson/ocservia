name: Cross-VM Real E2E

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-controller:
    name: Real Controller VM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT: ocservia-real-e2e-${{ github.run_id }}-${{ github.run_attempt }}-controller
      RUN_ID: real-e2e-${{ github.run_id }}-${{ github.run_attempt }}-controller
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runner preflight
        run: scripts/ci-preflight.sh
      - name: Real E2E policy tests
        run: scripts/test-real-e2e-workflow.sh
      - name: Start Controller, PostgreSQL, and real transportd
        run: scripts/real-e2e-controller.sh start
      - name: Publish Controller EndpointID
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: real-e2e-controller-ready-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocservia-real-e2e-controller-${{ env.RUN_ID }}/outbox/controller-ready
          if-no-files-found: error
          retention-days: 1
      - name: Wait for Agent EndpointID
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/real-e2e-artifact.sh wait-download "real-e2e-agent-endpoint-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${RUNNER_TEMP}/real-e2e-agent-endpoint" 600
      - name: Bind and publish one-time enrollment token
        run: scripts/real-e2e-controller.sh issue-token "${RUNNER_TEMP}/real-e2e-agent-endpoint"
      - name: Publish enrollment token
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: real-e2e-enrollment-token-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocservia-real-e2e-controller-${{ env.RUN_ID }}/outbox/enrollment-token
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
      - name: Wait for real Iroh enrollment result
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/real-e2e-artifact.sh wait-download "real-e2e-enrollment-result-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${RUNNER_TEMP}/real-e2e-enrollment-result" 600
      - name: Verify pending EndpointID binding
        run: scripts/real-e2e-controller.sh verify-enrollment "${RUNNER_TEMP}/real-e2e-enrollment-result"
      - name: Collect redacted Controller diagnostics
        if: always()
        run: scripts/real-e2e-controller.sh diagnostics
      - name: Clean Controller resources
        if: always()
        run: scripts/real-e2e-controller.sh cleanup
      - name: Upload Controller diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: real-e2e-controller-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/real-e2e-controller
          if-no-files-found: warn
          retention-days: 1

  real-node:
    name: Real Managed Node VM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUN_ID: real-e2e-${{ github.run_id }}-${{ github.run_attempt }}-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runner preflight
        run: scripts/ci-preflight.sh
      - name: Restore verified Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: tooling-v3-real-e2e-node-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh') }}
      - name: Bootstrap pinned Rust toolchain
        run: scripts/bootstrap.sh native
      - name: Real E2E policy tests
        run: scripts/test-real-e2e-workflow.sh
      - name: Wait for Controller EndpointID
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/real-e2e-artifact.sh wait-download "real-e2e-controller-ready-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${RUNNER_TEMP}/real-e2e-controller-ready" 600
      - name: Build Agent and prepare persistent EndpointID
        run: |
          source scripts/env.sh
          scripts/real-e2e-node.sh prepare "${RUNNER_TEMP}/real-e2e-controller-ready"
      - name: Publish Agent EndpointID
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: real-e2e-agent-endpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocservia-real-e2e-node-${{ env.RUN_ID }}/outbox/agent-endpoint
          if-no-files-found: error
          retention-days: 1
      - name: Wait for bound enrollment token
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/real-e2e-artifact.sh wait-download "real-e2e-enrollment-token-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${RUNNER_TEMP}/real-e2e-enrollment-token" 600
      - name: Enroll over real cross-VM Iroh
        run: scripts/real-e2e-node.sh enroll "${RUNNER_TEMP}/real-e2e-enrollment-token"
      - name: Publish enrollment result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: real-e2e-enrollment-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocservia-real-e2e-node-${{ env.RUN_ID }}/outbox/enrollment-result
          if-no-files-found: error
          retention-days: 1
      - name: Collect redacted Node diagnostics
        if: always()
        run: scripts/real-e2e-node.sh diagnostics
      - name: Clean Node resources
        if: always()
        run: scripts/real-e2e-node.sh cleanup
      - name: Upload Node diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: real-e2e-node-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/real-e2e-node
          if-no-files-found: warn
          retention-days: 1
