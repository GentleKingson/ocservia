name: Cross-VM Private Business
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  workflow_call:
    secrets:
      CROSS_VM_RELAY_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: cross-vm-enrollment-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
env:
  RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  COMPOSE_PROJECT: cross-vm-${{ github.run_id }}-${{ github.run_attempt }}
  CARGO_INCREMENTAL: '0'
jobs:
  admission:
    name: Cross-VM Admission
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      mode: ${{ steps.trust.outputs.mode }}
    steps:
      - name: Require trusted main workflow before repository code
        id: trust
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          JOB_CONTEXT: ${{ toJSON(job) }}
          EVENT_NAME: ${{ github.event_name }}
          # Keep disabled until this three-VM profile passes on trusted main.
          SCHEDULE_ENABLED: 'false'
        run: |
          if [[ "$SOURCE_REPOSITORY" != GentleKingson/ocservia || "$SOURCE_REF" != refs/heads/main ||
                ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] ||
             ! jq -e --arg ref 'GentleKingson/ocservia/.github/workflows/real-e2e.yml@refs/heads/main' \
               --arg sha "$SOURCE_SHA" '.workflow_ref == $ref and .workflow_sha == $sha' <<<"$JOB_CONTEXT" >/dev/null; then
            echo 'CROSS_VM_ENROLLMENT=BLOCKED_AUTH' >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          case "$EVENT_NAME" in
            workflow_dispatch|schedule|push) ;;
            *) echo 'CROSS_VM_ENROLLMENT=BLOCKED_AUTH' >>"$GITHUB_STEP_SUMMARY"; exit 1 ;;
          esac
          # Actions expression equality ignores case. Decide here, without
          # credentials, so only the exact repository-variable value enables it.
          if [[ "$EVENT_NAME" == schedule && "$SCHEDULE_ENABLED" != true ]]; then
            echo 'mode=disabled' >>"$GITHUB_OUTPUT"
            echo 'CROSS_VM_ENROLLMENT=NOT_RUN_SCHEDULE_DISABLED' >>"$GITHUB_STEP_SUMMARY"
          else
            echo 'mode=run' >>"$GITHUB_OUTPUT"
          fi
  preflight:
    name: Cross-VM Infrastructure Preflight
    needs: admission
    if: needs.admission.outputs.mode == 'run'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: cross-vm-test-relay
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require protected Tailnet configuration
        env:
          TS_PEER_CLIENT_ID: ${{ vars.TS_PEER_CLIENT_ID }}
          TS_PEER_AUDIENCE: ${{ vars.TS_PEER_AUDIENCE }}
          TS_RELAY_CLIENT_ID: ${{ vars.TS_RELAY_CLIENT_ID }}
          TS_RELAY_AUDIENCE: ${{ vars.TS_RELAY_AUDIENCE }}
          TS_POLICY_REVIEWED: ${{ vars.TS_POLICY_REVIEWED }}
          REAL_E2E_RELAY_TOKEN: ${{ secrets.CROSS_VM_RELAY_TOKEN }}
        run: |
          if ! python3 scripts/real-e2e-tailnet.py infra; then
            echo 'CROSS_VM_ENROLLMENT=BLOCKED_INFRA' >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
  relay:
    name: Cross-VM Relay
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    permissions:
      contents: read
      actions: read
      id-token: write
    environment:
      name: cross-vm-test-relay
      deployment: false
    env:
      REAL_E2E_ROLE: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify hosted VM and dependencies
        run: bash scripts/real-e2e-hosted.sh preflight
      - name: Check GitHub OIDC scope before Tailnet join
        env:
          TS_AUDIENCE: ${{ vars.TS_RELAY_AUDIENCE }}
        run: python3 scripts/real-e2e-tailnet.py oidc
      - name: Join ephemeral Tailnet using OIDC
        id: tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TS_RELAY_CLIENT_ID }}
          audience: ${{ vars.TS_RELAY_AUDIENCE }}
          tags: tag:ocservia-ci-relay
          hostname: ocservia-relay-${{ github.run_id }}-${{ github.run_attempt }}
          args: --accept-dns=false
          use-cache: 'false'
      - name: Reject advertised Tailnet routes
        run: sudo tailscale set --accept-routes=false
      - name: Start private HTTPS Relay
        env:
          REAL_E2E_RELAY_TOKEN: ${{ secrets.CROSS_VM_RELAY_TOKEN }}
        run: bash scripts/real-e2e-relay-host.sh start
      - name: Publish Relay readiness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-e2e-relay-ready-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/real-e2e-relay-${{ env.RUN_ID }}/ready
          if-no-files-found: error
          retention-days: 1
      - name: Keep Relay alive until both peer jobs complete
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/real-e2e-relay-host.sh hold
      - name: Clean Relay and private TLS material
        if: always()
        run: timeout --kill-after=15s 240s bash scripts/real-e2e-relay-host.sh cleanup
      - name: Logout local Tailnet identity
        if: always()
        run: bash scripts/real-e2e-hosted.sh tailnet-cleanup
      - name: Clean private preflight directory
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/real-e2e-private-$RUN_ID-relay"
      - name: Preserve allowlisted evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cross-vm-evidence-relay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/real-e2e-evidence-relay
          if-no-files-found: error
          retention-days: 7
  controller:
    name: Cross-VM Controller
    runs-on: ubuntu-24.04
    needs: preflight
    permissions:
      contents: read
      actions: read
      id-token: write
    timeout-minutes: 90
    environment:
      name: cross-vm-test-relay
      deployment: false
    env:
      REAL_E2E_ROLE: controller
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify hosted VM and dependencies
        run: bash scripts/real-e2e-hosted.sh preflight
      - name: Check GitHub OIDC scope before Tailnet join
        env:
          TS_AUDIENCE: ${{ vars.TS_PEER_AUDIENCE }}
        run: python3 scripts/real-e2e-tailnet.py oidc
      - name: Join ephemeral Tailnet using OIDC
        id: tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TS_PEER_CLIENT_ID }}
          audience: ${{ vars.TS_PEER_AUDIENCE }}
          tags: tag:ocservia-ci-peer
          hostname: ocservia-controller-${{ github.run_id }}-${{ github.run_attempt }}
          args: --accept-dns=false
          use-cache: 'false'
      - name: Reject advertised Tailnet routes
        run: sudo tailscale set --accept-routes=false
      - name: Wait for Relay readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/real-e2e-hosted.sh wait-download
          real-e2e-relay-ready-${{ github.run_id }}-${{ github.run_attempt }}
          relay-ready "Cross-VM Relay"
      - name: Configure dedicated test Relay
        env:
          REAL_E2E_RELAY_TOKEN: ${{ secrets.CROSS_VM_RELAY_TOKEN }}
        run: bash scripts/real-e2e-hosted.sh consume-relay
      - name: start
        run: bash scripts/real-e2e-hosted.sh start
      - name: Publish controller-ready
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-e2e-controller-ready-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocservia-real-e2e-controller-${{ env.RUN_ID }}/outbox/controller-ready
          if-no-files-found: error
          retention-days: 1
      - name: Wait for agent-endpoint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/real-e2e-hosted.sh wait-download
          real-e2e-agent-endpoint-${{ github.run_id }}-${{ github.run_attempt }}
          agent-endpoint "Cross-VM Agent"
      - name: issue-token
        run: bash scripts/real-e2e-hosted.sh issue-token
      - name: Publish enrollment-token
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-e2e-enrollment-token-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/real-e2e-private-${{ env.RUN_ID }}-controller/encrypted-token
          if-no-files-found: error
          retention-days: 1
      - name: Wait for enrollment-result
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/real-e2e-hosted.sh wait-download
          real-e2e-enrollment-result-${{ github.run_id }}-${{ github.run_attempt }}
          enrollment-result "Cross-VM Agent"
      - name: verify
        run: bash scripts/real-e2e-hosted.sh verify
      - name: Approve node and issue native authority
        run: bash scripts/real-e2e-hosted.sh authority
      - name: Publish encrypted business authority
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-e2e-business-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocservia-real-e2e-controller-${{ env.RUN_ID }}/outbox/business-authority
          if-no-files-found: error
          retention-days: 1
      - name: Wait for native Agent readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/real-e2e-hosted.sh wait-download
          real-e2e-business-node-ready-${{ github.run_id }}-${{ github.run_attempt }}
          business-node-ready "Cross-VM Agent"
      - name: Apply native business and create VPN user
        run: bash scripts/real-e2e-hosted.sh business
      - name: Publish encrypted VPN input and operation IDs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-e2e-business-controller-done-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocservia-real-e2e-controller-${{ env.RUN_ID }}/outbox/business-controller-done
          if-no-files-found: error
          retention-days: 1
      - name: Wait for native business result
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/real-e2e-hosted.sh wait-download
          real-e2e-business-node-result-${{ github.run_id }}-${{ github.run_attempt }}
          business-node-result "Cross-VM Agent"
      - name: Verify Controller DB and Agent native effects
        run: bash scripts/real-e2e-hosted.sh verify-business
      - name: Clean private files and task resources
        if: always()
        timeout-minutes: 5
        run: timeout --kill-after=15s 240s bash scripts/real-e2e-hosted.sh cleanup
      - name: Logout local Tailnet identity
        if: always()
        run: bash scripts/real-e2e-hosted.sh tailnet-cleanup
      - name: Preserve allowlisted evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cross-vm-evidence-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/real-e2e-evidence-controller
          if-no-files-found: error
          retention-days: 7
  node:
    name: Cross-VM Agent
    runs-on: ubuntu-24.04
    needs: preflight
    permissions:
      contents: read
      actions: read
      id-token: write
    timeout-minutes: 90
    environment:
      name: cross-vm-test-relay
      deployment: false
    env:
      REAL_E2E_ROLE: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify hosted VM and dependencies
        run: bash scripts/real-e2e-hosted.sh preflight
      - name: Check GitHub OIDC scope before Tailnet join
        env:
          TS_AUDIENCE: ${{ vars.TS_PEER_AUDIENCE }}
        run: python3 scripts/real-e2e-tailnet.py oidc
      - name: Join ephemeral Tailnet using OIDC
        id: tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TS_PEER_CLIENT_ID }}
          audience: ${{ vars.TS_PEER_AUDIENCE }}
          tags: tag:ocservia-ci-peer
          hostname: ocservia-node-${{ github.run_id }}-${{ github.run_attempt }}
          args: --accept-dns=false
          use-cache: 'false'
      - name: Reject advertised Tailnet routes
        run: sudo tailscale set --accept-routes=false
      - name: Wait for Relay readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/real-e2e-hosted.sh wait-download
          real-e2e-relay-ready-${{ github.run_id }}-${{ github.run_attempt }}
          relay-ready "Cross-VM Relay"
      - name: Configure dedicated test Relay
        env:
          REAL_E2E_RELAY_TOKEN: ${{ secrets.CROSS_VM_RELAY_TOKEN }}
        run: bash scripts/real-e2e-hosted.sh consume-relay
      - name: build
        run: bash scripts/real-e2e-hosted.sh build
      - name: Verify TLS and real Relay authentication negative controls
        run: bash scripts/real-e2e-hosted.sh relay-check
      - name: Wait for controller-ready
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/real-e2e-hosted.sh wait-download
          real-e2e-controller-ready-${{ github.run_id }}-${{ github.run_attempt }}
          controller-ready "Cross-VM Controller"
      - name: prepare
        run: bash scripts/real-e2e-hosted.sh prepare
      - name: Publish agent-endpoint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-e2e-agent-endpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocservia-real-e2e-node-${{ env.RUN_ID }}/outbox/agent-endpoint
          if-no-files-found: error
          retention-days: 1
      - name: Wait for enrollment-token
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/real-e2e-hosted.sh wait-download
          real-e2e-enrollment-token-${{ github.run_id }}-${{ github.run_attempt }}
          encrypted-token "Cross-VM Controller"
      - name: enroll
        run: bash scripts/real-e2e-hosted.sh enroll
      - name: Publish enrollment-result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-e2e-enrollment-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocservia-real-e2e-node-${{ env.RUN_ID }}/outbox/enrollment-result
          if-no-files-found: error
          retention-days: 1
      - name: Wait for native business authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/real-e2e-hosted.sh wait-download
          real-e2e-business-authority-${{ github.run_id }}-${{ github.run_attempt }}
          business-authority "Cross-VM Controller"
      - name: Start native Agent and privd
        run: bash scripts/real-e2e-hosted.sh activate
      - name: Publish native Agent readiness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-e2e-business-node-ready-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocservia-real-e2e-node-${{ env.RUN_ID }}/outbox/business-node-ready
          if-no-files-found: error
          retention-days: 1
      - name: Wait for Controller business operations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/real-e2e-hosted.sh wait-download
          real-e2e-business-controller-done-${{ github.run_id }}-${{ github.run_attempt }}
          business-controller-done "Cross-VM Controller"
      - name: Check native effects and OpenConnect VPN
        run: bash scripts/real-e2e-hosted.sh native-result
      - name: Publish native business result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-e2e-business-node-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocservia-real-e2e-node-${{ env.RUN_ID }}/outbox/business-node-result
          if-no-files-found: error
          retention-days: 1
      - name: Clean private files and task resources
        if: always()
        timeout-minutes: 5
        run: timeout --kill-after=15s 240s bash scripts/real-e2e-hosted.sh cleanup
      - name: Logout local Tailnet identity
        if: always()
        run: bash scripts/real-e2e-hosted.sh tailnet-cleanup
      - name: Preserve allowlisted evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cross-vm-evidence-node-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/real-e2e-evidence-node
          if-no-files-found: error
          retention-days: 7
  verdict:
    name: Cross-VM Verdict and Artifact Cleanup
    needs: [admission, preflight, relay, controller, node]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Delete run-attempt rendezvous artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | test("^real-e2e-(relay-ready|controller-ready|agent-endpoint|enrollment-token|enrollment-result|business-authority|business-node-ready|business-controller-done|business-node-result)-" + env.GITHUB_RUN_ID + "-" + env.GITHUB_RUN_ATTEMPT + "$")) | .id')"
          for id in $ids; do
            gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$id"
          done
          remaining="$(gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | test("^real-e2e-(relay-ready|controller-ready|agent-endpoint|enrollment-token|enrollment-result|business-authority|business-node-ready|business-controller-done|business-node-result)-" + env.GITHUB_RUN_ID + "-" + env.GITHUB_RUN_ATTEMPT + "$")) | .id')"
          test -z "$remaining"
      - name: Require preflight, three VMs and cleanup to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == schedule ]] && jq -e '
            keys == ["admission","controller","node","preflight","relay"] and
            .admission.result == "success" and .admission.outputs.mode == "disabled" and
            ([.controller,.node,.preflight,.relay] | all(.[]; .result == "skipped"))' <<<"$RESULTS" >/dev/null; then
            echo 'CROSS_VM_ENROLLMENT=NOT_RUN_SCHEDULE_DISABLED' >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -e 'keys == ["admission","controller","node","preflight","relay"] and
            .admission.outputs.mode == "run" and all(.[]; .result == "success")' <<<"$RESULTS" >/dev/null
          {
            echo 'CROSS_VM_ENROLLMENT=PASS'
            echo 'CROSS_VM_PRIVATE_BUSINESS=PASS'
            echo 'DEDICATED_RELAY_RECOVERY=NOT_PROVEN'
            echo 'CROSS_WAN_PUBLIC_INGRESS=NOT_TESTED'
            echo 'SERVER_DEVICE_DELETION=NOT_INDEPENDENTLY_VERIFIED'
            echo 'CLEANUP=PASS'
          } >>"$GITHUB_STEP_SUMMARY"
