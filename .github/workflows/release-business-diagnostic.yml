name: Native Business Diagnostics
on:
  workflow_call:
    inputs:
      run-resilience:
        type: boolean
        default: false
      version:
        type: string
        required: true
      profile:
        type: string
        required: true
      production_signer:
        type: boolean
        default: false
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
jobs:
  business:
    name: Business (${{ inputs.profile }}, amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      BUSINESS_PROFILE: ${{ inputs.profile }}
      BUSINESS_RUN_RESILIENCE: ${{ inputs.run-resilience }}
      PRODUCTION_SIGNER_ACCEPTANCE: ${{ inputs.production_signer }}
      CONTROLLER_ARCH: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-cache-credentials
      - name: Restore Business tool cache
        id: business-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: tooling-v4-business-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh', 'rust/Cargo.lock') }}
      - name: Resolve isolated Agent target cache
        id: agent-target
        run: |
          builder_hash="$(sha256sum rust/agent-build.Dockerfile | cut -c1-16)"
          echo "path=rust/target/agent-amd64-${builder_hash}" >>"${GITHUB_OUTPUT}"
      - name: Restore Rocky Agent compilation cache
        id: agent-target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.agent-target.outputs.path }}
          key: release-agent-target-v1-${{ runner.os }}-amd64-${{ hashFiles('rust/agent-build.Dockerfile', 'toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh', 'scripts/build-agent-binaries.sh', 'rust/rust-toolchain.toml', 'rust/.cargo/**', 'rust/**/Cargo.toml', 'rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: release-agent-target-v1-${{ runner.os }}-amd64-${{ hashFiles('rust/agent-build.Dockerfile', 'toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh', 'scripts/build-agent-binaries.sh', 'rust/rust-toolchain.toml', 'rust/.cargo/**', 'rust/**/Cargo.toml', 'rust/Cargo.lock') }}-
      - name: Build local products and exercise real business
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/business-diagnostics
        run: |
          if [[ "$PRODUCTION_SIGNER_ACCEPTANCE" == true ]]; then
            sudo --preserve-env=ARTIFACT_DIR,VERSION,BUSINESS_PROFILE,BUSINESS_RUN_RESILIENCE,PRODUCTION_SIGNER_ACCEPTANCE,GITHUB_ACTIONS,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_ENVIRONMENT,RUNNER_ARCH,CONTROLLER_ARCH,CARGO_INCREMENTAL \
              --preserve-env=BUILD_CACHE_AVAILABLE,ACTIONS_RUNTIME_TOKEN,ACTIONS_CACHE_URL,ACTIONS_RESULTS_URL \
              bash scripts/release-business-probe.sh
          else
            bash scripts/release-business-probe.sh
          fi
      - name: Return task-owned diagnostics and build caches to the runner
        if: ${{ always() && inputs.production_signer }}
        run: |
          for path in "$RUNNER_TEMP/business-diagnostics" .cache .tools rust/target; do
            if [[ -d "$path" && ! -L "$path" ]]; then
              sudo chown -R -- "$(id -u):$(id -g)" "$path"
            fi
          done
      - name: Summarize business timings and sanitized failures
        if: always()
        env:
          DIAGNOSTICS: ${{ runner.temp }}/business-diagnostics
        run: |
          if [[ -f "$DIAGNOSTICS/result.json" ]]; then
            jq '{probe_status,last_stage,exit_code,timings,resilience_scenarios}' "$DIAGNOSTICS/result.json"
          fi
          if [[ -f "$DIAGNOSTICS/api-checkpoints.jsonl" ]]; then
            jq -c 'select(.name == "real_vpn_relay_recovery" or .name == "resilience_relay") | {name,time,status}' "$DIAGNOSTICS/api-checkpoints.jsonl"
          fi
          if [[ -f "$DIAGNOSTICS/probe.log" ]]; then
            grep -E '^(RuntimeError:|AssertionError|probe failed at line)' "$DIAGNOSTICS/probe.log" || true
          fi
      - name: Require completed business and actual recovery scenarios
        env:
          DIAGNOSTICS: ${{ runner.temp }}/business-diagnostics
        run: |
          test -s "$DIAGNOSTICS/probe.log"
          jq -e --arg profile "$BUSINESS_PROFILE" \
            '.profile == $profile and .probe_status == "PASS" and .exit_code == 0 and (.timings | type == "array" and length > 0)' \
            "$DIAGNOSTICS/result.json" >/dev/null
          jq -e --arg profile "$BUSINESS_PROFILE" '
            (if $profile == "smoke" then
              (["real_browser_subset", "approved_config_apply_and_vpn_user", "real_vpn_after_config_apply"] - .passed_checkpoints | length) == 0
             else
              (["real_external_oidc", "real_certificate_lifecycle", "real_browser_subset", "real_vpn_business_and_recovery"] - .passed_checkpoints | length) == 0
             end)' "$DIAGNOSTICS/result.json" >/dev/null
          if [[ "$PRODUCTION_SIGNER_ACCEPTANCE" == true ]]; then
            grep -Fx integrated_entry_and_internal_tls "$DIAGNOSTICS/checkpoints.txt"
            grep -Fx production_signer_approved_binding "$DIAGNOSTICS/checkpoints.txt"
            if [[ "$BUSINESS_PROFILE" == smoke ]]; then
              jq -se 'any(.[]; .name == "production_signer_password_sealed" and .status == "PASS")' "$DIAGNOSTICS/api-checkpoints.jsonl" >/dev/null
            else
              grep -Fx integrated_recreation_and_authorized_sse "$DIAGNOSTICS/checkpoints.txt"
              jq -e '.primary_occtl_preserved == true and .before_auth == true and .revoked_rejected == true and .control_auth == true and .refresh == "signed-export-atomic-install-sighup"' "$DIAGNOSTICS/crl-acceptance.json" >/dev/null
            fi
          fi
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync(`${process.env.DIAGNOSTICS}/result.json`, 'utf8'));
          const requested = process.env.BUSINESS_RUN_RESILIENCE === 'true';
          if (result.resilience_requested !== requested) throw new Error('resilience request mismatch');
          const expected = requested ? 'PASS' : 'SKIPPED';
          if (result.resilience_result !== expected || !Array.isArray(result.resilience_scenarios)) throw new Error('resilience incomplete');
          if (expected === 'PASS') {
            if (result.planned_topology.native_systemd_node !== true) throw new Error('missing native node');
            for (const name of ['controller', 'agent', 'database', 'relay']) {
              const entries = result.resilience_scenarios.filter(entry => entry.name === `resilience_${name}`);
              if (entries.length !== 1 || entries[0].status !== 'PASS') throw new Error(`missing recovery: ${name}`);
            }
          }
          JS
      - name: Preserve business timings and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: business-${{ inputs.profile }}-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/business-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Save Business tool cache
        if: ${{ success() && steps.business-tools.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: ${{ steps.business-tools.outputs.cache-primary-key }}
      - name: Save Rocky Agent compilation cache
        if: ${{ success() && steps.agent-target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.agent-target.outputs.path }}
          key: ${{ steps.agent-target-cache.outputs.cache-primary-key }}
