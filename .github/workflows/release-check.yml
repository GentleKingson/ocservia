name: Hosted benchmark diagnostics
run-name: Hosted benchmark diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  BUILD_RUN_ID: '45213282067'
  BUILD_SHA: 'faea568f93b19fbd7a40b950da142841ee59259b'
  VERSION: '2.0.0-rc.1'
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      agent_id: ${{ steps.record.outputs.agent_id }}
      agent_digest: ${{ steps.record.outputs.agent_digest }}
      controller_id: ${{ steps.record.outputs.controller_id }}
      controller_digest: ${{ steps.record.outputs.controller_digest }}
    steps:
      - name: Find build receipt from benchmark run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")
          attempt=$(jq -er --arg sha "$BUILD_SHA" 'select(.head_sha == $sha and .status == "completed") | .run_attempt' <<<"$run")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/jobs?per_page=100" |
            jq -e 'any(.jobs[]; .name == "assets" and .conclusion == "success")'
          name="release-build-$BUILD_RUN_ID-$attempt"
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts?per_page=100" |
            jq -er --arg name "$name" '[.artifacts[] | select(.name == $name and .expired == false)] | select(length == 1) | .[0].id')
          printf 'receipt_id=%s\n' "$id" >>"$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7
        with:
          artifact-ids: ${{ steps.find.outputs.receipt_id }}
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN_ID }}
          path: ${{ runner.temp }}/receipt
          merge-multiple: true
      - name: Extract exact artifact coordinates
        id: record
        run: |
          file="$RUNNER_TEMP/receipt/release-build.json"
          jq -e --arg sha "$BUILD_SHA" --arg version "$VERSION" --argjson id "$BUILD_RUN_ID"             '.schema == 1 and .candidate.sha == $sha and .candidate.version == $version and .candidate.run_id == $id' "$file"
          for kind in agent controller; do
            id=$(jq -er --arg key "${kind}_amd64" '.products[$key].id | select(type == "number" and . > 0)' "$file")
            digest=$(jq -er --arg key "${kind}_amd64" '.products[$key].manifest_sha256 | select(test("^[0-9a-f]{64}$"))' "$file")
            printf '%s_id=%s\n%s_digest=%s\n' "$kind" "$id" "$kind" "$digest" >>"$GITHUB_OUTPUT"
  business:
    name: Business Smoke (amd64)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      CONTROLLER_ARCH: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BUILD_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7
        with:
          artifact-ids: ${{ needs.prepare.outputs.agent_id }}
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN_ID }}
          path: ${{ runner.temp }}/business-packages
          merge-multiple: true
      - name: Verify exact agent artifact
        env:
          PRODUCT_PATH: ${{ runner.temp }}/business-packages
          DIGEST: ${{ needs.prepare.outputs.agent_digest }}
        run: |
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
          python3 scripts/release-product-identity.py verify --kind agent --directory "$PRODUCT_PATH" --source "$BUILD_SHA" --version "$VERSION" --arch amd64 --manifest-sha256 "$DIGEST"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7
        with:
          artifact-ids: ${{ needs.prepare.outputs.controller_id }}
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN_ID }}
          path: ${{ runner.temp }}/business-controller-images
          merge-multiple: true
      - name: Verify exact controller artifact
        env:
          PRODUCT_PATH: ${{ runner.temp }}/business-controller-images
          DIGEST: ${{ needs.prepare.outputs.controller_digest }}
        run: |
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
          python3 scripts/release-product-identity.py verify --kind controller --directory "$PRODUCT_PATH" --source "$BUILD_SHA" --version "$VERSION" --arch amd64 --manifest-sha256 "$DIGEST"
      - uses: ./.github/actions/setup-tools
        with:
          profiles: npm-security
          cache-npm: 'true'
      - name: Exercise Integrated Business Smoke with candidate products
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/business-diagnostics
          PRODUCTS_DIR: ${{ runner.temp }}/business-packages
          IMAGES_DIR: ${{ runner.temp }}/business-controller-images
        run: |
          sudo --preserve-env=ARTIFACT_DIR,VERSION,GITHUB_ACTIONS,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_ENVIRONMENT,RUNNER_ARCH,CONTROLLER_ARCH,PRODUCTS_DIR,IMAGES_DIR \
            bash scripts/release-business-probe.sh
      - name: Return task-owned diagnostics and caches to the runner
        if: always()
        run: |
          for path in "$RUNNER_TEMP/business-diagnostics" .cache .tools web/node_modules; do
            if [[ -d "$path" && ! -L "$path" ]]; then
              sudo chown -R -- "$(id -u):$(id -g)" "$path"
            fi
          done
      - name: Summarize business timings and sanitized failures
        if: always()
        env:
          DIAGNOSTICS: ${{ runner.temp }}/business-diagnostics
        run: |
          if [[ -f "$DIAGNOSTICS/result.json" ]]; then
            jq '{probe_status,last_stage,exit_code,timings,scenario_timings,resilience_scenarios}' "$DIAGNOSTICS/result.json"
          fi
          if [[ -f "$DIAGNOSTICS/api-checkpoints.jsonl" ]]; then
            jq -c 'select(.name == "real_vpn_relay_recovery" or .name == "resilience_relay") | {name,time,status}' "$DIAGNOSTICS/api-checkpoints.jsonl"
          fi
          if [[ -f "$DIAGNOSTICS/probe.log" ]]; then
            grep -E '^(RuntimeError:|AssertionError|probe failed at line)' "$DIAGNOSTICS/probe.log" || true
          fi
      - name: Require completed business and recovery scenarios
        env:
          DIAGNOSTICS: ${{ runner.temp }}/business-diagnostics
        run: |
          test -s "$DIAGNOSTICS/probe.log"
          if grep -rIEq '(obt2_[A-Za-z0-9_-]{43}|oit1_[A-Za-z0-9_-]+\.[A-Za-z0-9_-]{43})' "$DIAGNOSTICS"; then
            echo 'diagnostics contain a node bootstrap token' >&2
            exit 1
          fi
          jq -e '
            . as $result |
            .profile == "smoke" and .terminal == "revocation" and
            .probe_status == "PASS" and .exit_code == 0 and
            (.timings | type == "array" and length > 0) and
            ([
              "integrated_entry_and_internal_tls",
              "production_signer_active_binding",
              "bootstrap_token_enrollment_and_rerun_identity",
              "real_browser_subset",
              "config_apply_and_vpn_user",
              "real_vpn_after_config_apply",
              "real_node_revocation_and_disconnect"
            ] - .passed_checkpoints | length) == 0 and
            .resilience_requested == true and
            .resilience_result == "PASS" and
            .planned_topology.native_systemd_node == true and
            (.resilience_scenarios | type == "array") and
            all(["controller", "agent", "database", "relay"][];
              . as $name |
              ([$result.resilience_scenarios[] | select(.name == "resilience_" + $name)] | length == 1 and .[0].status == "PASS"))
          ' "$DIAGNOSTICS/result.json" >/dev/null
          jq -se 'any(.[]; .name == "production_signer_password_sealed" and .status == "PASS")' \
            "$DIAGNOSTICS/api-checkpoints.jsonl" >/dev/null
          jq -se 'any(.[]; .name == "resilience_relay" and .status == "PASS" and .offline_queued_zero_side_effects == true and .idempotent_replay == true)' \
            "$DIAGNOSTICS/api-checkpoints.jsonl" >/dev/null
      - name: Preserve business timings and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: business-smoke-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/business-diagnostics
          if-no-files-found: warn
          retention-days: 7

  quick:
    name: Quick Install (Pebble ACME, amd64)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BUILD_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7
        with:
          artifact-ids: ${{ needs.prepare.outputs.controller_id }}
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN_ID }}
          path: ${{ runner.temp }}/quick-controller-images
          merge-multiple: true
      - name: Verify exact controller artifact
        env:
          PRODUCT_PATH: ${{ runner.temp }}/quick-controller-images
          DIGEST: ${{ needs.prepare.outputs.controller_digest }}
        run: |
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
          python3 scripts/release-product-identity.py verify --kind controller --directory "$PRODUCT_PATH" --source "$BUILD_SHA" --version "$VERSION" --arch amd64 --manifest-sha256 "$DIGEST"
      - name: Quick install, rerun, upgrade and rollback against Pebble
        env:
          IMAGES_DIR: ${{ runner.temp }}/quick-controller-images
          CONTROLLER_ARCH: amd64
        run: |
          sudo --preserve-env=VERSION,CONTROLLER_ARCH,RUNNER_ARCH,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,IMAGES_DIR \
            bash scripts/release-quick-acceptance.sh
