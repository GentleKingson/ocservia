name: Hosted release gate verification
run-name: Hosted release gate verification
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  products:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45215897281/jobs?per_page=100" |
            jq -e 'any(.jobs[]; .name == "Verify fixed asset assembly" and .conclusion == "success")'
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45213282067/jobs?per_page=100" |
            jq -e 'any(.jobs[]; .name == "security / Rust advisories" and .conclusion == "success")'
  business:
    name: Business Smoke job dependency
    needs: [products, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: exit 1
  quick:
    name: Quick Install job dependency
    needs: [products, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: exit 1
  result:
    name: Assert verified products and failed Security skip acceptance
    needs: [products, security, business, quick]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '.products.result == "success" and .security.result == "failure" and .business.result == "skipped" and .quick.result == "skipped"' <<<"$RESULTS"
