name: Supported Application Compatibility
on:
  workflow_call:
    inputs:
      helpers-id:
        type: string
        required: true
      helpers-sha256:
        type: string
        required: true
      session-id:
        type: string
        required: true
      session-sha256:
        type: string
        required: true
      version:
        type: string
        required: true
      arch:
        type: string
        required: true
      controller-id:
        type: string
        required: true
      controller-sha256:
        type: string
        required: true
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      CANDIDATE_SHA: ${{ github.sha }}
      PACKAGE_ARCH: ${{ inputs.arch }}
      CONTROLLER_MANIFEST_SHA256: ${{ inputs.controller-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: |
          echo "CANDIDATE_PRODUCTS=${RUNNER_TEMP}/products" >>"${GITHUB_ENV}"
          echo "SESSION_EVIDENCE=${RUNNER_TEMP}/session" >>"${GITHUB_ENV}"
      - uses: ./.github/actions/release-artifacts
        with:
          artifact-id: ${{ inputs.controller-id }}
          sha256: ${{ inputs.controller-sha256 }}
          component: controller
          arch: ${{ inputs.arch }}
          version: ${{ inputs.version }}
          path: ${{ runner.temp }}/products
      - uses: ./.github/actions/release-test-images
        with:
          artifact-id: ${{ inputs.helpers-id }}
          sha256: ${{ inputs.helpers-sha256 }}
          component: test-helpers
          arch: ${{ inputs.arch }}
          version: ${{ inputs.version }}
          path: ${{ runner.temp }}/test-helpers
      - uses: ./.github/actions/release-test-images
        with:
          artifact-id: ${{ inputs.session-id }}
          sha256: ${{ inputs.session-sha256 }}
          component: session-base
          arch: ${{ inputs.arch }}
          version: ${{ inputs.version }}
          path: ${{ runner.temp }}/session-base
      - run: bash scripts/build-release-session-images.sh
      - name: Published supported node against candidate Controller
        env:
          BASELINE_RELEASE: v1.0.0
          RUN_ID: sc-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.arch }}
          RELEASE_ASSET_DIR: ${{ runner.temp }}/baseline
          ARTIFACT_DIR: ${{ runner.temp }}/session/v1.0.0
        run: |
          bash scripts/release-session-compatibility.sh fetch >"${SESSION_EVIDENCE}/baseline-artifact.json"
          bash scripts/release-session-compatibility.sh run
      - name: Return task diagnostics to runner
        if: always()
        run: |
          if [[ -d "${SESSION_EVIDENCE}" && ! -L "${SESSION_EVIDENCE}" ]]; then
            sudo chown -R -- "$(id -u):$(id -g)" "${SESSION_EVIDENCE}"
          fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compatibility-${{ inputs.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/session
          retention-days: 7
          if-no-files-found: warn
      - if: always()
        run: docker buildx rm "session-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
