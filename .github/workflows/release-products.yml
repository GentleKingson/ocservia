name: Build and Smoke Release Products
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      arch:
        type: string
        required: true
      acceptance_identity:
        description: Bind artifacts for Release Check consumers; ordinary Release asset inventory stays unchanged
        type: boolean
        default: false
    outputs:
      agent_packages_artifact_id:
        value: ${{ jobs.build-agent-packages.outputs.artifact_id }}
      controller_images_artifact_id:
        value: ${{ jobs.build-controller-images.outputs.artifact_id }}
      agent_packages_manifest_sha256:
        value: ${{ jobs.build-agent-packages.outputs.manifest_sha256 }}
      controller_images_manifest_sha256:
        value: ${{ jobs.build-controller-images.outputs.manifest_sha256 }}
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
jobs:
  build-agent-packages:
    name: Build Agent Packages (${{ inputs.arch }})
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha256: ${{ steps.identity.outputs.sha256 }}
      version: ${{ steps.package-version.outputs.version }}
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          profiles: native-packages
      - name: Resolve isolated Agent target cache
        id: agent-target
        run: |
          builder_hash="$(sha256sum rust/agent-build.Dockerfile | cut -c1-16)"
          echo "path=rust/target/agent-${{ inputs.arch }}-${builder_hash}" >>"${GITHUB_OUTPUT}"
      - name: Restore Rocky Agent compilation cache
        id: agent-target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.agent-target.outputs.path }}
          key: release-agent-target-v1-${{ runner.os }}-${{ inputs.arch }}-${{ hashFiles('rust/agent-build.Dockerfile', 'toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh', 'scripts/build-agent-binaries.sh', 'rust/rust-toolchain.toml', 'rust/.cargo/**', 'rust/**/Cargo.toml', 'rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: release-agent-target-v1-${{ runner.os }}-${{ inputs.arch }}-${{ hashFiles('rust/agent-build.Dockerfile', 'toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh', 'scripts/build-agent-binaries.sh', 'rust/rust-toolchain.toml', 'rust/.cargo/**', 'rust/**/Cargo.toml', 'rust/Cargo.lock') }}-
      - name: Resolve package version & source epoch
        id: package-version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version=""
          if [[ -n "${RELEASE_TAG}" ]]; then
            if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[.][1-9][0-9]*)?$ ]]; then
              echo "refusing to build release packages for non-SemVer tag ${RELEASE_TAG}" >&2
              exit 1
            fi
            version="${RELEASE_TAG#v}"
          else
            version="${INPUT_VERSION}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[.][1-9][0-9]*)?$ ]]; then
              echo "dispatch version must be plain SemVer without a leading v, got ${version}" >&2
              exit 1
            fi
          fi
          {
            echo "version=${version}"
            echo "source_date_epoch=$(git log -1 --format=%ct)"
          } >>"${GITHUB_ENV}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
      - name: Build native Agent / privd / upgrader and packages
        id: build-packages
        run: |
          VERSION="${version}" PACKAGE_ARCH="${{ inputs.arch }}" \
            OUTPUT_DIR="${RUNNER_TEMP}/packages" \
            SOURCE_DATE_EPOCH="${source_date_epoch}" bash scripts/build-release-agent.sh
      - name: Save Rocky Agent compilation cache
        if: ${{ success() && steps.agent-target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.agent-target.outputs.path }}
          key: ${{ steps.agent-target-cache.outputs.cache-primary-key }}
      - name: Bind agent product identity and digests
        id: identity
        if: inputs.acceptance_identity
        env:
          PRODUCT_VERSION: ${{ env.version }}
          PRODUCT_ARCH: ${{ inputs.arch }}
        run: |
          sha256="$(python3 scripts/release-product-identity.py create --kind agent \
            --directory "$RUNNER_TEMP/packages" --source "$GITHUB_SHA" \
            --version "$PRODUCT_VERSION" --arch "$PRODUCT_ARCH")"
          echo "sha256=$sha256" >>"$GITHUB_OUTPUT"
      - name: Upload package set
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-packages-${{ inputs.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packages/*
          retention-days: 7
          if-no-files-found: error
  smoke-agent-packages:
    name: Smoke Agent Packages (${{ inputs.arch }})
    needs: build-agent-packages
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          profiles: native-packages
      - name: Download immutable package set for smoke
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7
        with:
          artifact-ids: ${{ needs.build-agent-packages.outputs.artifact_id }}
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - name: Validate native package lifecycle (${{ inputs.arch }})
        id: smoke-packages
        env:
          RUN_ID: release-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.arch }}
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts/native-smoke
          PRODUCTS_DIR: ${{ runner.temp }}/packages
          VERSION: ${{ needs.build-agent-packages.outputs.version }}
        run: scripts/release-native-package-smoke.sh
      - name: Validate RC to final package lifecycle (${{ inputs.arch }})
        if: github.event_name == 'workflow_dispatch' && contains(inputs.version, '-rc.')
        env:
          RUN_ID: rc-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.arch }}
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts/rc-lifecycle
          RC_LIFECYCLE: 'true'
          STUB_BINARIES: 'false'
        run: scripts/release-native-package-smoke.sh
      - name: Upload native smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-smoke-${{ inputs.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/artifacts/native-smoke
            ${{ runner.temp }}/artifacts/rc-lifecycle
          retention-days: 7
          if-no-files-found: warn
  build-controller-images:
    name: Build Controller Images (${{ inputs.arch }})
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha256: ${{ steps.identity.outputs.sha256 }}
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      BUILDX_BUILDER: controller-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.arch }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve release identity
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_TAG}" ]]; then
            if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[.][1-9][0-9]*)?$ ]]; then
              echo "refusing to build Controller images for non-SemVer tag ${RELEASE_TAG}" >&2
              exit 1
            fi
            version="${RELEASE_TAG#v}"
          else
            version="${INPUT_VERSION}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[.][1-9][0-9]*)?$ ]]; then
              echo "dispatch version must be plain SemVer without a leading v, got ${version}" >&2
              exit 1
            fi
          fi
          source_commit="$(git rev-parse HEAD)"
          {
            echo "version=${version}"
            echo "source_commit=${source_commit}"
          } >>"${GITHUB_ENV}"
      - name: Relay optional BuildKit cache credentials
        uses: ./.github/actions/build-cache-credentials
      # Each leg builds natively (no QEMU) and exports one Docker image
      # archive per image. Nothing is written to GHCR here: the legs hold
      # only source read, and every production registry write happens inside
      # the single reviewer-gated publish job.
      - name: Build Controller images
        id: build-images
        run: |
          VERSION="${version}" SOURCE_COMMIT="${source_commit}" \
            CONTROLLER_ARCH="${{ inputs.arch }}" OUTPUT_DIR="${RUNNER_TEMP}/controller-images" \
            bash scripts/build-release-controller.sh
      - uses: ./.github/actions/setup-tools
        with:
          profiles: image-security
      - name: Scan exact Controller image archives
        id: scan-images
        env:
          CONTROLLER_ARCH: ${{ inputs.arch }}
        run: |
          source scripts/env.sh
          scan_table="${RUNNER_TEMP}/controller-images.tsv"
          : >"$scan_table"
          for name in gateway control transport backup edge relay signer; do
            printf '%s\t%s\t%s\n' "$name" "$CONTROLLER_ARCH" "$RUNNER_TEMP/controller-images/$name-linux-$CONTROLLER_ARCH.tar" >>"$scan_table"
          done
          IMAGE_ARCHIVES_TSV="$scan_table" bash scripts/scan-release-images.sh
      - name: Smoke Controller images on the native runner
        id: smoke-images
        # Runs for both tag pushes and dispatch dry runs: a dispatch must
        # prove the real build path produces runnable images, not just
        # non-empty archives.
        env:
          IMAGES_DIR: ${{ runner.temp }}/controller-images
          CONTROLLER_ARCH: ${{ inputs.arch }}
          VERSION: ${{ env.version }}
        run: scripts/release-controller-image-smoke.sh
      - name: Bind controller product identity and digests
        id: identity
        if: inputs.acceptance_identity
        env:
          PRODUCT_VERSION: ${{ env.version }}
          PRODUCT_ARCH: ${{ inputs.arch }}
        run: |
          sha256="$(python3 scripts/release-product-identity.py create --kind controller \
            --directory "$RUNNER_TEMP/controller-images" --source "$GITHUB_SHA" \
            --version "$PRODUCT_VERSION" --arch "$PRODUCT_ARCH")"
          echo "sha256=$sha256" >>"$GITHUB_OUTPUT"
      - name: Upload Controller image archives
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: controller-images-${{ inputs.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/controller-images/*.tar
            ${{ runner.temp }}/controller-images/product-identity.json
          retention-days: 7
          if-no-files-found: error
      - name: Remove Controller BuildKit builder
        if: always()
        run: docker buildx rm "${BUILDX_BUILDER}" >/dev/null 2>&1 || true
