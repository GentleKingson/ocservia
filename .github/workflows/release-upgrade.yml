name: Release Diagnostics
on:
  workflow_dispatch:
    inputs:
      run-resilience:
        description: Run finite single-instance recovery
        type: boolean
        default: false
      version:
        description: Build-only test version without v
        type: string
        required: true
        default: '0.0.0'
      purpose:
        description: Diagnostic scope
        type: choice
        options: [smoke, integration]
        default: integration
        required: true
      production_signer:
        description: Integrated deployment with real Signer and CRL enforcement in a disposable runner
        type: boolean
        default: true
      terminal:
        description: Terminal lifecycle (uninstall never revokes the node)
        type: choice
        options: [revocation, uninstall]
        default: revocation
      ocserv_package:
        description: Native ocserv for the disposable runner (backport-1.5.0 also requires real session terminate)
        type: choice
        options: [distribution, backport-1.5.0]
        default: distribution
permissions:
  contents: read
concurrency:
  group: release-diagnostics-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  business:
    uses: ./.github/workflows/release-business-diagnostic.yml
    with:
      version: ${{ inputs.version }}
      run-resilience: ${{ inputs.run-resilience }}
      profile: ${{ (inputs.purpose == 'integration') && 'extended' || 'smoke' }}
      production_signer: ${{ inputs.production_signer }}
      ocserv_package: ${{ inputs.ocserv_package }}
      terminal: ${{ inputs.terminal }}
