name: Release Diagnostics
on:
  workflow_dispatch:
    inputs:
      run-resilience:
        description: Run finite single-instance recovery
        type: boolean
        default: false
      version:
        description: Build-only test version without v
        type: string
        required: true
        default: '0.0.0'
      purpose:
        description: Diagnostic scope
        type: choice
        options: [smoke, integration]
        default: integration
        required: true
      production_signer:
        description: Integrated deployment with real Signer and CRL enforcement in a disposable runner
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-diagnostics-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  business:
    uses: ./.github/workflows/release-business-diagnostic.yml
    with:
      version: ${{ inputs.version }}
      run-resilience: ${{ inputs.run-resilience }}
      profile: ${{ (inputs.production_signer || inputs.purpose == 'integration') && 'extended' || 'smoke' }}
      production_signer: ${{ inputs.production_signer }}
