name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Build-only test version without v; this dispatch never publishes
        type: string
        required: true
        default: '0.0.0'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          TEST_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT" == push ]]; then
            [[ "$TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+(-rc[.][1-9][0-9]*)?$ ]]
            version="${TAG#v}"
          else
            version="$TEST_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+(-rc[.][1-9][0-9]*)?$ ]]
          is_prerelease=false
          [[ "$version" =~ -rc[.][1-9][0-9]*$ ]] && is_prerelease=true
          echo "is_prerelease=$is_prerelease" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
  build-amd64:
    needs: prepare
    uses: ./.github/workflows/release-products.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      arch: amd64
  build-arm64:
    needs: prepare
    uses: ./.github/workflows/release-products.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      arch: arm64
  assets:
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7
        with:
          pattern: agent-packages-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Prepare ordinary deployment configuration and bootstrap assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ASSET_DIR: ${{ runner.temp }}/assets
        run: |
          scripts/bootstrap.sh npm-security
          source scripts/env.sh
          scripts/prepare-bootstrap-release-assets.sh "$ASSET_DIR" "v$VERSION"
          source_commit="$(git rev-parse HEAD)"
          for arch in amd64 arm64; do
            args=()
            for name in gateway control transport backup edge relay signer mysql_backup; do
              args+=(--image "$name=ghcr.io/gentlekingson/ocservia/$name:v$VERSION")
            done
            node scripts/generate-controller-release-manifest.mjs \
              --output "$ASSET_DIR/controller-release-$arch.json" --manifest-version 2 \
              --release-version "$VERSION" --release-tag "v$VERSION" --source-commit "$source_commit" \
              --platform "linux/$arch" "${args[@]}" \
              --image postgres=docker.io/library/postgres@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af \
              --image otel=docker.io/otel/opentelemetry-collector@sha256:0c066d4388070dad8dc9961d9f23649e85a226620e6b359334e4a6c7f9d73b23
          done
          cp "$ASSET_DIR/controller-release-amd64.json" "$ASSET_DIR/controller-release.json"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm cpio
          scripts/validate-release-packages.sh
          python3 scripts/publish-release.py check-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [prepare, build-amd64, build-arm64, assets]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: release-publishing
      deployment: false
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Require successful Release Check for the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          source_commit="$(git rev-parse HEAD)"
          tag_commit="$(gh api "repos/$GH_REPO/commits/tags/$GITHUB_REF_NAME" --jq '.sha')"
          if [[ "$source_commit" != "$GITHUB_SHA" || "$tag_commit" != "$source_commit" ]]; then
            echo 'Release tag no longer matches the build commit' >&2
            exit 1
          fi
          runs="$(gh api --paginate --slurp \
            "repos/$GH_REPO/actions/workflows/release-check.yml/runs?head_sha=$source_commit&branch=main&event=workflow_dispatch&per_page=100")"
          # A newer failed or unfinished qualification must not reuse an older PASS.
          qualification="$(jq -ce --arg sha "$source_commit" '
            [.[].workflow_runs[]] | max_by(.run_number) |
            select(.head_sha == $sha and .head_branch == "main" and
              .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success")
          ' <<<"$runs")" || {
            echo "No successful latest Release Check on main for $source_commit" >&2
            exit 1
          }
          printf 'Release Check: %s (SHA: %s)\n' \
            "$(jq -r '.html_url' <<<"$qualification")" "$source_commit" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7
        with:
          pattern: controller-images-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assets
      - name: Reject existing Release and image version tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/publish-release.py preflight
      - name: Select Release notes base
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ "$VERSION" =~ -rc[.]([1-9][0-9]*)$ && "${BASH_REMATCH[1]}" != 1 ]]; then
            previous="$(python3 -c 'import sys; print(int(sys.argv[1]) - 1)' "${BASH_REMATCH[1]}")"
            base="v${VERSION%-rc.*}-rc.$previous"
            gh release view "$base" --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == true' | grep -qx true
          else
            # Exclude this release on reruns; do not use an RC as the final's base.
            base="$(gh release list --exclude-drafts --exclude-pre-releases --limit 2 \
              --json tagName --jq "[.[] | select(.tagName != \"v$VERSION\")][0].tagName // empty")"
            [[ "$base" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
          fi
          echo "base=$base" >>"$GITHUB_OUTPUT"
      - name: Create new draft Release
        env:
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
          NOTES_BASE: ${{ steps.notes.outputs.base }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--notes-start-tag "$NOTES_BASE")
          if [[ "$NOTES_BASE" == v1.1.0 ]]; then
            flags+=(--notes "$(gh api "repos/$GH_REPO/contents/.github/release-notes/v1.1.0-history-rewrite.md?ref=$GITHUB_SHA" \
              -H 'Accept: application/vnd.github.raw+json')")
          elif [[ "$VERSION" == 2.0.0-rc.2 || "$VERSION" == 2.0.0-rc.3 || "$VERSION" == 2.0.0-rc.4 ]]; then
            notes_file=".github/release-notes/v$VERSION.md"
            test -s "$notes_file"
            flags+=(--notes "$(cat "$notes_file")")
          fi
          if [[ "$IS_PRERELEASE" == true ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --verify-tag --title "v$VERSION" --generate-notes "${flags[@]}"

          # Preserve GitHub's category, PR and comparison output; drop repeated owner attribution only.
          notes_before="$RUNNER_TEMP/release-notes-before.md"
          notes_after="$RUNNER_TEMP/release-notes-after.md"
          gh release view "v$VERSION" --json body --jq '.body' >"$notes_before"
          python3 scripts/strip-release-owner-attribution.py <"$notes_before" >"$notes_after"
          if ! cmp -s "$notes_before" "$notes_after"; then
            gh release edit "v$VERSION" --notes-file "$notes_after"
          fi
      - name: Upload, verify and publish immutable Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/publish-release.py finish
