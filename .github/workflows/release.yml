name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release build v{0}', inputs.version) || format('Publish {0}', github.ref_name) }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Build-only version without v; this dispatch never publishes
        type: string
        required: true
        default: '0.0.0'
      expected_sha:
        description: Expected main commit when dispatched by Release Check
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: release-perf-${{ github.event_name == 'workflow_dispatch' && format('build-{0}-{1}', github.sha, inputs.version) || github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      qualification_id: ${{ steps.qualify-release.outputs.qualification_id }}
      build_run_id: ${{ steps.qualify-release.outputs.build_run_id }}
      controller_amd64_id: ${{ steps.qualify-release.outputs.controller_amd64_id }}
      controller_amd64_sha256: ${{ steps.qualify-release.outputs.controller_amd64_sha256 }}
      controller_arm64_id: ${{ steps.qualify-release.outputs.controller_arm64_id }}
      controller_arm64_sha256: ${{ steps.qualify-release.outputs.controller_arm64_sha256 }}
      assets_id: ${{ steps.qualify-release.outputs.assets_id }}
    steps:
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          TEST_VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ "$EVENT" == push ]]; then
            [[ "$TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+(-rc[.][1-9][0-9]*)?$ ]]
            version="${TAG#v}"
          else
            version="$TEST_VERSION"
            if [[ -n "$EXPECTED_SHA" ]]; then
              test "$GITHUB_REF" = refs/heads/main
              test "$GITHUB_SHA" = "$EXPECTED_SHA"
            fi
          fi
          [[ "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+(-rc[.][1-9][0-9]*)?$ ]]
          is_prerelease=false
          [[ "$version" =~ -rc[.][1-9][0-9]*$ ]] && is_prerelease=true
          echo "is_prerelease=$is_prerelease" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require a successful Release Check and available build artifacts
        id: qualify-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/publish-release.py qualify
  build-amd64:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    uses: ./.github/workflows/release-products.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      arch: amd64
      run_rc_lifecycle: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
  build-arm64:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    uses: ./.github/workflows/release-products.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      arch: arm64
      run_rc_lifecycle: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
  assets:
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download and verify amd64 Agent packages
        uses: ./.github/actions/download-release-product
        with:
          artifact-id: ${{ needs.build-amd64.outputs.agent_packages_artifact_id }}
          manifest-sha256: ${{ needs.build-amd64.outputs.agent_packages_manifest_sha256 }}
          kind: agent
          version: ${{ needs.prepare.outputs.version }}
          arch: amd64
          path: ${{ runner.temp }}/agent-amd64
      - name: Download and verify arm64 Agent packages
        uses: ./.github/actions/download-release-product
        with:
          artifact-id: ${{ needs.build-arm64.outputs.agent_packages_artifact_id }}
          manifest-sha256: ${{ needs.build-arm64.outputs.agent_packages_manifest_sha256 }}
          kind: agent
          version: ${{ needs.prepare.outputs.version }}
          arch: arm64
          path: ${{ runner.temp }}/agent-arm64
      - name: Prepare bootstrap and package assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ASSET_DIR: ${{ runner.temp }}/assets
        run: |
          mkdir -p "$ASSET_DIR"
          for arch in amd64 arm64; do
            find "$RUNNER_TEMP/agent-$arch" -maxdepth 1 -type f ! -name 'product-identity.json' -exec mv -- {} "$ASSET_DIR/" +
          done
          scripts/prepare-bootstrap-release-assets.sh "$ASSET_DIR" "v$VERSION"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm cpio
          scripts/validate-release-packages.sh
      - name: Check pre-publication asset inventory
        id: check-assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/publish-release.py check-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: upload
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          retention-days: 7
      - name: Record the verified build artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          AGENT_AMD64_ID: ${{ needs.build-amd64.outputs.agent_packages_artifact_id }}
          AGENT_AMD64_SHA256: ${{ needs.build-amd64.outputs.agent_packages_manifest_sha256 }}
          AGENT_ARM64_ID: ${{ needs.build-arm64.outputs.agent_packages_artifact_id }}
          AGENT_ARM64_SHA256: ${{ needs.build-arm64.outputs.agent_packages_manifest_sha256 }}
          CONTROLLER_AMD64_ID: ${{ needs.build-amd64.outputs.controller_images_artifact_id }}
          CONTROLLER_AMD64_SHA256: ${{ needs.build-amd64.outputs.controller_images_manifest_sha256 }}
          CONTROLLER_ARM64_ID: ${{ needs.build-arm64.outputs.controller_images_artifact_id }}
          CONTROLLER_ARM64_SHA256: ${{ needs.build-arm64.outputs.controller_images_manifest_sha256 }}
          ASSETS_ID: ${{ steps.upload.outputs.artifact-id }}
          ASSETS_SHA256: ${{ steps.upload.outputs.artifact-digest }}
        run: python3 scripts/release_evidence.py record-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-build.json
          if-no-files-found: error
          retention-days: 7
  security:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/security.yml
  business:
    name: Business Smoke (amd64)
    needs: [build-amd64, assets, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ inputs.version }}
      CONTROLLER_ARCH: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-release-product
        with:
          artifact-id: ${{ needs.build-amd64.outputs.agent_packages_artifact_id }}
          manifest-sha256: ${{ needs.build-amd64.outputs.agent_packages_manifest_sha256 }}
          kind: agent
          version: ${{ inputs.version }}
          arch: amd64
          path: ${{ runner.temp }}/business-packages
      - uses: ./.github/actions/download-release-product
        with:
          artifact-id: ${{ needs.build-amd64.outputs.controller_images_artifact_id }}
          manifest-sha256: ${{ needs.build-amd64.outputs.controller_images_manifest_sha256 }}
          kind: controller
          version: ${{ inputs.version }}
          arch: amd64
          path: ${{ runner.temp }}/business-controller-images
      - uses: ./.github/actions/setup-tools
        with:
          profiles: npm-security
          cache-npm: 'true'
      - name: Exercise Integrated Business Smoke with candidate products
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/business-diagnostics
          PRODUCTS_DIR: ${{ runner.temp }}/business-packages
          IMAGES_DIR: ${{ runner.temp }}/business-controller-images
        run: |
          sudo --preserve-env=ARTIFACT_DIR,VERSION,GITHUB_ACTIONS,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_ENVIRONMENT,RUNNER_ARCH,CONTROLLER_ARCH,PRODUCTS_DIR,IMAGES_DIR \
            bash scripts/release-business-probe.sh
      - name: Return task-owned diagnostics and caches to the runner
        if: always()
        run: |
          for path in "$RUNNER_TEMP/business-diagnostics" .cache .tools web/node_modules; do
            if [[ -d "$path" && ! -L "$path" ]]; then
              sudo chown -R -- "$(id -u):$(id -g)" "$path"
            fi
          done
      - name: Summarize business timings and sanitized failures
        if: always()
        env:
          DIAGNOSTICS: ${{ runner.temp }}/business-diagnostics
        run: |
          if [[ -f "$DIAGNOSTICS/result.json" ]]; then
            jq '{probe_status,last_stage,exit_code,timings,scenario_timings,resilience_scenarios}' "$DIAGNOSTICS/result.json"
          fi
          if [[ -f "$DIAGNOSTICS/api-checkpoints.jsonl" ]]; then
            jq -c 'select(.name == "real_vpn_relay_recovery" or .name == "resilience_relay") | {name,time,status}' "$DIAGNOSTICS/api-checkpoints.jsonl"
          fi
          if [[ -f "$DIAGNOSTICS/probe.log" ]]; then
            grep -E '^(RuntimeError:|AssertionError|probe failed at line)' "$DIAGNOSTICS/probe.log" || true
          fi
      - name: Require completed business and recovery scenarios
        env:
          DIAGNOSTICS: ${{ runner.temp }}/business-diagnostics
        run: |
          test -s "$DIAGNOSTICS/probe.log"
          if grep -rIEq '(obt2_[A-Za-z0-9_-]{43}|oit1_[A-Za-z0-9_-]+\.[A-Za-z0-9_-]{43})' "$DIAGNOSTICS"; then
            echo 'diagnostics contain a node bootstrap token' >&2
            exit 1
          fi
          jq -e '
            . as $result |
            .profile == "smoke" and .terminal == "revocation" and
            .probe_status == "PASS" and .exit_code == 0 and
            (.timings | type == "array" and length > 0) and
            ([
              "integrated_entry_and_internal_tls",
              "production_signer_active_binding",
              "bootstrap_token_enrollment_and_rerun_identity",
              "real_browser_subset",
              "config_apply_and_vpn_user",
              "real_vpn_after_config_apply",
              "real_node_revocation_and_disconnect"
            ] - .passed_checkpoints | length) == 0 and
            .resilience_requested == true and
            .resilience_result == "PASS" and
            .planned_topology.native_systemd_node == true and
            (.resilience_scenarios | type == "array") and
            all(["controller", "agent", "database", "relay"][];
              . as $name |
              ([$result.resilience_scenarios[] | select(.name == "resilience_" + $name)] | length == 1 and .[0].status == "PASS"))
          ' "$DIAGNOSTICS/result.json" >/dev/null
          jq -se 'any(.[]; .name == "production_signer_password_sealed" and .status == "PASS")' \
            "$DIAGNOSTICS/api-checkpoints.jsonl" >/dev/null
          jq -se 'any(.[]; .name == "resilience_relay" and .status == "PASS" and .offline_queued_zero_side_effects == true and .idempotent_replay == true)' \
            "$DIAGNOSTICS/api-checkpoints.jsonl" >/dev/null
      - name: Preserve business timings and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: business-smoke-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/business-diagnostics
          if-no-files-found: warn
          retention-days: 7

  quick:
    name: Quick Install (Pebble ACME, amd64)
    needs: [build-amd64, assets, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-release-product
        with:
          artifact-id: ${{ needs.build-amd64.outputs.controller_images_artifact_id }}
          manifest-sha256: ${{ needs.build-amd64.outputs.controller_images_manifest_sha256 }}
          kind: controller
          version: ${{ inputs.version }}
          arch: amd64
          path: ${{ runner.temp }}/quick-controller-images
      - name: Quick install, rerun, upgrade and rollback against Pebble
        env:
          IMAGES_DIR: ${{ runner.temp }}/quick-controller-images
          VERSION: ${{ inputs.version }}
          CONTROLLER_ARCH: amd64
        run: |
          sudo --preserve-env=VERSION,CONTROLLER_ARCH,RUNNER_ARCH,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,IMAGES_DIR \
            bash scripts/release-quick-acceptance.sh
