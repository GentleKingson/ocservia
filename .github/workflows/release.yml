name: Agent Release Packages
run-name: Agent Packages · ${{ github.event.release.tag_name || inputs.version || github.sha }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to build (SemVer, no leading v); dispatch always stays a dry run"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.event.release.id || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"

jobs:
  build-agent-packages:
    name: Build & Smoke Agent Packages (${{ matrix.package_arch }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_arch: amd64
            runs_on: ubuntu-24.04
          - package_arch: arm64
            runs_on: ubuntu-24.04-arm
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify runner prerequisites
        run: scripts/ci-preflight.sh
      - name: Restore native-package tool cache
        id: native-package-tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: tooling-v4-native-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh') }}
      - name: Bootstrap pinned Rust and nfpm tools
        run: scripts/bootstrap.sh native-packages
      - name: Resolve package version & source epoch
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version=""
          if [[ -n "${RELEASE_TAG}" ]]; then
            if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "refusing to build release packages for non-SemVer tag ${RELEASE_TAG}" >&2
              exit 1
            fi
            version="${RELEASE_TAG#v}"
          else
            version="${INPUT_VERSION}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "dispatch version must be plain SemVer without a leading v, got ${version}" >&2
              exit 1
            fi
          fi
          {
            echo "version=${version}"
            echo "source_date_epoch=$(git log -1 --format=%ct)"
          } >>"${GITHUB_ENV}"
      - name: Create ephemeral dry-run signing key
        run: |
          key_file="${RUNNER_TEMP}/release-signing.key"
          # Every build is a dry run from the signing perspective: the
          # production release key is loaded only by the release-only
          # publish job, which re-signs the packages for release events.
          echo "signing with an ephemeral dry-run key; release publishing re-signs with the release key" >&2
          openssl genpkey -algorithm ED25519 -out "${key_file}" >/dev/null 2>&1
          chmod 0600 "${key_file}"
          echo "release_signing_key=${key_file}" >>"${GITHUB_ENV}"
      - name: Build native Agent / privd / upgrader binaries
        run: |
          # shellcheck source=scripts/env.sh
          # shellcheck disable=SC1091
          source scripts/env.sh
          cd rust
          # The published package version is the binaries' release identity:
          # the Agent heartbeat and the upgrade downgrade fence both compare
          # against it, so it must be embedded at compile time.
          OCSERV_AGENT_RELEASE_VERSION="${version}" \
            cargo build --locked --release \
            --package ocservia-agent --package ocservia-privd --package ocservia-upgrader
      - name: Save native-package tool cache
        if: ${{ success() && steps.native-package-tools-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: ${{ steps.native-package-tools-cache.outputs.cache-primary-key }}
      - name: Build tar / deb / rpm package set
        run: |
          # shellcheck source=scripts/env.sh
          # shellcheck disable=SC1091
          source scripts/env.sh
          package_dir="${RUNNER_TEMP}/packages"
          mkdir -p "${package_dir}"
          OUTPUT_DIR="${package_dir}" AGENT_SIGNING_KEY="${release_signing_key}" \
            VERSION="${version}" PACKAGE_ARCH="${{ matrix.package_arch }}" \
            SOURCE_DATE_EPOCH="${source_date_epoch}" \
            scripts/package-agent.sh >/dev/null
          openssl pkey -in "${release_signing_key}" -pubout -out "${RUNNER_TEMP}/release-signing.pub.pem" >/dev/null 2>&1
          fingerprint="$(openssl pkey -pubin -in "${RUNNER_TEMP}/release-signing.pub.pem" \
            -outform DER | sha256sum | awk '{print $1}')"
          OUTPUT_DIR="${package_dir}" VERSION="${version}" PACKAGE_ARCH="${{ matrix.package_arch }}" \
            SOURCE_DATE_EPOCH="${source_date_epoch}" \
            AGENT_TRUSTED_KEY_SHA256="${fingerprint}" \
            scripts/package-native-agent.sh >/dev/null
          ls -l "${package_dir}"
      - name: Validate native package lifecycle (${{ matrix.package_arch }})
        env:
          RUN_ID: release-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.package_arch }}
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts/native-smoke
        run: scripts/release-native-package-smoke.sh
      - name: Validate upgrade from published baseline (${{ matrix.package_arch }})
        env:
          RUN_ID: release-baseline-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.package_arch }}
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts/native-smoke
          VERSION: ${{ env.version }}
          CANDIDATE_DEB: ${{ runner.temp }}/packages/ocservia-agent_${{ env.version }}_${{ matrix.package_arch }}.deb
        run: scripts/release-baseline-upgrade-smoke.sh
      - name: Upload package set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-packages-${{ matrix.package_arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packages/*
          retention-days: 7
          if-no-files-found: error
      - name: Upload native smoke diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-smoke-${{ matrix.package_arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/native-smoke
          retention-days: 7
          if-no-files-found: warn
      - name: Remove release signing key
        if: always()
        run: rm -f -- "${release_signing_key}" "${RUNNER_TEMP}/release-signing.pub.pem"

  build-controller-images:
    name: Build Controller Images (${{ matrix.controller_arch }})
    if: github.event_name == 'release'
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - controller_arch: amd64
            runs_on: ubuntu-24.04
          - controller_arch: arm64
            runs_on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      BUILDX_BUILDER: controller-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.controller_arch }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify runner prerequisites
        run: scripts/ci-preflight.sh
      - name: Resolve release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing to build Controller images for non-SemVer tag ${RELEASE_TAG}" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          source_commit="$(git rev-parse HEAD)"
          if [[ ! "${source_commit}" =~ ^[0-9a-f]{40}$ || "${source_commit}" != "${GITHUB_SHA}" ]]; then
            echo "checked out source does not match the release commit ${GITHUB_SHA}" >&2
            exit 1
          fi
          {
            echo "release_tag=${RELEASE_TAG}"
            echo "version=${version}"
            echo "source_commit=${source_commit}"
          } >>"${GITHUB_ENV}"
      - name: Prepare pinned BuildKit builder
        run: |
          set -euo pipefail
          docker buildx create \
            --driver docker-container \
            --driver-opt "image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8" \
            --name "${BUILDX_BUILDER}" \
            --bootstrap \
            --use
      # Each leg builds natively (no QEMU) and exports an OCI archive per
      # image. Nothing is written to GHCR here: the legs hold only source
      # read, and every production registry write happens inside the single
      # reviewer-gated publish job.
      - name: Build Controller images
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/controller-images"
          mkdir -p "${output_dir}"
          build_image() {
            local name="$1" dockerfile="$2" archive metadata
            local -a build_args=(
              --builder "${BUILDX_BUILDER}"
              --platform "linux/${{ matrix.controller_arch }}"
              --provenance=false
              --pull
              --output "type=oci,dest=${output_dir}/${name}-linux-${{ matrix.controller_arch }}.tar"
              --metadata-file "${RUNNER_TEMP}/controller-${name}.metadata.json"
              --label "org.opencontainers.image.version=${version}"
              --label "org.opencontainers.image.revision=${source_commit}"
              --tag "ghcr.io/gentlekingson/ocservia/${name}:${version}-linux-${{ matrix.controller_arch }}"
              --file "${dockerfile}"
            )
            metadata="${RUNNER_TEMP}/controller-${name}.metadata.json"
            if [[ "${name}" == control ]]; then
              build_args+=(--build-arg "VERSION=${version}" --build-arg "COMMIT=${source_commit}")
            fi
            docker buildx build "${build_args[@]}" "${GITHUB_WORKSPACE}"
            archive="${output_dir}/${name}-linux-${{ matrix.controller_arch }}.tar"
            [[ -s "${archive}" ]] || {
              echo "Controller image archive is missing or empty: ${archive}" >&2
              exit 1
            }
            jq -er '."containerimage.digest" | strings | select(test("^sha256:[0-9a-f]{64}$"))' "${metadata}" >/dev/null
          }
          build_image gateway deploy/production/gateway.Dockerfile
          build_image control control-plane/Dockerfile
          build_image transport rust/transportd.Dockerfile
          build_image backup deploy/production/backup.Dockerfile
      - name: Upload Controller image archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: controller-images-${{ matrix.controller_arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/controller-images/*.tar
          retention-days: 7
          if-no-files-found: error
      - name: Remove Controller BuildKit builder
        if: always()
        run: docker buildx rm "${BUILDX_BUILDER}" >/dev/null 2>&1 || true

  validate-release-packages:
    name: Validate Multi-Arch Package Set
    needs: build-agent-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify runner prerequisites
        run: scripts/ci-preflight.sh
      - name: Install rpm inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rpm cpio
      - name: Collect built packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7
        with:
          pattern: agent-packages-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Resolve package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version=""
          if [[ -n "${RELEASE_TAG}" ]]; then
            version="${RELEASE_TAG#v}"
          else
            version="${INPUT_VERSION}"
          fi
          echo "version=${version}" >>"${GITHUB_ENV}"
      - name: Validate both architecture package sets
        run: |
          # No production pin here: a dispatch build validates the internal
          # consistency of the ephemeral-signed set only. The release pin is
          # enforced by the release-only publish job.
          ls -l "${RUNNER_TEMP}/assets"
          WRITE_SHA256SUMS=1 ASSET_DIR="${RUNNER_TEMP}/assets" VERSION="${version}" \
            scripts/validate-release-packages.sh

  publish-release-packages:
    name: Sign & Publish Release Assets
    needs: [validate-release-packages, build-controller-images]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release-publishing
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      CONTROLLER_IMAGE_PREFIX: ghcr.io/gentlekingson/ocservia
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify runner prerequisites
        run: scripts/ci-preflight.sh
      - name: Install rpm inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rpm cpio
      - name: Collect built packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7
        with:
          pattern: agent-packages-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Collect Controller image archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7
        with:
          pattern: controller-images-*
          path: ${{ runner.temp }}/controller-images
          merge-multiple: true
      - name: Resolve package version & source epoch
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing to publish release packages for non-SemVer tag ${RELEASE_TAG}" >&2
            exit 1
          fi
          {
            echo "version=${RELEASE_TAG#v}"
            echo "release_tag=${RELEASE_TAG}"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "source_date_epoch=$(git log -1 --format=%ct)"
          } >>"${GITHUB_ENV}"
      - name: Restore native-package tool cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: tooling-v4-native-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh') }}
      - name: Bootstrap pinned nfpm tool
        run: scripts/bootstrap.sh native-packages
      - name: Login to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      # First production registry write of the release: everything before this
      # job ran source-only, so the reviewer approves the exact images and
      # packages that are about to become public.
      - name: Push Controller images & assemble multi-platform indexes
        id: controller-index
        run: |
          set -euo pipefail
          images_dir="${RUNNER_TEMP}/controller-images"
          output_dir="${RUNNER_TEMP}/controller-release"
          mkdir -p "${output_dir}"
          for name in gateway control transport backup; do
            refs=()
            for arch in amd64 arm64; do
              archive="${images_dir}/${name}-linux-${arch}.tar"
              [[ -s "${archive}" ]] || {
                echo "Controller image archive is missing or empty: ${archive}" >&2
                exit 1
              }
              # The build legs baked this tag into the archive; loading
              # restores it, and the per-arch companion tag stays in GHCR as
              # the visible composition input of the final index.
              arch_tag="${CONTROLLER_IMAGE_PREFIX}/${name}:${version}-linux-${arch}"
              docker load --input "${archive}" >/dev/null
              docker image inspect "${arch_tag}" >/dev/null 2>&1 || {
                echo "loaded Controller image archive did not restore ${arch_tag}" >&2
                exit 1
              }
              push_output="$(docker push "${arch_tag}")"
              digest="$(grep -oE 'digest: sha256:[0-9a-f]{64}' <<<"${push_output}" | head -1 | cut -d' ' -f2)"
              if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "could not read the pushed digest for ${arch_tag}" >&2
                exit 1
              fi
              refs+=("${CONTROLLER_IMAGE_PREFIX}/${name}@${digest}")
            done
            docker buildx imagetools create \
              --tag "${CONTROLLER_IMAGE_PREFIX}/${name}:${release_tag}" \
              --tag "${CONTROLLER_IMAGE_PREFIX}/${name}:${version}" \
              "${refs[0]}" \
              "${refs[1]}"
            image_ref="${CONTROLLER_IMAGE_PREFIX}/${name}:${release_tag}"
            index_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${image_ref}")"
            if [[ ! "${index_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "could not read a valid index digest for ${name}: ${index_digest:-<empty>}" >&2
              exit 1
            fi
            platforms="$(docker buildx imagetools inspect --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}}{{"\n"}}{{end}}' "${image_ref}" | sort -u)"
            grep -Fxq 'linux/amd64' <<<"${platforms}" || {
              echo "Controller image index for ${name} is missing linux/amd64" >&2
              exit 1
            }
            grep -Fxq 'linux/arm64' <<<"${platforms}" || {
              echo "Controller image index for ${name} is missing linux/arm64" >&2
              exit 1
            }
            printf '%s\t%s\n' "${name}" "${CONTROLLER_IMAGE_PREFIX}/${name}@${index_digest}" >>"${output_dir}/image-refs.tsv"
            printf '%s_digest=%s\n' "${name}" "${index_digest}" >>"${GITHUB_OUTPUT}"
          done
      - name: Generate Controller release manifests
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/controller-release"
          image_ref() {
            awk -F '\t' -v name="$1" '$1 == name { print $2 }' "${output_dir}/image-refs.tsv"
          }
          for platform in amd64 arm64; do
            scripts/generate-controller-release-manifest.mjs \
              --output "${output_dir}/controller-release-${platform}.json" \
              --platform "linux/${platform}" \
              --release-version "${version}" \
              --release-tag "${release_tag}" \
              --source-commit "${source_commit}" \
              --migration-dir control-plane/migrations \
              --image "gateway=$(image_ref gateway)" \
              --image "control=$(image_ref control)" \
              --image "transport=$(image_ref transport)" \
              --image "backup=$(image_ref backup)" \
              --image "postgres=docker.io/library/postgres@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f" \
              --image "otel=docker.io/otel/opentelemetry-collector@sha256:0c066d4388070dad8dc9961d9f23649e85a226620e6b359334e4a6c7f9d73b23"
          done
          # Compatibility alias: existing amd64 operators keep consuming
          # controller-release.json unchanged.
          cp -- "${output_dir}/controller-release-amd64.json" "${output_dir}/controller-release.json"
          cd "${output_dir}"
          sha256sum controller-release.json >controller-release.json.sha256
          sha256sum controller-release-amd64.json >controller-release-amd64.json.sha256
          sha256sum controller-release-arm64.json >controller-release-arm64.json.sha256
          cp -- controller-release.json controller-release.json.sha256 \
            controller-release-amd64.json controller-release-amd64.json.sha256 \
            controller-release-arm64.json controller-release-arm64.json.sha256 \
            "${RUNNER_TEMP}/assets/"
      - name: Verify anonymous Controller image reads
        env:
          GATEWAY_DIGEST: ${{ steps.controller-index.outputs.gateway_digest }}
          CONTROL_DIGEST: ${{ steps.controller-index.outputs.control_digest }}
          TRANSPORT_DIGEST: ${{ steps.controller-index.outputs.transport_digest }}
          BACKUP_DIGEST: ${{ steps.controller-index.outputs.backup_digest }}
        run: |
          set -euo pipefail
          for image in \
            "gateway=${GATEWAY_DIGEST}" \
            "control=${CONTROL_DIGEST}" \
            "transport=${TRANSPORT_DIGEST}" \
            "backup=${BACKUP_DIGEST}"; do
            name="${image%%=*}"
            digest="${image#*=}"
            token="$(curl --fail --silent --show-error --get \
              --data-urlencode 'service=ghcr.io' \
              --data-urlencode "scope=repository:gentlekingson/ocservia/${name}:pull" \
              'https://ghcr.io/token' \
              | jq -er '(.token // .access_token) | strings | select(length > 0)')"
            curl --fail --silent --show-error --head \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
              --header "Authorization: Bearer ${token}" \
              "https://ghcr.io/v2/gentlekingson/ocservia/${name}/manifests/${digest}" \
              >/dev/null
          done
      - name: Attest gateway image provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.CONTROLLER_IMAGE_PREFIX }}/gateway
          subject-digest: ${{ steps.controller-index.outputs.gateway_digest }}
          push-to-registry: true
      - name: Attest control image provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.CONTROLLER_IMAGE_PREFIX }}/control
          subject-digest: ${{ steps.controller-index.outputs.control_digest }}
          push-to-registry: true
      - name: Attest transport image provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.CONTROLLER_IMAGE_PREFIX }}/transport
          subject-digest: ${{ steps.controller-index.outputs.transport_digest }}
          push-to-registry: true
      - name: Attest backup image provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.CONTROLLER_IMAGE_PREFIX }}/backup
          subject-digest: ${{ steps.controller-index.outputs.backup_digest }}
          push-to-registry: true
      - name: Load release signing key
        env:
          AGENT_SIGNING_KEY_SECRET: ${{ secrets.AGENT_SIGNING_KEY }}
        run: |
          if [[ -z "${AGENT_SIGNING_KEY_SECRET}" ]]; then
            echo "AGENT_SIGNING_KEY secret is required to publish release packages" >&2
            exit 1
          fi
          key_file="${RUNNER_TEMP}/release-signing.key"
          printf '%s\n' "${AGENT_SIGNING_KEY_SECRET}" >"${key_file}"
          chmod 0600 "${key_file}"
          echo "release_signing_key=${key_file}" >>"${GITHUB_ENV}"
      - name: Re-sign archives & rebuild installers
        run: |
          # The build jobs only ever sign with an ephemeral key. The release
          # set that reaches hosts must chain to the release key, so re-sign
          # both checksum triples with it and rebuild the native packages
          # around them with the release trust anchor embedded.
          # shellcheck source=scripts/env.sh
          # shellcheck disable=SC1091
          source scripts/env.sh
          fingerprint="$(openssl pkey -in "${release_signing_key}" -pubout -outform DER \
            | sha256sum | awk '{print $1}')"
          for package_arch in amd64 arm64; do
            archive="${RUNNER_TEMP}/assets/ocservia-agent-${version}-linux-${package_arch}.tar.gz"
            openssl pkeyutl -sign -rawin -inkey "${release_signing_key}" \
              -in "${archive}.sha256" -out "${archive}.sha256.sig"
            openssl pkey -in "${release_signing_key}" -pubout \
              -out "${archive}.sha256.pub.pem" >/dev/null 2>&1
            OUTPUT_DIR="${RUNNER_TEMP}/assets" VERSION="${version}" PACKAGE_ARCH="${package_arch}" \
              SOURCE_DATE_EPOCH="${source_date_epoch}" \
              AGENT_TRUSTED_KEY_SHA256="${fingerprint}" \
              scripts/package-native-agent.sh >/dev/null
          done
      - name: Validate package set against the pinned release key
        env:
          AGENT_TRUSTED_KEY_SHA256: ${{ secrets.AGENT_TRUSTED_KEY_SHA256 }}
        run: |
          CONTROLLER_RELEASE_MANIFEST_REQUIRED=1 WRITE_SHA256SUMS=1 \
            ASSET_DIR="${RUNNER_TEMP}/assets" VERSION="${version}" \
            scripts/validate-release-packages.sh
      - name: Sign unified checksum manifest
        run: |
          openssl pkeyutl -sign -rawin -inkey "${release_signing_key}" \
            -in "${RUNNER_TEMP}/assets/SHA256SUMS" \
            -out "${RUNNER_TEMP}/assets/SHA256SUMS.sig"
          openssl pkey -in "${release_signing_key}" -pubout \
            -out "${RUNNER_TEMP}/assets/release-signing.pub.pem" >/dev/null 2>&1
      - name: Verify signed release manifest
        run: |
          CONTROLLER_RELEASE_MANIFEST_REQUIRED=1 ASSET_DIR="${RUNNER_TEMP}/assets" \
            VERSION="${version}" \
            scripts/validate-release-packages.sh
      - name: Publish assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="${RUNNER_TEMP}/assets"
          gh release upload "${release_tag}" --clobber \
            "${assets}/ocservia-agent-${version}-linux-amd64.tar.gz" \
            "${assets}/ocservia-agent-${version}-linux-amd64.tar.gz.sha256" \
            "${assets}/ocservia-agent-${version}-linux-amd64.tar.gz.sha256.sig" \
            "${assets}/ocservia-agent-${version}-linux-arm64.tar.gz" \
            "${assets}/ocservia-agent-${version}-linux-arm64.tar.gz.sha256" \
            "${assets}/ocservia-agent-${version}-linux-arm64.tar.gz.sha256.sig" \
            "${assets}/ocservia-agent_${version}_amd64.deb" \
            "${assets}/ocservia-agent_${version}_arm64.deb" \
            "${assets}/ocservia-agent-${version}-1.x86_64.rpm" \
            "${assets}/ocservia-agent-${version}-1.aarch64.rpm" \
            "${assets}/controller-release.json" \
            "${assets}/controller-release.json.sha256" \
            "${assets}/controller-release-amd64.json" \
            "${assets}/controller-release-amd64.json.sha256" \
            "${assets}/controller-release-arm64.json" \
            "${assets}/controller-release-arm64.json.sha256" \
            "${assets}/SHA256SUMS" \
            "${assets}/SHA256SUMS.sig" \
            "${assets}/release-signing.pub.pem"
          gh release view "${release_tag}" --json assets --jq '.assets[].name'
      - name: Remove release signing key
        if: always()
        run: rm -f -- "${release_signing_key}"
