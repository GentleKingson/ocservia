name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Build-only test version without v; this dispatch never publishes
        type: string
        required: true
        default: '0.0.0'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          TEST_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT" == push ]]; then
            [[ "$TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
            version="${TAG#v}"
          else
            version="$TEST_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          echo "version=$version" >>"$GITHUB_OUTPUT"
  build-amd64:
    needs: prepare
    uses: ./.github/workflows/release-products.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      arch: amd64
  build-arm64:
    needs: prepare
    uses: ./.github/workflows/release-products.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      arch: arm64
  assets:
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7
        with:
          pattern: agent-packages-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Prepare ordinary deployment configuration and bootstrap assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ASSET_DIR: ${{ runner.temp }}/assets
        run: |
          scripts/bootstrap.sh npm-security
          source scripts/env.sh
          scripts/prepare-bootstrap-release-assets.sh "$ASSET_DIR"
          source_commit="$(git rev-parse HEAD)"
          for arch in amd64 arm64; do
            args=()
            for name in gateway control transport backup edge relay signer mysql_backup mariadb_backup; do
              args+=(--image "$name=ghcr.io/gentlekingson/ocservia/$name:v$VERSION")
            done
            node scripts/generate-controller-release-manifest.mjs \
              --output "$ASSET_DIR/controller-release-$arch.json" --manifest-version 2 \
              --release-version "$VERSION" --release-tag "v$VERSION" --source-commit "$source_commit" \
              --platform "linux/$arch" "${args[@]}" \
              --image postgres=docker.io/library/postgres@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f \
              --image otel=docker.io/otel/opentelemetry-collector@sha256:0c066d4388070dad8dc9961d9f23649e85a226620e6b359334e4a6c7f9d73b23
          done
          cp "$ASSET_DIR/controller-release-amd64.json" "$ASSET_DIR/controller-release.json"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm cpio
          scripts/validate-release-packages.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [prepare, build-amd64, build-arm64, assets]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release-publishing
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7
        with:
          pattern: controller-images-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assets
      - name: Publish version images and Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          prefix=ghcr.io/gentlekingson/ocservia
          for name in gateway control transport backup edge relay signer mysql_backup mariadb_backup; do
            for arch in amd64 arm64; do
              docker load --input "$RUNNER_TEMP/images/$name-linux-$arch.tar"
              docker tag "$prefix/$name:$VERSION-linux-$arch" "$prefix/$name:v$VERSION-$arch"
              docker push "$prefix/$name:v$VERSION-$arch"
            done
            docker buildx imagetools create --tag "$prefix/$name:v$VERSION" \
              "$prefix/$name:v$VERSION-amd64" "$prefix/$name:v$VERSION-arm64"
          done
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes
          fi
          gh release upload "v$VERSION" "$RUNNER_TEMP/assets/"* --clobber
