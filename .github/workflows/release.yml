name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Build-only test version without v; this dispatch never publishes
        type: string
        required: true
        default: '0.0.0'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          TEST_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT" == push ]]; then
            [[ "$TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+(-rc[.][1-9][0-9]*)?$ ]]
            version="${TAG#v}"
          else
            version="$TEST_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+(-rc[.][1-9][0-9]*)?$ ]]
          is_prerelease=false
          [[ "$version" =~ -rc[.][1-9][0-9]*$ ]] && is_prerelease=true
          echo "is_prerelease=$is_prerelease" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require successful Release Check before building
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/publish-release.py qualify
  build-amd64:
    needs: prepare
    uses: ./.github/workflows/release-products.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      arch: amd64
      run_rc_lifecycle: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.is_prerelease == 'true' }}
  build-arm64:
    needs: prepare
    uses: ./.github/workflows/release-products.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      arch: arm64
      run_rc_lifecycle: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.is_prerelease == 'true' }}
  assets:
    needs: [prepare, build-amd64, build-arm64]
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download and verify amd64 Agent packages
        uses: ./.github/actions/download-release-product
        with:
          artifact-id: ${{ needs.build-amd64.outputs.agent_packages_artifact_id }}
          manifest-sha256: ${{ needs.build-amd64.outputs.agent_packages_manifest_sha256 }}
          kind: agent
          version: ${{ needs.prepare.outputs.version }}
          arch: amd64
          path: ${{ runner.temp }}/agent-amd64
      - name: Download and verify arm64 Agent packages
        uses: ./.github/actions/download-release-product
        with:
          artifact-id: ${{ needs.build-arm64.outputs.agent_packages_artifact_id }}
          manifest-sha256: ${{ needs.build-arm64.outputs.agent_packages_manifest_sha256 }}
          kind: agent
          version: ${{ needs.prepare.outputs.version }}
          arch: arm64
          path: ${{ runner.temp }}/agent-arm64
      - name: Prepare bootstrap and package assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ASSET_DIR: ${{ runner.temp }}/assets
        run: |
          mkdir -p "$ASSET_DIR"
          for arch in amd64 arm64; do
            find "$RUNNER_TEMP/agent-$arch" -maxdepth 1 -type f ! -name 'product-identity.json' -exec mv -- {} "$ASSET_DIR/" +
          done
          scripts/prepare-bootstrap-release-assets.sh "$ASSET_DIR" "v$VERSION"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm cpio
          scripts/validate-release-packages.sh
      - name: Check pre-publication asset inventory
        id: check-assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/publish-release.py check-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: upload
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [prepare, build-amd64, build-arm64, assets]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: release-publishing
      deployment: false
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          profiles: node
      - name: Require successful Release Check for the tag commit
        id: qualify-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/publish-release.py qualify
      - name: Download and verify amd64 Controller images
        uses: ./.github/actions/download-release-product
        with:
          artifact-id: ${{ needs.build-amd64.outputs.controller_images_artifact_id }}
          manifest-sha256: ${{ needs.build-amd64.outputs.controller_images_manifest_sha256 }}
          kind: controller
          version: ${{ needs.prepare.outputs.version }}
          arch: amd64
          path: ${{ runner.temp }}/images-amd64
      - name: Download and verify arm64 Controller images
        uses: ./.github/actions/download-release-product
        with:
          artifact-id: ${{ needs.build-arm64.outputs.controller_images_artifact_id }}
          manifest-sha256: ${{ needs.build-arm64.outputs.controller_images_manifest_sha256 }}
          kind: controller
          version: ${{ needs.prepare.outputs.version }}
          arch: arm64
          path: ${{ runner.temp }}/images-arm64
      - name: Stage verified Controller image archives
        run: |
          mkdir -p "$RUNNER_TEMP/images"
          for arch in amd64 arm64; do
            mv -- "$RUNNER_TEMP/images-$arch"/*.tar "$RUNNER_TEMP/images/"
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7
        with:
          artifact-ids: ${{ needs.assets.outputs.artifact_id || 'missing' }}
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Record Docker publication runtime
        run: |
          docker version
          docker info --format 'storage={{.Driver}} driver_status={{json .DriverStatus}}'
          docker buildx version
      - name: Reject existing Release and image version tags
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/publish-release.py preflight
      - name: Select Release notes base
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ "$VERSION" =~ -rc[.]([1-9][0-9]*)$ && "${BASH_REMATCH[1]}" != 1 ]]; then
            base="$(python3 scripts/publish-release.py previous-rc)"
          else
            # Exclude this release on reruns; do not use an RC as the final's base.
            base="$(gh release list --exclude-drafts --exclude-pre-releases --limit 2 \
              --json tagName --jq "[.[] | select(.tagName != \"v$VERSION\")][0].tagName // empty")"
            [[ "$base" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
          fi
          echo "base=$base" >>"$GITHUB_OUTPUT"
      - name: Create new draft Release
        id: draft-release
        env:
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
          NOTES_BASE: ${{ steps.notes.outputs.base }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--notes-start-tag "$NOTES_BASE")
          if [[ "$IS_PRERELEASE" == true ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --verify-tag --title "v$VERSION" --generate-notes "${flags[@]}"

          # Preserve GitHub's category, PR and comparison output; drop repeated owner attribution only.
          notes_before="$RUNNER_TEMP/release-notes-before.md"
          notes_after="$RUNNER_TEMP/release-notes-after.md"
          gh release view "v$VERSION" --json body --jq '.body' >"$notes_before"
          python3 scripts/strip-release-owner-attribution.py <"$notes_before" >"$notes_after"
          if ! cmp -s "$notes_before" "$notes_after"; then
            gh release edit "v$VERSION" --notes-file "$notes_after"
          fi
      - name: Upload, verify and publish immutable Release
        id: finish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          source scripts/env.sh
          python3 scripts/publish-release.py finish
