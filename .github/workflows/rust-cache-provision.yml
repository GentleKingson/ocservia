# Provision the default-branch BuildKit cache for the shared Rust builder.
# Caches written by a pull_request workflow are bound to that PR's merge ref
# and can only be restored by re-runs of the same PR, while PR workflows can
# restore caches created on their base branch — so without this trusted
# main-branch producer every new PR would compile all third-party
# dependencies cold. This workflow only ever executes trusted main code, so
# it never violates the pull_request-only rule for PR-executing workflows,
# and it holds no secrets beyond the runner-provided Actions cache
# credentials. It is deliberately not a required check: the cache is a
# performance input, but the strict exporter below fails the solve when the
# export does not complete, so green means the cache was provisioned.
name: Rust Cache Provision

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'toolchains.lock'
      - 'scripts/checksums.txt'
      - 'scripts/bootstrap.sh'
      - 'scripts/env.sh'
      - '.github/workflows/rust-cache-provision.yml'
      - '.github/actions/g6-cache-credentials/**'
      - 'scripts/g6-buildx-cache.sh'
      - 'scripts/g6-timing.sh'
  schedule:
    # Weekly refresh guards the GitHub cache 7-day no-access eviction during
    # quiet weeks.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rust-cache-provision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provision:
    name: Provision the main Rust build cache
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILDX_BUILDER: g6-buildx-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Require main provisioning ref
        # workflow_dispatch accepts any ref, so fail closed before any
        # checkout runs untrusted repository code. Green must mean the
        # default-branch cache was provisioned.
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize provision timing diagnostics
        run: >-
          scripts/g6-timing.sh init
          "${RUNNER_TEMP}/artifacts/timing/g6-rust-provision.json"
          rust-cache-provision provision "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}"
      - name: Relay Actions cache credentials to the job environment
        # BuildKit's gha cache backend needs the runner's cache-service
        # token and URLs, but the runner injects those only into action
        # processes — plain run steps never see them (actions/runner#4325
        # is still open). This repo-owned relay action copies them into
        # the job environment for the builder preparation below. The strict
        # exporter fails the solve when they are unavailable.
        uses: ./.github/actions/g6-cache-credentials
      - name: Prepare the BuildKit cache builder
        run: |
          set -euo pipefail
          timing="${RUNNER_TEMP}/artifacts/timing/g6-rust-provision.json"
          scripts/g6-timing.sh start "${timing}" buildx_builder_prepare
          # The buildkitd container does not inherit the runner's Actions
          # cache credentials, so forward them explicitly when available.
          buildx_driver_opts=()
          if [[ "${G6_CACHE_AVAILABLE:-false}" == true ]]; then
            buildx_driver_opts+=(--driver-opt "env.ACTIONS_RUNTIME_TOKEN=${ACTIONS_RUNTIME_TOKEN}")
            if [[ -n "${ACTIONS_CACHE_URL:-}" ]]; then
              buildx_driver_opts+=(--driver-opt "env.ACTIONS_CACHE_URL=${ACTIONS_CACHE_URL}")
            fi
            if [[ -n "${ACTIONS_RESULTS_URL:-}" ]]; then
              buildx_driver_opts+=(--driver-opt "env.ACTIONS_RESULTS_URL=${ACTIONS_RESULTS_URL}")
            fi
          else
            echo "::warning::GitHub Actions cache credentials unavailable; the strict exporter will fail this run"
          fi
          docker buildx create \
            --driver docker-container \
            --driver-opt "image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8" \
            --name "${BUILDX_BUILDER}" \
            "${buildx_driver_opts[@]}" \
            --bootstrap \
            --use
          scripts/g6-timing.sh end "${timing}" buildx_builder_prepare || true
      - name: Build the workspace dependency cache
        env:
          G6_CACHE_STRICT_EXPORT: "true"
          G6_CACHE_TIMEOUT: 300s
        run: |
          set -euo pipefail
          scripts/g6-timing.sh measure \
            "${RUNNER_TEMP}/artifacts/timing/g6-rust-provision.json" \
            rust_workspace_build -- \
            scripts/g6-buildx-cache.sh g6-rust-runtime true rust-cache-provision \
              --pull=false \
              --file rust/g6-runtime.Dockerfile \
              --target g6-rust-builder .
      - name: Render provision timing diagnostics
        if: always()
        # measure appends raw records even for a failed strict solve, but
        # the JSON is only produced by an explicit render; a failure exits
        # the build step before any trailing render could run.
        run: |
          scripts/g6-timing.sh render \
            "${RUNNER_TEMP}/artifacts/timing/g6-rust-provision.json"
      - name: Upload provision timing diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g6-timing-rust-provision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/timing/g6-rust-provision.json
          if-no-files-found: warn
          retention-days: 5
      - name: Upload BuildKit cache diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g6-buildkit-cache-fallback-provision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/g6-buildkit-cache-fallback
          if-no-files-found: ignore
          retention-days: 5
      - name: Clean provision resources
        if: always()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if docker buildx inspect "${BUILDX_BUILDER}" >/dev/null 2>&1; then
            docker buildx rm "${BUILDX_BUILDER}" >/dev/null
          fi
