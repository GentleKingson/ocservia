name: Security Checks

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Repository secrets
            profile: secret-scan
            command: scripts/security-check.sh
          - name: Go vulnerabilities
            profile: go-security
            command: |
              (cd control-plane && govulncheck ./...)
          - name: Rust advisories
            profile: rust-security
            command: |
              cd rust
              cargo audit
              cargo audit --file ../deploy/production/relay.Cargo.lock
              cargo deny --locked check advisories
          - name: npm vulnerabilities
            profile: npm-security
            command: |
              (cd web && npm audit --package-lock-only --ignore-scripts)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ matrix.profile != 'secret-scan' && 1 || 0 }}
          persist-credentials: false
      - name: Cache pinned ${{ matrix.profile }} tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/downloads
            .tools
          key: tooling-v4-${{ matrix.profile }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh', 'control-plane/go.sum', 'signer/go.sum', 'rust/Cargo.lock', 'deploy/production/relay.Cargo.lock', 'web/**/package-lock.json') }}
      - name: Cache npm downloads
        if: matrix.profile == 'npm-security'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/npm
          key: npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock', 'scripts/checksums.txt', 'scripts/bootstrap.sh', 'scripts/env.sh', 'web/**/package-lock.json') }}
      - name: Bootstrap pinned tools
        env:
          npm_config_audit: "false"
          npm_config_fund: "false"
        run: scripts/bootstrap.sh "${{ matrix.profile }}"
      - name: Scan
        shell: bash
        run: |
          source scripts/env.sh
          ${{ matrix.command }}
