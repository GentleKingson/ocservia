name: Security Checks

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected main commit when dispatched by Release Check
        type: string
        required: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name == 'workflow_call' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Repository secrets
            profile: secret-scan
            command: scripts/security-check.sh
          - name: Go vulnerabilities
            profile: go-security
            restore_go_mod: true
            command: |
              (cd control-plane && govulncheck ./...)
              (cd signer && govulncheck ./...)
          - name: Rust advisories
            profile: rust-security
            command: |
              cd rust
              cargo audit
              cargo audit --file ../deploy/production/relay.Cargo.lock
              cargo deny --locked check advisories bans licenses sources
          - name: npm vulnerabilities
            profile: npm-security
            command: |
              (cd web && npm audit --package-lock-only --ignore-scripts)
          - name: Go & Web licenses
            profile: go-test web
            cache_label: go-test-web
            cache_npm: true
            restore_go_mod: true
            command: scripts/license-check.sh --skip-rust
    steps:
      - name: Verify dispatched candidate
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_REF" = refs/heads/codex/release-dag-MkmqHg && test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ matrix.profile != 'secret-scan' && 1 || 0 }}
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          profiles: ${{ matrix.profile }}
          cache-label: ${{ matrix.cache_label || matrix.profile }}
          key-suffix: ${{ matrix.profile == 'rust-security' && format('-{0}', hashFiles('rust/Cargo.lock')) || '' }}
          cache-npm: ${{ matrix.cache_npm && 'true' || 'false' }}
      - name: Compute Go module cache key
        id: go-cache-key
        if: matrix.restore_go_mod == true
        run: bash scripts/ci-go-cache-key.sh >> "${GITHUB_OUTPUT}"
      - name: Restore Go module cache
        if: matrix.restore_go_mod == true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/go-mod
          key: basic-go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-key.outputs.identity }}
      - name: Scan
        shell: bash
        run: |
          source scripts/env.sh
          ${{ matrix.command }}
