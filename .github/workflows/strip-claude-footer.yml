name: Strip Claude Code PR footer

# pull_request_target grants the write token for fork PRs too. The job never
# checks out or runs PR code; the body is untrusted and only passes via files.
on:
  pull_request_target:
    types: [opened, edited]

permissions: {}

concurrency:
  group: strip-claude-footer-${{ github.event.pull_request.number }}

jobs:
  strip:
    if: contains(github.event.pull_request.body, 'Generated by [Claude Code]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove the trailing Claude Code footer
        env:
          GH_TOKEN: ${{ github.token }}
          PR_API: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
        run: |
          # Read the current body rather than the event payload, which may be stale.
          gh api "${PR_API}" --jq '.body // ""' > "${RUNNER_TEMP}/body.md"
          python3 - "${RUNNER_TEMP}/body.md" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as file:
              body = file.read()
          footer = re.compile(
              r"(?:\s*^-{3,}[ \t\r]*$)?\s*"
              r"^_Generated by \[Claude Code\]\(https://claude\.ai/code[^)\s]*\)_\s*\Z",
              re.MULTILINE,
          )
          stripped = footer.sub("", body)
          if stripped == body:
              sys.exit(0)
          with open(path + ".new", "w", encoding="utf-8") as file:
              file.write(stripped + "\n")
          PY
          # Edits made with GITHUB_TOKEN do not trigger this workflow again.
          if [[ -f "${RUNNER_TEMP}/body.md.new" ]]; then
            gh api --method PATCH "${PR_API}" -F "body=@${RUNNER_TEMP}/body.md.new" --silent
          fi
