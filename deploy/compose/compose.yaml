name: ocservia-dev

services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: ocservia
      POSTGRES_USER: ocservia
      POSTGRES_PASSWORD: development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocservia -d ocservia"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  otel-collector:
    image: otel/opentelemetry-collector:0.130.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro

  control-plane:
    build:
      context: ../..
      dockerfile: control-plane/Dockerfile
    command: ["--role=all"]
    environment:
      OCSERV_ENVIRONMENT: development
      OCSERV_HTTP_ADDRESS: 0.0.0.0:8080
      OCSERV_DATABASE_URL: postgres://ocservia:development-only@postgres:5432/ocservia?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "127.0.0.1:${OCSERV_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:${OCSERV_WEB_PORT:-4173}:4173"
    depends_on:
      control-plane:
        condition: service_healthy

volumes:
  postgres-data:
