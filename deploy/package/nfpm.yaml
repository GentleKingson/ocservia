name: ocservia-agent
arch: "@ARCH@"
platform: linux
version: "@VERSION@"
release: 1
section: net
priority: optional
maintainer: ocservia maintainers <ocservia@users.noreply.github.com>
description: Ocservia node Agent, privileged helper, and package upgrader.
homepage: https://github.com/GentleKingson/ocservia
license: Apache-2.0
depends:
  - curl
  - diffutils
  - systemd
  - openssl
  - python3
  - util-linux
contents:
  - src: rust/target/release/ocservia-agent
    dst: /usr/libexec/ocservia/ocservia-agent
    file_info:
      mode: 0755
  - src: rust/target/release/ocservia-privd
    dst: /usr/libexec/ocservia/ocservia-privd
    file_info:
      mode: 0755
  - src: rust/target/release/ocservia-upgrader
    dst: /usr/libexec/ocservia/ocservia-upgrader
    file_info:
      mode: 0755
  - src: deploy/managed-node/vpn-session-hook
    dst: /usr/libexec/ocservia/vpn-session-hook
    file_info:
      mode: 0755
  - src: deploy/managed-node/vpn-audit.py
    dst: /usr/libexec/ocservia/vpn-audit.py
    file_info:
      mode: 0755
  - src: deploy/production/systemd/agent-relays.sh
    dst: /usr/libexec/ocservia/ocservia-agent-relays
    file_info:
      mode: 0755
  - src: deploy/systemd/*.service
    dst: /usr/lib/systemd/system/
    file_info:
      mode: 0644
  - src: deploy/production/systemd/ocservia-agent-relays.conf
    dst: /usr/lib/systemd/system/ocservia-agent.service.d/10-production-relays.conf
    file_info:
      mode: 0644
  - src: deploy/systemd/agent.env.example
    dst: /usr/share/ocservia-agent/agent.env.example
    file_info:
      mode: 0644
  - src: deploy/production/systemd/relays.env.example
    dst: /usr/share/ocservia-agent/relays.env.example
    file_info:
      mode: 0644
  - src: deploy/package/ocservia-agent.sysusers
    dst: /usr/lib/sysusers.d/ocservia-agent.conf
    file_info:
      mode: 0644
  - src: deploy/package/ocservia-agent.tmpfiles
    dst: /usr/lib/tmpfiles.d/ocservia-agent.conf
    file_info:
      mode: 0644
scripts:
  postinstall: deploy/package/postinstall.sh
  preremove: deploy/package/preremove.sh
  postremove: deploy/package/postremove.sh
