# compose.sh selects this file when any OIDC setting is nonempty.
services:
  migrate:
    environment: &oidc-environment
      OCSERV_OIDC_ISSUER: ${OCSERV_OIDC_ISSUER:?set OCSERV_OIDC_ISSUER}
      OCSERV_OIDC_CLIENT_ID: ${OCSERV_OIDC_CLIENT_ID:?set OCSERV_OIDC_CLIENT_ID}
      OCSERV_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      OCSERV_OIDC_REDIRECT_URL: ${OCSERV_OIDC_REDIRECT_URL:-https://${OCSERV_PUBLIC_HOST}/api/v1/auth/callback}
    secrets:
      - oidc_client_secret
  control-plane:
    environment: *oidc-environment
    secrets:
      - oidc_client_secret

secrets:
  oidc_client_secret:
    file: ${OCSERV_SECRET_DIR}/oidc-client-secret
