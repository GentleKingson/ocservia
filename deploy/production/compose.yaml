name: ocservia-production

x-service-defaults: &service-defaults
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  init: true
  ulimits:
    nofile:
      soft: 1024
      hard: 4096

x-gateway: &gateway
  <<: *service-defaults
  image: ${OCSERV_GATEWAY_IMAGE:?set OCSERV_GATEWAY_IMAGE to a digest-pinned image}
  environment:
    GOMEMLIMIT: 200MiB
    GOMAXPROCS: "1"
    OCSERV_PUBLIC_HOST: ${OCSERV_PUBLIC_HOST:?set OCSERV_PUBLIC_HOST}
  tmpfs:
    - /config:size=1m,mode=0700
    - /data:size=8m,mode=0700
    - /tmp:size=8m,mode=0700
  depends_on:
    control-plane:
      condition: service_healthy
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 256M
        pids: 256

x-relay: &relay
  <<: *service-defaults
  image: ${OCSERV_RELAY_IMAGE:-${OCSERV_GATEWAY_IMAGE}}
  tmpfs: ["/tmp:size=16m,mode=0700,uid=65532,gid=65532"]
  ports: ["${OCSERV_HTTPS_ADDRESS:-0.0.0.0}:7842:7842/udp"]
  networks:
    edge-relay: {aliases: [relay]}
    gateway-relay: {aliases: [relay]}
  healthcheck:
    test: ["CMD", "relay-healthcheck"]
    interval: 15s
    timeout: 3s
    retries: 8
    start_period: 15s
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 1G
        pids: 256

services:
  transport-runtime-init:
    <<: *service-defaults
    image: ${OCSERV_TRANSPORT_IMAGE:?set OCSERV_TRANSPORT_IMAGE to a digest-pinned image}
    user: "0:0"
    entrypoint: ["/usr/local/libexec/ocservia-prepare-transport-runtime"]
    command: ["/run/ocserv-platform", "65532", "65532", "65532"]
    restart: "no"
    network_mode: none
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    volumes:
      - type: volume
        source: transport-runtime
        target: /run/ocserv-platform
        volume:
          nocopy: true
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 16M
          pids: 16

  gateway-standalone:
    <<: *gateway
    profiles: [standalone]
    secrets: [tls_certificate, tls_private_key]
    ports: ["${OCSERV_HTTPS_ADDRESS:-0.0.0.0}:443:8443/tcp"]
    networks:
      frontend: {}
      application: {ipv4_address: "${OCSERV_GATEWAY_APPLICATION_IP:-172.30.240.2}"}

  gateway:
    <<: *gateway
    profiles: [manual]
    secrets: [tls_certificate, tls_private_key]
    environment:
      GOMEMLIMIT: 200MiB
      GOMAXPROCS: "1"
      OCSERV_PUBLIC_HOST: ${OCSERV_PUBLIC_HOST}
      OCSERV_EDGE_GATEWAY_IP: ${OCSERV_EDGE_GATEWAY_IP:-172.30.241.2}
      OCSERV_RELAY_ROUTE_PREFIX: ${OCSERV_RELAY_ROUTE_PREFIX:-disabled}
    tmpfs:
      - /config:size=1m,mode=0700,uid=65532,gid=65532
      - /data:size=8m,mode=0700,uid=65532,gid=65532
      - /tmp:size=8m,mode=0700,uid=65532,gid=65532
    networks:
      edge-gateway: {aliases: [gateway]}
      gateway-relay: {}
      application: {ipv4_address: "${OCSERV_GATEWAY_APPLICATION_IP:-172.30.240.2}"}
    volumes:
      - ./integrated/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./integrated/site.caddy:/etc/caddy/site.caddy:ro
      - ./integrated/relay.caddy:/etc/caddy/relay.caddy:ro

  gateway-acme:
    <<: *gateway
    profiles: [acme]
    environment:
      GOMEMLIMIT: 200MiB
      GOMAXPROCS: "1"
      OCSERV_PUBLIC_HOST: ${OCSERV_PUBLIC_HOST}
      OCSERV_EDGE_GATEWAY_IP: ${OCSERV_EDGE_GATEWAY_IP:-172.30.241.2}
      OCSERV_RELAY_ROUTE_PREFIX: ${OCSERV_RELAY_ROUTE_PREFIX:-disabled}
      OCSERV_ACME_EMAIL: ${OCSERV_ACME_EMAIL:-}
      OCSERV_ACME_DIRECTORY_URL: ${OCSERV_ACME_DIRECTORY_URL:-https://acme-v02.api.letsencrypt.org/directory}
      SSL_CERT_FILE: ${OCSERV_ACME_CA_FILE:+/run/secrets/acme_ca}
    secrets: [acme_ca]
    tmpfs:
      - /config:size=1m,mode=0700,uid=65532,gid=65532
      - /data:size=8m,mode=0700,uid=65532,gid=65532
      - /tmp:size=8m,mode=0700,uid=65532,gid=65532
    networks:
      edge-gateway: {aliases: [gateway]}
      gateway-relay: {}
      application: {ipv4_address: "${OCSERV_GATEWAY_APPLICATION_IP:-172.30.240.2}"}
      acme-egress: {}
    volumes:
      - ./integrated/Caddyfile.acme:/etc/caddy/Caddyfile:ro
      - gateway-acme:/var/lib/caddy-acme
      - ./integrated/site.caddy:/etc/caddy/site.caddy:ro
      - ./integrated/relay.caddy:/etc/caddy/relay.caddy:ro

  relay:
    <<: *relay
    profiles: [manual]
    environment:
      IROH_RELAY_ACCESS_TOKEN_FILE: /run/secrets/relay_access_token
    command: "${OCSERV_RELAY_MODE_ARG:-} --config-path /etc/iroh-relay/relay.toml"
    secrets: [relay_access_token, relay_tls_certificate, relay_tls_private_key]
    volumes:
      - ./relay/relay.toml:/etc/iroh-relay/relay.toml:ro

  relay-acme:
    <<: *relay
    profiles: [acme]
    environment:
      IROH_RELAY_ACCESS_TOKEN_FILE: /run/secrets/relay_access_token
      IROH_RELAY_ACME_URL: ${OCSERV_ACME_DIRECTORY_URL:-https://acme-v02.api.letsencrypt.org/directory}
      IROH_RELAY_ACME_CA:
      OCSERV_RELAY_CONFIG_TEMPLATE: /etc/iroh-relay/template.toml
      OCSERV_RELAY_PUBLIC_HOST: ${OCSERV_RELAY_PUBLIC_HOST:-}
      OCSERV_ACME_EMAIL: ${OCSERV_ACME_EMAIL:-}
      OCSERV_RELAY_SHARED_ACME_DIR: ${OCSERV_RELAY_SHARED_ACME_DIR:-}
    secrets: [relay_access_token, acme_ca]
    command: "${OCSERV_RELAY_MODE_ARG:-} --config-path /tmp/relay.toml"
    volumes:
      - ${OCSERV_RELAY_TEMPLATE:-./integrated/relay.acme.toml}:/etc/iroh-relay/template.toml:ro
      - ${OCSERV_RELAY_ACME_VOLUME:-relay-acme:/var/lib/iroh-relay}

  migrate:
    <<: *service-defaults
    restart: "no"
    image: ${OCSERV_CONTROL_IMAGE:?set OCSERV_CONTROL_IMAGE to a digest-pinned image}
    command: ["--migrate-only"]
    environment:
      GOMEMLIMIT: 200MiB
      GOMAXPROCS: "1"
      OCSERV_ENVIRONMENT: production
      OCSERV_DATABASE_BUNDLED_POSTGRES: ${OCSERV_DATABASE_BUNDLED_POSTGRES:-true}
      OCSERV_DATABASE_TLS_CA_FILE: ${OCSERV_DATABASE_TLS_CA_FILE:-}
      OCSERV_DATABASE_URL_FILE: /run/secrets/database_owner_url
      OCSERV_RUNTIME_DATABASE_ROLE: ocservia_app
      OCSERV_LOCAL_AUTH_ENABLED: ${OCSERV_LOCAL_AUTH_ENABLED:-true}
      OCSERV_PUBLIC_ORIGIN: ${OCSERV_PUBLIC_ORIGIN:-https://${OCSERV_PUBLIC_HOST}}
      OCSERV_SESSION_KEY_FILE: /run/secrets/session_key
      OCSERV_SESSION_TTL: ${OCSERV_SESSION_TTL:-8h}
      OCSERV_RECOMMENDED_AGENT_VERSION: ${OCSERV_RECOMMENDED_AGENT_VERSION:-}
      OCSERV_AUDIT_CHECKPOINT_KEY_FILE: /run/secrets/audit_checkpoint_key
      OCSERV_AUDIT_EVENT_KEY_ID: ${OCSERV_AUDIT_EVENT_KEY_ID:?set the audit event HMAC key ID}
      OCSERV_AUDIT_EVENT_KEY_FILE: /run/secrets/audit_event_key
    secrets:
      - source: ${OCSERV_DATABASE_CA_SECRET:-system_ca}
        target: database_ca
      - database_owner_url
      - session_key
      - audit_checkpoint_key
      - source: audit_event_key
        target: audit_event_key
        uid: "65534"
        gid: "65532"
        mode: 0400
    tmpfs:
      - /tmp:size=8m,mode=0700
    networks: ["${OCSERV_DATABASE_NETWORK:-database}"]
    depends_on:
      postgres: {condition: service_healthy, required: false}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 128

  telemetry-retention:
    <<: *service-defaults
    image: ${OCSERV_CONTROL_IMAGE:?set OCSERV_CONTROL_IMAGE to a digest-pinned image}
    command:
      - "--telemetry-retention-only"
      - "--telemetry-retention-interval=${OCSERV_TELEMETRY_RETENTION_INTERVAL:-24h}"
    environment:
      GOMEMLIMIT: 128MiB
      GOMAXPROCS: "1"
      OCSERV_ENVIRONMENT: production
      OCSERV_DATABASE_BUNDLED_POSTGRES: ${OCSERV_DATABASE_BUNDLED_POSTGRES:-true}
      OCSERV_DATABASE_TLS_CA_FILE: ${OCSERV_DATABASE_TLS_CA_FILE:-}
      OCSERV_DATABASE_URL_FILE: /run/secrets/database_owner_url
    secrets:
      - source: ${OCSERV_DATABASE_CA_SECRET:-system_ca}
        target: database_ca
      - database_owner_url
    tmpfs:
      - /tmp:size=8m,mode=0700
    networks: ["${OCSERV_DATABASE_NETWORK:-database}"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 64

  control-plane:
    <<: *service-defaults
    image: ${OCSERV_CONTROL_IMAGE:?set OCSERV_CONTROL_IMAGE to a digest-pinned image}
    environment:
      GOMEMLIMIT: 800MiB
      OCSERV_ENVIRONMENT: production
      OCSERV_DATABASE_BUNDLED_POSTGRES: ${OCSERV_DATABASE_BUNDLED_POSTGRES:-true}
      OCSERV_DATABASE_TLS_CA_FILE: ${OCSERV_DATABASE_TLS_CA_FILE:-}
      OCSERV_HTTP_ADDRESS: 0.0.0.0:8080
      OCSERV_AUTH_TRUSTED_PROXY_CIDRS: ${OCSERV_AUTH_TRUSTED_PROXY_CIDRS-${OCSERV_GATEWAY_APPLICATION_IP:-172.30.240.2}/32}
      OCSERV_DATABASE_URL_FILE: /run/secrets/database_app_url
      OCSERV_LOCAL_AUTH_ENABLED: ${OCSERV_LOCAL_AUTH_ENABLED:-true}
      OCSERV_PUBLIC_ORIGIN: ${OCSERV_PUBLIC_ORIGIN:-https://${OCSERV_PUBLIC_HOST}}
      OCSERV_SESSION_KEY_FILE: /run/secrets/session_key
      OCSERV_SESSION_TTL: ${OCSERV_SESSION_TTL:-8h}
      OCSERV_RECOMMENDED_AGENT_VERSION: ${OCSERV_RECOMMENDED_AGENT_VERSION:-}
      OCSERV_AUDIT_CHECKPOINT_KEY_FILE: /run/secrets/audit_checkpoint_key
      OCSERV_AUDIT_EVENT_KEY_ID: ${OCSERV_AUDIT_EVENT_KEY_ID:?set the audit event HMAC key ID}
      OCSERV_AUDIT_EVENT_KEY_FILE: /run/secrets/audit_event_key
      OCSERV_COMMAND_SIGNING_KEY_FILE: /run/secrets/controller_command_signing_key
      OCSERV_TRANSPORT_SOCKET: /run/ocserv-platform/transportd.sock
      OCSERV_TRUST_SOCKET: /run/ocserv-trust/control-plane.sock
      OCSERV_TRANSPORT_UID: "65532"
      OCSERV_TRANSPORT_GID: "65532"
      OCSERV_RELAY_URL_A: ${OCSERV_RELAY_URL_A:?set the dedicated HTTPS relay URL}
      OCSERV_RELAY_ACCESS_TOKEN_FILE: /run/secrets/relay_access_token
      OCSERV_CONTROLLER_ENDPOINT_ID: ${OCSERV_CONTROLLER_ENDPOINT_ID:?set OCSERV_CONTROLLER_ENDPOINT_ID}
      OCSERV_CERTIFICATE_SIGNER_URL: ${OCSERV_CERTIFICATE_SIGNER_URL:?set OCSERV_CERTIFICATE_SIGNER_URL}
      OCSERV_CERTIFICATE_SIGNER_CA_FILE: ${OCSERV_CERTIFICATE_SIGNER_CA_FILE:-}
      OCSERV_CERTIFICATE_SIGNER_TOKEN_FILE: /run/secrets/certificate_signer_token
      OCSERV_SSE_GLOBAL_LIMIT: "128"
      OCSERV_SSE_IDENTITY_LIMIT: "8"
      OCSERV_SSE_SESSION_LIMIT: "4"
      OCSERV_SSE_WORKSPACE_LIMIT: "32"
      OCSERV_SSE_RESOURCE_LIMIT: "16"
      OCSERV_SSE_WATCHER_LIMIT: "64"
      OCSERV_SSE_QUEUE_CAPACITY: "128"
      OCSERV_SSE_POLL_INTERVAL: 250ms
      OCSERV_SSE_DATABASE_MAX_BACKOFF: 10s
      OCSERV_SSE_MAX_LIFETIME: 30m
      OCSERV_SSE_REVALIDATE_INTERVAL: 30s
      OCSERV_SSE_RETRY_AFTER: 5s
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OCSERV_OTEL_BACKEND_ENDPOINT:+http://otel-collector:4317}
    secrets:
      - source: ${OCSERV_DATABASE_CA_SECRET:-system_ca}
        target: database_ca
      - database_app_url
      - session_key
      - audit_checkpoint_key
      - source: relay_access_token
        target: relay_access_token
        uid: "65532"
        gid: "65532"
        mode: 0440
      - source: audit_event_key
        target: audit_event_key
        uid: "65534"
        gid: "65532"
        mode: 0400
      - source: ${OCSERV_SIGNER_CA_SECRET:-system_ca}
        target: certificate_signer_ca
      - certificate_signer_token
      - source: controller_command_signing_key
        target: controller_command_signing_key
        uid: "65534"
        gid: "65532"
        mode: 0400
    volumes:
      - type: volume
        source: transport-runtime
        target: /run/ocserv-platform
        volume:
          nocopy: true
      - trust-runtime:/run/ocserv-trust
    tmpfs:
      - /tmp:size=16m,mode=0700
    networks: [application, "${OCSERV_DATABASE_NETWORK:-database}", observability, signer]
    depends_on:
      signer: {condition: service_healthy, required: false}
      migrate:
        condition: service_completed_successfully
      transport-runtime-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
          pids: 256

  transportd:
    <<: *service-defaults
    image: ${OCSERV_TRANSPORT_IMAGE:?set OCSERV_TRANSPORT_IMAGE to a digest-pinned image}
    entrypoint: ["/usr/local/libexec/ocservia-transportd-relays"]
    environment:
      OCSERV_RELAY_URL_A: ${OCSERV_RELAY_URL_A:?set the dedicated HTTPS relay URL}
    command:
      - --socket
      - /run/ocserv-platform/transportd.sock
      - --trust-socket
      - /run/ocserv-trust/control-plane.sock
      - --control-plane-uid
      - "65534"
      - --control-plane-gid
      - "65532"
      - --key-file
      - /run/secrets/controller_iroh_key
      - --relay-token-file
      - /run/secrets/relay_access_token
      - --controller-verification-key-file
      - /run/secrets/controller_command_verification_key
      - --known-agent-handshake-rate
      - "2400"
      - --known-agent-handshake-concurrency
      - "256"
      - --agent-authorization-rate
      - "1200"
      - --agent-authorization-concurrency
      - "48"
      - --agent-registration-recheck-rate
      - "1200"
      - --agent-registration-recheck-concurrency
      - "48"
      - --unknown-enrollment-preauth-rate
      - "120"
      - --unknown-enrollment-preauth-concurrency
      - "16"
      - --enrollment-completion-rate
      - "120"
      - --enrollment-completion-concurrency
      - "8"
    secrets:
      - source: ${OCSERV_RELAY_TRUST_SECRET:-system_ca}
        target: ${OCSERV_RELAY_TRUST_TARGET:-system_ca}
      - source: controller_command_verification_key
        target: controller_command_verification_key
        uid: "0"
        gid: "65532"
        mode: 0440
      - source: relay_access_token
        target: relay_access_token
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: controller_iroh_key
        target: controller_iroh_key
        uid: "65532"
        gid: "65532"
        mode: 0400
    volumes:
      - type: volume
        source: transport-runtime
        target: /run/ocserv-platform
        volume:
          nocopy: true
      - trust-runtime:/run/ocserv-trust
    tmpfs:
      - /tmp:size=8m,mode=0700
    networks: [application, observability, relay-egress]
    depends_on:
      transport-runtime-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/ocserv-platform/transportd.sock"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
          pids: 256

  otel-collector:
    profiles: [observability]
    <<: *service-defaults
    image: ${OCSERV_OTEL_IMAGE:?set OCSERV_OTEL_IMAGE to a digest-pinned OpenTelemetry Collector image}
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      GOMEMLIMIT: 300MiB
      GOMAXPROCS: "1"
      OCSERV_OTEL_BACKEND_ENDPOINT: ${OCSERV_OTEL_BACKEND_ENDPOINT:-}
    secrets:
      - otel_client_certificate
      - otel_client_key
      - otel_ca_certificate
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    tmpfs:
      - /tmp:size=16m,mode=0700
    networks: [observability]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256

  postgres:
    profiles: [bundled-postgres]
    <<: *service-defaults
    user: "999:999"
    image: ${OCSERV_POSTGRES_IMAGE:?set OCSERV_POSTGRES_IMAGE to a digest-pinned PostgreSQL 18 image}
    entrypoint: ["/bin/bash", "/usr/local/bin/ocservia-postgres-entrypoint"]
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_DB: ocservia
      POSTGRES_USER: ocservia_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    secrets: [postgres_owner_password, postgres_app_password, postgres_backup_password]
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../lib/postgres-entrypoint.sh:/usr/local/bin/ocservia-postgres-entrypoint:ro
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /run/postgresql:size=16m,uid=999,gid=999,mode=0770
      - /tmp:size=16m,uid=999,gid=999,mode=0700
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocservia_owner -d ocservia"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2G, pids: 256}

  backup:
    profiles: [bundled-postgres, external-postgres]
    <<: *service-defaults
    image: ${OCSERV_BACKUP_IMAGE:?set OCSERV_BACKUP_IMAGE to the repository backup image}
    environment:
      PGHOST: ${OCSERV_DATABASE_BACKUP_HOST:-postgres}
      PGPORT: ${OCSERV_DATABASE_BACKUP_PORT:-5432}
      PGDATABASE: ${OCSERV_DATABASE_BACKUP_NAME:-ocservia}
      PGUSER: ${OCSERV_DATABASE_BACKUP_USER:-ocservia_backup}
      PGSSLMODE: ${OCSERV_BACKUP_SSLMODE:-disable}
      PGSSLROOTCERT: /run/secrets/database_ca
      POSTGRES_SERVER_MAJOR: "18"
      PGPASS_SOURCE: /run/secrets/postgres_pgpass
      BACKUP_ROOT: /var/lib/ocservia-backup
      BACKUP_INTERVAL_SECONDS: ${OCSERV_BACKUP_INTERVAL_SECONDS:-900}
      BACKUP_RETENTION_COUNT: ${OCSERV_BACKUP_RETENTION_COUNT:-8}
    secrets:
      - postgres_pgpass
      - source: ${OCSERV_DATABASE_CA_SECRET:-system_ca}
        target: database_ca
    volumes:
      - ${OCSERV_BACKUP_DIR:?set OCSERV_BACKUP_DIR to a separately protected backup mount}:/var/lib/ocservia-backup
    tmpfs:
      - /tmp:size=32m,uid=999,gid=999,mode=0700
    networks: ["${OCSERV_DATABASE_NETWORK:-database}"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "find /var/lib/ocservia-backup/LATEST -mmin \"-$$((BACKUP_INTERVAL_SECONDS / 60 + 11))\" -type f | grep -q ."]
      interval: 5m
      timeout: 5s
      retries: 2
      # Engine 25+ defaults to 5s startup probes; omit start_interval for older Compose.
      start_period: 60s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M, pids: 256}

  signer:
    profiles: [manual, acme]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    image: ${OCSERV_SIGNER_IMAGE:-${OCSERV_GATEWAY_IMAGE}}
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    command: [serve]
    environment:
      GOMEMLIMIT: 200MiB
      GOMAXPROCS: "1"
      OCSERV_SIGNER_CERT_TTL: ${OCSERV_SIGNER_CERT_TTL:-2160h}
    volumes:
      - type: bind
        source: ${OCSERV_SIGNER_STATE_DIR:-/var/lib/ocservia-signer}
        target: /var/lib/ocservia-signer
        bind: {create_host_path: false}
      - type: bind
        source: ${OCSERV_SIGNER_SECRET_DIR:-/etc/ocservia/signer}
        target: /run/secrets
        read_only: true
        bind: {create_host_path: false}
    networks: [signer]
    healthcheck:
      test: [CMD, /ocserv-signer, health, --url, "https://signer:9443/healthz"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 256M, pids: 64}

  edge:
    profiles: [manual, acme]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    image: ${OCSERV_EDGE_IMAGE:-${OCSERV_GATEWAY_IMAGE}}
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    environment:
      OCSERV_PUBLIC_HOST: ${OCSERV_PUBLIC_HOST:?set Controller DNS name}
      OCSERV_RELAY_PUBLIC_HOST: ${OCSERV_RELAY_PUBLIC_HOST:-}
    ports:
      - "${OCSERV_HTTPS_ADDRESS:-0.0.0.0}:443:8443/tcp"
    tmpfs: ["/tmp:size=8m,mode=0700,uid=65532,gid=65532"]
    ulimits:
      nofile: {soft: 8192, hard: 8192}
    networks:
      frontend: {}
      edge-gateway:
        ipv4_address: ${OCSERV_EDGE_GATEWAY_IP:-172.30.241.2}
      edge-relay: {}
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 64M, pids: 32}

networks:
  # Only transportd needs outbound HTTPS to the dedicated Relay.
  relay-egress: {}
  frontend: {}
  application:
    internal: true
    ipam:
      config:
        - subnet: ${OCSERV_APPLICATION_SUBNET:-172.30.240.0/24}
          # Keep dynamic allocations away from the gateway, even while it is absent.
          ip_range: ${OCSERV_APPLICATION_IP_RANGE:-172.30.240.128/25}
  database:
    internal: true
  observability:
    internal: true
  database-egress: {}
  signer: {internal: true}
  gateway-relay: {internal: true}
  acme-egress: {}
  edge-gateway:
    internal: true
    ipam:
      config:
        - subnet: ${OCSERV_EDGE_GATEWAY_SUBNET:-172.30.241.0/24}
          ip_range: ${OCSERV_EDGE_GATEWAY_IP_RANGE:-172.30.241.128/25}
  edge-relay: {}

volumes:
  transport-runtime: {}
  trust-runtime: {}
  gateway-acme: {}
  relay-acme: {}
  postgres-data: {}

secrets:
  tls_certificate:
    file: ${OCSERV_SECRET_DIR:?set OCSERV_SECRET_DIR}/tls.crt
  tls_private_key:
    file: ${OCSERV_SECRET_DIR}/tls.key
  database_owner_url:
    file: ${OCSERV_SECRET_DIR}/database-owner-url
  database_app_url:
    file: ${OCSERV_SECRET_DIR}/database-app-url
  session_key:
    file: ${OCSERV_SECRET_DIR}/session-key
  audit_checkpoint_key:
    file: ${OCSERV_SECRET_DIR}/audit-checkpoint-key
  audit_event_key:
    file: ${OCSERV_SECRET_DIR}/audit-event-key
  controller_command_signing_key:
    file: ${OCSERV_SECRET_DIR}/controller-command-signing-key.pem
  controller_command_verification_key:
    file: ${OCSERV_SECRET_DIR}/controller-command-verification-key.pem
  certificate_signer_token:
    file: ${OCSERV_SECRET_DIR}/certificate-signer-token
  relay_access_token:
    file: ${OCSERV_SECRET_DIR}/relay-access-token
  controller_iroh_key:
    file: ${OCSERV_SECRET_DIR}/controller-iroh.key
  otel_client_certificate:
    file: ${OCSERV_SECRET_DIR}/otel-client.crt
  otel_client_key:
    file: ${OCSERV_SECRET_DIR}/otel-client.key
  otel_ca_certificate:
    file: ${OCSERV_SECRET_DIR}/otel-ca.crt
  postgres_owner_password:
    file: ${OCSERV_SECRET_DIR}/postgres-owner-password
  postgres_app_password:
    file: ${OCSERV_SECRET_DIR}/postgres-app-password
  postgres_backup_password:
    file: ${OCSERV_SECRET_DIR}/postgres-backup-password
  postgres_pgpass:
    file: ${OCSERV_SECRET_DIR}/postgres.pgpass
  system_ca:
    file: /etc/ssl/certs/ca-certificates.crt
  relay_ca:
    file: ${OCSERV_SECRET_DIR}/relay-ca.pem
  database_ca:
    file: ${OCSERV_SECRET_DIR}/database-ca.pem
  certificate_signer_ca:
    file: ${OCSERV_SIGNER_SECRET_DIR:-/etc/ocservia/signer}/tls-ca.pem
  acme_ca:
