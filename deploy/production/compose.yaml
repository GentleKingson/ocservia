name: ocservia-production

x-service-defaults: &service-defaults
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  init: true
  ulimits:
    nofile:
      soft: 1024
      hard: 4096

services:
  transport-runtime-init:
    <<: *service-defaults
    image: ${OCSERV_TRANSPORT_IMAGE:?set OCSERV_TRANSPORT_IMAGE to a digest-pinned image}
    user: "0:0"
    entrypoint: ["/usr/local/libexec/ocservia-prepare-transport-runtime"]
    command: ["/run/ocserv-platform", "65532", "65532", "65532"]
    restart: "no"
    network_mode: none
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    volumes:
      - type: volume
        source: transport-runtime
        target: /run/ocserv-platform
        volume:
          nocopy: true
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 16M
          pids: 16

  gateway:
    <<: *service-defaults
    image: ${OCSERV_GATEWAY_IMAGE:?set OCSERV_GATEWAY_IMAGE to a digest-pinned image}
    ports:
      - "${OCSERV_HTTPS_ADDRESS:-0.0.0.0}:443:8443/tcp"
    environment:
      OCSERV_PUBLIC_HOST: ${OCSERV_PUBLIC_HOST:?set OCSERV_PUBLIC_HOST}
    secrets:
      - tls_certificate
      - tls_private_key
    tmpfs:
      - /config:size=1m,mode=0700
      - /data:size=8m,mode=0700
      - /tmp:size=8m,mode=0700
    networks:
      frontend: {}
      application:
        ipv4_address: ${OCSERV_GATEWAY_APPLICATION_IP:-172.30.240.2}
    depends_on:
      control-plane:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 256

  migrate:
    <<: *service-defaults
    restart: "no"
    image: ${OCSERV_CONTROL_IMAGE:?set OCSERV_CONTROL_IMAGE to a digest-pinned image}
    command: ["--migrate-only"]
    environment:
      OCSERV_ENVIRONMENT: production
      OCSERV_DATABASE_URL_FILE: /run/secrets/database_owner_url
      OCSERV_RUNTIME_DATABASE_ROLE: ocservia_app
      OCSERV_LOCAL_AUTH_ENABLED: ${OCSERV_LOCAL_AUTH_ENABLED:-false}
      OCSERV_PUBLIC_ORIGIN: ${OCSERV_PUBLIC_ORIGIN:-https://${OCSERV_PUBLIC_HOST}}
      OCSERV_SESSION_KEY_FILE: /run/secrets/session_key
      OCSERV_SESSION_TTL: ${OCSERV_SESSION_TTL:-8h}
      OCSERV_AUDIT_CHECKPOINT_KEY_FILE: /run/secrets/audit_checkpoint_key
      OCSERV_AUDIT_EVENT_KEY_ID: ${OCSERV_AUDIT_EVENT_KEY_ID:?set the audit event HMAC key ID}
      OCSERV_AUDIT_EVENT_KEY_FILE: /run/secrets/audit_event_key
    secrets:
      - database_owner_url
      - session_key
      - audit_checkpoint_key
      - source: audit_event_key
        target: audit_event_key
        uid: "65534"
        gid: "65532"
        mode: 0400
    tmpfs:
      - /tmp:size=8m,mode=0700
    networks: [database]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 128

  control-plane:
    <<: *service-defaults
    image: ${OCSERV_CONTROL_IMAGE:?set OCSERV_CONTROL_IMAGE to a digest-pinned image}
    command: ["--role=all"]
    environment:
      OCSERV_ENVIRONMENT: production
      OCSERV_HTTP_ADDRESS: 0.0.0.0:8080
      OCSERV_AUTH_TRUSTED_PROXY_CIDRS: ${OCSERV_AUTH_TRUSTED_PROXY_CIDRS-${OCSERV_GATEWAY_APPLICATION_IP:-172.30.240.2}/32}
      OCSERV_DATABASE_URL_FILE: /run/secrets/database_app_url
      OCSERV_LOCAL_AUTH_ENABLED: ${OCSERV_LOCAL_AUTH_ENABLED:-false}
      OCSERV_PUBLIC_ORIGIN: ${OCSERV_PUBLIC_ORIGIN:-https://${OCSERV_PUBLIC_HOST}}
      OCSERV_SESSION_KEY_FILE: /run/secrets/session_key
      OCSERV_SESSION_TTL: ${OCSERV_SESSION_TTL:-8h}
      OCSERV_AUDIT_CHECKPOINT_KEY_FILE: /run/secrets/audit_checkpoint_key
      OCSERV_AUDIT_EVENT_KEY_ID: ${OCSERV_AUDIT_EVENT_KEY_ID:?set the audit event HMAC key ID}
      OCSERV_AUDIT_EVENT_KEY_FILE: /run/secrets/audit_event_key
      OCSERV_COMMAND_SIGNING_KEY_FILE: /run/secrets/controller_command_signing_key
      OCSERV_TRANSPORT_SOCKET: /run/ocserv-platform/transportd.sock
      OCSERV_TRUST_SOCKET: /run/ocserv-trust/control-plane.sock
      OCSERV_TRANSPORT_UID: "65532"
      OCSERV_TRANSPORT_GID: "65532"
      OCSERV_CONTROLLER_ENDPOINT_ID: ${OCSERV_CONTROLLER_ENDPOINT_ID:?set OCSERV_CONTROLLER_ENDPOINT_ID}
      OCSERV_CERTIFICATE_SIGNER_URL: ${OCSERV_CERTIFICATE_SIGNER_URL:?set OCSERV_CERTIFICATE_SIGNER_URL}
      OCSERV_CERTIFICATE_SIGNER_TOKEN_FILE: /run/secrets/certificate_signer_token
      OCSERV_SSE_GLOBAL_LIMIT: "128"
      OCSERV_SSE_IDENTITY_LIMIT: "8"
      OCSERV_SSE_SESSION_LIMIT: "4"
      OCSERV_SSE_WORKSPACE_LIMIT: "32"
      OCSERV_SSE_RESOURCE_LIMIT: "16"
      OCSERV_SSE_WATCHER_LIMIT: "64"
      OCSERV_SSE_QUEUE_CAPACITY: "128"
      OCSERV_SSE_POLL_INTERVAL: 250ms
      OCSERV_SSE_DATABASE_MAX_BACKOFF: 10s
      OCSERV_SSE_MAX_LIFETIME: 30m
      OCSERV_SSE_REVALIDATE_INTERVAL: 30s
      OCSERV_SSE_RETRY_AFTER: 5s
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OCSERV_OTEL_BACKEND_ENDPOINT:+http://otel-collector:4317}
    secrets:
      - database_app_url
      - session_key
      - audit_checkpoint_key
      - source: audit_event_key
        target: audit_event_key
        uid: "65534"
        gid: "65532"
        mode: 0400
      - certificate_signer_token
      - source: controller_command_signing_key
        target: controller_command_signing_key
        uid: "65534"
        gid: "65532"
        mode: 0400
    volumes:
      - type: volume
        source: transport-runtime
        target: /run/ocserv-platform
        volume:
          nocopy: true
      - trust-runtime:/run/ocserv-trust
    tmpfs:
      - /tmp:size=16m,mode=0700
    networks: [application, database, observability]
    depends_on:
      migrate:
        condition: service_completed_successfully
      transport-runtime-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
          pids: 256

  transportd:
    <<: *service-defaults
    image: ${OCSERV_TRANSPORT_IMAGE:?set OCSERV_TRANSPORT_IMAGE to a digest-pinned image}
    entrypoint: ["/usr/local/libexec/ocservia-transportd-relays"]
    environment:
      OCSERV_RELAY_URL_A: ${OCSERV_RELAY_URL_A:?set the dedicated HTTPS relay URL}
      OCSERV_RELAY_URL_B: ${OCSERV_RELAY_URL_B:-}
    command:
      - --socket
      - /run/ocserv-platform/transportd.sock
      - --trust-socket
      - /run/ocserv-trust/control-plane.sock
      - --control-plane-uid
      - "65534"
      - --control-plane-gid
      - "65532"
      - --key-file
      - /run/secrets/controller_iroh_key
      - --relay-token-file
      - /run/secrets/relay_access_token
      - --controller-verification-key-file
      - /run/secrets/controller_command_verification_key
      - --require-fencing
      - --known-agent-handshake-rate
      - "2400"
      - --known-agent-handshake-concurrency
      - "256"
      - --agent-authorization-rate
      - "1200"
      - --agent-authorization-concurrency
      - "48"
      - --agent-registration-recheck-rate
      - "1200"
      - --agent-registration-recheck-concurrency
      - "48"
      - --unknown-enrollment-preauth-rate
      - "120"
      - --unknown-enrollment-preauth-concurrency
      - "16"
      - --enrollment-completion-rate
      - "120"
      - --enrollment-completion-concurrency
      - "8"
    secrets:
      - source: controller_command_verification_key
        target: controller_command_verification_key
        uid: "0"
        gid: "65532"
        mode: 0440
      - source: relay_access_token
        target: relay_access_token
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: controller_iroh_key
        target: controller_iroh_key
        uid: "65532"
        gid: "65532"
        mode: 0400
    volumes:
      - type: volume
        source: transport-runtime
        target: /run/ocserv-platform
        volume:
          nocopy: true
      - trust-runtime:/run/ocserv-trust
    tmpfs:
      - /tmp:size=8m,mode=0700
    networks: [application, observability, relay-egress]
    depends_on:
      transport-runtime-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/ocserv-platform/transportd.sock"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
          pids: 256

  otel-collector:
    profiles: [observability]
    <<: *service-defaults
    image: ${OCSERV_OTEL_IMAGE:?set OCSERV_OTEL_IMAGE to a digest-pinned OpenTelemetry Collector image}
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      OCSERV_OTEL_BACKEND_ENDPOINT: ${OCSERV_OTEL_BACKEND_ENDPOINT:-}
    secrets:
      - otel_client_certificate
      - otel_client_key
      - otel_ca_certificate
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    tmpfs:
      - /tmp:size=16m,mode=0700
    networks: [observability]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256

networks:
  # Only transportd needs outbound HTTPS to independent dedicated Relays.
  relay-egress: {}
  frontend: {}
  application:
    internal: true
    ipam:
      config:
        - subnet: ${OCSERV_APPLICATION_SUBNET:-172.30.240.0/24}
          # Keep dynamic allocations away from the gateway, even while it is absent.
          ip_range: ${OCSERV_APPLICATION_IP_RANGE:-172.30.240.128/25}
  database:
    internal: true
  observability:
    internal: true

volumes:
  transport-runtime: {}
  trust-runtime: {}

secrets:
  tls_certificate:
    file: ${OCSERV_SECRET_DIR:?set OCSERV_SECRET_DIR}/tls.crt
  tls_private_key:
    file: ${OCSERV_SECRET_DIR}/tls.key
  database_owner_url:
    file: ${OCSERV_SECRET_DIR}/database-owner-url
  database_app_url:
    file: ${OCSERV_SECRET_DIR}/database-app-url
  session_key:
    file: ${OCSERV_SECRET_DIR}/session-key
  audit_checkpoint_key:
    file: ${OCSERV_SECRET_DIR}/audit-checkpoint-key
  audit_event_key:
    file: ${OCSERV_SECRET_DIR}/audit-event-key
  controller_command_signing_key:
    file: ${OCSERV_SECRET_DIR}/controller-command-signing-key.pem
  controller_command_verification_key:
    file: ${OCSERV_SECRET_DIR}/controller-command-verification-key.pem
  certificate_signer_token:
    file: ${OCSERV_SECRET_DIR}/certificate-signer-token
  relay_access_token:
    file: ${OCSERV_SECRET_DIR}/relay-access-token
  controller_iroh_key:
    file: ${OCSERV_SECRET_DIR}/controller-iroh.key
  otel_client_certificate:
    file: ${OCSERV_SECRET_DIR}/otel-client.crt
  otel_client_key:
    file: ${OCSERV_SECRET_DIR}/otel-client.key
  otel_ca_certificate:
    file: ${OCSERV_SECRET_DIR}/otel-ca.crt
