# Shared-domain ACME overlay, applied after compose.shared-domain.yaml when
# OCSERV_TLS_MODE=acme and OCSERV_PUBLIC_HOST == OCSERV_RELAY_PUBLIC_HOST.
# Gateway obtains and renews the single ACME certificate via TLS-ALPN-01;
# Relay mounts Gateway's ACME volume read-only and reloads the certificate
# for QUIC Address Discovery on UDP 7842.
services:
  relay:
    depends_on:
      gateway:
        condition: service_started
    environment: !override
      IROH_RELAY_ACCESS_TOKEN_FILE: /run/secrets/relay_access_token
      OCSERV_RELAY_CONFIG_TEMPLATE: /etc/iroh-relay/relay.shared-acme.toml
      OCSERV_RELAY_PUBLIC_HOST: ${OCSERV_RELAY_PUBLIC_HOST:?set Relay DNS name}
      OCSERV_RELAY_SHARED_ACME_DIR: /var/lib/caddy-acme
    secrets: !override
      - source: relay_access_token
        target: relay_access_token
        uid: "65532"
        gid: "65532"
        mode: 0400
    command: !override ["--dev", "--config-path", "/tmp/relay.toml"]
    volumes: !override
      - ./integrated/relay.shared-acme.toml:/etc/iroh-relay/relay.shared-acme.toml:ro
      - gateway-acme:/var/lib/caddy-acme:ro
