listen_addresses = '*'
port = 5432
password_encryption = 'scram-sha-256'
ssl = off
max_connections = 100
shared_buffers = '256MB'
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/lib/ocservia-backup/wal/%f && cp %p /var/lib/ocservia-backup/wal/%f'
archive_timeout = '5min'
max_wal_senders = 5
wal_keep_size = '512MB'
logging_collector = off
log_destination = 'stderr'
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d '
