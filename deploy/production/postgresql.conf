listen_addresses = '*'
port = 5432
password_encryption = 'scram-sha-256'
ssl = off
max_connections = 100
# Bundled container limit: shared_buffers / effective_cache_size / work_mem
# 1 GiB: 256MB / 640MB / 2MB
# 2 GiB: 512MB / 1280MB / 4MB (active)
# 4 GiB: 1GB / 2560MB / 8MB
# effective_cache_size estimates shared buffers plus available OS file cache.
shared_buffers = '512MB'
effective_cache_size = '1280MB'
# Per sort or hash operation, per worker; hashes may use hash_mem_multiplier.
work_mem = '4MB'
wal_level = replica
wal_compression = lz4
checkpoint_timeout = '10min'
checkpoint_completion_target = 0.9
max_wal_size = '2GB'
archive_mode = off
max_wal_senders = 5
wal_keep_size = '512MB'
logging_collector = off
log_destination = 'stderr'
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d '
# SSD storage: random and sequential reads have similar costs.
random_page_cost = 1.1
effective_io_concurrency = 200
log_min_duration_statement = '250ms'
