schema_version: ocservia.g6-slo.v1

stability:
  window_seconds: 300
  sample_interval_seconds: 5

capacity:
  authorized_real_agents_min: 50
  production_command_inflight_min: 50
  synthetic_command_completion_seconds_p99_max: 30

correctness:
  stale_owner_accepts_max: 0
  stale_scheduler_commits_max: 0
  concurrent_active_scheduler_leaders_max: 1
  duplicate_remote_effects_max: 0
  acknowledged_transaction_loss_max: 0
  unreconciled_outbox_rows_max: 0
  unreconciled_unknown_commands_max: 0
  quarantined_unmatched_command_results_max: 0

recovery:
  database_rpo_seconds_max: 900
  database_rto_seconds_max: 7200
  connection_owner_takeover_seconds_max: 30
  scheduler_takeover_seconds_max: 30
  relay_takeover_seconds_max: 30
  reconnect_storm_recovery_seconds_max: 120

service:
  read_api_success_ratio_min: 0.999
  enqueue_success_ratio_min: 0.999
  enqueue_latency_seconds_p95_max: 0.5
  telemetry_fresh_ratio_min: 0.99
  telemetry_fresh_age_seconds_max: 90
  command_dispatch_ratio_min: 0.99
  command_dispatch_seconds_max: 10
  audit_completeness_ratio_min: 1.0
  terminal_or_reconciled_operation_ratio_min: 1.0

resources:
  controller_rss_growth_ratio_max: 0.20
  transportd_rss_growth_ratio_max: 0.20
  agent_rss_growth_ratio_max: 0.20
  controller_fd_growth_max: 32
  transportd_fd_growth_max: 32
  agent_fd_growth_max: 8
  controller_goroutine_growth_max: 64
  transportd_tokio_task_growth_max: 64
  agent_tokio_task_growth_max: 8
  database_connection_growth_max: 16
  queue_depth_end_max: 0
  outbox_oldest_age_seconds_end_max: 0

required_observations:
  database_failover: true
  dual_primary_prevention: true
  pitr_target_restore: true
  connection_owner_failover: true
  stale_owner_rejection: true
  scheduler_leader_failover: true
  stale_scheduler_rejection: true
  relay_failover: true
  direct_to_relay: true
  relay_to_direct: true
  reconnect_storm: true
  outbox_crash_recovery: true
