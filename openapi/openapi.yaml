openapi: 3.1.2
info:
  title: ocservia API
  version: 1.0.0
  description: Public control-plane API contract.
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0
servers:
  - url: /api/v1
security:
  - oidc: []
  - bearerAuth: []
tags:
  - name: platform
    description: Process health and build metadata.
  - name: operations
    description: Asynchronous control-plane operation state.
  - name: events
    description: Durable platform event rebuild and live stream.
  - name: development
    description: Side-effect-free local development facilities.
  - name: enrollment
    description: One-time node enrollment credentials.
  - name: nodes
    description: Explicit node trust lifecycle.
  - name: configuration
    description: Side-effect-free configuration rendering and remote validation.
paths:
  /livez:
    get:
      operationId: getLiveness
      summary: Get process liveness
      tags: [platform]
      security: []
      responses:
        "200":
          description: The process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "4XX":
          $ref: "#/components/responses/Problem"
  /readyz:
    get:
      operationId: getReadiness
      summary: Get dependency readiness
      tags: [platform]
      security: []
      responses:
        "200":
          description: The process and database schema are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          $ref: "#/components/responses/Problem"
        "4XX":
          $ref: "#/components/responses/Problem"
  /version:
    get:
      operationId: getVersion
      summary: Get build metadata
      tags: [platform]
      security: []
      responses:
        "200":
          description: Build metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildInfo"
        "4XX":
          $ref: "#/components/responses/Problem"
  /operations:
    get:
      operationId: listOperations
      summary: List operations
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Operations ordered from newest to oldest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /operations/{operation_id}:
    get:
      operationId: getOperation
      summary: Get an asynchronous operation
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          description: Operation state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /operations/{operation_id}/events:
    get:
      operationId: watchOperationEvents
      summary: Watch durable operation state changes
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/OperationId"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            $ref: "#/components/schemas/UuidV7"
      responses:
        "200":
          description: SSE stream whose id field is a durable operation event ID.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /operations/queue-metrics:
    get:
      operationId: getOperationQueueMetrics
      summary: Get transactional outbox and command queue metrics
      tags: [operations]
      responses:
        "200":
          description: Current bounded queue metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueMetrics"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /events:
    get:
      operationId: listEvents
      summary: Rebuild platform events from durable state
      tags: [events]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: after
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UuidV7"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Events ordered from oldest to newest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformEventPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /events/stream:
    get:
      operationId: watchEvents
      summary: Watch platform events with SSE resume support
      tags: [events]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            $ref: "#/components/schemas/UuidV7"
      responses:
        "200":
          description: SSE stream whose id field is a durable platform event ID.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /development/simulations:
    post:
      operationId: createLocalSimulation
      summary: Start a side-effect-free local agent simulation
      description: Available only when the local simulator is explicitly enabled outside production.
      tags: [development]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationScenario"
      responses:
        "202":
          description: The simulation was durably queued.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default:
          $ref: "#/components/responses/Problem"
  /development/runtime:
    get:
      operationId: getDevelopmentRuntime
      summary: Read bounded runtime counters for local resilience tests
      description: Available only when the local simulator is explicitly enabled outside production.
      tags: [development]
      security: []
      responses:
        "200":
          description: Current process and database pool counters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevelopmentRuntime"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /enrollment-tokens:
    post:
      operationId: createEnrollmentToken
      summary: Create a one-time enrollment token
      tags: [enrollment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentTokenRequest"
      responses:
        "201":
          description: The plaintext token is returned once and is not persisted.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentToken"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/approval:
    post:
      operationId: approveNode
      summary: Approve a pending node and bind its endpoint identity
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeApproval"
      responses:
        "200":
          description: The node is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeTrustState"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/revocation:
    post:
      operationId: revokeNode
      summary: Revoke a node endpoint and close its current connection
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeRevocation"
      responses:
        "200":
          description: The node is revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeTrustState"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/privd-attestation-credentials:
    post:
      operationId: createPrivdAttestationCredential
      summary: Create a root-provisioning-only one-time privd key credential
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivdAttestationCredentialRequest" }
      responses:
        "201":
          description: One-time root provisioning material, returned once.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivdAttestationCredential" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /nodes/{node_id}/privd-attestation-keys:register:
    post:
      operationId: registerPrivdAttestationKey
      summary: Atomically consume root provisioning proof and bind a privd key
      tags: [nodes]
      security: []
      parameters:
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivdAttestationRegistration" }
      responses:
        "201":
          description: The root-authenticated key is active.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivdAttestationKeyState" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /nodes/{node_id}/privd-attestation-keys:revoke:
    post:
      operationId: revokePrivdAttestationKey
      summary: Revoke a node privd result attestation key
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivdAttestationRevokeRequest" }
      responses:
        "200":
          description: The key is revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivdAttestationKeyState" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /nodes:
    get:
      operationId: listNodes
      summary: List node observed state
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Nodes ordered by stable ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePage"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}:
    get:
      operationId: getNode
      summary: Get current node observed state
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Node state with freshness and path information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeObservedState"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/sessions:
    get:
      operationId: listNodeSessions
      summary: List current sessions observed on a node
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Current observed sessions ordered by stable session ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeSessionPage"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/sessions/{session_id}:disconnect:
    post:
      operationId: disconnectNodeSession
      summary: Disconnect one observed session
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlledOperationRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/sessions/{session_id}:terminate:
    post:
      operationId: terminateNodeSession
      summary: Terminate one observed session and invalidate its reconnect cookie
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlledOperationRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/ip-bans/{ip}:remove:
    post:
      operationId: removeNodeIpBan
      summary: Remove one canonical IP address from the Ocserv ban list
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - name: ip
          in: path
          required: true
          schema: { type: string, format: ip }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlledOperationRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/ip-bans:
    get:
      operationId: listNodeIpBans
      summary: List current IP bans observed on a node
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: At most 200 current typed ban observations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeIpBanPage"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/service:reload:
    post:
      operationId: reloadNodeService
      summary: Reload the fixed Ocserv service unit
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/ApprovalId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlledOperationRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/telemetry:
    get:
      operationId: listNodeTelemetry
      summary: Query bounded raw or rolled-up node telemetry
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - name: metric
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TelemetryMetric"
        - name: resolution
          in: query
          required: false
          schema:
            type: string
            enum: [raw, 5m, 1h]
            default: 5m
        - name: since
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UtcDateTime"
      responses:
        "200":
          description: At most 2000 chronological telemetry points.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryPointPage"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/user-group-state:
    get:
      operationId: listNodeUserGroupState
      summary: List node-scoped desired and observed users and groups
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Desired, observed, drift, pending, and latest operation state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserGroupStatePage" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /nodes/{node_id}/users:
    post:
      operationId: createNodeUser
      summary: Queue creation of one node-scoped user
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DesiredIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreateRequest" }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /nodes/{node_id}/users/{username}:disable:
    post:
      operationId: disableNodeUser
      summary: Queue disabling one node-scoped user
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/Username"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DesiredIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesiredMutationRequest" }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /nodes/{node_id}/users/{username}:enable:
    post:
      operationId: enableNodeUser
      summary: Queue enabling one node-scoped user without changing its password or groups
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/Username"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DesiredIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesiredMutationRequest" }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /nodes/{node_id}/users/{username}:rotate-password:
    post:
      operationId: rotateNodeUserPassword
      summary: Queue write-only password rotation using node-sealed ciphertext
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/Username"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DesiredIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRotateRequest" }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /nodes/{node_id}/users/{username}/policy:
    get:
      operationId: getNodeUserPolicy
      summary: Get desired quota and UTC expiry with observed usage
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/Username"
      responses:
        "200":
          description: Desired policy and current observed UTC-period usage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPolicy" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: setNodeUserPolicy
      summary: Set byte quota and exact UTC expiry for one node-scoped user
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/Username"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPolicyRequest" }
