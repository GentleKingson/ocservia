  /auth/login:
    post:
      operationId: loginLocal
      summary: Authenticate with a local username and password
      description: Requires Local authentication and the exact PUBLIC_ORIGIN. Body is limited to 8192 bytes (or the configured request limit if smaller). Invalid credentials return the same 401 response. Limited to 5 attempts per source and 120 globally per minute, with at most 4 concurrent requests.
      tags: [platform]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalLoginRequest" }
      responses:
        "204":
          description: Shared secure session established.
          headers:
            Set-Cookie:
              description: __Host-ocservia_session with Secure, HttpOnly, Path=/ and SameSite=Lax.
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/CrossOriginRequest" }
        "404": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429":
          description: Authentication rate or concurrency limit reached.
          headers:
            Retry-After:
              description: Seconds before retrying authentication.
              schema: { type: integer, minimum: 1 }
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        default: { $ref: "#/components/responses/Problem" }
  /auth/change-password:
    post:
      operationId: changeLocalPassword
      summary: Change the current Local session owner's password
      tags: [platform]
      security:
        - sessionCookie: []
      description: Requires exact Origin and a valid non-break-glass Local session. No target identity or workspace may be submitted. Verifies the current password under the shared Local account attempt protection and applies the new-password policy. Credential version, disabled state and session validity are rechecked in the transaction. Success atomically changes the password, revokes all sessions and appends audit; the caller must log in again. Break-glass sessions cannot use this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 1
                  description: Current password, at most 1024 UTF-8 bytes; never normalized.
                new_password:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 15
                  description: 15 or more Unicode code points, at most 1024 UTF-8 bytes; must pass the common, compromised and service-related password blocklist. Never normalized.
      responses:
        "204": { description: "Password changed, all old sessions revoked and cookie cleared. Log in again." }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current server-side session
      tags: [platform]
      responses:
        "204": { description: Session revoked and cookie cleared. }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/break-glass:
    post:
      operationId: useBreakGlass
      summary: Use explicitly enabled offline emergency access
      tags: [platform]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BreakGlassRequest" }
      responses:
        "204": { description: Short-lived emergency session established; alert and rotation requirement recorded. }
        "401": { $ref: "#/components/responses/Problem" }
        "423": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/CrossOriginRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /workspaces:
    get:
      operationId: listAuthorizedWorkspaces
      summary: List only workspaces visible to the current principal
      tags: [platform]
      responses:
        "200":
          description: Authorized workspaces.
          content: { application/json: { schema: { $ref: "#/components/schemas/WorkspacePage" } } }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /audit/vpn:
    get:
      operationId: listVpnAuditRecords
      summary: Query workspace VPN lifecycle events, reconciled snapshots or network flows
      tags: [events]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/PageSize" }
        - { in: query, name: cursor, schema: { type: string, maxLength: 2048 } }
        - { in: query, name: kind, schema: { type: string, enum: [sessions, observations, network], default: sessions } }
        - { in: query, name: destination_ip, schema: { type: string } }
        - { in: query, name: username, schema: { type: string, maxLength: 128 } }
        - { in: query, name: node_id, schema: { type: string, format: uuid } }
        - { in: query, name: since, schema: { type: string, format: date-time } }
        - { in: query, name: until, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Matching audit records, newest first, with a cursor for the next page.
          content: { application/json: { schema: { $ref: "#/components/schemas/VpnAuditPage" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /audit/events:
    get:
      operationId: listAuditEvents
      summary: List append-only audit events
      tags: [events]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: Audit events with chain hashes.
          content: { application/json: { schema: { $ref: "#/components/schemas/AuditEventPage" } } }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /audit:verify:
    post:
      operationId: verifyAuditChain
      summary: Verify the workspace audit hash chain and latest checkpoint
      tags: [events]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      responses:
        "200":
          description: Chain and checkpoint are valid.
          content: { application/json: { schema: { $ref: "#/components/schemas/AuditVerification" } } }
        "409":
          description: The chain or latest checkpoint failed verification.
          content: { application/json: { schema: { $ref: "#/components/schemas/AuditVerification" } } }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ocservia_session
      description: Shared Secure, HttpOnly, SameSite server-side session established by Local or break-glass authentication.
    bearerAuth:
      type: http
      scheme: bearer
      description: Development bearer authentication.
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the previous page.
      required: false
      schema:
        $ref: "#/components/schemas/Cursor"
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV7"
    NodeId:
      name: node_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV7"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"
        maxLength: 20
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
        pattern: '^"revision-[1-9][0-9]*"$'
    DesiredIfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
        pattern: '^"revision-(0|[1-9][0-9]*)"$'
    Username:
      name: username
      in: path
      required: true
      schema: { $ref: "#/components/schemas/OcservName" }
    GroupName:
      name: group_name
      in: path
      required: true
      schema: { $ref: "#/components/schemas/OcservName" }
    WorkspaceId:
      name: X-Workspace-ID
      in: header
      description: Required when the principal can access more than one workspace; otherwise the sole authorized workspace is inferred.
      required: false
      schema: { $ref: "#/components/schemas/UuidV7" }
  responses:
    Problem:
      description: Request failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CrossOriginRequest:
      description: A cookie-authenticated mutation must originate from the exact public browser origin; a sibling origin, an unknown site, a missing Origin header, or a cross-site Fetch Metadata signal is rejected before authorization.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: Request bodies must use the application/json media type; JSON parsers never accept text, form, or multipart payloads.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    OperationAccepted:
      description: The typed operation intent, command, outbox event, and audit intent were committed atomically.
      headers:
        Location:
          required: true
          schema: { type: string }
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, enum: ["true"] }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Operation"
  schemas:
    LocalLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          description: Local username; at most 128 UTF-8 bytes, normalized by the authentication core.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: At most 1024 UTF-8 bytes. Never returned or logged.
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    BuildInfo:
      type: object
      additionalProperties: false
      required: [version, commit, role]
      properties:
        version:
          type: string
          minLength: 1
        commit:
          type: string
          minLength: 1
        role:
          type: string
          enum: [api, worker, scheduler, all]
        recommended_agent_version:
          description: Operator-configured recommended agent version; absent when no recommendation is configured.
          type: string
          minLength: 1
          maxLength: 128
    UuidV7:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      example: 0193c1b2-7d8a-7f01-8a2d-1e5b4f302901
    UtcDateTime:
      type: string
      format: date-time
      description: RFC 3339 timestamp normalized to UTC.
      example: "2026-08-01T16:00:00Z"
    OcservName:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$"
      minLength: 1
      maxLength: 64
    Cursor:
      type: string
      minLength: 1
      maxLength: 2048
      description: Opaque pagination position; clients must not parse it.
    OperationState:
      type: string
      enum:
        - draft
        - queued
        - dispatched
        - accepted
        - running
        - succeeded
        - failed
        - unknown
        - expired
        - rolled_back
        - offline_pending
        - drifted
        - superseded
    Operation:
      type: object
      additionalProperties: false
      required: [id, state, version, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        state:
          $ref: "#/components/schemas/OperationState"
        node_id:
          $ref: "#/components/schemas/UuidV7"
        command_id:
          $ref: "#/components/schemas/UuidV7"
        config_apply_state:
          type: string
          enum: [queued, dispatched, accepted, running, succeeded, failed, rolled_back, failed_critical, unknown, expired]
          description: Typed configuration outcome when this operation applies a configuration plan.
        config_apply_failure_code:
          type: string
          minLength: 1
          maxLength: 128
        agent_upgrade_state:
          type: string
          enum: [queued, accepted, running, succeeded, failed, rolled_back, unknown]
          description: Reconciled single-node upgrade outcome when this operation upgrades the node agent.
        agent_upgrade_target_version:
          type: string
          minLength: 1
          maxLength: 128
          description: Trusted target agent version of this upgrade operation.
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          $ref: "#/components/schemas/TelemetryTimestamp"
        updated_at:
          $ref: "#/components/schemas/TelemetryTimestamp"
        expires_at:
          $ref: "#/components/schemas/TelemetryTimestamp"
    SyntheticCommandRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [noop, echo]
        message:
          type: string
          maxLength: 4096
        expected_version:
          type: integer
          format: int64
          minimum: 1
        ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 86400
          default: 60
        supersede_pending:
          type: boolean
          default: false
      description: expected_version is required unless If-Match supplies the same revision.
    ControlledOperationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        boot_id:
          type: string
          format: uuid
          description: Required for session operations; must match the observed node boot.
        reason:
          type: string
          minLength: 1
          maxLength: 512
        expected_version:
          type: integer
          format: int64
          minimum: 1
        ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 300
          default: 60
      description: expected_version is required unless If-Match supplies the same revision.
    AgentUpgradeRequest:
      type: object
      additionalProperties: false
      required: [target_version, reason]
      properties:
        target_version:
          type: string
          minLength: 5
          maxLength: 128
          description: Semantic version of the trusted release; the digest resolves server-side.
        reason: { type: string, minLength: 1, maxLength: 512 }
        expected_version: { type: integer, format: int64, minimum: 1 }
        ttl_seconds:
          type: integer
          format: int64
          minimum: 60
          maximum: 3600
          default: 300
          description: Bounded dispatch and scheduling acknowledgement window; the restart and reconciliation windows are separate and server-owned.
      description: expected_version is required unless If-Match supplies the same revision.
    DesiredMutationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 512 }
        expected_version: { type: integer, format: int64, minimum: 0 }
        ttl_seconds: { type: integer, format: int64, minimum: 1, maximum: 86400, default: 86400 }
      description: expected_version is required unless If-Match supplies the same desired version.
    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [name, sealed_password, reason]
      properties:
        name: { $ref: "#/components/schemas/OcservName" }
        sealed_password: { $ref: "#/components/schemas/UserPasswordSealedSecretV1" }
        reason: { type: string, minLength: 1, maxLength: 512 }
        expected_version: { type: integer, format: int64, minimum: 0 }
        ttl_seconds: { type: integer, format: int64, minimum: 1, maximum: 86400, default: 86400 }
    PasswordRotateRequest:
      type: object
      additionalProperties: false
      required: [sealed_password, reason]
      properties:
        sealed_password: { $ref: "#/components/schemas/UserPasswordSealedSecretV1" }
        reason: { type: string, minLength: 1, maxLength: 512 }
        expected_version: { type: integer, format: int64, minimum: 1 }
        ttl_seconds: { type: integer, format: int64, minimum: 1, maximum: 86400, default: 86400 }
    UserPasswordSealingKey:
      type: object
      required: [workspace_id, node_id, endpoint_id, purpose, version, key_id, public_key_sha256, public_key_der]
      properties:
        workspace_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        endpoint_id: { type: string, pattern: "^[0-9a-f]{64}$" }
        purpose: { type: string, enum: [user_password] }
        version: { type: integer, enum: [1] }
        key_id: { type: string, minLength: 1, maxLength: 128 }
        public_key_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        public_key_der: { type: string, format: byte, maxLength: 1368, description: Standard base64 of the RSA SubjectPublicKeyInfo DER. }
    UserPasswordSealedSecretV1:
      type: object
      additionalProperties: false
      required: [version, purpose, key_id, ciphertext]
      properties:
        version: { type: integer, format: int32, enum: [1] }
        purpose: { type: string, enum: [user_password] }
        key_id: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9_.-]+$" }
        ciphertext:
          type: string
          format: byte
          minLength: 44
          maxLength: 5464
          writeOnly: true
          description: Purpose-specific RSA-OAEP-SHA256 ciphertext; plaintext and cross-purpose ciphertext are never accepted.
    GroupApplyRequest:
      type: object
      additionalProperties: false
      required: [members, reason]
      properties:
        members:
          type: array
          maxItems: 384
          uniqueItems: true
          items: { $ref: "#/components/schemas/OcservName" }
        reason: { type: string, minLength: 1, maxLength: 512 }
        expected_version: { type: integer, format: int64, minimum: 0 }
        ttl_seconds: { type: integer, format: int64, minimum: 1, maximum: 86400, default: 86400 }
    UserGroupResourceState:
      type: object
      additionalProperties: false
      required: [kind, name, convergence, recovery_required]
      properties:
        kind: { type: string, enum: [user, group] }
        name: { $ref: "#/components/schemas/OcservName" }
        desired_enabled: { type: boolean }
        observed_enabled: { type: boolean }
        desired_members:
          type: array
          items: { type: [string, "null"] }
          maxItems: 4096
        observed_members:
          type: array
          items: { type: [string, "null"] }
          maxItems: 4096
        desired_member_dimensions:
          $ref: "#/components/schemas/ResourceMemberDimensions"
        observed_member_dimensions:
          $ref: "#/components/schemas/ResourceMemberDimensions"
        desired_version: { type: integer, format: int64, minimum: 1 }
        desired_revision: { type: integer, format: int64, minimum: 1 }
        observed_revision: { type: integer, format: int64, minimum: 0 }
        desired_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
        observed_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
        convergence: { type: string, enum: [converged, pending, offline_pending, drifted] }
        operation_id: { $ref: "#/components/schemas/UuidV7" }
        operation_state: { $ref: "#/components/schemas/OperationState" }
        recovery_required: { type: boolean }
        recovery_mutation_kind:
          type: string
          enum: [user_create, user_disable, user_enable, user_password_rotate, group_apply]
        observed_at: { $ref: "#/components/schemas/TelemetryTimestamp" }
    ResourceMemberDimensions:
      type: array
      minItems: 1
      maxItems: 6
      description: Present only for multidimensional or non-one-based arrays. Members are in row-major order; absence means an ordinary one-based list or empty array.
      items:
        type: object
        additionalProperties: false
        required: [length, lower_bound]
        properties:
          length: { type: integer, format: int32, minimum: 1 }
          lower_bound: { type: integer, format: int32 }
    UserGroupStatePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1536
          items: { $ref: "#/components/schemas/UserGroupResourceState" }
    ConfigSecretRef:
      type: object
      additionalProperties: false
      required: [secret_ref_id]
      properties:
        secret_ref_id: { $ref: "#/components/schemas/UuidV7" }
    ConfigDirective:
      type: object
      additionalProperties: false
      required: [name]
      description: Exactly one of value and secret_ref must be provided.
      properties:
        name: { type: string, minLength: 1, maxLength: 64, pattern: "^[a-z][a-z0-9-]*$" }
        value: { type: string, minLength: 1, maxLength: 4096 }
        secret_ref: { $ref: "#/components/schemas/ConfigSecretRef" }
    ConfigTemplate:
      type: object
      additionalProperties: false
      required: [name, directives]
      properties:
        name: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$" }
        directives:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/ConfigDirective" }
    ConfigPlanRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, template, ttl_seconds, reason]
      properties:
        expected_revision: { type: integer, format: int64, minimum: 0 }
        template: { $ref: "#/components/schemas/ConfigTemplate" }
        ttl_seconds: { type: integer, format: int64, minimum: 60, maximum: 3600 }
        reason: { type: string, minLength: 1, maxLength: 512 }
    ConfigPlan:
      type: object
      additionalProperties: false
      required: [id, workspace_id, node_id, operation_id, template_name, expected_revision, candidate_hash, state, validation, diff_redacted, warnings, current_unchanged, staging_cleaned, expires_at, created_at]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        workspace_id: { $ref: "#/components/schemas/UuidV7" }
        node_id: { $ref: "#/components/schemas/UuidV7" }
        operation_id: { $ref: "#/components/schemas/UuidV7" }
        template_name: { type: string, minLength: 1, maxLength: 128 }
        expected_revision: { type: integer, format: int64, minimum: 0 }
        candidate_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        materialized_hash: { type: string, pattern: "^[0-9a-f]{64}$", description: Exact root-attested configuration file hash for the complete node-local TLS profile. }
        state: { $ref: "#/components/schemas/OperationState" }
        validation: { type: string, enum: [pending, valid, failed, rejected, unknown, expired] }
        diff_redacted: { type: string, maxLength: 262144, description: Secret-safe line diff; secret keys and values are never included. }
        warnings: { type: array, items: {}, description: Stored JSONB warning array plus verified validation warning strings. }
        current_unchanged: { type: boolean }
        staging_cleaned: { type: boolean }
        current_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        expires_at: { $ref: "#/components/schemas/TelemetryTimestamp" }
        created_at: { $ref: "#/components/schemas/TelemetryTimestamp" }
    ConfigApplyRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 512 }
    CertificateRequest:
      type: object
      additionalProperties: false
      required: [expected_version, common_name, key_bits, reason]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        common_name: { type: string, minLength: 1, maxLength: 253, pattern: "^[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?$" }
        dns_names:
          type: array
          maxItems: 32
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 253 }
        key_bits: { type: integer, format: int32, enum: [2048, 3072, 4096] }
        reason: { type: string, minLength: 1, maxLength: 512 }
    CertificateIssueRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 512 }
    CertificateRevokeRequest:
      type: object
      additionalProperties: false
      required: [expected_version, certificate_version, reason]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        certificate_version: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 128 }
    CertificateP12Request:
      type: object
      additionalProperties: false
      required: [expected_version, certificate_version, artifact_request_id, reason]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        certificate_version: { type: integer, format: int64, minimum: 1 }
        artifact_request_id: { $ref: "#/components/schemas/UuidV7" }
        reason: { type: string, minLength: 1, maxLength: 512 }
    ArtifactGrant:
      type: object
      additionalProperties: false
      required: [artifact_id, operation, expires_at]
      properties:
        artifact_id: { $ref: "#/components/schemas/UuidV7" }
        operation: { $ref: "#/components/schemas/Operation" }
        download_token: { type: string, minLength: 43, maxLength: 43, writeOnly: true }
        password: { type: string, minLength: 32, maxLength: 32, writeOnly: true }
        expires_at: { $ref: "#/components/schemas/TelemetryTimestamp" }
    SecretProviderRefRequest:
      type: object
      additionalProperties: false
      required: [provider, key_path, version, reason]
      properties:
        provider: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" }
        key_path: { type: string, minLength: 1, maxLength: 512 }
        version: { type: string, minLength: 1, maxLength: 128 }
        reason: { type: string, minLength: 1, maxLength: 512 }
    SecretProviderRotateRequest:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version: { type: string, minLength: 1, maxLength: 128 }
        reason: { type: string, minLength: 1, maxLength: 512 }
    SecretProviderRef:
      type: object
      additionalProperties: false
      required: [id, workspace_id, provider, key_path, version, state, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        workspace_id: { $ref: "#/components/schemas/UuidV7" }
        provider: { type: string, maxLength: 64 }
        key_path: { type: string, maxLength: 512 }
        version: { type: string, maxLength: 128 }
        state: { type: string, enum: [active, rotating, disabled, unavailable] }
        rotated_at: { $ref: "#/components/schemas/TelemetryTimestamp" }
        created_at: { $ref: "#/components/schemas/TelemetryTimestamp" }
        updated_at: { $ref: "#/components/schemas/TelemetryTimestamp" }
    Certificate:
      type: object
      additionalProperties: false
      required: [id, workspace_id, node_id, operation_id, common_name, dns_names, key_bits, state, version, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        workspace_id: { $ref: "#/components/schemas/UuidV7" }
        node_id: { $ref: "#/components/schemas/UuidV7" }
        operation_id: { $ref: "#/components/schemas/UuidV7" }
        common_name: { type: string, minLength: 1, maxLength: 253 }
        dns_names: { type: array, items: {} }
        key_bits: { type: integer, format: int32, enum: [2048, 3072, 4096] }
        state: { type: string, enum: [csr_pending, csr_ready, signing, signer_unavailable, issued, expiring, expired, revoking, revocation_unknown, revoked, failed, unknown] }
        version: { type: integer, format: int64, minimum: 1 }
        public_key_sha256: { type: string, format: byte, description: SHA-256 of the node-local public key. }
        serial_number: { type: string, maxLength: 128 }
        not_before: { $ref: "#/components/schemas/TelemetryTimestamp" }
        not_after: { $ref: "#/components/schemas/TelemetryTimestamp" }
        revoked_at: { $ref: "#/components/schemas/TelemetryTimestamp" }
        created_at: { $ref: "#/components/schemas/TelemetryTimestamp" }
        updated_at: { $ref: "#/components/schemas/TelemetryTimestamp" }
    UserPolicyRequest:
      type: object
      additionalProperties: false
      required: [quota_period, quota_direction, quota_bytes, expected_version, reason]
      properties:
        quota_period: { type: string, enum: [none, monthly, lifetime] }
        quota_direction: { type: string, enum: [rx, tx, rxtx] }
        quota_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Integer bytes; none requires zero.
        expires_at:
          allOf: [{ $ref: "#/components/schemas/UtcDateTime" }]
          description: RFC 3339 UTC timestamp ending in Z; the parsed instant must have zero nanoseconds.
        expected_version: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 512 }
    UserPolicy:
      type: object
      additionalProperties: false
      required: [node_id, username, quota_period, quota_direction, quota_bytes, version, period_start, observed_rx_bytes, observed_tx_bytes, exceeded, expired, convergence]
      properties:
        node_id: { $ref: "#/components/schemas/UuidV7" }
        username: { $ref: "#/components/schemas/OcservName" }
        quota_period: { type: string, enum: [none, monthly, lifetime] }
        quota_direction: { type: string, enum: [rx, tx, rxtx] }
        quota_bytes: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
        expires_at: { $ref: "#/components/schemas/TelemetryTimestamp" }
        version: { type: integer, format: int64, minimum: 1 }
        period_start: { $ref: "#/components/schemas/TelemetryTimestamp" }
        observed_rx_bytes: { type: integer, format: int64, minimum: 0 }
        observed_tx_bytes: { type: integer, format: int64, minimum: 0 }
        observed_at: { $ref: "#/components/schemas/TelemetryTimestamp" }
        exceeded: { type: boolean }
        expired: { type: boolean }
        convergence: { type: string, enum: [converged, pending, offline_pending, drifted] }
    AgentRolloutCreateRequest:
      type: object
      additionalProperties: false
      required: [target_version, node_ids, reason]
      properties:
        target_version:
          type: string
          minLength: 5
          maxLength: 128
          description: Semantic version of the trusted release; every package digest resolves server-side per node architecture.
        node_ids:
          type: array
          minItems: 1
          maxItems: 500
          description: Candidate nodes; the server sorts, deduplicates, and rechecks eligibility. Ineligible nodes are excluded with a reason.
          items: { $ref: "#/components/schemas/UuidV7" }
        batch_size:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: Nodes per batch after the mandatory one-node canary.
        reason: { type: string, minLength: 1, maxLength: 512 }
      description: The immutable rollout request hash binds target version, sorted node set, batch size and stop-on-failure policy.
    AgentRolloutNode:
      type: object
      additionalProperties: false
      required: [node_id, ordinal, batch, state]
      properties:
        node_id: { $ref: "#/components/schemas/UuidV7" }
        ordinal: { type: integer, minimum: 0 }
        batch:
          type: integer
          minimum: 0
          description: Batch 0 is the mandatory single-node canary.
        state:
          type: string
          enum: [pending, running, succeeded, failed, rolled_back, unknown, skipped]
        operation_id:
          $ref: "#/components/schemas/UuidV7"
        from_version: { type: string }
        failure_code: { type: string }
      description: One selected node in stable sorted order; operation_id links to the underlying single-node upgrade operation.
    AgentRolloutExclusion:
      type: object
      additionalProperties: false
      required: [node_id, reason]
      properties:
        node_id: { $ref: "#/components/schemas/UuidV7" }
        reason:
          type: string
          description: Eligibility reason; readers retain unknown historical reason codes.
    AgentRollout:
      type: object
      additionalProperties: false
      required: [id, workspace_id, target_version, state, batch_size, stop_on_failure, reason, created_by, current_batch, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        workspace_id: { $ref: "#/components/schemas/UuidV7" }
        target_version: { type: string }
        state: { type: string, enum: [queued, running, paused, succeeded, failed, cancelled] }
        batch_size: { type: integer, minimum: 1, maximum: 20 }
        stop_on_failure: { type: boolean }
        reason: { type: string }
        created_by: { $ref: "#/components/schemas/UuidV7" }
        current_batch: { type: integer, minimum: 0 }
        pause_code: { type: string }
        created_at: { $ref: "#/components/schemas/TelemetryTimestamp" }
        updated_at: { $ref: "#/components/schemas/TelemetryTimestamp" }
        nodes:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/AgentRolloutNode" }
        excluded:
          type: array
          maxItems: 500
          items:
            anyOf:
              - { $ref: "#/components/schemas/AgentRolloutExclusion" }
              - type: [object, array, string, number, boolean, "null"]
                description: Unclassified historical stored JSON.
          description: Current entries follow AgentRolloutExclusion. Historical stored JSON values remain readable unchanged.
      description: Durable server-side orchestration state; failed and unknown node outcomes always pause the rollout.
    AgentRolloutPage:
      type: object
      additionalProperties: false
      required: [rollouts]
      properties:
        rollouts:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/AgentRollout" }
    QueueMetrics:
      type: object
      additionalProperties: false
      required: [outbox_unpublished_total, outbox_oldest_age_seconds, command_queue_depth, command_unknown_total, config_rollback_total, config_failed_critical_total]
      properties:
        outbox_unpublished_total:
          type: integer
          format: int64
          minimum: 0
        outbox_oldest_age_seconds:
          type: number
          format: double
          minimum: 0
        command_queue_depth:
          type: integer
          format: int64
          minimum: 0
        command_unknown_total:
          type: integer
          format: int64
          minimum: 0
        config_rollback_total:
          type: integer
          format: int64
          minimum: 0
        config_failed_critical_total:
          type: integer
          format: int64
          minimum: 0
    OperationSummary:
      type: object
      additionalProperties: false
      required: [active, unknown]
      properties:
        active:
          type: integer
          format: int64
          minimum: 0
          description: Operations in a non-terminal state other than unknown.
        unknown:
          type: integer
          format: int64
          minimum: 0
          description: Operations in the unknown recovery state.
    SimulationScenario:
      type: object
      additionalProperties: false
      properties:
        heartbeat_count:
          type: integer
          format: int32
          minimum: 1
          maximum: 32
          default: 3
        delay_millis:
          type: integer
          format: int32
          minimum: 0
          maximum: 30000
          default: 100
        duplicate_event:
          type: boolean
          default: false
        return_error:
          type: boolean
          default: false
        disconnect_after:
          type: boolean
          default: false
    DevelopmentRuntime:
      type: object
      additionalProperties: false
      required: [goroutines, db_acquired, db_idle, db_total, sse_active_streams, sse_rejected_streams, sse_watchers, sse_unhealthy_watchers, sse_sql_queries, sse_slow_consumer_disconnects, sse_database_backoff_seconds, privd_receipt_verifications, privd_attestation_key_states]
      properties:
        goroutines:
          type: integer
          format: int32
          minimum: 1
        db_acquired:
          type: integer
          format: int32
          minimum: 0
        db_idle:
          type: integer
          format: int32
          minimum: 0
        db_total:
          type: integer
          format: int32
          minimum: 0
        sse_active_streams: { type: integer, format: int32, minimum: 0 }
        sse_rejected_streams: { type: integer, format: int64, minimum: 0 }
        sse_watchers: { type: integer, format: int32, minimum: 0 }
        sse_unhealthy_watchers: { type: integer, format: int32, minimum: 0 }
        sse_sql_queries: { type: integer, format: int64, minimum: 0 }
        sse_slow_consumer_disconnects: { type: integer, format: int64, minimum: 0 }
        sse_database_backoff_seconds: { type: number, format: double, minimum: 0 }
        privd_receipt_verifications:
          type: array
          maxItems: 11
          items: { $ref: "#/components/schemas/PrivdReceiptVerificationMetric" }
        privd_attestation_key_states:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/PrivdAttestationKeyStateMetric" }
        privd_attestation_key_states_available:
          type: boolean
    PrivdReceiptVerificationMetric:
      type: object
      additionalProperties: false
      required: [outcome, reason, total]
      properties:
        outcome: { type: string, enum: [not_required, verified, missing, invalid, unknown_key, revoked_key] }
        reason: { type: string, enum: [not_required, verified, receipt_missing, receipt_malformed, receipt_version_unsupported, receipt_claim_mismatch, receipt_key_lookup_failed, receipt_key_outside_validity, receipt_signature_invalid, receipt_key_unknown, receipt_key_revoked] }
        total: { type: integer, format: int64, minimum: 0 }
    PrivdAttestationKeyStateMetric:
      type: object
      additionalProperties: false
      required: [state, total]
      properties:
        state: { type: string, enum: [pending, active, revoked] }
        total: { type: integer, format: int64, minimum: 0 }
