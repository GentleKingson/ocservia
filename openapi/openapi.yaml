        protocol: { type: string }
        flow_started_at: { type: string, format: date-time }
        node_id: { type: string, format: uuid }
        session_id: { type: string }
        username: { type: string }
        client_ip: { type: string }
        vpn_ip: { type: string }
        connected_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        absent_at: { type: string, format: date-time }
        bytes_in: { type: string, pattern: "^[0-9]+$" }
        bytes_out: { type: string, pattern: "^[0-9]+$" }
    AuditEventPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/AuditEvent" }
    AuditVerification:
      type: object
      additionalProperties: false
      required: [workspace_id, events, compacted_events, valid, checkpoint_valid]
      properties:
        workspace_id: { $ref: "#/components/schemas/UuidV7" }
        events: { type: integer, format: int64, minimum: 0 }
        valid: { type: boolean }
        compacted_events:
          type: integer
          format: int64
          minimum: 0
          description: Events whose aged detail is replaced by an authenticated retained record.
        checkpoint_valid: { type: boolean }
    Problem:
      type: object
      additionalProperties: true
      description: RFC 9457 Problem Details response.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
          minLength: 1
          maxLength: 256
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 4096
        instance:
          type: string
          format: uri-reference
        trace_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
