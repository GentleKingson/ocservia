openapi: 3.1.2
info:
  title: ocservia API
  version: 1.0.0
  description: Public control-plane API contract.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerAuth: []
tags:
  - name: platform
    description: Process health and build metadata.
  - name: operations
    description: Asynchronous control-plane operation state.
  - name: events
    description: Durable platform event rebuild and live stream.
  - name: development
    description: Side-effect-free local development facilities.
  - name: enrollment
    description: One-time node enrollment credentials.
  - name: nodes
    description: Explicit node trust lifecycle.
  - name: configuration
    description: Side-effect-free configuration rendering and remote validation.
paths:
  /livez:
    get:
      operationId: getLiveness
      summary: Get process liveness
      tags: [platform]
      security: []
      responses:
        "200":
          description: The process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "4XX":
          $ref: "#/components/responses/Problem"
  /readyz:
    get:
      operationId: getReadiness
      summary: Get dependency readiness
      tags: [platform]
      security: []
      responses:
        "200":
          description: The process and database schema are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          $ref: "#/components/responses/Problem"
        "4XX":
          $ref: "#/components/responses/Problem"
  /version:
    get:
      operationId: getVersion
      summary: Get build metadata
      tags: [platform]
      security: []
      responses:
        "200":
          description: Build metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildInfo"
        "4XX":
          $ref: "#/components/responses/Problem"
  /operations:
    get:
      operationId: listOperations
      summary: List operations
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Operations ordered from newest to oldest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /operations/summary:
    get:
      operationId: getOperationSummary
      summary: Get workspace-wide operation state counters
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace-wide operation counts, accurate beyond any page limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationSummary"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /operations/{operation_id}:
    get:
      operationId: getOperation
      summary: Get an asynchronous operation
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          description: Operation state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /operations/{operation_id}/events:
    get:
      operationId: watchOperationEvents
      summary: Watch durable operation state changes
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/OperationId"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            $ref: "#/components/schemas/UuidV7"
        - name: after
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UuidV7"
          description: Exclusive event cursor alternative to Last-Event-ID.
      responses:
        "200":
          description: SSE stream whose id field is a durable operation event ID.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /operations/queue-metrics:
    get:
      operationId: getOperationQueueMetrics
      summary: Get transactional outbox and command queue metrics
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Current bounded queue metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueMetrics"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /events:
    get:
      operationId: listEvents
      summary: Rebuild platform events from durable state
      tags: [events]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: after
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UuidV7"
          description: >-
            Exclusive event cursor; in asc order it resumes after the event,
            in desc order it resumes before the event.
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: >-
            Events ordered from oldest to newest, or from newest to oldest
            when order is desc.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformEventPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /events/stream:
    get:
      operationId: watchEvents
      summary: Watch platform events with SSE resume support
      tags: [events]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: workspace_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UuidV7"
          description: Workspace UUIDv7 query parameter alternative to X-Workspace-ID (required for the development principal).
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            $ref: "#/components/schemas/UuidV7"
        - name: after
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UuidV7"
          description: Exclusive event cursor alternative to Last-Event-ID.
      responses:
        "200":
          description: SSE stream whose id field is a durable platform event ID.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /development/simulations:
    post:
      operationId: createLocalSimulation
      summary: Start a side-effect-free local agent simulation
      description: Available only when the local simulator is explicitly enabled outside production; requires the development principal and a loopback Host header.
      tags: [development]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationScenario"
      responses:
        "202":
          description: The simulation was durably queued.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default:
          $ref: "#/components/responses/Problem"
  /development/runtime:
    get:
      operationId: getDevelopmentRuntime
      summary: Read bounded runtime counters for local resilience tests
      description: Available only when the local simulator is explicitly enabled outside production; requires the development principal and a loopback Host header.
      tags: [development]
      security: []
      responses:
        "200":
          description: Current process and database pool counters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevelopmentRuntime"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /node-bootstrap-tokens:
    post:
      operationId: createNodeBootstrapToken
      summary: Create a one-time node installation token
      tags: [enrollment]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeBootstrapTokenRequest"
      responses:
        "201":
          description: The plaintext token is returned once and is not persisted.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeBootstrapToken"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default:
          $ref: "#/components/responses/Problem"
  /node-bootstrap/config:
    post:
      operationId: getNodeBootstrapConfiguration
      summary: Exchange the root installation token for node configuration
      description: HTTPS only. Keep the installation token root-only; only enrollment_token may be passed to the Agent. Successful retries return the same derived credentials while the token is unexpired; a consumed token remains bound to its original node and endpoint. Responses must never be cached or logged.
      tags: [enrollment]
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NodeInstallationTokenRequest" } } }
      responses:
        "200":
          description: Bootstrap configuration for the root installer.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content: { application/json: { schema: { $ref: "#/components/schemas/NodeBootstrapConfiguration" } } }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /node-bootstrap/attestation:
    post:
      operationId: getNodeBootstrapAttestationChallenge
      summary: Obtain a root-only privd registration challenge
      tags: [enrollment]
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NodeBootstrapAttestationRequest" } } }
      responses:
        "200":
          description: Registration challenge bound to the enrolled node identity.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content: { application/json: { schema: { $ref: "#/components/schemas/NodeBootstrapAttestationChallenge" } } }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /node-bootstrap/register:
    post:
      operationId: registerNodeBootstrapAttestation
      summary: Register the root privd key and complete installation authorization
      description: Atomically binds the verified root key and consumes installation authorization. Recovery may replay only the identical completed registration; it cannot substitute a node or key.
      tags: [enrollment]
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NodeBootstrapRegistrationRequest" } } }
      responses:
        "201":
          description: The privd key is registered and active.
          content:
            application/json:
              schema:
                type: object
                required: [key_id, state]
                properties:
                  key_id: { type: string }
                  state: { type: string, const: active }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /node-bootstrap/status:
    post:
      operationId: getNodeBootstrapStatus
      summary: Verify that the installed node is active and online
      description: Requires the root installation token and its enrolled identity binding. Returns Controller observations so local systemd state alone cannot complete installation.
      tags: [enrollment]
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NodeBootstrapAttestationRequest" } } }
      responses:
        "200":
          description: Current Controller observations for this installation only.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [trust_status, connection_state, freshness, attestation_registered]
                properties:
                  trust_status: { type: string }
                  connection_state: { type: string }
                  freshness: { type: string }
                  attestation_registered: { type: boolean }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /nodes/{node_id}/revocation:
    post:
      operationId: revokeNode
      summary: Revoke a node endpoint and close its current connection
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeRevocation"
      responses:
        "200":
          description: The node is revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeTrustState"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default:
          $ref: "#/components/responses/Problem"
  /nodes:
    get:
      operationId: listNodes
      summary: List node observed state
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Nodes ordered by stable ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePage"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}:
    get:
      operationId: getNode
      summary: Get current node observed state
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Node state with freshness and path information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeObservedState"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/sessions:
    get:
      operationId: listNodeSessions
      summary: List current sessions observed on a node
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Current observed sessions ordered by stable session ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeSessionPage"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/sessions/{session_id}:disconnect:
    post:
      operationId: disconnectNodeSession
      summary: Disconnect one observed session
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlledOperationRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/sessions/{session_id}:terminate:
    post:
      operationId: terminateNodeSession
      summary: Terminate one observed session and invalidate its reconnect cookie
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlledOperationRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/ip-bans/{ip}:remove:
    post:
      operationId: removeNodeIpBan
      summary: Remove one canonical IP address from the Ocserv ban list
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - name: ip
          in: path
          required: true
          schema: { type: string, format: ip }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlledOperationRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/ip-bans:
    get:
      operationId: listNodeIpBans
      summary: List current IP bans observed on a node
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: At most 200 current typed ban observations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeIpBanPage"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/service:reload:
    post:
      operationId: reloadNodeService
      summary: Reload the fixed Ocserv service unit
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlledOperationRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/agent-upgrade:
    post:
      operationId: upgradeNodeAgent
      summary: Start one reconciled single-node agent upgrade
      description: >-
        Creates an agent upgrade operation whose package identity resolves
        server-side from the trusted release catalog for the node's observed
        architecture. The browser never supplies a digest, URL, or path. The
        scheduling acknowledgement is not success: the operation reaches a
        terminal state only through reconciliation of the durable local
        outcome, node freshness, and the observed target version.
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpgradeRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/telemetry:
    get:
      operationId: listNodeTelemetry
      summary: Query bounded raw or rolled-up node telemetry
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - name: metric
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TelemetryMetric"
        - name: resolution
          in: query
          required: false
          schema:
            type: string
            enum: [raw, 5m, 1h]
            default: 5m
        - name: since
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TelemetryTimestamp"
      responses:
        "200":
          description: At most 2000 chronological telemetry points.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryPointPage"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/user-group-state:
    get:
      operationId: listNodeUserGroupState
      summary: List node-scoped desired and observed users and groups
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Desired, observed, drift, pending, and latest operation state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserGroupStatePage" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /nodes/{node_id}/user-password-sealing-key:
    get:
      operationId: getNodeUserPasswordSealingKey
      summary: Read a verified node public key for browser password sealing
      description: Requires user.manage. Validates the enabled Signer binding against the current approved node endpoint and sealing descriptor. No key TTL is implied. Responses are not cacheable.
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Verified RSA SPKI public key; contains no private key material.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPasswordSealingKey" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /nodes/{node_id}/users:
    post:
      operationId: createNodeUser
      summary: Queue creation of one node-scoped user
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DesiredIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreateRequest" }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
