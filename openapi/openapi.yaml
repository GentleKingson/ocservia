    NodeBootstrapRegistrationRequest:
      type: object
      additionalProperties: false
      required: [token, node_id, endpoint_id, user_password_seal_key_id, user_password_seal_public_key_sha256, p12_password_seal_key_id, p12_password_seal_public_key_sha256, registration]
      properties:
        token: { type: string, writeOnly: true }
        node_id: { $ref: "#/components/schemas/UuidV7" }
        endpoint_id: { type: string, pattern: "^[0-9a-f]{64}$" }
        user_password_seal_key_id: { type: string, minLength: 1, maxLength: 128 }
        user_password_seal_public_key_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        p12_password_seal_key_id: { type: string, minLength: 1, maxLength: 128 }
        p12_password_seal_public_key_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        registration:
          type: object
          additionalProperties: false
          required: [version, key_id, public_key, controller_nonce, credential_context_sha256, signature]
          properties:
            version: { type: integer, const: 1 }
            key_id: { type: string }
            public_key: { type: string }
            controller_nonce: { type: string }
            credential_context_sha256: { type: string }
            signature: { type: string }
    NodeBootstrapTokenRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, environment, reason]
      properties:
        installation:
          type: boolean
          default: true
          description: Return a root-only oit1_ installation token and automatically provision the node. Legacy obt1_ tokens (installation=false) are retired and rejected.
        workspace_id:
          $ref: "#/components/schemas/UuidV7"
        environment:
          type: string
          minLength: 1
          maxLength: 64
        expected_node_name:
          type: string
          minLength: 1
          maxLength: 128
        expected_endpoint_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Optional possession-bound Agent EndpointID.
        ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 900
          default: 900
        reason:
          type: string
          minLength: 1
          maxLength: 1024
    NodeBootstrapToken:
      type: object
      additionalProperties: false
      required: [id, token, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        token:
          type: string
          pattern: "^oit1_[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]{43}$"
          readOnly: true
        expires_at:
          $ref: "#/components/schemas/UtcDateTime"
    NodeRevocation:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1024
    NodeTrustState:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        status:
          type: string
          enum: [active, revoked]
    DropCounters:
      type: object
      additionalProperties: false
      required: [security, health, aggregate, raw]
      properties:
        security: { type: integer, format: int64, minimum: 0 }
        health: { type: integer, format: int64, minimum: 0 }
        aggregate: { type: integer, format: int64, minimum: 0 }
        raw: { type: integer, format: int64, minimum: 0 }
    NodeActionAvailability:
      type: object
      additionalProperties: false
      required: [allowed, reason]
      properties:
        allowed: { type: boolean }
        reason:
          type: string
          enum: [available, missing_capability, node_unavailable, forbidden, authorization_unavailable]
    NodeObservedState:
      type: object
      additionalProperties: false
      required: [id, name, version, trust_status, connection_state, freshness, dropped, session_count]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        name: { type: string, minLength: 1, maxLength: 128 }
        version: { type: integer, format: int64, minimum: 1 }
        effective_actions:
          type: object
          description: >-
            Advisory action availability on the authorized node detail read, derived
            from current approved capabilities, node trust and the caller's existing
            resource-scoped permissions. Absent means unknown. Availability does not
            replace write-time checks, template-specific capabilities, authorization,
            revision, sealing-key, secret-reference or operation constraints.
          additionalProperties:
            $ref: "#/components/schemas/NodeActionAvailability"
        config_revision:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Current node_config_state.revision for ConfigPlan expected_revision,
            not the node version or desired configuration revision. Zero means
            no configuration state exists yet or its revision is zero. An absent
            field means unknown, never zero. Clients must not submit a revision
            they cannot represent exactly (for JavaScript, a safe integer).
        trust_status: { type: string, enum: [pending, active, revoked, offline] }
        connection_state: { type: string, enum: [online, offline] }
        freshness: { type: string, enum: [fresh, stale, never] }
        observed_at: { $ref: "#/components/schemas/TelemetryTimestamp" }
        last_heartbeat_at: { $ref: "#/components/schemas/TelemetryTimestamp" }
        boot_id: { type: string, minLength: 1, maxLength: 128 }
        agent_instance_id: { $ref: "#/components/schemas/UuidV7" }
        agent_version: { type: string, minLength: 1, maxLength: 128 }
        agent_version_state:
          description: Server-side classification of agent_version against the operator-configured recommended agent version.
          type: string
          enum: [current, upgrade_available, ahead, unsupported, unknown]
        recommended_agent_version: { type: string, minLength: 1, maxLength: 128 }
        architecture:
          type: string
          enum: [amd64, arm64, ""]
          description: Node package architecture reported by the agent heartbeat.
        agent_upgrade_eligible:
          type: boolean
          description: >-
            Read-time derivation gating the single-node upgrade workflow:
            online fresh node with the
            approved upgrade capability, a trusted release for its
            architecture, and no conflicting active upgrade.
        ocserv_version: { type: string, minLength: 1, maxLength: 128 }
        os_release: { type: string, minLength: 1, maxLength: 128 }
        ocserv: { type: object, additionalProperties: true }
        system: { type: object, additionalProperties: true }
        path: { $ref: "#/components/schemas/ConnectionPathState" }
        dropped: { $ref: "#/components/schemas/DropCounters" }
        session_count: { type: integer, minimum: 0 }
    ConnectionPathState:
      type: object
      additionalProperties: true
      required: [mode, rtt_ms]
      properties:
        mode: { type: string, enum: [direct, relay, unknown] }
        rtt_ms: { type: number, minimum: 0 }
        relay_url: { type: string, format: uri }
    NodePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/NodeObservedState" }
        page: { $ref: "#/components/schemas/PageInfo" }
    NodeSession:
      type: object
      additionalProperties: false
      required: [id, username, client_ip, connected_at, bytes_in, bytes_out]
      properties:
        id: { type: string, minLength: 1, maxLength: 256 }
        username: { type: string, minLength: 1, maxLength: 256 }
        client_ip: { type: string, format: ip }
        connected_at: { $ref: "#/components/schemas/TelemetryTimestamp" }
        bytes_in: { type: integer, format: int64, minimum: 0 }
        bytes_out: { type: integer, format: int64, minimum: 0 }
    NodeSessionPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/NodeSession" }
        page: { $ref: "#/components/schemas/PageInfo" }
    NodeIpBan:
      type: object
      additionalProperties: false
      required: [ip]
      properties:
        ip: { type: string, format: ip }
        seconds_remaining: { type: integer, format: int64, minimum: 0 }
    NodeIpBanPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/NodeIpBan" }
    TelemetryMetric:
      type: string
      enum: [cpu_usage_ratio, memory_used_bytes, network_rx_bytes, network_tx_bytes, session_count, connection_rtt_ms]
    TelemetryTimestamp:
      type: string
      description: >-
        Lossless PostgreSQL-range timestamp. Ordinary years use RFC 3339;
        years outside 0000..9999 use an ISO 8601 signed six-digit year.
        Infinite values are the strings infinity and -infinity. Responses
        are normalized to UTC with microsecond precision. Keep this as text,
        not a JavaScript Date, which cannot represent the complete domain.
      example: "2026-09-10T04:34:56.123456Z"
    TelemetryPoint:
      type: object
      additionalProperties: false
      required: [at, metric, count, minimum, maximum, average]
      properties:
        at: { $ref: "#/components/schemas/TelemetryTimestamp" }
        metric: { $ref: "#/components/schemas/TelemetryMetric" }
        count: { type: integer, format: int64, minimum: 1 }
        minimum: { type: number }
        maximum: { type: number }
        average: { type: number }
    TelemetryPointPage:
      type: object
      additionalProperties: false
      required: [items, resolution]
      properties:
        items:
          type: array
          maxItems: 2000
          items: { $ref: "#/components/schemas/TelemetryPoint" }
        resolution: { type: string, enum: [raw, 5m, 1h] }
    PlatformEventType:
      type: string
      enum: [connected, disconnected, command_result, simulation_result, heartbeat, error, path_changed, telemetry]
    Traceparent:
      type: string
      pattern: "^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$"
    PlatformEvent:
      type: object
      additionalProperties: false
      required: [id, node_id, type, traceparent, occurred_at]
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        node_id:
          $ref: "#/components/schemas/UuidV7"
        type:
          $ref: "#/components/schemas/PlatformEventType"
        traceparent:
          $ref: "#/components/schemas/Traceparent"
        occurred_at:
          $ref: "#/components/schemas/TelemetryTimestamp"
    PlatformEventPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/PlatformEvent"
        page:
          $ref: "#/components/schemas/PageInfo"
    PageInfo:
      type: object
      additionalProperties: false
      required: [has_more]
