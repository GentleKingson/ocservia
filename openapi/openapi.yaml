openapi: 3.1.2
info:
  title: ocservia API
  version: 1.0.0
  description: Public control-plane API contract.
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0
servers:
  - url: /api/v1
security:
  - oidc: []
tags:
  - name: platform
    description: Process health and build metadata.
  - name: operations
    description: Asynchronous control-plane operation state.
  - name: events
    description: Durable platform event rebuild and live stream.
  - name: development
    description: Side-effect-free local development facilities.
  - name: enrollment
    description: One-time node enrollment credentials.
  - name: nodes
    description: Explicit node trust lifecycle.
paths:
  /livez:
    get:
      operationId: getLiveness
      summary: Get process liveness
      tags: [platform]
      security: []
      responses:
        "200":
          description: The process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "4XX":
          $ref: "#/components/responses/Problem"
  /readyz:
    get:
      operationId: getReadiness
      summary: Get dependency readiness
      tags: [platform]
      security: []
      responses:
        "200":
          description: The process and database schema are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          $ref: "#/components/responses/Problem"
        "4XX":
          $ref: "#/components/responses/Problem"
  /version:
    get:
      operationId: getVersion
      summary: Get build metadata
      tags: [platform]
      security: []
      responses:
        "200":
          description: Build metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildInfo"
        "4XX":
          $ref: "#/components/responses/Problem"
  /operations:
    get:
      operationId: listOperations
      summary: List operations
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Operations ordered from newest to oldest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /operations/{operation_id}:
    get:
      operationId: getOperation
      summary: Get an asynchronous operation
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          description: Operation state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /events:
    get:
      operationId: listEvents
      summary: Rebuild platform events from durable state
      tags: [events]
      security: []
      parameters:
        - name: after
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UuidV7"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Events ordered from oldest to newest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformEventPage"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /events/stream:
    get:
      operationId: watchEvents
      summary: Watch platform events with SSE resume support
      tags: [events]
      security: []
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            $ref: "#/components/schemas/UuidV7"
      responses:
        "200":
          description: SSE stream whose id field is a durable platform event ID.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /development/simulations:
    post:
      operationId: createLocalSimulation
      summary: Start a side-effect-free local agent simulation
      description: Available only when the local simulator is explicitly enabled outside production.
      tags: [development]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationScenario"
      responses:
        "202":
          description: The simulation was durably queued.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /enrollment-tokens:
    post:
      operationId: createEnrollmentToken
      summary: Create a one-time enrollment token
      tags: [enrollment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentTokenRequest"
      responses:
        "201":
          description: The plaintext token is returned once and is not persisted.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentToken"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/approval:
    post:
      operationId: approveNode
      summary: Approve a pending node and bind its endpoint identity
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeApproval"
      responses:
        "200":
          description: The node is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeTrustState"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{node_id}/revocation:
    post:
      operationId: revokeNode
      summary: Revoke a node endpoint and close its current connection
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeRevocation"
      responses:
        "200":
          description: The node is revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeTrustState"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    oidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer access token issued by the configured OIDC provider.
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the previous page.
      required: false
      schema:
        $ref: "#/components/schemas/Cursor"
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV7"
    NodeId:
      name: node_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV7"
  responses:
    Problem:
      description: Request failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      additionalProperties: false
      required: [status, schema_version]
      properties:
        status:
          type: string
          const: ok
        schema_version:
          type: integer
          format: int64
          minimum: 1
    BuildInfo:
      type: object
      additionalProperties: false
      required: [version, commit, role]
      properties:
        version:
          type: string
          minLength: 1
        commit:
          type: string
          minLength: 1
        role:
          type: string
          enum: [api, worker, scheduler, all]
    UuidV7:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      example: 0193c1b2-7d8a-7f01-8a2d-1e5b4f302901
    UtcDateTime:
      type: string
      format: date-time
      description: RFC 3339 timestamp normalized to UTC.
      example: "2026-08-01T16:00:00Z"
    Cursor:
      type: string
      minLength: 1
      maxLength: 2048
      description: Opaque pagination position; clients must not parse it.
    OperationState:
      type: string
      enum:
        - draft
        - queued
        - dispatched
        - accepted
        - running
        - succeeded
        - failed
        - unknown
        - expired
        - rolled_back
        - offline_pending
        - drifted
        - superseded
    Operation:
      type: object
      additionalProperties: false
      required: [id, state, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        state:
          $ref: "#/components/schemas/OperationState"
        node_id:
          $ref: "#/components/schemas/UuidV7"
        command_id:
          $ref: "#/components/schemas/UuidV7"
        created_at:
          $ref: "#/components/schemas/UtcDateTime"
        updated_at:
          $ref: "#/components/schemas/UtcDateTime"
    SimulationScenario:
      type: object
      additionalProperties: false
      properties:
        heartbeat_count:
          type: integer
          format: int32
          minimum: 1
          maximum: 32
          default: 3
        delay_millis:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          default: 100
        duplicate_event:
          type: boolean
          default: false
        return_error:
          type: boolean
          default: false
        disconnect_after:
          type: boolean
          default: false
    EnrollmentTokenRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, environment, reason]
      properties:
        workspace_id:
          $ref: "#/components/schemas/UuidV7"
        environment:
          type: string
          minLength: 1
          maxLength: 64
        expected_node_name:
          type: string
          minLength: 1
          maxLength: 128
        expected_endpoint_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 900
          default: 900
        reason:
          type: string
          minLength: 1
          maxLength: 1024
    EnrollmentToken:
      type: object
      additionalProperties: false
      required: [id, token, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        token:
          type: string
          minLength: 43
          maxLength: 43
          readOnly: true
        expires_at:
          $ref: "#/components/schemas/UtcDateTime"
    NodeApproval:
      type: object
      additionalProperties: false
      required: [policy, capabilities, reason]
      properties:
        labels:
          type: object
          maxProperties: 32
          propertyNames:
            minLength: 1
            maxLength: 64
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 128
        policy:
          type: string
          minLength: 1
          maxLength: 128
        capabilities:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        reason:
          type: string
          minLength: 1
          maxLength: 1024
    NodeRevocation:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1024
    NodeTrustState:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        status:
          type: string
          enum: [active, revoked]
    PlatformEventType:
      type: string
      enum: [connected, disconnected, command_result, heartbeat, error]
    Traceparent:
      type: string
      pattern: "^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$"
    PlatformEvent:
      type: object
      additionalProperties: false
      required: [id, node_id, type, traceparent, occurred_at]
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        node_id:
          $ref: "#/components/schemas/UuidV7"
        type:
          $ref: "#/components/schemas/PlatformEventType"
        traceparent:
          $ref: "#/components/schemas/Traceparent"
        occurred_at:
          $ref: "#/components/schemas/UtcDateTime"
    PlatformEventPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/PlatformEvent"
        page:
          $ref: "#/components/schemas/PageInfo"
    PageInfo:
      type: object
      additionalProperties: false
      required: [has_more]
      properties:
        has_more:
          type: boolean
        next_cursor:
          $ref: "#/components/schemas/Cursor"
    OperationPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Operation"
        page:
          $ref: "#/components/schemas/PageInfo"
    Problem:
      type: object
      additionalProperties: true
      description: RFC 9457 Problem Details response.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
          minLength: 1
          maxLength: 256
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 4096
        instance:
          type: string
          format: uri-reference
        trace_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
