        actor_type: { type: string }
        actor_id: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: [string, "null"], format: uuid }
        node_id: { type: [string, "null"], format: uuid }
        request_id: { type: string }
        trace_id: { type: [string, "null"] }
        command_id: { type: [string, "null"], format: uuid }
        result:
          type: string
          description: Historical result codes remain readable without a closed enum.
        reason: { type: [string, "null"] }
        error_type: { type: [string, "null"] }
        previous_event_hash: { type: string }
        event_hash: { type: string }
    VpnAuditPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/VpnAuditRecord" } }
        next_cursor: { type: string }
    VpnAuditRecord:
      type: object
      required: [node_id, session_id, username, client_ip, last_seen_at, event_type]
