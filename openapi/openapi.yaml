      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserBatchRequest" }
      responses:
        "202":
          description: Parent batch accepted; each authorized item receives its own operation and command.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserBatch" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /user-batches/{batch_id}:
    get:
      operationId: getUserBatch
      summary: Get parent and per-item authorization, command, and result state
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: batch_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UuidV7" }
      responses:
        "200":
          description: Current parent and child states, including offline and partial failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserBatch" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /user-operations/metrics:
    get:
      operationId: getUserOperationMetrics
      summary: Get workspace quota, expiry, and batch scheduler health counters
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Current bounded scheduler health counters for alerting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserOperationMetrics" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /nodes/{node_id}/config-plans:
    post:
      operationId: createConfigPlan
      summary: Render and remotely validate an immutable configuration candidate
      tags: [configuration]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigPlanRequest" }
      responses:
        "202":
          description: The side-effect-free validation operation was accepted.
          headers:
            Location: { schema: { type: string, format: uri-reference } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPlan" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /config-plans/{plan_id}:
    get:
      operationId: getConfigPlan
      summary: Get validation, safe diff, warnings, and approval state for a configuration plan
      tags: [configuration]
      parameters:
        - name: plan_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UuidV7" }
      responses:
        "200":
          description: Current immutable plan state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPlan" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /config-plans/{plan_id}/apply:
    post:
      operationId: applyConfigPlan
      summary: Queue atomic application of an unexpired independently approved plan
      tags: [configuration]
      parameters:
        - name: plan_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UuidV7" }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigApplyRequest" }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /nodes/{node_id}/certificates:
    get:
      operationId: listNodeCertificates
      summary: List the newest node-scoped certificate lifecycle records
      tags: [certificates]
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: At most 100 certificate records, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: "#/components/schemas/Certificate" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCertificate
      summary: Generate a node-local private key and queue a CSR operation
      tags: [certificates]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateRequest" }
      responses:
        "202":
          description: Node-local key and CSR generation accepted.
          headers:
            Location: { schema: { type: string, format: uri-reference } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /certificates/{certificate_id}:
    get:
      operationId: getCertificate
      summary: Get node-scoped certificate lifecycle state and public metadata
      tags: [certificates]
      parameters:
        - name: certificate_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UuidV7" }
      responses:
        "200":
          description: Certificate state without CSR private material or secret values.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /certificates/{certificate_id}:issue:
    post:
      operationId: issueCertificate
      summary: Ask the configured external PKI signer to issue a ready CSR
      tags: [certificates]
      parameters:
        - name: certificate_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UuidV7" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateIssueRequest" }
      responses:
        "200":
          description: Certificate issued by the external signer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /certificates/{certificate_id}:revoke:
    post:
      operationId: revokeCertificate
      summary: Revoke an issued certificate and remove its node-local private key
      tags: [certificates]
      parameters:
        - name: certificate_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UuidV7" }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateRevokeRequest" }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /certificates/{certificate_id}:p12:
    post:
      operationId: createCertificateP12
      summary: Create a short-lived one-time encrypted P12 artifact
      tags: [certificates]
      parameters:
        - name: certificate_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UuidV7" }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateP12Request" }
      responses:
        "202":
          description: Artifact generation queued; password and download token appear only in the initial response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactGrant" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /artifacts/{artifact_id}:
    get:
      operationId: downloadArtifact
      summary: Stream one ready artifact once with its separate bearer token
      tags: [certificates]
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UuidV7" }
        - name: X-Artifact-Token
          in: header
          required: true
          description: Short-lived one-time capability returned only by the initial artifact request.
          schema: { type: string, minLength: 43, maxLength: 43 }
      responses:
        "200":
          description: Bounded P12 stream. A completed response consumes the artifact token.
          content:
            application/x-pkcs12:
              schema: { type: string, format: binary, maxLength: 67108864 }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /secret-provider-refs:
    post:
      operationId: createSecretProviderRef
      summary: Register opaque external secret metadata without a secret value
      tags: [certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretProviderRefRequest" }
      responses:
        "201":
          description: Opaque secret reference registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretProviderRef" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /secret-provider-refs/{secret_ref_id}:
    get:
      operationId: getSecretProviderRef
      summary: Read opaque provider/version metadata
      tags: [certificates]
      parameters:
        - name: secret_ref_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UuidV7" }
      responses:
        "200":
          description: Secret metadata without the secret value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretProviderRef" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /secret-provider-refs/{secret_ref_id}:rotate:
    post:
      operationId: rotateSecretProviderRef
      summary: Record an externally completed secret version rotation
      tags: [certificates]
      parameters:
        - name: secret_ref_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UuidV7" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretProviderRotateRequest" }
      responses:
        "200":
          description: Rotation metadata updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretProviderRef" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /nodes/{node_id}/groups/{group_name}:
    put:
      operationId: applyNodeGroup
      summary: Queue atomic application of one node-scoped group
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/GroupName"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DesiredIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupApplyRequest" }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /nodes/{node_id}/synthetic-commands:
    post:
      operationId: createSyntheticCommand
      summary: Queue a side-effect-free typed synthetic command
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
            pattern: '^"revision-[1-9][0-9]*"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyntheticCommandRequest"
      responses:
        "202":
          description: The operation intent, command, outbox event, and audit intent were committed atomically.
          headers:
            Location:
              required: true
              schema:
                type: string
            ETag:
              required: true
              schema:
                type: string
            Idempotency-Replayed:
              required: false
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default:
          $ref: "#/components/responses/Problem"
  /auth/login:
    get:
      operationId: beginOIDCLogin
      summary: Begin OIDC Authorization Code login with PKCE S256
      tags: [platform]
      security: []
      responses:
        "302": { description: Redirect to the configured OIDC provider. }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/callback:
    get:
      operationId: completeOIDCLogin
      summary: Validate OIDC state, nonce, code, and ID token
      tags: [platform]
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, minLength: 32, maxLength: 128 } }
        - { name: code, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 4096 } }
      responses:
        "302": { description: Secure session established. }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current server-side session
      tags: [platform]
      responses:
        "204": { description: Session revoked and cookie cleared. }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/break-glass:
    post:
      operationId: useBreakGlass
      summary: Use explicitly enabled offline emergency access
      tags: [platform]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BreakGlassRequest" }
      responses:
        "204": { description: Short-lived emergency session established; alert and rotation requirement recorded. }
        "401": { $ref: "#/components/responses/Problem" }
        "423": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/CrossOriginRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /workspaces:
    get:
      operationId: listAuthorizedWorkspaces
      summary: List only workspaces visible to the current principal
      tags: [platform]
      responses:
        "200":
          description: Authorized workspaces.
          content: { application/json: { schema: { $ref: "#/components/schemas/WorkspacePage" } } }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /role-bindings:
    post:
      operationId: createRoleBinding
      summary: Bind one baseline role to a workspace or resource scope
      tags: [platform]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RoleBindingRequest" } } }
      responses:
        "201":
          description: Role binding created.
          content: { application/json: { schema: { $ref: "#/components/schemas/RoleBinding" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /approval-requests:
    post:
      operationId: createApprovalRequest
      summary: Request independent approval for a high-risk action
      tags: [operations]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } }
      responses:
        "201":
          description: Pending approval created.
          content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /approval-requests/{approval_id}:
    get:
      operationId: getApprovalRequest
      summary: Inspect immutable approval details before deciding
      tags: [operations]
      parameters:
        - name: approval_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UuidV7" }
      responses:
        "200":
          description: Approval details including any content-bound hash and item summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /approval-requests/{approval_id}:approve:
    post:
      operationId: approveRequest
      summary: Approve another principal's high-risk request
      tags: [operations]
      parameters:
        - { name: approval_id, in: path, required: true, schema: { $ref: "#/components/schemas/UuidV7" } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalDecision" } } }
      responses:
        "200":
          description: Approval granted.
          content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        default: { $ref: "#/components/responses/Problem" }
  /audit/events:
    get:
      operationId: listAuditEvents
      summary: List append-only audit events
      tags: [events]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: Audit events with chain hashes.
          content: { application/json: { schema: { $ref: "#/components/schemas/AuditEventPage" } } }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /audit:verify:
    post:
      operationId: verifyAuditChain
      summary: Verify the workspace audit hash chain and latest checkpoint
      tags: [events]
      parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
      responses:
        "200":
          description: Chain and checkpoint are valid.
          content: { application/json: { schema: { $ref: "#/components/schemas/AuditVerification" } } }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    oidc:
      type: apiKey
      in: cookie
      name: __Host-ocservia_session
    bearerAuth:
      type: http
      scheme: bearer
      description: Secure, HttpOnly, SameSite server-side session established by OIDC Authorization Code plus PKCE S256.
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the previous page.
      required: false
      schema:
        $ref: "#/components/schemas/Cursor"
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV7"
    NodeId:
      name: node_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV7"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"
        maxLength: 20
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
        pattern: '^"revision-[1-9][0-9]*"$'
    DesiredIfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
        pattern: '^"revision-(0|[1-9][0-9]*)"$'
    Username:
      name: username
      in: path
      required: true
      schema: { $ref: "#/components/schemas/OcservName" }
    GroupName:
      name: group_name
      in: path
      required: true
      schema: { $ref: "#/components/schemas/OcservName" }
    WorkspaceId:
      name: X-Workspace-ID
      in: header
      description: Required when the principal can access more than one workspace; otherwise the sole authorized workspace is inferred.
      required: false
      schema: { $ref: "#/components/schemas/UuidV7" }
    ApprovalId:
      name: X-Approval-ID
      in: header
      description: Required by high-risk actions; optional in the base contract so pre-approval clients receive a typed authorization error.
      required: false
      schema: { $ref: "#/components/schemas/UuidV7" }
  responses:
    Problem:
      description: Request failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CrossOriginRequest:
      description: A cookie-authenticated mutation must originate from the exact public browser origin; a sibling origin, an unknown site, a missing Origin header, or a cross-site Fetch Metadata signal is rejected before authorization.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: Request bodies must use the application/json media type; JSON parsers never accept text, form, or multipart payloads.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    OperationAccepted:
      description: The typed operation intent, command, outbox event, and audit intent were committed atomically.
      headers:
        Location:
          required: true
          schema: { type: string }
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, enum: ["true"] }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Operation"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      additionalProperties: false
      required: [status, schema_version]
      properties:
        status:
          type: string
          const: ok
        schema_version:
          type: integer
          format: int64
          minimum: 1
    BuildInfo:
      type: object
      additionalProperties: false
      required: [version, commit, role]
      properties:
        version:
          type: string
          minLength: 1
        commit:
          type: string
          minLength: 1
        role:
          type: string
          enum: [api, worker, scheduler, all]
    UuidV7:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      example: 0193c1b2-7d8a-7f01-8a2d-1e5b4f302901
    UtcDateTime:
      type: string
      format: date-time
      description: RFC 3339 timestamp normalized to UTC.
      example: "2026-08-01T16:00:00Z"
    OcservName:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$"
      minLength: 1
      maxLength: 64
    Cursor:
      type: string
      minLength: 1
      maxLength: 2048
      description: Opaque pagination position; clients must not parse it.
    OperationState:
      type: string
      enum:
        - draft
        - queued
        - dispatched
        - accepted
        - running
        - succeeded
        - failed
        - unknown
        - expired
        - rolled_back
        - offline_pending
        - drifted
        - superseded
    Operation:
      type: object
      additionalProperties: false
      required: [id, state, version, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        state:
          $ref: "#/components/schemas/OperationState"
        node_id:
          $ref: "#/components/schemas/UuidV7"
        command_id:
          $ref: "#/components/schemas/UuidV7"
        config_apply_state:
          type: string
          enum: [queued, dispatched, accepted, running, succeeded, failed, rolled_back, failed_critical, unknown, expired]
          description: Typed configuration outcome when this operation applies a configuration plan.
        config_apply_failure_code:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          $ref: "#/components/schemas/UtcDateTime"
        updated_at:
          $ref: "#/components/schemas/UtcDateTime"
        expires_at:
          $ref: "#/components/schemas/UtcDateTime"
    SyntheticCommandRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [noop, echo]
        message:
          type: string
          maxLength: 4096
        expected_version:
          type: integer
          format: int64
          minimum: 1
        ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 86400
          default: 60
        supersede_pending:
          type: boolean
          default: false
      description: expected_version is required unless If-Match supplies the same revision.
    ControlledOperationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        boot_id:
          type: string
          format: uuid
          description: Required for session operations; must match the observed node boot.
        reason:
          type: string
          minLength: 1
          maxLength: 512
        expected_version:
          type: integer
          format: int64
          minimum: 1
        ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 300
          default: 60
      description: expected_version is required unless If-Match supplies the same revision.
    DesiredMutationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 512 }
        expected_version: { type: integer, format: int64, minimum: 0 }
        ttl_seconds: { type: integer, format: int64, minimum: 1, maximum: 86400, default: 86400 }
      description: expected_version is required unless If-Match supplies the same desired version.
    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [name, sealed_password, reason]
      properties:
        name: { $ref: "#/components/schemas/OcservName" }
        sealed_password: { $ref: "#/components/schemas/UserPasswordSealedSecretV1" }
        reason: { type: string, minLength: 1, maxLength: 512 }
        expected_version: { type: integer, format: int64, minimum: 0 }
        ttl_seconds: { type: integer, format: int64, minimum: 1, maximum: 86400, default: 86400 }
    PasswordRotateRequest:
      type: object
      additionalProperties: false
      required: [sealed_password, reason]
      properties:
        sealed_password: { $ref: "#/components/schemas/UserPasswordSealedSecretV1" }
        reason: { type: string, minLength: 1, maxLength: 512 }
        expected_version: { type: integer, format: int64, minimum: 1 }
        ttl_seconds: { type: integer, format: int64, minimum: 1, maximum: 86400, default: 86400 }
    UserPasswordSealedSecretV1:
      type: object
      additionalProperties: false
      required: [version, purpose, key_id, ciphertext]
      properties:
        version: { type: integer, format: int32, enum: [1] }
        purpose: { type: string, enum: [user_password] }
        key_id: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9_.-]+$" }
        ciphertext:
          type: string
          format: byte
          minLength: 44
          maxLength: 5464
          writeOnly: true
          description: Purpose-specific RSA-OAEP-SHA256 ciphertext; plaintext and cross-purpose ciphertext are never accepted.
    GroupApplyRequest:
      type: object
      additionalProperties: false
      required: [members, reason]
      properties:
        members:
          type: array
          maxItems: 384
          uniqueItems: true
          items: { $ref: "#/components/schemas/OcservName" }
        reason: { type: string, minLength: 1, maxLength: 512 }
        expected_version: { type: integer, format: int64, minimum: 0 }
        ttl_seconds: { type: integer, format: int64, minimum: 1, maximum: 86400, default: 86400 }
    UserGroupResourceState:
      type: object
      additionalProperties: false
      required: [kind, name, convergence, recovery_required]
      properties:
        kind: { type: string, enum: [user, group] }
        name: { $ref: "#/components/schemas/OcservName" }
        desired_enabled: { type: boolean }
        observed_enabled: { type: boolean }
        desired_members: { type: array, items: { $ref: "#/components/schemas/OcservName" }, maxItems: 384 }
        observed_members: { type: array, items: { $ref: "#/components/schemas/OcservName" }, maxItems: 384 }
        desired_version: { type: integer, format: int64, minimum: 1 }
        desired_revision: { type: integer, format: int64, minimum: 1 }
        observed_revision: { type: integer, format: int64, minimum: 0 }
        desired_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
        observed_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
        convergence: { type: string, enum: [converged, pending, offline_pending, drifted] }
        operation_id: { $ref: "#/components/schemas/UuidV7" }
        operation_state: { $ref: "#/components/schemas/OperationState" }
        recovery_required: { type: boolean }
        recovery_mutation_kind:
          type: string
          enum: [user_create, user_disable, user_enable, user_password_rotate, group_apply]
        observed_at: { $ref: "#/components/schemas/UtcDateTime" }
    UserGroupStatePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1536
          items: { $ref: "#/components/schemas/UserGroupResourceState" }
    ConfigSecretRef:
      type: object
      additionalProperties: false
      required: [secret_ref_id]
      properties:
        secret_ref_id: { $ref: "#/components/schemas/UuidV7" }
    ConfigDirective:
      type: object
      additionalProperties: false
      required: [name]
      description: Exactly one of value and secret_ref must be provided.
      properties:
        name: { type: string, minLength: 1, maxLength: 64, pattern: "^[a-z][a-z0-9-]*$" }
        value: { type: string, minLength: 1, maxLength: 4096 }
        secret_ref: { $ref: "#/components/schemas/ConfigSecretRef" }
    ConfigTemplate:
      type: object
      additionalProperties: false
      required: [name, directives]
      properties:
        name: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$" }
        directives:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/ConfigDirective" }
    ConfigPlanRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, template, ttl_seconds, reason]
      properties:
        expected_revision: { type: integer, format: int64, minimum: 0 }
        template: { $ref: "#/components/schemas/ConfigTemplate" }
        node_variables:
          type: object
          maxProperties: 128
          additionalProperties: { type: string, minLength: 1, maxLength: 4096 }
        ttl_seconds: { type: integer, format: int64, minimum: 60, maximum: 3600 }
        reason: { type: string, minLength: 1, maxLength: 512 }
    ConfigPlan:
      type: object
      additionalProperties: false
      required: [id, workspace_id, node_id, operation_id, template_name, expected_revision, candidate_hash, state, validation, diff_redacted, warnings, current_unchanged, staging_cleaned, expires_at, created_at]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        workspace_id: { $ref: "#/components/schemas/UuidV7" }
        node_id: { $ref: "#/components/schemas/UuidV7" }
        operation_id: { $ref: "#/components/schemas/UuidV7" }
        template_name: { type: string, minLength: 1, maxLength: 128 }
        expected_revision: { type: integer, format: int64, minimum: 0 }
        candidate_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        state: { $ref: "#/components/schemas/OperationState" }
        validation: { type: string, enum: [pending, valid, failed, rejected, unknown, expired] }
        diff_redacted: { type: string, maxLength: 262144, description: Secret-safe line diff; secret keys and values are never included. }
        warnings: { type: array, maxItems: 128, items: { type: string, maxLength: 256 } }
        current_unchanged: { type: boolean }
        staging_cleaned: { type: boolean }
        current_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        approval_id: { $ref: "#/components/schemas/UuidV7" }
        approval_status: { type: string, enum: [pending, approved, rejected, expired, consumed] }
        expires_at: { $ref: "#/components/schemas/UtcDateTime" }
        created_at: { $ref: "#/components/schemas/UtcDateTime" }
    ConfigApplyRequest:
      type: object
      additionalProperties: false
      required: [approval_id, reason]
      properties:
        approval_id: { $ref: "#/components/schemas/UuidV7" }
        reason: { type: string, minLength: 1, maxLength: 512 }
    ConfigPlanApprovalSummary:
      type: object
      additionalProperties: false
      required: [node_id, expected_revision, candidate_hash, current_hash, diff_redacted, expires_at]
      properties:
        node_id: { $ref: "#/components/schemas/UuidV7" }
        expected_revision: { type: integer, format: int64, minimum: 0 }
        candidate_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        current_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        diff_redacted: { type: string, maxLength: 262144, description: "Approver-visible secret-safe diff containing exact secret reference identifiers, providers, and versions without provider keys or values." }
        expires_at: { $ref: "#/components/schemas/UtcDateTime" }
    CertificateRequest:
      type: object
      additionalProperties: false
      required: [expected_version, common_name, key_bits, reason]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        common_name: { type: string, minLength: 1, maxLength: 253, pattern: "^[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?$" }
        dns_names:
          type: array
          maxItems: 32
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 253 }
        key_bits: { type: integer, format: int32, enum: [2048, 3072, 4096] }
        reason: { type: string, minLength: 1, maxLength: 512 }
    CertificateIssueRequest:
      type: object
      additionalProperties: false
      required: [approval_id, reason]
      properties:
        approval_id: { $ref: "#/components/schemas/UuidV7" }
        reason: { type: string, minLength: 1, maxLength: 512 }
    CertificateRevokeRequest:
      type: object
      additionalProperties: false
      required: [expected_version, certificate_version, approval_id, reason]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        certificate_version: { type: integer, format: int64, minimum: 1 }
        approval_id: { $ref: "#/components/schemas/UuidV7" }
        reason: { type: string, minLength: 1, maxLength: 128 }
    CertificateP12Request:
      type: object
      additionalProperties: false
      required: [expected_version, certificate_version, approval_id, reason]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        certificate_version: { type: integer, format: int64, minimum: 1 }
        approval_id: { $ref: "#/components/schemas/UuidV7" }
        reason: { type: string, minLength: 1, maxLength: 512 }
    ArtifactGrant:
      type: object
      additionalProperties: false
      required: [artifact_id, operation, expires_at]
      properties:
        artifact_id: { $ref: "#/components/schemas/UuidV7" }
        operation: { $ref: "#/components/schemas/Operation" }
        download_token: { type: string, minLength: 43, maxLength: 43, writeOnly: true }
        password: { type: string, minLength: 32, maxLength: 32, writeOnly: true }
        expires_at: { $ref: "#/components/schemas/UtcDateTime" }
    SecretProviderRefRequest:
      type: object
      additionalProperties: false
      required: [provider, key_path, version, reason]
      properties:
        provider: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" }
        key_path: { type: string, minLength: 1, maxLength: 512 }
        version: { type: string, minLength: 1, maxLength: 128 }
        reason: { type: string, minLength: 1, maxLength: 512 }
    SecretProviderRotateRequest:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version: { type: string, minLength: 1, maxLength: 128 }
        reason: { type: string, minLength: 1, maxLength: 512 }
    SecretProviderRef:
      type: object
      additionalProperties: false
      required: [id, workspace_id, provider, key_path, version, state, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        workspace_id: { $ref: "#/components/schemas/UuidV7" }
        provider: { type: string, maxLength: 64 }
        key_path: { type: string, maxLength: 512 }
        version: { type: string, maxLength: 128 }
        state: { type: string, enum: [active, rotating, disabled, unavailable] }
        rotated_at: { $ref: "#/components/schemas/UtcDateTime" }
        created_at: { $ref: "#/components/schemas/UtcDateTime" }
        updated_at: { $ref: "#/components/schemas/UtcDateTime" }
    CertificateApprovalSummary:
      oneOf:
        - $ref: "#/components/schemas/CertificateIssueApprovalSummary"
        - $ref: "#/components/schemas/CertificateActionApprovalSummary"
    CertificateIssueApprovalSummary:
      type: object
      additionalProperties: false
      required: [certificate_id, node_id, common_name, dns_names, csr_sha256]
      properties:
        certificate_id: { $ref: "#/components/schemas/UuidV7" }
        node_id: { $ref: "#/components/schemas/UuidV7" }
        common_name: { type: string, minLength: 1, maxLength: 253 }
        dns_names: { type: array, maxItems: 32, items: { type: string, maxLength: 253 } }
        csr_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    CertificateActionApprovalSummary:
      type: object
      additionalProperties: false
      required: [action, certificate_id, certificate_version, node_id]
      properties:
        action: { type: string, enum: [certificate.revoke, certificate.private_key.export] }
        certificate_id: { $ref: "#/components/schemas/UuidV7" }
        certificate_version: { type: integer, format: int64, minimum: 1 }
        node_id: { $ref: "#/components/schemas/UuidV7" }
        purpose: { type: string, maxLength: 512 }
        artifact_request_id: { $ref: "#/components/schemas/UuidV7" }
        serial_number: { type: string, maxLength: 128 }
        certificate_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    Certificate:
      type: object
      additionalProperties: false
      required: [id, workspace_id, node_id, operation_id, common_name, dns_names, key_bits, state, version, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        workspace_id: { $ref: "#/components/schemas/UuidV7" }
        node_id: { $ref: "#/components/schemas/UuidV7" }
        operation_id: { $ref: "#/components/schemas/UuidV7" }
        common_name: { type: string, minLength: 1, maxLength: 253 }
        dns_names: { type: array, maxItems: 32, items: { type: string, maxLength: 253 } }
        key_bits: { type: integer, format: int32, enum: [2048, 3072, 4096] }
        state: { type: string, enum: [csr_pending, csr_ready, signing, signer_unavailable, issued, expiring, expired, revoking, revocation_unknown, revoked, failed, unknown] }
        version: { type: integer, format: int64, minimum: 1 }
        public_key_sha256: { type: string, format: byte, description: SHA-256 of the node-local public key. }
        serial_number: { type: string, maxLength: 128 }
        not_before: { $ref: "#/components/schemas/UtcDateTime" }
        not_after: { $ref: "#/components/schemas/UtcDateTime" }
        revoked_at: { $ref: "#/components/schemas/UtcDateTime" }
        created_at: { $ref: "#/components/schemas/UtcDateTime" }
        updated_at: { $ref: "#/components/schemas/UtcDateTime" }
    UserPolicyRequest:
      type: object
      additionalProperties: false
      required: [quota_period, quota_direction, quota_bytes, expected_version, reason]
      properties:
        quota_period: { type: string, enum: [none, monthly, lifetime] }
        quota_direction: { type: string, enum: [rx, tx, rxtx] }
        quota_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Integer bytes; none requires zero.
        expires_at:
          allOf: [{ $ref: "#/components/schemas/UtcDateTime" }]
          description: Exact instant in UTC; offsets and fractional seconds are rejected.
        expected_version: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 512 }
    UserPolicy:
      type: object
      additionalProperties: false
      required: [node_id, username, quota_period, quota_direction, quota_bytes, version, period_start, observed_rx_bytes, observed_tx_bytes, exceeded, expired, convergence]
      properties:
        node_id: { $ref: "#/components/schemas/UuidV7" }
        username: { $ref: "#/components/schemas/OcservName" }
        quota_period: { type: string, enum: [none, monthly, lifetime] }
        quota_direction: { type: string, enum: [rx, tx, rxtx] }
        quota_bytes: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
        expires_at: { $ref: "#/components/schemas/UtcDateTime" }
        version: { type: integer, format: int64, minimum: 1 }
        period_start: { $ref: "#/components/schemas/UtcDateTime" }
        observed_rx_bytes: { type: integer, format: int64, minimum: 0 }
        observed_tx_bytes: { type: integer, format: int64, minimum: 0 }
        observed_at: { $ref: "#/components/schemas/UtcDateTime" }
        exceeded: { type: boolean }
        expired: { type: boolean }
        convergence: { type: string, enum: [converged, pending, offline_pending, drifted] }
    UserBatchItemRequest:
      type: object
      additionalProperties: false
      required: [node_id, username, action, expected_version]
      properties:
        node_id: { $ref: "#/components/schemas/UuidV7" }
        username: { $ref: "#/components/schemas/OcservName" }
        action: { type: string, enum: [disable, enable] }
        expected_version: { type: integer, format: int64, minimum: 1 }
    UserBatchRequest:
      type: object
      additionalProperties: false
      required: [reason, items]
      properties:
        reason: { type: string, minLength: 1, maxLength: 512 }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/UserBatchItemRequest" }
    UserBatchItem:
      type: object
      additionalProperties: false
      required: [index, node_id, username, action, expected_version, state]
      properties:
        index: { type: integer, minimum: 0 }
        node_id: { $ref: "#/components/schemas/UuidV7" }
        username: { $ref: "#/components/schemas/OcservName" }
        action: { type: string, enum: [disable, enable] }
        expected_version: { type: integer, format: int64, minimum: 1 }
        state: { type: string, enum: [queued, submitting, submitted, succeeded, failed, unknown, offline_pending, forbidden] }
        child_operation_id: { $ref: "#/components/schemas/UuidV7" }
        error_type: { type: string, maxLength: 128 }
    UserBatch:
      type: object
      additionalProperties: false
      required: [id, workspace_id, state, items, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        workspace_id: { $ref: "#/components/schemas/UuidV7" }
        state: { type: string, enum: [queued, running, succeeded, partial_failed, failed] }
        items:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/UserBatchItem" }
        created_at: { $ref: "#/components/schemas/UtcDateTime" }
        updated_at: { $ref: "#/components/schemas/UtcDateTime" }
    QueueMetrics:
      type: object
      additionalProperties: false
      required: [outbox_unpublished_total, outbox_oldest_age_seconds, command_queue_depth, command_unknown_total, config_rollback_total, config_failed_critical_total]
      properties:
        outbox_unpublished_total:
          type: integer
          format: int64
          minimum: 0
        outbox_oldest_age_seconds:
          type: number
          format: double
          minimum: 0
        command_queue_depth:
          type: integer
          format: int64
          minimum: 0
        command_unknown_total:
          type: integer
          format: int64
          minimum: 0
        config_rollback_total:
          type: integer
          format: int64
          minimum: 0
        config_failed_critical_total:
          type: integer
          format: int64
          minimum: 0
    UserOperationMetrics:
      type: object
      additionalProperties: false
      required: [policy_pending_total, active_batch_item_total, stale_batch_claim_total, unknown_batch_item_total]
      properties:
        policy_pending_total: { type: integer, format: int64, minimum: 0 }
        active_batch_item_total: { type: integer, format: int64, minimum: 0 }
        stale_batch_claim_total: { type: integer, format: int64, minimum: 0 }
        unknown_batch_item_total: { type: integer, format: int64, minimum: 0 }
    SimulationScenario:
      type: object
      additionalProperties: false
      properties:
        heartbeat_count:
          type: integer
          format: int32
          minimum: 1
          maximum: 32
          default: 3
        delay_millis:
          type: integer
          format: int32
          minimum: 0
          maximum: 30000
          default: 100
        duplicate_event:
          type: boolean
          default: false
        return_error:
          type: boolean
          default: false
        disconnect_after:
          type: boolean
          default: false
    DevelopmentRuntime:
      type: object
      additionalProperties: false
      required: [goroutines, db_acquired, db_idle, db_total, sse_active_streams, sse_rejected_streams, sse_watchers, sse_unhealthy_watchers, sse_sql_queries, sse_slow_consumer_disconnects, sse_database_backoff_seconds, privd_receipt_verifications, privd_attestation_key_states]
      properties:
        goroutines:
          type: integer
          format: int32
          minimum: 1
        db_acquired:
          type: integer
          format: int32
          minimum: 0
        db_idle:
          type: integer
          format: int32
          minimum: 0
        db_total:
          type: integer
          format: int32
          minimum: 0
        sse_active_streams: { type: integer, format: int32, minimum: 0 }
        sse_rejected_streams: { type: integer, format: int64, minimum: 0 }
        sse_watchers: { type: integer, format: int32, minimum: 0 }
        sse_unhealthy_watchers: { type: integer, format: int32, minimum: 0 }
        sse_sql_queries: { type: integer, format: int64, minimum: 0 }
        sse_slow_consumer_disconnects: { type: integer, format: int64, minimum: 0 }
        sse_database_backoff_seconds: { type: number, format: double, minimum: 0 }
        privd_receipt_verifications:
          type: array
          maxItems: 11
          items: { $ref: "#/components/schemas/PrivdReceiptVerificationMetric" }
        privd_attestation_key_states:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/PrivdAttestationKeyStateMetric" }
    PrivdReceiptVerificationMetric:
      type: object
      additionalProperties: false
      required: [outcome, reason, total]
      properties:
        outcome: { type: string, enum: [not_required, verified, missing, invalid, unknown_key, revoked_key] }
        reason: { type: string, enum: [not_required, verified, receipt_missing, receipt_malformed, receipt_version_unsupported, receipt_claim_mismatch, receipt_key_lookup_failed, receipt_key_outside_validity, receipt_signature_invalid, receipt_key_unknown, receipt_key_revoked] }
        total: { type: integer, format: int64, minimum: 0 }
    PrivdAttestationKeyStateMetric:
      type: object
      additionalProperties: false
      required: [state, total]
      properties:
        state: { type: string, enum: [pending, active, revoked] }
        total: { type: integer, format: int64, minimum: 0 }
    PrivdAttestationCredentialRequest:
      type: object
      additionalProperties: false
      required: [ttl_seconds, reason]
      properties:
        ttl_seconds: { type: integer, format: int64, minimum: 300, maximum: 3600 }
        reason: { type: string, minLength: 1, maxLength: 512 }
    PrivdAttestationCredential:
      type: object
      additionalProperties: false
      required: [id, node_id, credential, controller_nonce_hex, credential_context_sha256_hex, expires_at]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        node_id: { $ref: "#/components/schemas/UuidV7" }
        credential: { type: string, pattern: "^[A-Za-z0-9_-]{43}$", writeOnly: true }
        controller_nonce_hex: { type: string, pattern: "^[0-9a-f]{64}$" }
        credential_context_sha256_hex: { type: string, pattern: "^[0-9a-f]{64}$" }
        expires_at: { $ref: "#/components/schemas/UtcDateTime" }
    PrivdAttestationRegistration:
      type: object
      additionalProperties: false
      required: [credential, version, key_id, public_key, controller_nonce, credential_context_sha256, signature]
      properties:
        credential: { type: string, pattern: "^[A-Za-z0-9_-]{43}$", writeOnly: true }
        version: { type: integer, const: 1 }
        key_id: { type: string, pattern: "^ed25519-sha256:[0-9a-f]{64}$" }
        public_key: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        controller_nonce: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        credential_context_sha256: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        signature: { type: string, pattern: "^[A-Za-z0-9_-]{86}$" }
    PrivdAttestationRevokeRequest:
      type: object
      additionalProperties: false
      required: [key_id, reason]
      properties:
        key_id: { type: string, pattern: "^ed25519-sha256:[0-9a-f]{64}$" }
        reason: { type: string, minLength: 1, maxLength: 512 }
    PrivdAttestationKeyState:
      type: object
      additionalProperties: false
      required: [key_id, state]
      properties:
        key_id: { type: string, pattern: "^ed25519-sha256:[0-9a-f]{64}$" }
        state: { type: string, enum: [active, revoked] }
    EnrollmentTokenRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, environment, expected_endpoint_id, reason]
      properties:
        workspace_id:
          $ref: "#/components/schemas/UuidV7"
        environment:
          type: string
          minLength: 1
          maxLength: 64
        expected_node_name:
          type: string
          minLength: 1
          maxLength: 128
        expected_endpoint_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 900
          default: 900
        reason:
          type: string
          minLength: 1
          maxLength: 1024
    EnrollmentToken:
      type: object
      additionalProperties: false
      required: [id, token, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        token:
          type: string
          minLength: 43
          maxLength: 43
          readOnly: true
        expires_at:
          $ref: "#/components/schemas/UtcDateTime"
    NodeApproval:
      type: object
      additionalProperties: false
      required: [policy, capabilities, reason]
      properties:
        labels:
          type: object
          maxProperties: 32
          propertyNames:
            minLength: 1
            maxLength: 64
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 128
        policy:
          type: string
          minLength: 1
          maxLength: 128
        capabilities:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        reason:
          type: string
          minLength: 1
          maxLength: 1024
    NodeRevocation:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1024
    NodeTrustState:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        status:
          type: string
          enum: [active, revoked]
    DropCounters:
      type: object
      additionalProperties: false
      required: [security, health, aggregate, raw]
      properties:
        security: { type: integer, format: int64, minimum: 0 }
        health: { type: integer, format: int64, minimum: 0 }
        aggregate: { type: integer, format: int64, minimum: 0 }
        raw: { type: integer, format: int64, minimum: 0 }
    NodeObservedState:
      type: object
      additionalProperties: false
      required: [id, name, version, trust_status, connection_state, freshness, dropped, session_count]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        name: { type: string, minLength: 1, maxLength: 128 }
        version: { type: integer, format: int64, minimum: 1 }
        trust_status: { type: string, enum: [pending, active, revoked, offline] }
        connection_state: { type: string, enum: [online, offline] }
        freshness: { type: string, enum: [fresh, stale, never] }
        observed_at: { $ref: "#/components/schemas/UtcDateTime" }
        last_heartbeat_at: { $ref: "#/components/schemas/UtcDateTime" }
        boot_id: { type: string, minLength: 1, maxLength: 128 }
        agent_instance_id: { $ref: "#/components/schemas/UuidV7" }
        agent_version: { type: string, minLength: 1, maxLength: 128 }
        ocserv_version: { type: string, minLength: 1, maxLength: 128 }
        os_release: { type: string, minLength: 1, maxLength: 128 }
        ocserv: { type: object, additionalProperties: true }
        system: { type: object, additionalProperties: true }
        path: { $ref: "#/components/schemas/ConnectionPathState" }
        dropped: { $ref: "#/components/schemas/DropCounters" }
        session_count: { type: integer, minimum: 0 }
    ConnectionPathState:
      type: object
      additionalProperties: true
      required: [mode, rtt_ms]
      properties:
        mode: { type: string, enum: [direct, relay, unknown] }
        rtt_ms: { type: number, minimum: 0 }
        relay_url: { type: string, format: uri }
    NodePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/NodeObservedState" }
        page: { $ref: "#/components/schemas/PageInfo" }
    NodeSession:
      type: object
      additionalProperties: false
      required: [id, username, client_ip, connected_at, bytes_in, bytes_out]
      properties:
        id: { type: string, minLength: 1, maxLength: 256 }
        username: { type: string, minLength: 1, maxLength: 256 }
        client_ip: { type: string, format: ip }
        connected_at: { $ref: "#/components/schemas/UtcDateTime" }
        bytes_in: { type: integer, format: int64, minimum: 0 }
        bytes_out: { type: integer, format: int64, minimum: 0 }
    NodeSessionPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/NodeSession" }
        page: { $ref: "#/components/schemas/PageInfo" }
    NodeIpBan:
      type: object
      additionalProperties: false
      required: [ip]
      properties:
        ip: { type: string, format: ip }
        seconds_remaining: { type: integer, format: int64, minimum: 0 }
    NodeIpBanPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/NodeIpBan" }
    TelemetryMetric:
      type: string
      enum: [cpu_usage_ratio, memory_used_bytes, network_rx_bytes, network_tx_bytes, session_count, connection_rtt_ms]
    TelemetryPoint:
      type: object
      additionalProperties: false
      required: [at, metric, count, minimum, maximum, average]
      properties:
        at: { $ref: "#/components/schemas/UtcDateTime" }
        metric: { $ref: "#/components/schemas/TelemetryMetric" }
        count: { type: integer, format: int64, minimum: 1 }
        minimum: { type: number }
        maximum: { type: number }
        average: { type: number }
    TelemetryPointPage:
      type: object
      additionalProperties: false
      required: [items, resolution]
      properties:
        items:
          type: array
          maxItems: 2000
          items: { $ref: "#/components/schemas/TelemetryPoint" }
        resolution: { type: string, enum: [raw, 5m, 1h] }
    PlatformEventType:
      type: string
      enum: [connected, disconnected, command_result, simulation_result, heartbeat, error, path_changed, telemetry]
    Traceparent:
      type: string
      pattern: "^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$"
    PlatformEvent:
      type: object
      additionalProperties: false
      required: [id, node_id, type, traceparent, occurred_at]
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        node_id:
          $ref: "#/components/schemas/UuidV7"
        type:
          $ref: "#/components/schemas/PlatformEventType"
        traceparent:
          $ref: "#/components/schemas/Traceparent"
        occurred_at:
          $ref: "#/components/schemas/UtcDateTime"
    PlatformEventPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/PlatformEvent"
        page:
          $ref: "#/components/schemas/PageInfo"
    PageInfo:
      type: object
      additionalProperties: false
      required: [has_more]
      properties:
        has_more:
          type: boolean
        next_cursor:
          $ref: "#/components/schemas/Cursor"
    OperationPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Operation"
        page:
          $ref: "#/components/schemas/PageInfo"
    BreakGlassRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 1024, writeOnly: true }
    Workspace:
      type: object
      additionalProperties: false
      required: [id, name, slug, version]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        name: { type: string, minLength: 1, maxLength: 256 }
        slug: { type: string, minLength: 1, maxLength: 256 }
        version: { type: integer, format: int64, minimum: 1 }
    WorkspacePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/Workspace" } }
    RoleBindingRequest:
      type: object
      additionalProperties: false
      required: [identity_id, workspace_id, role, resource_type, reason]
      properties:
        identity_id: { $ref: "#/components/schemas/UuidV7" }
        workspace_id: { $ref: "#/components/schemas/UuidV7" }
        role: { type: string, enum: [Viewer, Operator, UserManager, ConfigManager, Auditor, SecurityAdmin, PlatformAdmin] }
        resource_type: { type: string, enum: [workspace, node, resource, secret_ref, certificate, config_plan, batch_operation, role_binding] }
        resource_id: { $ref: "#/components/schemas/UuidV7" }
        reason: { type: string, minLength: 1, maxLength: 512 }
        approval_id:
          allOf: [{ $ref: "#/components/schemas/UuidV7" }]
          description: Required for SecurityAdmin and PlatformAdmin grants.
    RoleBinding:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [action, resource_type, reason, ttl_seconds]
      properties:
        action: { type: string, minLength: 1, maxLength: 128 }
        resource_type: { type: string, minLength: 1, maxLength: 64 }
        resource_id: { $ref: "#/components/schemas/UuidV7" }
        reason: { type: string, minLength: 1, maxLength: 512 }
        ttl_seconds: { type: integer, format: int64, minimum: 60, maximum: 86400 }
        batch_items:
          type: array
          minItems: 1
          maxItems: 500
          description: Required for user.batch.disable so the approver reviews the immutable batch contents.
          items: { $ref: "#/components/schemas/UserBatchItemRequest" }
        node_approval:
          $ref: "#/components/schemas/NodeApproval"
        certificate:
          type: object
          additionalProperties: false
          required: [expected_version, reason]
          properties:
            expected_version: { type: integer, format: int64, minimum: 1 }
            purpose: { type: string, enum: [certificate_p12] }
            artifact_request_id: { $ref: "#/components/schemas/UuidV7" }
            reason: { type: string, minLength: 1, maxLength: 512 }
        role_binding:
          type: object
          additionalProperties: false
          required: [identity_id, role, resource_type]
          properties:
            identity_id: { $ref: "#/components/schemas/UuidV7" }
            role: { type: string, enum: [SecurityAdmin, PlatformAdmin] }
            resource_type: { type: string, enum: [workspace, node, resource, secret_ref, certificate, config_plan, batch_operation, role_binding] }
            resource_id: { $ref: "#/components/schemas/UuidV7" }
    ApprovalDecision:
      type: object
      additionalProperties: false
      required: [reason, expected_request_hash]
      properties:
        reason: { type: string, minLength: 1, maxLength: 512 }
        expected_request_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Required when approving a content-bound request; must match the details read before deciding.
    Approval:
      type: object
      additionalProperties: false
      required: [id, workspace_id, requester_id, action, resource_type, resource_id, reason, status, expires_at, created_at]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        workspace_id: { $ref: "#/components/schemas/UuidV7" }
        requester_id: { $ref: "#/components/schemas/UuidV7" }
        approver_id: { $ref: "#/components/schemas/UuidV7" }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { $ref: "#/components/schemas/UuidV7" }
        reason: { type: string }
        status: { type: string, enum: [pending, approved, rejected, expired, consumed] }
        request_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Canonical SHA-256 of the immutable reviewed content when the approval is content-bound.
        request_summary:
          oneOf:
            - type: array
              maxItems: 500
              items: { $ref: "#/components/schemas/UserBatchItemRequest" }
            - type: object
              additionalProperties: true
        config_plan_summary:
          $ref: "#/components/schemas/ConfigPlanApprovalSummary"
        certificate_summary:
          $ref: "#/components/schemas/CertificateApprovalSummary"
        expires_at: { $ref: "#/components/schemas/UtcDateTime" }
        created_at: { $ref: "#/components/schemas/UtcDateTime" }
    AuditEventPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items: { type: object, additionalProperties: true }
    AuditVerification:
      type: object
      additionalProperties: false
      required: [workspace_id, events, valid, checkpoint_valid]
      properties:
        workspace_id: { $ref: "#/components/schemas/UuidV7" }
        events: { type: integer, format: int64, minimum: 0 }
        valid: { type: boolean }
        checkpoint_valid: { type: boolean }
    Problem:
      type: object
      additionalProperties: true
      description: RFC 9457 Problem Details response.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
          minLength: 1
          maxLength: 256
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 4096
        instance:
          type: string
          format: uri-reference
        trace_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
