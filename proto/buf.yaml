version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # The architecture fixes these response names as NodeConnection and
    # TransportEvent at the language-neutral IPC boundary.
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
  ignore:
    # Go Controller and transportd ship from the same release commit; only
    # external Agent wire contracts under agent/v1 carry cross-version breaking checks.
    - ocserv/platform/transport/v1
