syntax = "proto3";

package ocserv.platform.agent.v1;

import "google/protobuf/timestamp.proto";

message EnrollRequest {
  string token = 1;
  bytes endpoint_id = 2;
  string agent_version = 3;
  string os_release = 4;
  string ocserv_version = 5;
  string boot_id = 6;
  bytes agent_instance_id = 7;
  repeated string capabilities = 8;
  string environment = 9;
  bytes nonce = 10;
  google.protobuf.Timestamp time = 11;
  uint32 enrollment_protocol_major = 12;
  uint32 enrollment_protocol_minor = 13;
  EnrollmentProofV1 proof = 14;
  repeated SealingKeyDescriptorV1 sealing_keys = 15;
}

// EnrollmentProofV1 is signed by the Agent's long-lived Iroh Endpoint
// SecretKey over an independent canonical representation. transportd relays
// it but cannot substitute the endpoint or advertised capabilities.
message EnrollmentProofV1 {
  uint32 version = 1;
  bytes signature = 2;
}

message EnrollResponse {
  HandshakeResult result = 1;
  bytes node_id = 2;
  string controller_endpoint_id = 3;
}

enum HandshakeResult {
  HANDSHAKE_RESULT_UNSPECIFIED = 0;
  HANDSHAKE_RESULT_ACCEPTED = 1;
  HANDSHAKE_RESULT_PENDING_APPROVAL = 2;
  HANDSHAKE_RESULT_REVOKED = 3;
  HANDSHAKE_RESULT_INCOMPATIBLE_PROTOCOL = 4;
  HANDSHAKE_RESULT_UPGRADE_REQUIRED = 5;
  HANDSHAKE_RESULT_CLOCK_SKEW = 6;
  HANDSHAKE_RESULT_CAPABILITY_REJECTED = 7;
}

message SessionHandshake {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string agent_version = 3;
  string controller_version = 4;
  bytes node_id = 5;
  bytes endpoint_id = 6;
  repeated string capabilities = 7;
  string ocserv_version = 8;
  string os_release = 9;
  string boot_id = 10;
  bytes agent_instance_id = 11;
  repeated string supported_compressions = 12;
  uint32 max_message_size = 13;
  google.protobuf.Timestamp time = 14;
  bytes nonce = 15;
  repeated SealingKeyDescriptorV1 sealing_keys = 16;
}

enum SealedSecretVersion {
  SEALED_SECRET_VERSION_UNSPECIFIED = 0;
  SEALED_SECRET_VERSION_V1 = 1;
}

enum SealedSecretPurpose {
  SEALED_SECRET_PURPOSE_UNSPECIFIED = 0;
  SEALED_SECRET_PURPOSE_USER_PASSWORD = 1;
  SEALED_SECRET_PURPOSE_CERTIFICATE_P12_PASSWORD = 2;
}

// SealingKeyDescriptorV1 identifies one purpose-specific RSA-OAEP-SHA256
// public key. Enrollment proof binds the complete advertised set.
message SealingKeyDescriptorV1 {
  SealedSecretVersion version = 1;
  SealedSecretPurpose purpose = 2;
  string key_id = 3;
  bytes public_key_sha256 = 4;
}

// SealedSecretV1 is purpose-bound metadata plus ciphertext. Purpose isolation
// is additionally enforced by distinct private keys at privd.
message SealedSecretV1 {
  SealedSecretVersion version = 1;
  SealedSecretPurpose purpose = 2;
  string key_id = 3;
  bytes ciphertext = 4;
}

message SessionHandshakeResponse {
  HandshakeResult result = 1;
  uint32 protocol_major = 2;
  uint32 protocol_minor = 3;
  uint32 max_message_size = 4;
  string controller_version = 5;
  repeated string negotiated_capabilities = 6;
  SessionGrantV1 session_grant = 7;
}

enum SessionGrantVersion {
  SESSION_GRANT_VERSION_UNSPECIFIED = 0;
  SESSION_GRANT_VERSION_V1 = 1;
}

// SessionGrantV1 is signed by the Controller over an independent canonical
// representation. transportd relays and retains it but cannot mint it.
message SessionGrantV1 {
  SessionGrantVersion version = 1;
  string key_id = 2;
  uint32 protocol_major = 3;
  uint32 protocol_minor = 4;
  bytes node_id = 5;
  bytes endpoint_id = 6;
  uint64 authorization_revision = 7;
  repeated string negotiated_capabilities = 8;
  google.protobuf.Timestamp issued_at = 9;
  google.protobuf.Timestamp expires_at = 10;
  bytes signature = 11;
}

enum FenceSignatureVersion {
  FENCE_SIGNATURE_VERSION_UNSPECIFIED = 0;
  FENCE_SIGNATURE_VERSION_ED25519_V1 = 1;
}

enum FenceOperationKind {
  FENCE_OPERATION_KIND_UNSPECIFIED = 0;
  FENCE_OPERATION_KIND_COMMAND = 1;
  FENCE_OPERATION_KIND_ARTIFACT = 2;
  FENCE_OPERATION_KIND_CONNECTION_CLOSE = 3;
  FENCE_OPERATION_KIND_STATE_UPDATE = 4;
}

// ConnectionFenceV2 is the Controller-signed per-node connection-owner fence.
// It binds the exact owner instance, process incarnation, connection identity,
// and the monotonically increasing fencing epoch recorded by the database
// ownership authority. V1 session grants never carry these fields and are
// never reinterpreted as fences: a V1 grant stays a bounded compatibility
// proof and cannot authorize a fenced mutation.
message ConnectionFenceV2 {
  FenceSignatureVersion signature_version = 1;
  string key_id = 2;
  bytes fence_id = 3;
  bytes node_id = 4;
  bytes endpoint_id = 5;
  bytes owner_instance_id = 6;
  uint64 owner_incarnation = 7;
  uint64 owner_epoch = 8;
  bytes connection_id = 9;
  uint64 authorization_revision = 10;
  repeated string capabilities = 11;
  google.protobuf.Timestamp lease_until = 12;
  google.protobuf.Timestamp issued_at = 13;
  google.protobuf.Timestamp expires_at = 14;
  bytes signature = 15;
}

// FenceBindingV2 binds one operation identity (command dispatch, artifact
// acknowledgement, connection close, or state update) to the exact fence
// identity tuple: owner instance, incarnation, connection, and epoch. A
// binding signed for one epoch never authorizes work recorded under a
// different epoch, so late legitimate results are matched against the fence
// of the actual dispatch attempt.
message FenceBindingV2 {
  FenceSignatureVersion signature_version = 1;
  string key_id = 2;
  FenceOperationKind operation_kind = 3;
  bytes operation_id = 4;
  bytes fence_id = 5;
  bytes node_id = 6;
  bytes endpoint_id = 7;
  bytes owner_instance_id = 8;
  uint64 owner_incarnation = 9;
  uint64 owner_epoch = 10;
  bytes connection_id = 11;
  uint64 authorization_revision = 12;
  string capability = 13;
  google.protobuf.Timestamp issued_at = 14;
  google.protobuf.Timestamp expires_at = 15;
  bytes signature = 16;
}

enum AgentEventType {
  AGENT_EVENT_TYPE_UNSPECIFIED = 0;
  AGENT_EVENT_TYPE_COMMAND_RESULT = 1;
  AGENT_EVENT_TYPE_HEARTBEAT = 2;
  AGENT_EVENT_TYPE_ERROR = 3;
}

// AgentEvent is a bounded, length-delimited response frame on a command stream.
message AgentEvent {
  AgentEventType type = 1;
  bytes payload = 2;
}

enum CommandResultState {
  COMMAND_RESULT_STATE_UNSPECIFIED = 0;
  COMMAND_RESULT_STATE_SUCCEEDED = 1;
  COMMAND_RESULT_STATE_FAILED = 2;
  COMMAND_RESULT_STATE_UNKNOWN = 3;
  COMMAND_RESULT_STATE_REJECTED = 4;
}

enum CommandDeliveryMode {
  COMMAND_DELIVERY_MODE_UNSPECIFIED = 0;
  COMMAND_DELIVERY_MODE_EXECUTE_OR_REPLAY = 1;
  COMMAND_DELIVERY_MODE_RECONCILE_ONLY = 2;
  COMMAND_DELIVERY_MODE_RETRY_IF_EFFECT_ABSENT = 3;
}

// SemanticPayloadHashVersion identifies the canonical command identity
// algorithm. See docs/development/command-semantic-hash-v1.md and v2.md.
enum SemanticPayloadHashVersion {
  SEMANTIC_PAYLOAD_HASH_VERSION_UNSPECIFIED = 0;
  SEMANTIC_PAYLOAD_HASH_VERSION_V1 = 1;
  SEMANTIC_PAYLOAD_HASH_VERSION_V2 = 2;
}

// CommandAuthorizationVersion selects the canonical Controller authorization
// format. Command authorization is independent of Protobuf serialization.
enum CommandAuthorizationVersion {
  COMMAND_AUTHORIZATION_VERSION_UNSPECIFIED = 0;
  COMMAND_AUTHORIZATION_VERSION_V1 = 1;
}

// CommandAuthorizationProof is issued by the Controller and only relayed by
// transportd. The signature covers CommandAuthorizationV1 canonical bytes.
message CommandAuthorizationProof {
  CommandAuthorizationVersion version = 1;
  string key_id = 2;
  bytes signature = 3;
}

// CommandResult is persisted before it is placed on the response stream.
message CommandResult {
  bytes command_id = 1;
  bytes idempotency_key = 2;
  bytes payload_sha256 = 3;
  CommandResultState state = 4;
  bytes result = 5;
  string error_code = 6;
  google.protobuf.Timestamp accepted_at = 7;
  google.protobuf.Timestamp completed_at = 8;
  bool replayed = 9;
  SemanticPayloadHashVersion semantic_payload_hash_version = 10;
  PrivilegedResultProof privileged_result_proof = 11;
}

enum PrivdReceiptVersion {
  PRIVD_RECEIPT_VERSION_UNSPECIFIED = 0;
  PRIVD_RECEIPT_VERSION_V1 = 1;
}

enum PrivilegedCommandKind {
  PRIVILEGED_COMMAND_KIND_UNSPECIFIED = 0;
  PRIVILEGED_COMMAND_KIND_SESSION_DISCONNECT = 1;
  PRIVILEGED_COMMAND_KIND_SESSION_TERMINATE = 2;
  PRIVILEGED_COMMAND_KIND_IP_BAN_REMOVE = 3;
  PRIVILEGED_COMMAND_KIND_SERVICE_RELOAD = 4;
  PRIVILEGED_COMMAND_KIND_USER_CREATE = 5;
  PRIVILEGED_COMMAND_KIND_USER_DISABLE = 6;
  PRIVILEGED_COMMAND_KIND_USER_ENABLE = 7;
  PRIVILEGED_COMMAND_KIND_USER_PASSWORD_ROTATE = 8;
  PRIVILEGED_COMMAND_KIND_GROUP_APPLY = 9;
  PRIVILEGED_COMMAND_KIND_CONFIG_PLAN = 10;
  PRIVILEGED_COMMAND_KIND_CONFIG_APPLY = 11;
  PRIVILEGED_COMMAND_KIND_CERTIFICATE_CSR = 12;
  PRIVILEGED_COMMAND_KIND_CERTIFICATE_P12 = 13;
  PRIVILEGED_COMMAND_KIND_CERTIFICATE_REVOKE = 14;
}

enum PrivilegedResultKind {
  PRIVILEGED_RESULT_KIND_UNSPECIFIED = 0;
  PRIVILEGED_RESULT_KIND_MUTATION = 1;
  PRIVILEGED_RESULT_KIND_CONFIG_PLAN = 2;
  PRIVILEGED_RESULT_KIND_CONFIG_APPLY = 3;
  PRIVILEGED_RESULT_KIND_CERTIFICATE_CSR = 4;
  PRIVILEGED_RESULT_KIND_CERTIFICATE_P12 = 5;
  PRIVILEGED_RESULT_KIND_CERTIFICATE_REVOKE = 6;
  PRIVILEGED_RESULT_KIND_ERROR = 7;
}

// PrivilegedResultProof is opaque evidence to Agent and transportd. Only
// root-owned privd signs it and Controller reconstructs its canonical bytes.
message PrivilegedResultProof {
  PrivdReceiptVersion version = 1;
  PrivdResultReceiptV1 receipt_v1 = 2;
  bytes signature = 3;
}

message PrivdResultReceiptV1 {
  PrivdReceiptVersion receipt_version = 1;
  bytes node_id = 2;
  string privd_attestation_key_id = 3;
  bytes command_id = 4;
  bytes operation_id = 5;
  bytes idempotency_key = 6;
  SemanticPayloadHashVersion semantic_payload_hash_version = 7;
  bytes semantic_payload_sha256 = 8;
  PrivilegedCommandKind command_kind = 9;
  PrivilegedResultKind result_kind = 10;
  CommandResultState terminal_state = 11;
  bytes result_bytes_sha256 = 12;
  bytes error_code_sha256 = 13;
  bytes effect_record_id = 14;
  uint64 effect_sequence = 15;
  google.protobuf.Timestamp accepted_at = 16;
  google.protobuf.Timestamp completed_at = 17;
  bool replayed = 18;
  PrivdCertificateReceiptBindingV1 certificate = 19;
}

message PrivdCertificateReceiptBindingV1 {
  bytes certificate_id = 1;
  bytes csr_der_sha256 = 2;
  bytes public_key_sha256 = 3;
  bytes requested_subject_sha256 = 4;
  bytes root_effect_record_id = 5;
}

// PrivdAttestationRegistrationV1 proves possession of the new key while a
// separately delivered root-only one-time credential establishes trust.
message PrivdAttestationRegistrationV1 {
  PrivdReceiptVersion version = 1;
  bytes node_id = 2;
  string privd_attestation_key_id = 3;
  bytes public_key = 4;
  bytes controller_nonce = 5;
  bytes credential_context_sha256 = 6;
  bytes signature = 7;
}

enum TelemetryPriority {
  TELEMETRY_PRIORITY_UNSPECIFIED = 0;
  TELEMETRY_PRIORITY_SECURITY = 1;
  TELEMETRY_PRIORITY_CURRENT_HEALTH = 2;
  TELEMETRY_PRIORITY_AGGREGATE = 3;
  TELEMETRY_PRIORITY_RAW_HISTORY = 4;
}

message TelemetryDropCounters {
  uint64 security = 1;
  uint64 health = 2;
  uint64 aggregate = 3;
  uint64 raw = 4;
}

message ObservedSnapshot {
  google.protobuf.Timestamp observed_at = 1;
  string boot_id = 2;
  bytes agent_instance_id = 3;
  string agent_version = 4;
  string ocserv_version = 5;
  string os_release = 6;
  bytes ocserv_json = 7;
  bytes system_json = 8;
  bytes path_json = 9;
  TelemetryDropCounters dropped = 10;
}

message SessionObservation {
  string session_id = 1;
  string username = 2;
  string client_ip = 3;
  google.protobuf.Timestamp connected_at = 4;
  uint64 bytes_in = 5;
  uint64 bytes_out = 6;
}

message IpBanObservation {
  string ip = 1;
  optional uint64 seconds_remaining = 2;
}

message MetricSample {
  google.protobuf.Timestamp sampled_at = 1;
  string metric = 2;
  double value = 3;
}

message SecurityObservation {
  bytes event_id = 1;
  google.protobuf.Timestamp observed_at = 2;
  string severity = 3;
  string event_type = 4;
  bytes detail_json = 5;
}

message TelemetryBatch {
  bytes batch_id = 1;
  bytes node_id = 2;
  uint64 sequence = 3;
  TelemetryPriority priority = 4;
  ObservedSnapshot snapshot = 5;
  repeated SessionObservation sessions = 6;
  repeated MetricSample samples = 7;
  repeated SecurityObservation security_events = 8;
  repeated IpBanObservation ip_bans = 9;
  repeated UserObservation users = 10;
  repeated GroupObservation groups = 11;
}

message UserObservation {
  string username = 1;
  bool enabled = 2;
  uint64 revision = 3;
  bytes fingerprint_sha256 = 4;
}

message GroupObservation {
  string group_name = 1;
  repeated string members = 2;
  uint64 revision = 3;
  bytes fingerprint_sha256 = 4;
}

message CommandEnvelope {
  string protocol_version = 1;
  bytes message_id = 2;
  bytes command_id = 3;
  bytes idempotency_key = 4;
  bytes node_id = 5;
  uint64 sequence = 6;
  google.protobuf.Timestamp issued_at = 7;
  google.protobuf.Timestamp expires_at = 8;
  uint64 expected_revision = 9;
  string traceparent = 10;
  string actor_id = 11;
  string reason = 12;
  reserved 13 to 99;
  reserved "legacy_payload";

  oneof payload {
    SessionDisconnect session_disconnect = 100;
    UserCreate user_create = 101;
    UserDisable user_disable = 102;
    ConfigPlan config_plan = 103;
    ConfigApply config_apply = 104;
    ServiceReload service_reload = 105;
    SimulationProbe simulation_probe = 106;
    SyntheticNoop synthetic_noop = 107;
    SyntheticEcho synthetic_echo = 108;
    SessionTerminate session_terminate = 112;
    IpBanRemove ip_ban_remove = 113;
    UserPasswordRotate user_password_rotate = 114;
    GroupApply group_apply = 115;
    UserEnable user_enable = 116;
    CertificateCsr certificate_csr = 117;
    CertificateP12 certificate_p12 = 118;
    CertificateRevoke certificate_revoke = 119;
  }
  CommandDeliveryMode delivery_mode = 109;
  SemanticPayloadHashVersion semantic_payload_hash_version = 110;
  bytes semantic_payload_sha256 = 111;
  bytes operation_id = 120;
  string action = 121;
  string required_capability = 122;
  bytes approval_id = 123;
  bytes approval_request_sha256 = 124;
  CommandAuthorizationProof authorization = 125;
}

message SessionDisconnect {
  string session_id = 1;
  string boot_id = 2;
}

message SessionTerminate {
  string session_id = 1;
  string boot_id = 2;
}

message IpBanRemove {
  string ip = 1;
}

message UserCreate {
  string username = 1;
  // Deprecated wire fields are rejected by protocol 1.1 execution.
  bytes sealed_password = 2;
  string secret_key_id = 3;
  uint64 desired_revision = 4;
  SealedSecretV1 sealed_password_v1 = 5;
}

message UserDisable {
  string username = 1;
  uint64 desired_revision = 2;
}

message UserEnable {
  string username = 1;
  uint64 desired_revision = 2;
}

message UserPasswordRotate {
  string username = 1;
  // Deprecated wire fields are rejected by protocol 1.1 execution.
  bytes sealed_password = 2;
  string secret_key_id = 3;
  uint64 desired_revision = 4;
  SealedSecretV1 sealed_password_v1 = 5;
}

message GroupApply {
  string group_name = 1;
  repeated string members = 2;
  uint64 desired_revision = 3;
}

message ConfigPlan {
  bytes candidate = 1;
  bytes candidate_hash = 2;
  uint64 expected_revision = 3;
}

message ConfigPlanResult {
  bytes candidate_hash = 1;
  string diff_redacted = 2;
  repeated string warnings = 3;
  bool current_unchanged = 4;
  bool staging_cleaned = 5;
  bytes current_hash = 6;
}

message ConfigApply {
  bytes candidate_hash = 1;
  bytes candidate = 2;
  bytes expected_current_hash = 3;
  uint64 desired_revision = 4;
}

message ConfigApplyResult {
  bytes candidate_hash = 1;
  bytes previous_hash = 2;
  bytes observed_hash = 3;
  uint64 applied_revision = 4;
  bool healthy = 5;
  bool rolled_back = 6;
  bool failed_critical = 7;
  string failure_code = 8;
}

message CertificateCsr {
  bytes certificate_id = 1;
  string common_name = 2;
  repeated string dns_names = 3;
  uint32 key_bits = 4;
}

message CertificateCsrResult {
  bytes certificate_id = 1;
  bytes csr_der = 2;
  bytes public_key_sha256 = 3;
}

message CertificateP12 {
  bytes certificate_id = 1;
  bytes certificate_chain_pem = 2;
  // Deprecated wire fields are rejected by protocol 1.1 execution.
  bytes sealed_password = 3;
  string secret_key_id = 4;
  bytes artifact_id = 5;
  SealedSecretV1 sealed_password_v1 = 6;
  uint64 certificate_version = 7;
  google.protobuf.Timestamp artifact_expires_at = 8;
}

message CertificateArtifactResult {
  bytes certificate_id = 1;
  bytes artifact_id = 2;
  bytes artifact_sha256 = 3;
  uint64 artifact_size = 4;
}

message CertificateRevoke {
  bytes certificate_id = 1;
  string reason = 2;
  uint64 certificate_version = 3;
}

message CertificateRevokeResult {
  bytes certificate_id = 1;
  bool key_removed = 2;
}

message ArtifactFetchRequest {
  bytes artifact_id = 1;
  string purpose = 2;
  uint64 max_bytes = 3;
  ArtifactGrantV1 grant = 4;
}

// ArtifactConsumeRequest is sent only after the Control Plane has received and
// verified the complete artifact. The same signed grant authorizes deletion.
message ArtifactConsumeRequest {
  ArtifactGrantV1 grant = 1;
  bytes sha256 = 2;
  uint64 size = 3;
  // Confirmation is read-only and may use an expired grant only to prove that
  // the exact root-owned ledger record was already consumed.
  bool confirm_only = 4;
}

message ArtifactConsumeResponse {
  bytes artifact_id = 1;
  bytes grant_id = 2;
  bool consumed = 3;
}

enum ArtifactGrantVersion {
  ARTIFACT_GRANT_VERSION_UNSPECIFIED = 0;
  ARTIFACT_GRANT_VERSION_V1 = 1;
}

// ArtifactGrantV1 is signed by the Controller over an independent canonical
// representation. transportd only relays this proof.
message ArtifactGrantV1 {
  ArtifactGrantVersion version = 1;
  string key_id = 2;
  bytes node_id = 3;
  bytes artifact_id = 4;
  bytes certificate_id = 5;
  uint64 certificate_version = 6;
  bytes operation_id = 7;
  string authorized_subject = 8;
  string purpose = 9;
  uint64 max_bytes = 10;
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp expires_at = 12;
  bytes grant_id = 13;
  bytes signature = 14;
}

message ArtifactChunk {
  bytes artifact_id = 1;
  uint64 offset = 2;
  bytes data = 3;
  bool eof = 4;
  bytes sha256 = 5;
}

message ServiceReload {}

// Synthetic commands exercise delivery without changing remote state.
message SyntheticNoop {}

message SyntheticEcho {
  string message = 1;
}

// SimulationProbe exists only to exercise the local, side-effect-free slice.
message SimulationProbe {
  uint32 heartbeat_count = 1;
  uint32 delay_millis = 2;
  bool duplicate_event = 3;
  bool return_error = 4;
  bool disconnect_after = 5;
}
