syntax = "proto3";

package ocserv.platform.transport.v1;

import "google/protobuf/timestamp.proto";
import "ocserv/platform/agent/v1/agent.proto";

// TransportService is the complete typed UDS boundary exposed to Go.
service TransportService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc GetNodeConnection(GetNodeConnectionRequest) returns (NodeConnection);
  rpc SendCommand(SendCommandRequest) returns (SendCommandResponse);
  rpc CloseNode(CloseNodeRequest) returns (CloseNodeResponse);
  rpc WatchEvents(WatchEventsRequest) returns (stream TransportEvent);
  rpc UpdateNodeTrust(UpdateNodeTrustRequest) returns (UpdateNodeTrustResponse);
  rpc FetchArtifact(FetchArtifactRequest) returns (stream ocserv.platform.agent.v1.ArtifactChunk);
  rpc ConsumeArtifact(ConsumeArtifactRequest) returns (ConsumeArtifactResponse);
  rpc RegisterOwnerFence(RegisterOwnerFenceRequest) returns (RegisterOwnerFenceResponse);
  rpc GetOwnerFence(GetOwnerFenceRequest) returns (GetOwnerFenceResponse);
}

// TrustService is implemented by the Go control plane on a private UDS.
service TrustService {
  rpc ListNodeTrust(ListNodeTrustRequest) returns (ListNodeTrustResponse);
  rpc CheckEndpoint(CheckEndpointRequest) returns (CheckEndpointResponse);
  rpc ValidateEnrollment(ValidateEnrollmentRequest) returns (ValidateEnrollmentResponse);
  rpc Enroll(ocserv.platform.agent.v1.EnrollRequest) returns (ocserv.platform.agent.v1.EnrollResponse);
  rpc AuthorizeSession(AuthorizeSessionRequest) returns (ocserv.platform.agent.v1.SessionHandshakeResponse);
}

message ListNodeTrustRequest {}

message NodeTrustBinding {
  bytes node_id = 1;
  bytes endpoint_id = 2;
  NodeTrustState state = 3;
  uint64 revision = 4;
}

message ListNodeTrustResponse {
  repeated NodeTrustBinding bindings = 1;
}

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_SERVING = 1;
  HEALTH_STATUS_NOT_SERVING = 2;
}

enum ConnectionPath {
  CONNECTION_PATH_UNSPECIFIED = 0;
  CONNECTION_PATH_DIRECT = 1;
  CONNECTION_PATH_RELAY = 2;
}

enum TransportEventType {
  TRANSPORT_EVENT_TYPE_UNSPECIFIED = 0;
  TRANSPORT_EVENT_TYPE_CONNECTED = 1;
  TRANSPORT_EVENT_TYPE_DISCONNECTED = 2;
  TRANSPORT_EVENT_TYPE_COMMAND_RESULT = 3;
  TRANSPORT_EVENT_TYPE_HEARTBEAT = 4;
  TRANSPORT_EVENT_TYPE_ERROR = 5;
  TRANSPORT_EVENT_TYPE_PATH_CHANGED = 6;
  TRANSPORT_EVENT_TYPE_TELEMETRY = 7;
  TRANSPORT_EVENT_TYPE_SIMULATION_RESULT = 8;
}

message HealthRequest {}

message HealthResponse {
  HealthStatus status = 1;
  string version = 2;
}

message GetNodeConnectionRequest {
  bytes node_id = 1;
}

message NodeConnection {
  bytes node_id = 1;
  bytes endpoint_id = 2;
  ConnectionPath path = 3;
  uint64 round_trip_time_millis = 4;
  google.protobuf.Timestamp connected_at = 5;
  bytes agent_instance_id = 6;
  string path_detail = 7;
  google.protobuf.Timestamp last_seen = 8;
  repeated string negotiated_capabilities = 9;
  uint64 authorization_revision = 10;
  google.protobuf.Timestamp session_expires_at = 11;
  // Fencing epoch of the owner fence registered for this node. Zero when no
  // fence is registered for the node yet.
  uint64 owner_epoch = 12;
}

message SendCommandRequest {
  bytes node_id = 1;
  bytes command_envelope = 2;
}

message SendCommandResponse {
  bool accepted = 1;
}

message CloseNodeRequest {
  bytes node_id = 1;
  string reason = 2;
  // Required when the node has a registered owner fence: closing a
  // connection is an owner-fenced operation and a stale owner must not close
  // the current connection.
  ocserv.platform.agent.v1.FenceBindingV2 fence_binding = 3;
}

message CloseNodeResponse {}

enum NodeTrustState {
  NODE_TRUST_STATE_UNSPECIFIED = 0;
  NODE_TRUST_STATE_ACTIVE = 1;
  NODE_TRUST_STATE_REVOKED = 2;
}

message UpdateNodeTrustRequest {
  bytes node_id = 1;
  bytes endpoint_id = 2;
  NodeTrustState state = 3;
  string reason = 4;
  uint64 revision = 5;
  // Required when the node has a registered owner fence: owner-driven state
  // updates are fenced and a stale owner must not update connection state.
  ocserv.platform.agent.v1.FenceBindingV2 fence_binding = 6;
}

enum TrustUpdateDisposition {
  TRUST_UPDATE_DISPOSITION_UNSPECIFIED = 0;
  TRUST_UPDATE_DISPOSITION_APPLIED = 1;
  TRUST_UPDATE_DISPOSITION_STALE = 2;
  TRUST_UPDATE_DISPOSITION_REJECTED = 3;
}

message UpdateNodeTrustResponse {
  TrustUpdateDisposition disposition = 1;
  uint64 retained_revision = 2;
  NodeTrustState retained_state = 3;
}

message FetchArtifactRequest {
  bytes node_id = 1;
  bytes artifact_id = 2;
  string purpose = 3;
  uint64 max_bytes = 4;
  ocserv.platform.agent.v1.ArtifactGrantV1 grant = 5;
  // Required when the node has a registered owner fence. The binding must be
  // an artifact binding for this artifact identity issued under the current
  // owner term.
  ocserv.platform.agent.v1.FenceBindingV2 fence_binding = 6;
}

message ConsumeArtifactRequest {
  bytes node_id = 1;
  ocserv.platform.agent.v1.ArtifactGrantV1 grant = 2;
  bytes sha256 = 3;
  uint64 size = 4;
  // Never consumes bytes. It only confirms an exact already-consumed root
  // ledger record, including after the signed grant has expired.
  bool confirm_only = 5;
  // Required when the node has a registered owner fence, including
  // confirm-only requests: a stale owner must neither consume nor confirm
  // artifacts. The fence binding carries its own expiry, so a current owner
  // can still confirm a record whose artifact grant already expired.
  ocserv.platform.agent.v1.FenceBindingV2 fence_binding = 6;
}

message ConsumeArtifactResponse {
  bool consumed = 1;
}

message CheckEndpointRequest {
  bytes endpoint_id = 1;
  string alpn = 2;
}

message CheckEndpointResponse {
  bool permitted = 1;
}

message ValidateEnrollmentRequest {
  ocserv.platform.agent.v1.EnrollRequest enrollment = 1;
}

message ValidateEnrollmentResponse {
  bool permitted = 1;
}

message AuthorizeSessionRequest {
  bytes remote_endpoint_id = 1;
  ocserv.platform.agent.v1.SessionHandshake handshake = 2;
}

message WatchEventsRequest {
  bytes after_event_id = 1;
}

// RegisterOwnerFence installs or refreshes the Controller-signed owner fence
// for one node. transportd verifies the signature against its pinned
// Controller verification keys, records the term, and immediately retires the
// node's active mutation session when a strictly higher epoch arrives. A
// fence whose epoch is lower than the registered one is rejected as stale, so
// a resumed old owner cannot reclaim dispatch authority.
message RegisterOwnerFenceRequest {
  ocserv.platform.agent.v1.ConnectionFenceV2 fence = 1;
}

enum OwnerFenceDisposition {
  OWNER_FENCE_DISPOSITION_UNSPECIFIED = 0;
  // The fence was recorded; a higher epoch retired the previous session.
  OWNER_FENCE_DISPOSITION_APPLIED = 1;
  // The fence was recorded; the same term's lease deadline was refreshed.
  OWNER_FENCE_DISPOSITION_REFRESHED = 2;
  // The fence predates the registered epoch and was rejected.
  OWNER_FENCE_DISPOSITION_STALE = 3;
}

message RegisterOwnerFenceResponse {
  OwnerFenceDisposition disposition = 1;
  // Epoch retained after the registration decision.
  uint64 retained_epoch = 2;
}

message GetOwnerFenceRequest {
  bytes node_id = 1;
}

// Returns the verified owner fence registered for the node so any Controller
// role process can issue operation bindings for the current term without
// holding the lease itself. transportd never returns an unverified fence.
message GetOwnerFenceResponse {
  ocserv.platform.agent.v1.ConnectionFenceV2 fence = 1;
}

message TransportEvent {
  bytes event_id = 1;
  bytes node_id = 2;
  TransportEventType type = 3;
  google.protobuf.Timestamp occurred_at = 4;
  bytes payload = 5;
  string traceparent = 6;
  bytes endpoint_id = 7;
}
