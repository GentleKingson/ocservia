# The G6 bounded-window sampler derives transportd and Agent task counts from
# the tokio runtime metrics API, which tokio only exposes when the
# `tokio_unstable` cfg is set at build time. The workspace pins the exact
# tokio version, so enabling this cfg cannot pull in changed unstable APIs
# through a patch upgrade. It changes no runtime behavior by itself.
[build]
rustflags = ["--cfg", "tokio_unstable"]
