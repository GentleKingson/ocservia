[workspace]
members = [
  "crates/agent",
  "crates/agent-protocol",
  "crates/canonical-cbor",
  "crates/command-journal",
  "crates/command-authorization",
  "crates/contracts",
  "crates/relay-network-probe",
  "crates/observability",
  "crates/ocserv-adapter",
  "crates/privd",
  "crates/privd-attestation",
  "crates/test-support",
  "crates/transportd",
  "crates/transportd-stub",
  "crates/upgrader",
]
resolver = "3"

[profile.release]
lto = "thin"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97.1"

[workspace.dependencies]
prost = "=0.14.4"
prost-types = "=0.14.4"
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
tokio = "=1.53.3"
tokio-stream = "=0.1.19"
tonic-health = "=0.14.6"
uuid = "=1.24.0"
iroh = { version = "=1.4.2", default-features = false, features = ["metrics", "tls-ring"] }
iroh-relay = { version = "=1.4.2", default-features = false, features = ["server", "tls-ring"] }
hex = "=0.4.3"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
zeroize = "=1.9.0"
rustix = { version = "=1.1.6", features = ["fs", "process"] }
tower = "=0.5.2"
hyper-util = { version = "=0.1.20", features = ["tokio"] }
rand = "=0.10.2"
rusqlite = { version = "=0.41.1", features = ["bundled", "fallible_uint"] }
serde_json = "=1.0.151"
ciborium = "=0.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
hmac = "=0.12.1"
ed25519-dalek = { version = "=3.0.0", features = ["pem", "pkcs8"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
