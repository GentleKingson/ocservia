[workspace]
members = [
  "crates/agent",
  "crates/agent-identity",
  "crates/agent-protocol",
  "crates/command-journal",
  "crates/command-authorization",
  "crates/contracts",
  "crates/g6-probe",
  "crates/g6-tunnel",
  "crates/observability",
  "crates/ocserv-adapter",
  "crates/privd",
  "crates/privd-attestation",
  "crates/transportd",
  "crates/transportd-stub",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97.1"

[workspace.dependencies]
prost = "=0.14.4"
prost-types = "=0.14.4"
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
tokio = "=1.53.1"
tokio-stream = "=0.1.19"
tonic-health = "=0.14.6"
uuid = "=1.24.0"
iroh = { version = "=1.0.0", default-features = false, features = ["metrics", "tls-ring"] }
iroh-relay = { version = "=1.0.3", default-features = false, features = ["server", "tls-ring"] }
hex = "=0.4.3"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.22"
zeroize = "=1.9.0"
rustix = { version = "=1.1.4", features = ["fs", "process"] }
futures-util = "=0.3.33"
tower = "=0.5.2"
hyper-util = { version = "=0.1.20", features = ["tokio"] }
rand = "=0.9.5"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
ed25519-dalek = { version = "=3.0.0-rc.0", features = ["pem", "pkcs8"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }

[patch.crates-io]
iroh = { path = "vendor/iroh" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
