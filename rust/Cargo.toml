[workspace]
members = ["crates/contracts"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97.1"

[workspace.dependencies]
prost = "=0.14.4"
prost-types = "=0.14.4"
tonic = "=0.14.6"
tonic-prost = "=0.14.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
