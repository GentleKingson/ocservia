[workspace]
members = ["crates/contracts", "crates/transportd", "crates/transportd-stub"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97.1"

[workspace.dependencies]
prost = "=0.14.4"
prost-types = "=0.14.4"
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
tokio = "=1.53.1"
tokio-stream = "=0.1.19"
tonic-health = "=0.14.6"
uuid = "=1.24.0"
iroh = { version = "=1.0.0", default-features = false, features = ["metrics", "tls-ring"] }
hex = "=0.4.3"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.22"
zeroize = "=1.9.0"
rustix = { version = "=1.1.4", features = ["process"] }
futures-util = "=0.3.33"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
