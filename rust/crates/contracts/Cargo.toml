[package]
name = "ocservia-contracts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["transport"]
transport = ["dep:tokio", "dep:tonic", "dep:tonic-prost", "dep:uuid"]
relay = ["dep:iroh", "dep:rustls-pki-types", "dep:zeroize"]

[dependencies]
iroh = { workspace = true, optional = true }
ocservia-canonical-cbor = { version = "=0.1.0", path = "../canonical-cbor" }
prost.workspace = true
prost-types.workspace = true
rustix.workspace = true
rustls-pki-types = { workspace = true, optional = true }
serde.workspace = true
tokio = { workspace = true, features = ["net"], optional = true }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v7"], optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
