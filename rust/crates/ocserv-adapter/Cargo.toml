sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
uuid.workspace = true
x509-parser = "=0.18.1"
zeroize.workspace = true

[dev-dependencies]
ocservia-test-support = { version = "=0.1.0", path = "../test-support" }
