[package]
name = "ocservia-transportd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
hex.workspace = true
iroh.workspace = true
ocservia-command-authorization = { version = "=0.1.0", path = "../command-authorization", default-features = false }
ocservia-contracts = { version = "=0.1.0", path = "../contracts" }
prost.workspace = true
prost-types.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic.workspace = true
tonic-health.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
uuid = { workspace = true, features = ["v7"] }
zeroize.workspace = true
rustix.workspace = true
futures-util.workspace = true
tower.workspace = true
hyper-util.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
iroh = { workspace = true, features = ["test-utils"] }
iroh-relay.workspace = true
ocservia-agent-identity = { version = "=0.1.0", path = "../agent-identity" }
ocservia-privd-attestation = { version = "=0.1.0", path = "../privd-attestation" }
sha2.workspace = true

[lints]
workspace = true
