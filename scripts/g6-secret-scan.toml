# Gitleaks configuration for published G6 evidence artifacts and for the
# repository secret scan in scripts/security-check.sh.
#
# The configuration extends the complete default rule set. The narrow allowlist
# exempts only two public, non-secret literals:
#
#   - the run-scoped relay-pre-fault idempotency key, publicly derived from the
#     scenario name, the GitHub run id, the run attempt, and the producing
#     failure domain, which the generic-api-key heuristic mistakes for a
#     credential;
#   - the fixed RSA-2048 SubjectPublicKeyInfo ASN.1 header prefix that every
#     2048-bit RSA public key starts with. Commit 2b4e02e embedded exactly this
#     public constant (without any private modulus) inside a test fixture, and
#     history is immutable, so the private-key heuristic keeps matching that one
#     committed line forever without this value-shaped exemption.
#
#   - the tagged journal effect key `g6-journal-key-<32 hex>`: the run-scoped
#     Agent-journal idempotency key of a synthetic command, published by the
#     evidence builder as a public correlation identifier tying trace effect
#     records to relay-path traffic; bare 32-hex UUIDs trip the same heuristic;
#
#   - every harness-submitted scenario command key
#     `g6-<scenario>-<run>-<attempt>-fd-b[-suffix]` with the scenario drawn
#     from the fixed set the G6 harness submits (load, relay-pre-fault,
#     relay-failover, path-direct-recovery, crashN, window). These are the
#     same public run-scoped idempotency-key class as the relay entry below —
#     derived from the scenario name, the GitHub run id, the attempt, and the
#     producing failure domain — but only some members (for example
#     `g6-crash1-…`) happen to cross the entropy heuristic, so the whole
#     enumerated class is exempted uniformly instead of per-run luck;
#
#   - the fixed synthetic constant `01a02cfab3f17d5888eb7c20bf609ff2`, the
#     bare fixture journal key committed once (as a bare value) in fb99f98's
#     test-script diff. It is an authored test constant, not a credential,
#     and commit history is immutable, so the heuristic keeps matching that
#     one committed line forever without this value-shaped exemption. The
#     live negative regression generates a fresh bare key at runtime and
#     still fails closed.
#
# Exemptions are value-shaped only: a path- or file-based allowlist would hide
# a real secret inside the same evidence files, so it is forbidden by
# scripts/test-g6-secret-scan-config.sh.
[extend]
useDefault = true

[[allowlists]]
description = "public G6 idempotency keys and the public RSA-2048 SPKI header constant"
regexTarget = "match"
regexes = [
  '''g6-(?:load|relay-pre-fault|relay-failover|path-direct-recovery|crash[0-9]+|window)-[0-9]+-[0-9]+-fd-b(?:-[a-z0-9]+)*''',
  '''g6-relay-pre-fault-[0-9]+-[0-9]+-fd-b''',
  '''g6-journal-key-[0-9a-f]{32}''',
  '''01a02cfab3f17d5888eb7c20bf609ff2''',
  '''MIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAOCAQ8AMIIBCgKCAQEA''',
]

# The generic-api-key rule reports the JSON field prefix after the public
# value-shaped allowlist above consumes the tagged value. Restrict this second
# exemption to that rule and the complete evidence-record line shape.
[[allowlists]]
description = "public G6 journal effect key in a generic-api-key evidence record"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = [
  '''idempotency_key":"g6-journal-key-[0-9a-f]{32}''',
]

# Historical strict-wire protobuf fixture from 9cb59d1: its sealed password
# contains the public literals "test-key" and "sealed-test-data", not a secret.
# Match only the complete fixed value, never arbitrary password_rotate fields.
[[allowlists]]
description = "fixed synthetic password-rotation protobuf test vector"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^0a03312e3192072b0a05616c696365202a2a20080110011a08746573742d6b657922107365616c65642d746573742d64617461$''',
]
