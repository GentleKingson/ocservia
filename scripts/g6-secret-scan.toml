# Gitleaks configuration for published G6 evidence artifacts.
#
# The configuration extends the complete default rule set. The single narrow
# allowlist entry exempts only the run-scoped relay-pre-fault idempotency key,
# which is publicly derived from the scenario name, the GitHub run id, the run
# attempt, and the producing failure domain, and which the generic-api-key
# heuristic mistakes for a credential. Exemptions are value-shaped only: a
# path- or file-based allowlist would hide a real secret inside the same
# evidence files, so it is forbidden by scripts/test-g6-secret-scan-config.sh.
[extend]
useDefault = true

[allowlist]
description = "public run-scoped G6 relay-pre-fault idempotency key"
regexes = [
  '''g6-relay-pre-fault-[0-9]+-[0-9]+-fd-b''',
]
